<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frotas - Segunda bateria</title>
<style>
:root{
  --bg:#0a1628; --navy:#0d2050; --or:#f05a28; --mut:#94a3b8; --bd:#1e3a5f;
  --tx:#e2e8f0; --wh:#ffffff; --orbg:rgba(240,90,40,.12); --orbd:rgba(240,90,40,.55);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
body{overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color-scheme:dark}
a{color:var(--or)}
.mono{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.wh{color:var(--wh)}
.or{color:var(--or)}
.sm{font-size:.82rem}.xs{font-size:.74rem}
.b{font-weight:600}

/* barra do mockup */
.mbar{position:sticky;top:0;z-index:40;background:var(--navy);border-bottom:1px solid var(--bd);padding:.55rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem .9rem;align-items:center}
.mbar .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.mbar label{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:.5rem;overflow:hidden;flex-wrap:wrap}
.seg button{padding:.32rem .65rem;font-size:.78rem;color:var(--mut);border-right:1px solid var(--bd)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--or);color:var(--wh)}
.fld{width:100%;padding:.5rem .7rem;border-radius:.5rem;background:var(--bg);border:1px solid var(--bd);color:var(--wh);font-size:.86rem}
.fld:focus{outline:none;border-color:var(--or)}
.fld::placeholder{color:#4a6080}
select.fld.auto{width:auto;padding:.3rem .5rem;font-size:.78rem}

/* telas */
.screens{display:flex;gap:.4rem;overflow-x:auto;padding:.7rem 1rem;border-bottom:1px solid var(--bd);background:var(--bg)}
.screens button{white-space:nowrap;padding:.45rem .85rem;border-radius:.5rem;border:1px solid var(--bd);color:var(--mut);font-size:.85rem}
.screens button.on{background:var(--or);border-color:var(--or);color:var(--wh)}

/* casca do app */
.shell{display:flex;min-height:calc(100vh - 110px)}
.side{width:210px;flex:0 0 210px;border-right:1px solid var(--bd);padding:1rem .6rem;background:var(--bg)}
.side .grp{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:#4a6080;margin:.9rem .5rem .3rem}
.side .it{display:block;width:100%;text-align:left;padding:.38rem .55rem;border-radius:.45rem;font-size:.84rem;color:var(--mut)}
.side .it.on{background:var(--or);color:var(--wh)}
.side .it.dim{opacity:.45;cursor:default}
.main{flex:1;min-width:0;padding:1.5rem 1.75rem 4rem}
@media (max-width:860px){.side{display:none}.main{padding:1rem 1rem 4rem}}

/* tipografia de seção */
h1.sec{font-size:1.35rem;font-weight:700;color:var(--wh);margin:0 0 .25rem;display:flex;align-items:center;gap:.55rem}
h2.sec{font-size:1.05rem;font-weight:650;color:var(--wh);margin:2rem 0 .2rem;display:flex;align-items:center;gap:.5rem}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:1.7rem;height:1.7rem;padding:0 .35rem;border-radius:999px;background:var(--or);color:var(--wh);font-size:.78rem;font-weight:700;flex:0 0 auto}
h2.sec .num{min-width:2.1rem;height:1.5rem;font-size:.72rem;border-radius:.4rem}
.lead{color:var(--mut);font-size:.88rem;margin:.1rem 0 1rem}
.why{border-left:3px solid var(--or);background:var(--navy);padding:.6rem .85rem;border-radius:0 .5rem .5rem 0;font-size:.82rem;color:var(--mut);margin:.6rem 0 1rem}
.why b{color:var(--wh);font-weight:600}

.card{border:1px solid var(--bd);background:var(--navy);border-radius:.75rem}
.pad{padding:1rem 1.1rem}
.grid{display:grid;gap:.8rem}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g3,.g2{grid-template-columns:1fr}}

.stat{text-align:left;padding:.9rem 1rem;border:1px solid var(--bd);background:var(--navy);border-radius:.75rem;width:100%;transition:border-color .15s}
.stat:hover{border-color:var(--or)}
.stat .l{font-size:.78rem;color:var(--mut)}
.stat .v{font-size:1.7rem;font-weight:700;color:var(--wh);margin:.15rem 0}
.stat .s{font-size:.74rem;color:var(--mut)}
.stat.hot .v{color:var(--or)}
.stat.new{border-style:dashed}

.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .95rem;border-radius:.5rem;font-size:.85rem;font-weight:500;white-space:nowrap}
.btn-p{background:var(--or);color:var(--wh)}
.btn-s{border:1px solid var(--bd);color:var(--mut)}
.btn-s:hover{border-color:var(--mut);color:var(--wh)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.chip{display:inline-block;padding:.12rem .55rem;border-radius:999px;font-size:.7rem;font-weight:600;white-space:nowrap;border:1px solid var(--bd);color:var(--mut)}
.chip.hot{background:var(--or);border-color:var(--or);color:var(--wh)}
.chip.warn{border-color:var(--orbd);color:var(--or)}
.chip.ok{color:var(--wh)}
.chip.new{border-style:dashed;color:var(--mut)}

/* barra de situação da frota */
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;border:1px solid var(--bd);margin:.8rem 0 .4rem}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-size:.75rem;color:var(--mut)}
.dot{display:inline-block;width:.6rem;height:.6rem;border-radius:2px;margin-right:.3rem;vertical-align:middle}

/* lista de ação */
.acts{display:flex;flex-direction:column}
.act{display:flex;align-items:center;gap:.8rem;padding:.75rem 1rem;border-top:1px solid var(--bd);text-align:left;width:100%}
.act:first-child{border-top:0}
.act:hover{background:rgba(255,255,255,.02)}
.act .n{min-width:2.2rem;text-align:center;font-size:1.25rem;font-weight:700;color:var(--wh)}
.act .n.hot{color:var(--or)}
.act .t{flex:1;min-width:0}
.act .t .a{color:var(--wh);font-size:.9rem}
.act .t .d{color:var(--mut);font-size:.76rem;overflow:hidden;text-overflow:ellipsis}
.act .go{color:var(--mut);font-size:.8rem;white-space:nowrap}

/* tabela */
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:.75rem;background:var(--navy)}
table{border-collapse:collapse;width:100%;min-width:720px}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:.6rem .75rem;border-bottom:1px solid var(--bd);white-space:nowrap;background:var(--navy);position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--wh)}
th .ar{color:var(--or);margin-left:.2rem}
td{padding:.55rem .75rem;border-bottom:1px solid rgba(30,58,95,.6);font-size:.84rem;color:#cbd5e1;white-space:nowrap}
tr.rowc{cursor:pointer}
tr.rowc:hover td{background:rgba(240,90,40,.06)}
td.r,th.r{text-align:right}
tfoot td{color:var(--wh);font-weight:600;border-bottom:0;border-top:1px solid var(--bd)}
.small-t table{min-width:0}

/* filtros */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr;gap:.6rem;margin-bottom:.8rem}
.filters .lbl{display:block;font-size:.72rem;color:var(--mut);margin-bottom:.25rem}
@media (max-width:1100px){.filters{grid-template-columns:repeat(3,minmax(0,1fr))}.filters .wide{grid-column:1/-1}}
@media (max-width:520px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;margin:.4rem 0 .8rem}
.toolbar .l{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.pager{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;margin-top:.7rem;font-size:.8rem;color:var(--mut)}
.pager .pg{display:flex;gap:.3rem}
.pager .pg button{min-width:2rem;padding:.3rem .5rem;border:1px solid var(--bd);border-radius:.4rem;color:var(--mut)}
.pager .pg button.on{background:var(--or);border-color:var(--or);color:var(--wh)}
.pager .pg button[disabled]{opacity:.4;cursor:default}

.subtabs{display:flex;gap:.35rem;overflow-x:auto;margin:.2rem 0 1rem;border-bottom:1px solid var(--bd)}
.subtabs button{padding:.55rem .8rem;font-size:.86rem;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button.on{color:var(--wh);border-color:var(--or)}

/* estados */
.empty{border:1px dashed var(--bd);border-radius:.75rem;padding:2.2rem 1rem;text-align:center;color:var(--mut)}
.empty .ic{font-size:1.6rem;opacity:.5;margin-bottom:.4rem}
.err{border:1px solid var(--or);background:var(--orbg);border-radius:.75rem;padding:1.2rem 1.1rem;display:flex;gap:.8rem;align-items:flex-start}
.err .ic{flex:0 0 auto;width:1.8rem;height:1.8rem;border-radius:999px;background:var(--or);color:var(--wh);font-weight:800;display:flex;align-items:center;justify-content:center}
.err .t{color:var(--wh);font-weight:600}
.err p{margin:.2rem 0 .7rem;font-size:.84rem;color:var(--tx)}
.sk{background:linear-gradient(90deg,var(--navy) 0%,#13285a 50%,var(--navy) 100%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:.5rem}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.noperm{max-width:420px;margin:3rem auto;text-align:center}
.banner{border:1px solid var(--orbd);background:var(--orbg);border-radius:.6rem;padding:.6rem .85rem;font-size:.83rem;color:var(--tx);margin-bottom:.8rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;justify-content:space-between}
.info{border:1px solid var(--bd);border-radius:.6rem;padding:.6rem .85rem;font-size:.8rem;color:var(--mut);margin-bottom:.8rem}

/* gaveta e modal */
.ov{position:fixed;inset:0;background:rgba(5,10,20,.7);z-index:60;display:flex;justify-content:flex-end}
.drawer{width:min(520px,100%);height:100%;overflow-y:auto;background:var(--bg);border-left:1px solid var(--bd);padding:1.2rem 1.2rem 3rem}
.ov.c{justify-content:center;align-items:center;padding:1rem}
.modal{width:min(560px,100%);max-height:92vh;overflow-y:auto;background:var(--bg);border:1px solid var(--bd);border-radius:.8rem;padding:1.2rem}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:.35rem .8rem;font-size:.85rem;margin:.6rem 0 1rem}
.kv dt{color:var(--mut)}.kv dd{margin:0;color:var(--wh);overflow-wrap:anywhere}
.tl{border-left:2px solid var(--bd);margin:.4rem 0 1rem .3rem;padding-left:.9rem;font-size:.82rem}
.tl div{margin:.35rem 0;position:relative}
.tl div::before{content:"";position:absolute;left:-1.24rem;top:.4rem;width:.5rem;height:.5rem;border-radius:999px;background:var(--bd)}
.tl div.cur::before{background:var(--or)}
.collist{columns:2;column-gap:1.2rem;font-size:.82rem;color:var(--tx);padding-left:1.1rem;margin:.4rem 0}
@media (max-width:520px){.collist{columns:1}}
.toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);z-index:80;width:calc(100% - 2rem);max-width:460px;background:var(--navy);border:1px solid var(--or);border-radius:.6rem;padding:.7rem .9rem;font-size:.85rem;color:var(--wh);box-shadow:0 8px 30px rgba(0,0,0,.4)}

/* e-mail */
.mailwrap{max-width:720px}
.mailhead{border:1px solid var(--bd);border-bottom:0;border-radius:.75rem .75rem 0 0;background:var(--navy);padding:.8rem 1rem;font-size:.82rem}
.mailhead .row{display:flex;gap:.6rem;margin:.15rem 0}
.mailhead .row span:first-child{color:var(--mut);min-width:4.2rem}
.mailbody{border:1px solid var(--bd);border-radius:0 0 .75rem .75rem;background:#ffffff;color:#1f2937;padding:1.3rem 1.2rem;font-size:.9rem}
.mailbody h3{margin:0 0 .2rem;font-size:1.05rem;color:#0d2050}
.mailbody .top{border-bottom:3px solid #f05a28;padding-bottom:.7rem;margin-bottom:1rem}
.mailbody .blk{margin:1.1rem 0}
.mailbody .blk h4{margin:0 0 .35rem;font-size:.9rem;color:#0d2050;display:flex;justify-content:space-between;gap:.5rem}
.mailbody .blk h4 .c{background:#f05a28;color:#fff;border-radius:999px;padding:0 .5rem;font-size:.75rem;line-height:1.4rem}
.mailbody .blk h4 .c.n{background:#94a3b8}
.mailbody ul{margin:0;padding:0;list-style:none}
.mailbody li{display:flex;justify-content:space-between;gap:.6rem;padding:.42rem 0;border-bottom:1px solid #e5e7eb;font-size:.85rem}
.mailbody li a{color:#f05a28;white-space:nowrap;font-size:.8rem;text-decoration:none;font-weight:600}
.mailbody .foot{margin-top:1.2rem;font-size:.75rem;color:#64748b;border-top:1px solid #e5e7eb;padding-top:.7rem}
.mailbody .cta{display:inline-block;background:#f05a28;color:#fff;text-decoration:none;padding:.55rem 1rem;border-radius:.4rem;font-weight:600;font-size:.85rem}
.mailbody .sum{display:flex;flex-wrap:wrap;gap:.4rem}
.mailbody .sum span{background:#0d2050;color:#fff;border-radius:.4rem;padding:.25rem .55rem;font-size:.76rem}
.mailbody .sum span.h{background:#f05a28}

.sup{counter-reset:s;list-style:none;padding:0;margin:0}
.sup li{counter-increment:s;position:relative;padding:.85rem 1rem .85rem 3.3rem;border:1px solid var(--bd);background:var(--navy);border-radius:.6rem;margin-bottom:.55rem;font-size:.88rem}
.sup li::before{content:"S" counter(s);position:absolute;left:.85rem;top:.82rem;background:var(--or);color:var(--wh);border-radius:.35rem;font-size:.72rem;font-weight:700;padding:.1rem .35rem}
.sup li .d{color:var(--mut);font-size:.8rem;margin-top:.2rem}
.hide-sm{}
@media (max-width:520px){.hide-sm{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ovl"></div>
<div id="toast"></div>

<script>
/* ================= utilidades ================= */
const $ = s => document.querySelector(s);
const d2 = n => String(n).padStart(2,'0');
const brl = v => 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf = v => Number(v).toLocaleString('pt-BR');
const nf2 = v => Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const dt = iso => iso ? iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4) : '—';
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = rng(3010);
const pick = a => a[Math.floor(R()*a.length)];
const HOJE = '2026-10-30', ONTEM = '2026-10-29';
const addDays = (iso,n) => {const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const diasAte = iso => Math.round((new Date(iso+'T12:00:00Z')-new Date(HOJE+'T12:00:00Z'))/864e5);

/* ================= dados de exemplo ================= */
const PLACAS = ['RTX4F21','KQP2B87','LSU7C03','RIO3D45','QNM8A12','LTB5E66','KXZ1H09','RJW6G38','PYR2J54','LQA9K71','RTB3M20','KPF7N16','LVC4P82','RHS0R47','QOD5S33','LMX8T05','RKN2U69','PZL6V91','LDF1W24','RCE9X58','KTG4Y13','LBH7Z40','RUA3B76','QWE8C02'];
const MODELOS = ['Fiat Strada Endurance','Fiat Fiorino Furgão','VW Saveiro Robust','Renault Kangoo','Fiat Mobi Like','Chevrolet Montana'];
const NOMES = ['Carlos Henrique Souza','Rafael Lima','Anderson Pereira','Marcos Vinícius Rocha','Thiago Martins','Bruno Albuquerque','Diego Fernandes','Leandro Costa','Fábio Nascimento','Wellington Silva','Rodrigo Teixeira','Jefferson Alves','Paulo Roberto Dias','Leonardo Barbosa','Renan Carvalho','Felipe Moreira','Alexandre Ramos','Gustavo Pinto','Márcio Freitas','Vitor Hugo Santos','Eduardo Lopes','Sérgio Mendes'];
const POSTOS = ['Posto Ipiranga Av. Brasil - Bonsucesso','Posto Shell Av. das Américas - Barra','Posto BR Centro - Niterói','Auto Posto Ale - Duque de Caxias','Posto Petrobras Rod. Amaral Peixoto - São Gonçalo','Posto Ipiranga Centro - Nova Iguaçu','Posto Shell Dias da Cruz - Méier','Auto Posto BR Linha Amarela - Pilares'];
const EQS = Array.from({length:20},(_,i)=>'EQ '+d2(i+1));

const VEIC = PLACAS.map((p,i)=>({
  id:i, placa:p, modelo:MODELOS[i%MODELOS.length], ano:2022+(i%3),
  km_contratual:3000, locacao:[2890,3150,3290,3450][i%4],
  status: i===21||i===22 ? 'manutencao' : i===23 ? 'inativo' : 'ativo',
  equipe: i<18 ? EQS[i] : null, motorista: i<18 ? NOMES[i] : null,
  retorno: i===21 ? '2026-10-31' : i===22 ? '2026-10-27' : null,
  oficinaMotivo: i===21 ? 'revisao' : i===22 ? 'mecanico' : null,
  oficinaDesde: i===21 ? '2026-10-28' : i===22 ? '2026-10-21' : null,
  km0: 18000 + Math.floor(R()*34000), km:0
}));
const MOT = NOMES.map((n,i)=>({id:i,nome:n,equipe: i<18?EQS[i]: i===18?EQS[18]: null,
  cnh: String(10000000000 + Math.floor(R()*89999999999)).slice(0,11),
  cnhVenc: i===7?'2026-11-12': i===14?'2026-12-03': i===17?'2026-10-20' : addDays('2027-01-15', Math.floor(R()*900)),
  contato:'(21) 9'+(8000+Math.floor(R()*1999))+'-'+(1000+Math.floor(R()*8999)),
  ativo: i!==21}));
// EQ 19 tem motorista mas está sem carro (o carro dela foi para a oficina)

/* KM diário: dias úteis de 01/09 a 30/10 */
const DIAS=[]; for(let d='2026-09-01'; d<=HOJE; d=addDays(d,1)){const w=new Date(d+'T12:00:00Z').getUTCDay(); if(w>0&&w<6) DIAS.push(d)}
const SEM_KM_ONTEM = ['EQ 07','EQ 12','EQ 16'];
const KM=[]; const kmAt={};
VEIC.forEach(v=>{v.km=v.km0});
DIAS.forEach(d=>{
  VEIC.forEach(v=>{
    if(v.id>=18 && !(v.id===21 && d<'2026-10-28') && !(v.id===22 && d<'2026-10-21')) return; // livres não lançam
    if(v.id>=18) return;
    if(d===HOJE && v.id%3!==0) return;                 // hoje só algumas equipes já lançaram
    if(d===ONTEM && SEM_KM_ONTEM.includes(v.equipe)) return;
    if(R()<.04) return;                                  // falhas esporádicas
    const ant=v.km; v.km += 55+Math.floor(R()*140);
    KM.push({id:'k'+KM.length,data:d,equipe:v.equipe,placa:v.placa,motorista:v.motorista,km:v.km,rodado:v.km-ant,obs: R()<.06?pick(['Plantão fim de semana','Trajeto até a obra de Niterói','Carro reserva no dia']):'',criado:d+' '+d2(17+Math.floor(R()*3))+':'+d2(Math.floor(R()*60))});
    kmAt[v.id+'|'+d]=v.km;
  });
});
KM.reverse();
// veículos sem lançamento recente ficam com km inicial + algo
VEIC.forEach(v=>{if(v.id>=18) v.km = v.km0 + 21000});

/* Abastecimentos */
const AB=[];
VEIC.slice(0,18).forEach(v=>{
  let i=Math.floor(R()*4);
  while(i<DIAS.length){
    const d=DIAS[i]; const pl=+(6.09+R()*.4).toFixed(2); const lt=+(24+R()*24).toFixed(2);
    AB.push({id:'a'+AB.length,data:d,placa:v.placa,modelo:v.modelo,equipe:v.equipe,motorista:v.motorista,litros:lt,valor:+(lt*pl).toFixed(2),preco:pl,km: R()<.08?null:(kmAt[v.id+'|'+d]||null),posto:pick(POSTOS),criado:d+' '+d2(9+Math.floor(R()*9))+':'+d2(Math.floor(R()*60)),corrigido: R()<.03});
    i += 3+Math.floor(R()*4);
  }
});
AB.sort((a,b)=>b.data.localeCompare(a.data)||a.placa.localeCompare(b.placa));

/* Histórico carro × equipe × motorista (veiculo_responsabilidade_historico) */
function histVeic(v){
  if(v.id===22) return [{ini:'2026-08-01',fim:'2026-10-21',eq:'EQ 20',mot:NOMES[19]+'',o:'Checklist de recebimento'}];
  if(v.id===21) return [{ini:'2026-08-01',fim:'2026-10-28',eq:'EQ 19',mot:NOMES[18],o:'Checklist de recebimento'}];
  if(v.id>=18) return [];

function kmMes(v){const r=KM.filter(k=>k.placa===v.placa&&k.data>='2026-10-01');return r.length?r.reduce((s,k)=>s+k.rodado,0):null}
function cnhChip(m){const d=diasAte(m.cnhVenc);return d<0?'<span class="chip hot">vencida</span>':d<=60?'<span class="chip warn">vence em '+d+' dias</span>':''}
function sitChip(v){const s=situacao(v);
  if(s==='oficina'&&S.oficinaNova) return `<span class="chip warn">${v.oficinaMotivo==='revisao'?'Em revisão':'No mecânico'}</span>`;
  return `<span class="chip ${s==='uso'?'ok':s==='oficina'?'warn':''}">${SIT_LBL[s]}</span>`}

function fdef(b){return S.f[b] || (S.f[b] = {busca:'',de: b==='abast'||b==='km' ? '2026-10-01':'',ate: b==='abast'||b==='km' ? HOJE:'',equipe:'',placa:'',motorista:'',situacao:'',cnh:'',sit:''})}
function filtrar(b){
  const B=BASES[b], f=fdef(b); const q=f.busca.trim().toLowerCase();
  let rows = B.rows().filter(r=>{
    if(q && !B.busca(r).toLowerCase().includes(q)) return false;
    if(B.temPeriodo){ if(f.de && r.data<f.de) return false; if(f.ate && r.data>f.ate) return false; }
    if(f.equipe && r.equipe!==f.equipe) return false;
    if(f.placa && r.placa!==f.placa) return false;
    if(f.motorista && r.motorista!==f.motorista) return false;
    if(b==='mot'){ if(f.situacao==='ativo'&&!r.ativo) return false; if(f.situacao==='inativo'&&r.ativo) return false;
      const d=diasAte(r.cnhVenc); if(f.cnh==='vencendo'&&!(d>=0&&d<=60)) return false; if(f.cnh==='vencida'&&d>=0) return false; if(f.cnh==='alerta'&&d>60) return false; }
    if(b==='veic' && f.sit && situacao(r)!==f.sit) return false;
    return true;
  });
  const so = S.sort[b];
  if(so){const c=B.cols.find(c=>c.k===so.k); rows=[...rows].sort((x,y)=>{const a=c.s(x),z=c.s(y);return (a>z?1:a<z?-1:0)*(so.dir)})}
  return rows;
}
function filtrosTexto(b){
  const f=fdef(b), p=[];
  if(BASES[b].temPeriodo) p.push(`período ${f.de?dt(f.de):'início'} a ${f.ate?dt(f.ate):'hoje'}`);
  if(f.equipe) p.push('equipe '+f.equipe); if(f.placa) p.push('placa '+f.placa); if(f.motorista) p.push('motorista '+f.motorista);
  if(f.situacao) p.push(f.situacao==='ativo'?'só ativos':'só inativos'); if(f.cnh) p.push({vencendo:'CNH vencendo em 60 dias',vencida:'CNH vencida',alerta:'CNH vencida ou vencendo'}[f.cnh]);
  if(f.sit) p.push('situação: '+SIT_LBL[f.sit].toLowerCase()); if(f.busca) p.push('busca "'+f.busca+'"');
  return p.length?p.join(' · '):'sem filtro (tudo)';
}

      <div class="xs" style="margin-top:.35rem">Hoje o sistema só sabe que o carro "foi para a oficina", com a data prevista de volta. Para separar revisão de mecânico, o botão "Enviar para oficina" precisa perguntar o motivo — <b class="wh">precisa de dado novo</b>.</div>
    </div>
    <div class="card" style="margin-top:.4rem"><div class="pad sm"><div class="wh b" style="margin-bottom:.4rem">Carros na oficina agora</div>
      ${VEIC.filter(v=>v.status==='manutencao').map(v=>`<div style="display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;padding:.35rem 0;border-top:1px solid var(--bd)"><span><b class="wh">${v.placa}</b> <span class="mut">${v.modelo}</span>${S.oficinaNova?' · '+(v.oficinaMotivo==='revisao'?'em revisão':'no mecânico'):''}</span><span class="mut">desde ${dt(v.oficinaDesde)} · volta prevista ${dt(v.retorno)} ${v.retorno<HOJE?'<span class="chip hot">atrasado '+(-diasAte(v.retorno))+' dias</span>':''}</span></div>`).join('')}

  /* 1.2 */
  const A = vazio ? [] : [
    {n:REV_ATR_KM.length+REV_ATR_DATA.length,hot:1,a:'Revisões atrasadas',d:`${REV_ATR_KM.length} por KM (${REV_ATR_KM.map(r=>r.placa).join(', ')}) · ${REV_ATR_DATA.length} por data (${REV_ATR_DATA.map(r=>r.placa).join(', ')})`,go:'Revisões · atrasadas',act:'toast-rev'},
    {n:REV_BREVE.length,a:'Revisões chegando (faltam até 1.000 km)',d:REV_BREVE.map(r=>r.placa+' '+r.txt.split(' (')[0]).join(' · '),go:'Revisões · vencendo',act:'toast-rev'},
    {n:SEM_KM_ONTEM.length,hot:1,a:'Equipes sem KM diário de ontem (29/10)',d:SEM_KM_ONTEM.join(', '),go:'KM diário · ontem',act:'km-ontem'},
    {n:DOCS.length,hot:1,a:'Documentos vencidos ou vencendo em 30 dias',d:DOCS.map(x=>x.placa+' '+x.tipo.split(' ')[0]+' '+(x.venc<HOJE?'venceu '+dt(x.venc):'vence '+dt(x.venc))).join(' · '),go:'Documentos',act:'toast-doc'},
    {n:CNH.length,hot:CNH.some(m=>m.cnhVenc<HOJE),a:'CNH vencida ou vencendo em 60 dias',d:CNH.map(m=>m.nome.split(' ')[0]+' '+(m.cnhVenc<HOJE?'venceu '+dt(m.cnhVenc):'vence '+dt(m.cnhVenc))).join(' · '),go:'Motoristas · CNH',act:'cnh'},
    {n:MULTAS.length,a:'Multas sem tratativa',d:`${MULTAS.filter(m=>m.st==='Pendente').length} pendentes, ${MULTAS.filter(m=>m.st==='Validada').length} validada aguardando desconto · ${brl(MULTAS.reduce((s,m)=>s+m.valor,0))}`,go:'Multas · pendentes',act:'toast-multa'},
    {n:SIN.length,a:'Sinistros abertos',d:SIN.map(s=>s.placa+' '+s.st.toLowerCase()).join(' · '),go:'Sinistros · abertos',act:'toast-sin'},
    {n:1,hot:1,a:'Volta da oficina atrasada',d:'RUA3B76 deveria ter voltado em 27/10',go:'Veículos · na oficina',act:'sit',v:'oficina'}
  ];
  h += head2('1.2','O que precisa de ação hoje','A mesma lista que vai no e-mail das 07:00 (tela 3). Quando não há nada, o item some.');
  if(vazio) h += emptyBox('Nada pendente hoje.','<p class="sm">Nenhuma revisão atrasada, documento vencendo, multa ou sinistro em aberto, e todas as equipes lançaram o KM de ontem.</p>');
  else h += `<div class="card acts">${A.map(x=>`<button class="act" data-act="${x.act}" ${x.v?`data-v="${x.v}"`:''}><span class="n ${x.hot?'hot':''}">${x.n}</span><span class="t"><div class="a">${x.a}</div><div class="d">${x.d}</div></span><span class="go hide-sm">${x.go} →</span></button>`).join('')}</div>`;
  h += why('<b>De onde vem.</b> Revisões: a mesma conta de hoje (última revisão de cada carro, por data prevista ou KM previsto; aviso a 1.000 km). Documentos: vencimento cadastrado em Documentos. CNH: vencimento no cadastro do motorista — <b>hoje a CNH que já venceu some do alerta</b>; a proposta passa a mostrar. KM de ontem: equipe ativa com carro e sem lançamento no último dia útil. Multas: tudo que não foi descontado. Sinistros: tudo que não foi encerrado. <b>Não entra:</b> "carro obrigado a apresentar KM" (item 2.3.4 do mapa do Igor) — o cadastro do veículo não tem esse campo, então hoje todo carro com equipe é cobrado.');

  /* 1.3 */
  h += head2('1.3','Quanto gastamos no mês','Outubro de 2026, do dia 1 até hoje. Mesma regra da tela Custos. Clique em um valor para abrir os lançamentos.');
  if(vazio) h += emptyBox('Nenhum gasto registrado em outubro.');
  else {
    const ab=AB.filter(mesAtual).reduce((s,r)=>s+r.valor,0), mu=MULTAS.filter(m=>m.data>='2026-10-01').reduce((s,m)=>s+m.valor,0), si=SIN.reduce((s,x)=>s+x.valor,0), rv=1280, lo=VEIC.filter(v=>v.status!=='inativo').reduce((s,v)=>s+v.locacao,0);
    const tot=ab+mu+si+rv+lo;
    const it=[['Locação',lo,'toast-custo'],['Abastecimento (lançado no hub)',ab,'ab-mes'],['Revisões',rv,'toast-rev'],['Sinistros',si,'toast-sin'],['Multas',mu,'toast-multa']];
    h += `<div class="grid g3">
      <div class="stat" style="cursor:default"><div class="l">Total do mês</div><div class="v mono">${brl(tot)}</div><div class="s">${VEIC.filter(v=>v.status!=='inativo').length} carros · média ${brl(tot/23)} por carro</div></div>
      <div class="card pad" style="grid-column:span 2;min-width:0"><div class="l sm mut" style="margin-bottom:.5rem">Onde o gasto pesa (item 14.1.4 do mapa)</div>
        ${it.map(([l,v,a])=>`<button data-act="${a}" style="display:block;width:100%;text-align:left;margin:.3rem 0"><div style="display:flex;justify-content:space-between;gap:.5rem" class="sm"><span>${l}</span><span class="wh mono">${brl(v)} <span class="mut">${Math.round(v/tot*100)}%</span></span></div><div style="height:6px;background:var(--bg);border-radius:9px;margin-top:.2rem"><div style="height:6px;width:${v/tot*100}%;background:var(--or);border-radius:9px"></div></div></button>`).join('')}
      </div></div>`;
    h += `<h2 class="sec" style="margin-top:1.4rem;font-size:.95rem"><span class="num">1.3b</span>Gasto dos extratos por centro de custo <span class="chip new">já no ar desde 29/10</span></h2>
    <p class="lead">Ticketlog (combustível) e Veloe (pedágio e estacionamento), outubro, enviados até 27/10. A equipe e o centro de custo são os da data de uso.</p>
    <div class="tw small-t"><table style="min-width:520px"><thead><tr><th>Centro de custo</th><th class="r">Ticketlog</th><th class="r">Veloe</th><th class="r">Total</th></tr></thead><tbody>
    ${CC.map(r=>`<tr class="rowc" data-act="toast-cc"><td>${r[0]?`<span class="wh">${r[0]}</span> <span class="mut">${r[1]}</span>`:`<span class="or">${r[1]}</span>`}</td><td class="r mono">${brl(r[2])}</td><td class="r mono">${brl(r[3])}</td><td class="r mono wh">${brl(r[2]+r[3])}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>Total</td><td class="r">${brl(CC.reduce((s,r)=>s+r[2],0))}</td><td class="r">${brl(CC.reduce((s,r)=>s+r[3],0))}</td><td class="r">${brl(CC.reduce((s,r)=>s+r[2]+r[3],0))}</td></tr></tfoot></table></div>`;
    h += why('<b>Cuidado com contar duas vezes.</b> O abastecimento lançado à mão no hub e o extrato da Ticketlog são o mesmo combustível visto de dois lados. Por isso o quadro de cima usa só o lançado no hub (como a tela Custos faz hoje) e o extrato aparece separado. Decisão pendente: quando os extratos estiverem rodando, qual dos dois vale como "custo de combustível"? Recomendação: o extrato, e o lançamento à mão vira conferência.');
  }

  /* 1.4 */
  h += head2('1.4','Atalhos','Os formulários são os que já existem; só mudam de lugar.');
  const at=[['Registrar abastecimento','abast',1],['Lançar KM do dia','km',1],['Novo checklist',null,1],['Registrar multa',null,1],['Registrar sinistro',null,1],['Registrar revisão',null,1],['Enviar extrato',null,0]];
  h += `<div class="grid g4">${at.filter(a=>a[2]?podeRegistrar():podeGerir()).map(a=>`<button class="stat" data-act="${a[1]?'novo':'toast-form'}" data-v="${a[1]||a[0]}"><div class="wh b sm">${a[0]}</div><div class="s">abre o formulário</div></button>`).join('')}
  ${!podeRegistrar()&&!podeGerir()?`<div class="info" style="grid-column:1/-1">Sem atalhos de registro para o seu papel. As bases continuam abertas para consulta e exportação.</div>`:''}</div>`;
  if(S.papel==='usuario') h += why('<b>Papel "usuário do Frotas".</b> Pelo sistema de hoje, quem tem acesso ao Frotas <b>já pode registrar</b> abastecimento, KM, checklist, multa, sinistro, revisão e cadastrar motorista e veículo. Só corrigir, excluir, enviar extrato e mexer em desconto são exclusivos do gestor. Use o botão "Usuário registra?" na tela 2 para ver as duas opções.');
  return h;
}

/* ================= TELA 2: bases ================= */
function telaBases(){
  let h = head1(2,'Bases em tabela, com exportar','Um padrão só, igual à Base da Gestão de Obras: filtros em cima, tabela, total, "Exportar Excel" e "Registrar novo". Vale para Abastecimentos, KM diário, Motoristas e Veículos.');
  if(!temAcesso()) return h+noPerm();
  h += `<div class="subtabs">${Object.entries(BASES).map(([k,b],i)=>`<button class="${S.base===k?'on':''}" data-act="base" data-v="${k}">2.${i+1} ${b.nome}</button>`).join('')}<button class="${S.base==='ext'?'on':''}" data-act="base" data-v="ext">2.5 Revisões, Multas, Sinistros?</button></div>`;
  if(S.base==='ext') return h+telaExt();
  const b=S.base, B=BASES[b], f=fdef(b), idx=Object.keys(BASES).indexOf(b)+1;
  h += head2('2.'+idx,B.nome, {abast:'Todos os abastecimentos, de qualquer mês — não só o mês atual como hoje. Equipe e motorista são os que estavam com o carro no dia, pelo histórico carro × equipe × motorista.',km:'Um lançamento por carro por dia. "Rodou desde o anterior" é a diferença para o lançamento anterior do mesmo carro.',mot:'Cadastro em tabela, com busca, como o José pediu ([26:14]).',veic:'A "ficha do veículo": clique na linha para ver cadastro, histórico de equipe e motorista, últimos KM e abastecimentos.'}[b]);
  if(S.papel==='usuario') h += `<div class="info" style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">Mockup — usuário do Frotas registra? <span class="seg"><button class="${S.userRegistra?'on':''}" data-act="ureg" data-v="1">Sim, como hoje</button><button class="${!S.userRegistra?'on':''}" data-act="ureg" data-v="0">Não, só consulta</button></span></div>`;

  // toolbar
  h += `<div class="toolbar"><div class="l">
      ${podeRegistrar()?`<button class="btn btn-p" data-act="novo" data-v="${b}">+ ${B.novo}</button>`:''}
      <button class="btn btn-s" data-act="exportar" ${S.estado!=='dados'?'disabled':''}>⭳ Exportar Excel</button>
    </div><span class="xs mut">${podeGerir()?'Clique na linha para ver e corrigir.':'Clique na linha para ver o detalhe.'}</span></div>`;

  // filtros
  const opt=(arr,sel,all)=>`<option value="">${all}</option>`+arr.map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('');
  const fl=(k,html,cls)=>`<label class="${cls||''}"><span class="lbl">${k}</span>${html}</label>`;
  const parts={
    busca: fl('Buscar',`<input id="q_${b}" class="fld" placeholder="${{abast:'Placa, posto, motorista…',km:'Placa, motorista, observação…',mot:'Nome, CNH, telefone…',veic:'Placa, modelo, motorista…'}[b]}" value="${esc(f.busca)}" data-act="f" data-k="busca">`,'wide'),
    de: fl('De',`<input type="date" class="fld" value="${f.de}" data-act="f" data-k="de">`),
    ate: fl('Até',`<input type="date" class="fld" value="${f.ate}" data-act="f" data-k="ate">`),
    equipe: fl('Equipe',`<select class="fld" data-act="f" data-k="equipe">${opt(EQS,f.equipe,'Todas')}</select>`),
    placa: fl('Placa',`<select class="fld" data-act="f" data-k="placa">${opt(PLACAS,f.placa,'Todas')}</select>`),
    motorista: fl('Motorista',`<select class="fld" data-act="f" data-k="motorista">${opt(NOMES,f.motorista,'Todos')}</select>`),
    situacao: fl('Situação',`<select class="fld" data-act="f" data-k="situacao"><option value="">Todos</option><option value="ativo" ${f.situacao==='ativo'?'selected':''}>Ativos</option><option value="inativo" ${f.situacao==='inativo'?'selected':''}>Inativos</option></select>`),
    cnh: fl('CNH',`<select class="fld" data-act="f" data-k="cnh"><option value="">Todas</option><option value="alerta" ${f.cnh==='alerta'?'selected':''}>Vencida ou vencendo</option><option value="vencendo" ${f.cnh==='vencendo'?'selected':''}>Vencendo em 60 dias</option><option value="vencida" ${f.cnh==='vencida'?'selected':''}>Vencida</option></select>`),
    sit: fl('Situação',`<select class="fld" data-act="f" data-k="sit"><option value="">Todas</option>${Object.entries(SIT_LBL).map(([k,v])=>`<option value="${k}" ${f.sit===k?'selected':''}>${v}</option>`).join('')}</select>`)
  };
  h += `<div class="filters">${B.filtros.map(k=>parts[k]).join('')}</div>`;
  if(S.aviso && S.aviso.base===b) h += `<div class="banner"><span>${S.aviso.txt}</span><button class="btn btn-s" data-act="aviso-x">Fechar</button></div>`;

  // estados
  if(S.estado==='carregando') return h+skel(38,9);
  if(S.estado==='erro') return h+errBox('a base de '+B.nome.toLowerCase());
  if(S.estado==='vazio') return h+emptyBox(B.vazio, podeRegistrar()?`<p class="sm">Quando o primeiro registro entrar, ele aparece aqui.</p><button class="btn btn-p" data-act="novo" data-v="${b}">+ ${B.novo}</button>`:'<p class="sm">Quando o primeiro registro entrar, ele aparece aqui.</p>');

  const rows=filtrar(b);
  if(!rows.length) return h+emptyBox('Nenhum resultado com estes filtros.','<p class="sm">'+filtrosTexto(b)+'</p><button class="btn btn-s" data-act="limpar">Limpar filtros</button>');
  const POR=20, tp=Math.ceil(rows.length/POR); let p=Math.min(S.pag[b]||1,tp);
  const page=rows.slice((p-1)*POR,p*POR); const so=S.sort[b];
  h += `<div class="tw"><table><thead><tr>${B.cols.map(c=>`<th class="sortable ${c.r?'r':''}" data-act="sort" data-v="${c.k}">${c.t}${so&&so.k===c.k?`<span class="ar">${so.dir>0?'▲':'▼'}</span>`:''}</th>`).join('')}</tr></thead>
    <tbody>${page.map(r=>`<tr class="rowc" data-act="row" data-v="${r.id}">${B.cols.map(c=>`<td class="${c.r?'r mono':''}">${c.v(r)}</td>`).join('')}</tr>`).join('')}</tbody>
    <tfoot><tr>${B.total(rows)}</tr></tfoot></table></div>`;
  const pages=[]; for(let i=Math.max(1,p-2);i<=Math.min(tp,p+2);i++) pages.push(i);
  h += `<div class="pager"><span>Mostrando ${(p-1)*POR+1}–${Math.min(p*POR,rows.length)} de ${nf(rows.length)} · ${filtrosTexto(b)}</span><span class="pg"><button data-act="pag" data-v="${p-1}" ${p<=1?'disabled':''}>‹</button>${pages.map(i=>`<button class="${i===p?'on':''}" data-act="pag" data-v="${i}">${i}</button>`).join('')}<button data-act="pag" data-v="${p+1}" ${p>=tp?'disabled':''}>›</button></span></div>`;
  h += why(`<b>Como funciona.</b> Clique no título de uma coluna para ordenar (de novo, inverte). 20 linhas por página. O "Exportar Excel" leva <b>tudo o que está filtrado</b>, não só a página da tela, na ordem da tela. ${b==='abast'?'O chip "corrigido" aparece quando o gestor corrigiu litros, valor ou KM.':''}${b==='veic'?'"Rodou no mês" soma o KM diário de outubro; "passou" marca quem estourou a franquia contratada.':''}`);
  return h;
}

      <div class="sum"><span class="h">3 revisões atrasadas</span><span class="h">3 equipes sem KM</span><span class="h">1 documento vencido</span><span>2 revisões chegando</span><span>2 documentos vencendo</span><span>${CNH.length} CNH</span><span>4 multas</span><span>2 sinistros</span><span>1 volta da oficina atrasada</span></div>
      ${blk('Revisões atrasadas',3,REV_ATR_KM.map(r=>it(`<b>${r.placa}</b> (${r.eq}) — por KM: ${r.txt}`,'rev')).join('')+REV_ATR_DATA.map(r=>it(`<b>${r.placa}</b> (${r.eq}) — por data: ${r.txt}`,'rev')).join(''))}
      ${blk('Revisões chegando (faltam até 1.000 km)',2,REV_BREVE.map(r=>it(`<b>${r.placa}</b> (${r.eq}) — ${r.txt}`,'rev')).join(''))}
      ${blk('Equipes sem KM diário de ontem (qui 29/10)',3,SEM_KM_ONTEM.map(e=>{const vv=VEIC.find(x=>x.equipe===e);return it(`<b>${e}</b> — ${vv.placa}, ${vv.motorista}`,'km')}).join(''))}
      ${blk('Documentos vencidos ou vencendo em 30 dias',3,DOCS.map(d=>it(`<b>${d.placa}</b> — ${d.tipo}: ${d.venc<HOJE?'<span style="color:#f05a28;font-weight:600">venceu em '+dt(d.venc)+'</span>':'vence em '+dt(d.venc)+' ('+diasAte(d.venc)+' dias)'}`,'doc')).join(''))}
      ${blk('CNH vencida ou vencendo em 60 dias',CNH.length,CNH.map(m=>it(`<b>${m.nome}</b> (${m.equipe||'sem equipe'}) — ${m.cnhVenc<HOJE?'<span style="color:#f05a28;font-weight:600">venceu em '+dt(m.cnhVenc)+'</span>':'vence em '+dt(m.cnhVenc)}`,'mot')).join(''))}
      ${blk('Multas sem tratativa',4,MULTAS.map(m=>it(`<b>${m.placa}</b> — ${m.mot}, ${dt(m.data)}, ${brl(m.valor)} · ${m.st.toLowerCase()}`,'multa')).join(''))}
      ${blk('Sinistros abertos',2,SIN.map(s=>it(`<b>${s.placa}</b> (${s.eq}) — ${s.tipo.toLowerCase()} em ${dt(s.data)}, ${s.st.toLowerCase()}`,'sin')).join(''))}
      ${blk('Volta da oficina atrasada',1,it('<b>RUA3B76</b> — previsão era 27/10/2026 (3 dias)','veic'))}
      <p style="margin-top:1.2rem"><a class="cta" href="#" data-act="mail-link" data-v="visao">Abrir a visão geral do Frotas</a></p>`;
  } else if(v==='nada'){
    assunto = 'Frotas · sex 30/10 · nada pendente hoje';
    corpo = `<div class="top"><h3>Bom dia, Igor. Nada pendente hoje.</h3><div style="font-size:.82rem;color:#64748b">Resumo da Gestão de Frotas de sexta-feira, 30/10/2026, gerado às 07:00.</div></div>
      <p>Conferimos revisões, documentos, CNH, multas, sinistros, carros na oficina e o KM de ontem: está tudo em dia.</p>
      <p style="font-size:.82rem;color:#64748b">Este e-mail chega mesmo quando não há nada, para você saber que a conferência rodou.</p>`;
  } else {
    assunto = 'Frotas · sex 30/10 · não conseguimos montar o resumo de hoje';
    corpo = `<div class="top"><h3>Bom dia, Igor. O resumo de hoje não pôde ser montado.</h3><div style="font-size:.82rem;color:#64748b">Tentativa às 07:00 de sexta-feira, 30/10/2026.</div></div>
      <p>A conferência automática falhou ao ler os dados. <b>Isso não quer dizer que está tudo em dia.</b> Até corrigirmos, confira os alertas direto no hub.</p>
      <p style="margin-top:1rem"><a class="cta" href="#" data-act="mail-link" data-v="visao">Ver os alertas no hub</a></p>
      <p style="font-size:.82rem;color:#64748b;margin-top:1rem">O suporte do hub recebeu o mesmo aviso.</p>`;
  }
  h += `<div class="mailwrap"><div class="mailhead">
      <div class="row"><span>De</span><span class="wh">Hub Manfac</span></div>
      <div class="row"><span>Para</span><span class="wh">Igor (gestor de frotas)</span></div>
      <div class="row"><span>Assunto</span><span class="wh b">${assunto}</span></div>
      <div class="row"><span>Quando</span><span>sex, 30/10/2026, 07:00</span></div>
    </div><div class="mailbody">${corpo}
      <div class="foot">Você recebe este e-mail porque é gestor de frotas no Hub Manfac. Enviado de segunda a sexta às 07:00. Os links abrem o hub; se pedir login, entre com a sua conta de sempre.</div>
    </div></div>`;
  h += why('<b>Dia sem pendência: manda ou não manda?</b> Recomendação: <b>manda, curto</b>. Se o e-mail parar de chegar, o Igor precisa saber se é porque está tudo em dia ou porque o envio quebrou — silêncio não diferencia os dois. Pelo mesmo motivo, quando a conferência falha, chega um aviso dizendo isso, em vez de nada.');
  h += why('<b>Segunda-feira:</b> "KM de ontem" passa a ser "KM de sexta" (último dia útil). Equipes de plantão no fim de semana não são cobradas, porque o sistema não sabe quem está de plantão.');
  return h + quemRecebe();
}
function quemRecebe(){
  return head2('3.1','Quem recebe e quando','Sem tela nova de configuração nesta rodada.') + `<div class="card pad" style="max-width:720px">
    <div class="kv" style="margin:0">
      <dt>Quem recebe</dt><dd>Todos os gestores de frotas (hoje: Igor). Para incluir alguém, essa pessoa recebe o papel de gestor de frotas.</dd>
      <dt>Administradores do hub</dt><dd>Não recebem, a menos que também sejam gestores de frotas.</dd>
      <dt>Horário</dt><dd>07:00, de segunda a sexta.</dd>
      <dt>Um e-mail por pessoa</dt><dd>Todos recebem o mesmo conteúdo, com a frota inteira.</dd>
      <dt>Como é enviado</dt><dd>Pelo mesmo caminho do e-mail diário da Gestão de Obras, que já está no ar.</dd>
    </div></div>`;
}

/* ================= TELA 4: suposições ================= */
function telaSup(){
  const L=[
    ['O e-mail diário vai para os gestores de frotas (hoje, o Igor), às 07:00, de segunda a sexta.','Administradores do hub não recebem. Não há tela para escolher destinatário; quem quiser receber vira gestor de frotas.'],
    ['Num dia sem pendências o e-mail é enviado mesmo assim, curto, dizendo "nada pendente".','E se a conferência falhar, chega um aviso de falha. Alternativa: não mandar nada nesses dias.'],
    ['A planilha exportada é um arquivo Excel (.xlsx), com o nome "frotas-<base>-<data de hoje>.xlsx".','Exporta tudo o que está filtrado, na ordem da tela, não só a página visível. Datas saem como data e valores como número, para dar para somar no Excel.'],
    ['"Disponível" quer dizer "fora da oficina": carro em uso e carro livre contam como disponíveis.','Carro fora da frota (inativo/devolvido) não entra na conta. Hoje a tela inicial e a tela Disponibilidade calculam de jeitos diferentes; as duas passam a usar esta regra.'],
    ['"Em revisão" e "no mecânico" aparecem juntos como "na oficina" até o sistema perguntar o motivo.','Para separar, o botão "Enviar para oficina" passa a pedir o motivo (revisão ou mecânico). Isso é um dado novo no banco.'],
    ['"Equipe sem KM de ontem" vale para toda equipe ativa que tem carro, em dia útil.','O campo "obrigado a apresentar KM" do mapa do Igor não existe no cadastro do veículo. Plantão de fim de semana não é cobrado.'],
    ['A CNH que já venceu passa a aparecer no alerta.','Hoje o sistema só avisa a CNH que vai vencer nos próximos 60 dias; a vencida some.'],
    ['Na base de Abastecimentos, a equipe e o motorista são os que estavam com o carro naquela data.','O abastecimento só guarda a placa; a equipe e o motorista vêm do histórico carro × equipe × motorista, o mesmo que o checklist grava.'],
    ['O "custo de combustível" da visão geral continua sendo o abastecimento lançado à mão, até decidirem.','O extrato da Ticketlog aparece separado, por centro de custo, para não somar o mesmo combustível duas vezes.'],
    ['O usuário do Frotas (sem papel de gestor) continua podendo registrar, como hoje.','Ele vê as bases, exporta e registra novo; não corrige nem exclui. Se a intenção for "só consulta", é uma mudança a mais.'],
    ['Os formulários de "Registrar novo" são os que já existem.','A base só muda de lugar o botão; os campos e as regras dos formulários não mudam nesta rodada.'],
    ['Revisões, Multas e Sinistros ganham o mesmo formato de base numa rodada seguinte.','Esta rodada entrega Abastecimentos, KM diário, Motoristas e Veículos.'],
    ['A tela Pendências continua existindo como está.','A visão geral nova mostra o "o que precisa de ação hoje" sem depender dela; a revisão do que é pendência ([23:39]) fica para outra conversa.']
  ];
  return head1(4,'Suposições do coordenador','O que foi assumido para desenhar estas telas. Se alguma estiver errada, basta citar o número (S1, S2…).') + `<ol class="sup">${L.map(([t,d])=>`<li><div class="wh">${t}</div><div class="d">${d}</div></li>`).join('')}</ol>`;
}

/* ================= gaveta de detalhe ================= */
function drawer(){
  const d=S.drawer; if(!d) return '';
  const B=BASES[d.base], r=B.rows().find(x=>x.id==d.id); if(!r) return '';
  let body='', titulo='';
  const acoes = (corr)=> podeGerir()
    ? `<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem"><button class="btn btn-p" data-act="toast" data-v="Abre o formulário de correção que já existe (${corr}).">Corrigir</button><button class="btn btn-s" data-act="toast" data-v="Pede confirmação antes de excluir — só gestor de frotas ou administrador.">Excluir</button></div>`
    : `<div class="info" style="margin-top:.6rem">Só gestores de frotas corrigem ou excluem lançamentos. Se algo estiver errado, avise o Igor.</div>`;
  if(d.base==='abast'){ titulo='Abastecimento · '+r.placa+' · '+dt(r.data);
    body=`<dl class="kv"><dt>Data</dt><dd>${dt(r.data)}</dd><dt>Placa</dt><dd>${r.placa} · ${r.modelo}</dd><dt>Equipe no dia</dt><dd>${r.equipe}</dd><dt>Motorista no dia</dt><dd>${esc(r.motorista)}</dd><dt>Litros</dt><dd>${nf2(r.litros)}</dd><dt>Valor</dt><dd>${brl(r.valor)} (${nf2(r.preco)} por litro)</dd><dt>KM no painel</dt><dd>${r.km?nf(r.km):'não informado'}</dd><dt>Posto</dt><dd>${esc(r.posto)}</dd><dt>Lançado em</dt><dd>${dt(r.criado.slice(0,10))} ${r.criado.slice(11)}</dd></dl>${r.corrigido?'<div class="info">Corrigido em 22/10/2026 pelo gestor de frotas: valor era R$ 248,10. Motivo: "digitei errado".</div>':''}${acoes('litros, valor e KM, com motivo')}`;}
  if(d.base==='km'){ titulo='KM diário · '+r.equipe+' · '+dt(r.data);
    body=`<dl class="kv"><dt>Data</dt><dd>${dt(r.data)}</dd><dt>Equipe</dt><dd>${r.equipe}</dd><dt>Placa</dt><dd>${r.placa}</dd><dt>Motorista</dt><dd>${esc(r.motorista)}</dd><dt>KM informado</dt><dd>${nf(r.km)}</dd><dt>Rodou desde o anterior</dt><dd>${nf(r.rodado)} km</dd><dt>Observações</dt><dd>${r.obs?esc(r.obs):'—'}</dd></dl>${acoes('KM novo entre o lançamento anterior e o seguinte, com motivo')}`;}
  if(d.base==='mot'){ titulo=r.nome;
    body=`<dl class="kv"><dt>Equipe atual</dt><dd>${r.equipe||'sem equipe'}</dd><dt>CNH</dt><dd>${r.cnh}</dd><dt>Vencimento da CNH</dt><dd>${dt(r.cnhVenc)} ${cnhChip(r)}</dd><dt>Contato</dt><dd>${r.contato}</dd><dt>Situação</dt><dd>${r.ativo?'Ativo':'Inativo'}</dd><dt>Termo de uso</dt><dd>assinado em 04/08/2026</dd></dl>
    <div class="wh b sm">Carros que passaram por este motorista</div><div class="tl">${(()=>{const v=VEIC.find(x=>x.motorista===r.nome);return v?histVeic(v).filter(h=>h.mot===r.nome).map(h=>`<div class="${h.fim?'':'cur'}">${dt(h.ini)} → ${h.fim?dt(h.fim):'hoje'} · <b class="wh">${v.placa}</b> · ${h.eq}</div>`).join(''):'<div>Nenhum carro registrado.</div>'})()}</div>
    ${podeGerir()?'<button class="btn btn-s" data-act="toast" data-v="Abre o cadastro do motorista para edição.">Editar cadastro</button>':''}`;}
  if(d.base==='veic'){ titulo='Ficha do veículo · '+r.placa;
    const hh=histVeic(r); const ab=AB.filter(a=>a.placa===r.placa).slice(0,3); const km=KM.filter(k=>k.placa===r.placa).slice(0,3);
    body=`<dl class="kv"><dt>Modelo</dt><dd>${r.modelo} ${r.ano}</dd><dt>Situação</dt><dd>${sitChip(r)}</dd><dt>Equipe / motorista</dt><dd>${r.equipe?r.equipe+' · '+esc(r.motorista):'—'}</dd><dt>KM atual</dt><dd>${nf(r.km)}</dd><dt>Franquia</dt><dd>${nf(r.km_contratual)} km/mês</dd><dt>Locação</dt><dd>${brl(r.locacao)}/mês</dd>${r.retorno?`<dt>Volta da oficina</dt><dd>${dt(r.retorno)}</dd>`:''}</dl>
    <div class="wh b sm">Histórico carro × equipe × motorista</div><div class="tl">${hh.length?[...hh].reverse().map(h=>`<div class="${h.fim?'':'cur'}">${dt(h.ini)} → ${h.fim?dt(h.fim):'hoje'} · <b class="wh">${h.eq}</b> · ${esc(h.mot)} <span class="mut xs">(${h.o})</span></div>`).join(''):'<div>Nunca esteve com uma equipe.</div>'}</div>
    <div class="wh b sm">Últimos KM</div><div class="tl">${km.length?km.map(k=>`<div>${dt(k.data)} · ${nf(k.km)} km</div>`).join(''):'<div>Sem lançamentos.</div>'}</div>
    <div class="wh b sm">Últimos abastecimentos</div><div class="tl">${ab.length?ab.map(a=>`<div>${dt(a.data)} · ${nf2(a.litros)} L · ${brl(a.valor)}</div>`).join(''):'<div>Sem abastecimentos.</div>'}</div>
    ${podeGerir()?'<div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn btn-s" data-act="toast" data-v="Abre a ficha completa do veículo (tela que já existe).">Abrir ficha completa</button><button class="btn btn-s" data-act="toast" data-v="Pede a data prevista de volta (e, se aprovado, o motivo: revisão ou mecânico).">Enviar para oficina</button></div>':'<button class="btn btn-s" data-act="toast" data-v="Abre a ficha completa do veículo (tela que já existe).">Abrir ficha completa</button>'}`;}
  return `<div class="ov" data-act="fechar-ov"><aside class="drawer" data-stop="1"><div style="display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start"><div class="wh b">${titulo}</div><button class="btn btn-s" data-act="fechar">Fechar</button></div>${body}</aside></div>`;
}

/* ================= modais ================= */
function modal(){
  const m=S.modal; if(!m) return '';
  let t='',b='';
  if(m.tipo==='exportar'){
    const B=BASES[S.base], n=filtrar(S.base).length;
    t='Exportar Excel · '+B.nome;
    b=`<dl class="kv"><dt>Arquivo</dt><dd class="mono">${B.arquivo}-${HOJE}.xlsx</dd><dt>Linhas</dt><dd>${nf(n)} (tudo o que está filtrado, não só a página)</dd><dt>Filtros</dt><dd>${filtrosTexto(S.base)}</dd></dl>
      <div class="sm mut">Colunas da planilha, nesta ordem:</div><ol class="collist" style="padding-left:1.3rem">${B.planilha.map(c=>`<li>${c}</li>`).join('')}</ol>
      <div class="xs mut" style="margin:.6rem 0 1rem">Cabeçalho em negrito e congelado, com filtro do Excel ligado. Datas como data e valores como número.</div>
      <div style="display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap"><button class="btn btn-s" data-act="fechar">Cancelar</button><button class="btn btn-p" data-act="baixar">Baixar planilha</button></div>`;
  }
  if(m.tipo==='novo'){
    const F={abast:['Registrar novo abastecimento',[['Veículo','select'],['Data','date'],['Litros','text'],['Valor (R$)','text'],['KM no painel (opcional)','text'],['Posto (opcional)','text']]],
      km:['Lançar KM do dia',[['Equipe','select'],['Data','date'],['KM do painel','text'],['Observações (opcional)','text']]],
      mot:['Cadastrar motorista',[['Nome','text'],['CNH','text'],['Vencimento da CNH','date'],['Contato','text'],['Equipe','select']]],
      veic:['Cadastrar veículo',[['Placa','text'],['Modelo','text'],['Ano','text'],['Franquia de KM/mês','text'],['Valor da locação mensal (R$)','text']]]}[m.v];
    t=F[0];
    b=`<p class="xs mut" style="margin-top:0">É o formulário que já existe hoje; só ganhou o botão na base.</p>${F[1].map(([l,ty])=>`<label style="display:block;margin-bottom:.6rem"><span class="lbl xs mut">${l}</span>${ty==='select'?`<select class="fld"><option>Selecione…</option></select>`:`<input class="fld" type="${ty}">`}</label>`).join('')}
      <div style="display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap"><button class="btn btn-s" data-act="fechar">Cancelar</button><button class="btn btn-p" data-act="salvar">Salvar</button></div>`;
  }
  return `<div class="ov c" data-act="fechar-ov"><div class="modal" data-stop="1"><div class="wh b" style="margin-bottom:.6rem">${t}</div>${b}</div></div>`;
}

/* ================= render ================= */
function render(){
  const corpo = {visao:telaVisao,bases:telaBases,email:telaEmail,sup:telaSup}[S.tela]();
  $('#app').innerHTML = mbar() + `<div class="shell">${side()}<main class="main">${corpo}</main></div>`;
  $('#ovl').innerHTML = drawer() + modal();
  if(S.focus){const el=document.getElementById(S.focus); if(el){el.focus(); const n=el.value.length; try{el.setSelectionRange(n,n)}catch(e){}} S.focus=null}
}
function irBase(b,patch,aviso){S.tela='bases';S.base=b;S.f[b]=Object.assign(fdef(b),{busca:'',equipe:'',placa:'',motorista:'',situacao:'',cnh:'',sit:''},patch||{});S.pag[b]=1;S.aviso=aviso?{base:b,txt:aviso}:null;window.scrollTo(0,0);render()}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.act==='fechar-ov' && e.target.closest('[data-stop]')) return;
  const a=el.dataset.act, v=el.dataset.v;
  if(el.tagName==='A') e.preventDefault();
  switch(a){
    case 'tela': S.tela=v; S.drawer=null; window.scrollTo(0,0); break;
    case 'estado': S.estado=v; break;
    case 'papel': S.papel=v; break;
    case 'go-visao': S.tela='visao'; break;
    case 'go-abast': case 'go-km': case 'go-mot': case 'go-veic': S.tela='bases'; S.base=a.slice(3); S.aviso=null; break;
    case 'base': S.base=v; S.aviso=null; break;
    case 'sit': return irBase('veic',{sit:v});
    case 'cnh': return irBase('mot',{cnh:'alerta'});
    case 'km-ontem': return irBase('km',{de:'2026-10-28',ate:ONTEM},`Sem lançamento em 29/10: <b class="wh">${SEM_KM_ONTEM.join(', ')}</b>. As linhas abaixo são das equipes que lançaram.`);
    case 'ab-mes': return irBase('abast',{de:'2026-10-01',ate:HOJE});
    case 'sort': {const so=S.sort[S.base]; S.sort[S.base]= so&&so.k===v ? {k:v,dir:-so.dir} : {k:v,dir:1}; break}
    case 'pag': S.pag[S.base]=+v; break;
    case 'limpar': S.f[S.base]=null; fdef(S.base); S.f[S.base].de=''; S.aviso=null; break;
    case 'aviso-x': S.aviso=null; break;
    case 'row': S.drawer={base:S.base,id:v}; break;
    case 'exportar': S.modal={tipo:'exportar'}; break;
    case 'novo': S.modal={tipo:'novo',v}; break;
    case 'baixar': S.modal=null; toast('Planilha gerada (no mockup não baixa arquivo).'); break;
    case 'salvar': S.modal=null; toast('Salvo. A linha nova aparece no topo da base.'); break;
    case 'fechar': case 'fechar-ov': S.modal=null; S.drawer=null; break;
    case 'ureg': S.userRegistra = v==='1'; break;
    case 'mailvar': S.mailVar=v; if(S.estado!=='dados') S.estado='dados'; break;
    case 'mail-link': {const m={visao:'visão geral',rev:'Revisões, já filtrado',km:'KM diário de ontem',doc:'Documentos',mot:'Motoristas com CNH em alerta',multa:'Multas pendentes',sin:'Sinistros abertos',veic:'Veículos na oficina'}; toast('Abre o hub em: '+m[v]+'.'); return}
    case 'toast': toast(v); return;
    case 'toast-form': toast('Abre o formulário "'+v+'" que já existe.'); return;
    case 'toast-rev': toast('Abre Revisões filtrado. (Revisões ainda não está no formato de base — ver 2.5.)'); return;
    case 'toast-doc': toast('Abre Documentos, ordenado por vencimento.'); return;
    case 'toast-multa': toast('Abre Multas, só as sem tratativa.'); return;
    case 'toast-sin': toast('Abre Sinistros, só os abertos e em tratativa.'); return;
    case 'toast-custo': toast('Abre a tela Custos, que detalha por carro.'); return;
    case 'toast-cc': toast('Abre a Lista de gastos dos extratos, filtrada neste centro de custo.'); return;
    default: return;
  }
  render();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='papel-sel'){S.papel=el.value;S.drawer=null;S.modal=null;render()}
  else if(el.dataset.act==='oficina-nova'){S.oficinaNova=el.checked;render()}
  else if(el.dataset.act==='f' && el.dataset.k!=='busca'){fdef(S.base)[el.dataset.k]=el.value;S.pag[S.base]=1;S.aviso=null;render()}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.act==='f' && el.dataset.k==='busca'){fdef(S.base).busca=el.value;S.pag[S.base]=1;S.focus=el.id;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.modal||S.drawer)){S.modal=null;S.drawer=null;render()}});
render();
</script>
</body>
</html>
