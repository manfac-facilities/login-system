<title>Almoxarifado Manfac</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: continuação da rodada 1 (2026-11-11-mockup-almox.html). Barra do mockup (âmbar tracejado, fora do produto) fixa no topo,
   uma seção por vez; telas do hub dentro da moldura do hub (lateral navy de 256 px a partir de 768 px, topo navy com menu abaixo disso);
   contagem de inventário dentro de um celular; assinatura dentro de um tablet. Tema único, o escuro do hub, de propósito:
   tokens e componentes copiados sem mudança da rodada 1; o que é novo vem depois do bloco copiado. */
:root{
  color-scheme:dark;
  --background:#0a1628;--navy:#0d2050;--navy-hover:#10285f;--orange:#f05a28;--orange-hover:#d94e22;
  --muted:#94a3b8;--muted-dark:#4a6080;--border:#1e3a5f;--input-bg:#0f1f3d;--error:#ef4444;
  --texto:#ffffff;--texto-suave:#e8eef7;
  --verde-bg:#0d542b;--verde:#7bf1a8;--ambar-bg:#7b3306;--ambar:#ffd230;
  --vermelho-bg:#82181a;--vermelho:#ffa2a2;--azul-bg:#1c398e;--azul:#8ec5ff;
  --erro-borda:#e7000b;--erro-fundo:#460809;--ok-borda:#008236;--ok-fundo:#052e16;
  --div-fundo:rgba(123,51,6,.42);--div-solido:#3a2219;
  /* Texto auxiliar: #94a3b8, a opção legível da decisão D7 do RH. */
  --aux:var(--muted);
  /* Só do mockup: âmbar tracejado, para nunca parecer parte do produto. */
  --nota:#fbbf24;--nota-fundo:#2a2108;--nota-borda:#7a5c0e;--mk-fundo:#060e1c;--frame:#050b16;
  /* Nomes que o JavaScript usa em estilos inline. */
  --primary:var(--orange);--primary-foreground:#ffffff;--aviso:var(--ambar);--aviso-bg:var(--div-fundo);--ok:var(--verde);--destructive:var(--vermelho);
  --fonte:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background-color:var(--background);color:var(--texto)}
body{margin:0;font:400 14px/1.5 var(--fonte);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--mk-fundo)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.n,.tab{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.label-mono{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:500;color:var(--aux)}
.sp{flex:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ------------------------------ fora do produto: o mockup ------------------------------ */
.mk-in,.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mk-cab{background:var(--mk-fundo)}
.mk-cab .wrap{padding-block:12px 4px}
.mk-tit{font-weight:600;color:var(--nota)}
.mk-tit small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.mk-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--mk-fundo);border-bottom:1px dashed var(--nota-borda)}
.mk-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:8px}
.mk-tabs{display:flex;gap:4px;min-width:0}
.mk-tab{border:1px dashed var(--nota-borda);background:transparent;color:var(--texto-suave);border-radius:8px;min-height:34px;padding:0 12px;font-size:13px;white-space:nowrap}
.mk-tab:hover{border-color:var(--nota)}
.mk-tab[aria-selected="true"]{background:var(--nota);border:1px solid var(--nota);color:#1a1405;font-weight:600}
.mk-tab .tc{display:none}
.mk-hora{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px dashed var(--nota-borda);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:6px;padding:4px 9px;font-size:12px;color:var(--texto-suave)}
.seg button:hover{background:var(--nota-fundo)}
.seg button[aria-pressed="true"]{background:var(--nota);color:#1a1405;font-weight:600}
.mk-ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--texto-suave);padding:8px 10px;border:1px dashed var(--nota-borda);border-radius:10px;background:var(--nota-fundo)}
.mk-ctrl b{font-weight:600;color:var(--nota)}
@media (max-width:640px){
  .mk-in{gap:6px 8px;padding-block:6px}
  .mk-in>.sp{display:none}
  .mk-hora{margin-left:auto}
  .mk-tabs{gap:3px}
  .mk-tab{padding:0 7px;min-width:34px}
  .mk-tab .tl,.mk-tab .tc{display:none}
  .mk-tab[aria-selected="true"] .tc{display:inline}
  .mk-hora .hd,.mk-hora .mk-hora-r{display:none}
  .mk-hora .seg::before{content:"Hora";align-self:center;padding:0 1px 0 4px;font-size:10px;color:var(--muted)}
  .mk-hora .seg button{padding:7px 5px}
}

main.pg{padding-block:20px 80px}
.sec-h{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.sec-h h1{font-size:22px;font-weight:700;color:var(--texto)}
.sec-h p{color:var(--muted);max-width:72ch}

/* ------------------------------ componentes do hub ------------------------------ */
/* Botões: btn-p, btn-s e btn-er do RH/Frotas */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 16px;border-radius:8px;border:1px solid transparent;background:var(--orange);color:#fff;font-size:14px;font-weight:500;white-space:nowrap;transition:background-color .15s,border-color .15s,transform .15s;text-decoration:none}
.btn:hover{background:var(--orange-hover)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-outline{background:transparent;border-color:var(--border);color:var(--texto-suave)}
.btn-outline:hover{background:transparent;border-color:var(--muted)}
.btn-secondary{background:var(--border);color:#fff}
.btn-secondary:hover{background:var(--navy-hover)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--border);color:#fff}
.btn-destructive{background:transparent;border-color:var(--erro-borda);color:#fff}
.btn-destructive:hover{background:var(--vermelho-bg)}
.btn-destructive-solid{background:var(--erro-borda);color:#fff}
.btn-destructive-solid:hover{background:#c10007}
.btn-sm{min-height:32px;padding:0 12px;font-size:13px}
.btn-xs{min-height:26px;padding:0 8px;font-size:12px;border-radius:6px}
.btn-lg{min-height:44px;padding:0 18px;font-size:15px}
.btn-block{width:100%}
/* Etiquetas: chips do BaseTabela; a forma fica, para o tom não depender só da cor */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:500;line-height:1.45;white-space:nowrap;background:var(--border);color:var(--texto-suave)}
.badge::before{font-size:9px;line-height:1}
.b-ok{background:var(--verde-bg);color:var(--verde)}.b-ok::before{content:'✓'}
.b-avi{background:var(--ambar-bg);color:var(--ambar)}.b-avi::before{content:'◆'}
.b-des{background:var(--vermelho-bg);color:var(--vermelho)}.b-des::before{content:'▲'}
.b-sec{background:var(--azul-bg);color:var(--azul)}.b-sec::before{content:'●'}
.b-out{background:var(--border);color:var(--texto-suave)}
/* Cartões navy */
.card{background:var(--navy);border:1px solid var(--border);border-radius:12px;padding:20px;min-width:0}
/* Campos: veiculos/novo/_form.tsx */
.inp{min-height:36px;border:1px solid var(--border);background:var(--input-bg);color:#fff;border-radius:8px;padding:0 12px;font-size:14px;min-width:0;outline:none}
.inp::placeholder{color:var(--muted-dark)}
.inp:focus{border-color:var(--orange)}
textarea.inp{padding:10px 12px;resize:vertical;width:100%}
select.inp{padding-right:8px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--orange);width:16px;height:16px;flex:none}

/* Moldura do hub: lateral de components/sofia/Sidebar.tsx; abaixo de 768 px vira topo navy com menu, como no Frotas */
.shell{container:sh/inline-size;position:relative;isolation:isolate;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--background)}
.sh-app{display:flex;flex-direction:column;min-height:560px}
.lat{position:absolute;inset:0 auto 0 0;z-index:50;width:256px;max-width:85%;flex:none;background:var(--navy);border-right:1px solid var(--border);padding:16px;overflow-y:auto;display:flex;flex-direction:column;transform:translateX(-100%);visibility:hidden;transition:transform .2s ease-in-out,visibility .2s}
.shell[data-gaveta="sim"] .lat{transform:none;visibility:visible}
.lat-cab{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;padding:0 8px}
.lat-nome{font-size:18px;font-weight:700;line-height:1.25;display:block;color:#fff}
.volta{color:var(--muted);font-size:12px;display:inline-flex;align-items:center}
.lat-fecha{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;display:grid;place-items:center;border-radius:8px;width:44px;height:44px}
.lat-fecha:hover{color:#fff}
.lat-grupo{display:flex;flex-direction:column;gap:4px;margin-bottom:24px}
.item{display:flex;align-items:center;width:100%;min-height:44px;padding:8px;border-radius:4px;font-size:14px;color:var(--muted);transition:background-color .15s,color .15s}
.item[aria-disabled="true"]{cursor:default}
.item[aria-disabled="true"]:hover{background:var(--border);color:#fff}
.item[aria-current="page"]{background:var(--orange);color:#fff}
.lat-pe{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.quem{display:flex;align-items:center;gap:10px;padding:4px 8px 8px}
.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--border);font-size:12px;font-weight:500;color:#fff;flex:none}
.quem-txt{min-width:0;font-size:12px;line-height:1.35}
.quem-txt b{display:block;font-weight:500;color:#fff;font-size:13px}
.quem-txt span{color:var(--muted);overflow-wrap:anywhere}
.topo-cel{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--navy);border-bottom:1px solid var(--border);padding:10px 16px}
.ic-btn{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--muted);flex:none}
.ic-btn:hover{color:#fff;border-color:var(--muted)}
.veu{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.shell[data-gaveta="sim"] .veu{display:block}
.sh-main{container:area/inline-size;flex:1;min-width:0;padding:16px}
@container sh (min-width:640px){.sh-main{padding:24px}}
@container sh (min-width:1100px){.sh-main{padding:32px}}
@container sh (min-width:768px){
  .topo-cel,.veu{display:none!important}
  .sh-app{flex-direction:row}
  .lat{position:static;z-index:auto;transform:none;visibility:visible;max-width:none;transition:none}
  .lat-fecha{display:none}
  .item{min-height:0}
}
/* Título de página: app/(operacoes)/sofia/page.tsx */
.pg-tit{font-size:24px;line-height:1.33;font-weight:700;color:#fff}

/* Estados: vazio é convite (tracejado), erro é alarme (vermelho cheio), sem acesso é cartão navy */
.est{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:24px;border-radius:12px;font-size:14px}
.est h3{font-size:16px;font-weight:600;color:#fff}
.est p{max-width:60ch;color:var(--muted)}
.est .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;font-weight:700}
.est-vazio,.est-ok{border:1px dashed var(--border);align-items:center;text-align:center;padding:40px 16px}
.est-vazio h3{font-weight:500;color:var(--texto-suave)}
.est-vazio .ico{background:var(--border);color:var(--muted)}
.est-ok .ico{background:var(--verde-bg);color:var(--verde)}
.est-erro{border:1px solid var(--erro-borda);background:var(--erro-fundo)}
.est-erro p{color:var(--vermelho)}
.est-erro .ico{background:var(--erro-borda);color:#fff}
.est-erro .btn{background:transparent;border-color:var(--erro-borda)}
.est-erro .btn:hover{background:var(--vermelho-bg)}
.est-perm{border:1px solid var(--border);background:var(--navy)}
.est-perm .ico{background:var(--border);color:var(--muted)}
.skel{background:var(--navy);border-radius:6px;height:14px;animation:sk 1.6s ease-in-out infinite}
.card .skel,.fi .skel,.ped .skel{background:var(--border)}
@keyframes sk{50%{opacity:.45}}

/* Seção 1 */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:20px}
@container area (min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container area (min-width:860px){.tiles{grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}}
.tile{padding:16px;transition:border-color .15s}
.tile[data-a]:hover{border-color:var(--orange)}
.tile .v{font-size:22px;line-height:1.25;font-weight:700;color:#fff;margin-top:4px;overflow-wrap:anywhere}
.tile .s{font-size:12px;color:var(--aux);margin-top:4px}
.tile.alerta .v{color:var(--vermelho)}
@container area (max-width:420px){.tile .v{font-size:19px}}
.filtros{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px}
.filtros .busca{flex:1 1 240px;min-width:0}
.filtros .busca input{width:100%}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--aux);margin-bottom:8px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
/* Tabela: BaseTabela do Frotas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;max-width:100%;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{padding:10px 12px;text-align:left;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--border);background:var(--navy)}
.tbl td{padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--texto-suave)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr.lin:hover td{background:var(--navy)}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td.r{font-variant-numeric:tabular-nums}
.tbl .col-on{box-shadow:inset 0 -2px 0 var(--orange)}
.tbl .fix{position:sticky;left:0;z-index:1;background:var(--background)}
.tbl th.fix{background:var(--navy);z-index:2}
.tbl tbody tr.lin:hover td.fix{background:var(--navy)}
.prod-btn{border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;max-width:280px;color:#fff}
.prod-btn .nm{font-weight:500;white-space:normal;line-height:1.3}
.prod-btn:hover .nm{color:var(--orange);text-decoration:underline;text-underline-offset:3px}
.prod-btn .cd{font-family:var(--mono);font-size:11px;color:var(--aux)}
.tbl td.c-red{background:var(--vermelho-bg);color:var(--vermelho);font-weight:600}
.tbl td.c-amb{background:var(--ambar-bg);color:var(--ambar);font-weight:600}
.zero{color:var(--muted-dark)}
.tbl .zero{color:var(--aux)}
.eq-btn{border:1px solid var(--border);background:transparent;color:var(--texto-suave);border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
.eq-btn:hover{border-color:var(--orange)}
.tbl .sub td{background:var(--navy);font-size:13px;white-space:normal}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;border-radius:4px;padding:2px 8px;font-size:12px;background:var(--border);color:var(--texto-suave)}
.chip b{color:#fff}
.min-t{font-size:12px;color:var(--aux)}
.atual{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--aux)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--verde);animation:pul 2.2s ease-in-out infinite}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.4}}

/* Diálogo */
dialog.dlg{border:1px solid var(--border);padding:0;border-radius:12px;background:var(--navy);color:#fff;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 20px 60px rgba(0,0,0,.55)}
dialog.dlg::backdrop{background:rgba(0,0,0,.6)}
.dlg-in{display:flex;flex-direction:column;gap:14px;padding:20px;max-height:calc(100vh - 48px);overflow:auto}
.dlg-h{display:flex;align-items:flex-start;gap:12px}
.dlg-h h2{font-size:18px;font-weight:600}
.dlg .tbl .fix,.dlg .tbl td{background:var(--navy)}
.dlg .tbl th{background:var(--background)}
.dlg-f{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.conseq{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-radius:8px;background:var(--erro-fundo);border:1px solid var(--erro-borda);color:var(--texto-suave)}
.conseq b{color:#fff}
.conseq ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:14px;color:var(--muted)}
.erro-t{color:var(--vermelho);font-size:13px}
.hist{display:flex;flex-direction:column}
.hist .h{display:grid;grid-template-columns:92px 1fr auto;gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--border)}
.hist .h:last-child{border:0}
.hist .q{font-weight:600;font-variant-numeric:tabular-nums}
.q.pos{color:var(--verde)}

.s2-grid{display:grid;grid-template-columns:400px minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:900px){.s2-grid{grid-template-columns:minmax(0,1fr)}}
.phone{width:390px;max-width:100%;height:800px;border:11px solid var(--frame);border-radius:46px;overflow:hidden;display:flex;flex-direction:column;background:var(--background);box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 1px var(--border);position:relative}
.ph-notch{height:26px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600;background:var(--navy);color:#fff}
@media (max-width:520px){.s2-grid .phone{width:100%;height:auto;min-height:680px;border:1px solid var(--border);border-radius:12px;box-shadow:none}.ph-notch{display:none}.phone .ph-body{overflow:visible}}
.ph-head{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--navy);color:#fff}
.ph-head .t1{font-weight:700;font-size:16px;line-height:1.25}
.ph-head .t2{font-size:12px;color:var(--muted)}
.bell{position:relative;border:1px solid var(--border);background:none;color:#fff;width:44px;height:44px;border-radius:8px;display:grid;place-items:center}
.bell .ct{position:absolute;top:-6px;right:-6px;background:var(--orange);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.ph-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.ph-foot{flex:none;border-top:1px solid var(--border);background:var(--navy);position:sticky;bottom:0}
.tabs-b{display:grid;grid-template-columns:1fr 1fr}
.tabs-b button{border:0;background:transparent;min-height:56px;padding:8px 6px;font-size:12px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs-b button[aria-current="page"]{color:var(--orange);font-weight:600}
.tabs-b .ic{font-size:17px;line-height:1}
.cartbar{display:flex;align-items:center;gap:10px;padding:10px 16px}
.cartbar .muted{color:var(--muted)}
.pin-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 20px;text-align:center}
.pin-logo{width:56px;height:56px;border-radius:14px;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px}
.pin-wrap h2{color:#fff}
.pin-dots{display:flex;gap:12px;height:18px}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots span.f{background:var(--orange);border-color:var(--orange)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.keypad button{height:60px;border-radius:12px;border:1px solid var(--border);background:var(--navy);color:#fff;font-size:22px;font-weight:500}
.keypad button:active{background:var(--navy-hover)}
.faixa{border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--texto-suave);border:1px solid var(--border)}
.faixa .al{display:flex;gap:8px;align-items:flex-start}
.faixa .al .tx{flex:1}
.al-avi{background:var(--div-fundo);border-color:var(--ambar-bg)}
.al-des{background:var(--erro-fundo);border-color:var(--erro-borda)}
.al-ok{background:var(--ok-fundo);border-color:var(--ok-borda)}
.al-sec{background:rgba(28,57,142,.35);border-color:var(--azul-bg)}
.al .mk{font-weight:700;width:18px;text-align:center;flex:none}
.al-avi .mk{color:var(--ambar)}.al-des .mk{color:var(--vermelho)}.al-ok .mk{color:var(--verde)}.al-sec .mk{color:var(--azul)}
.al-x{border:0;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline;padding:6px 0;min-height:32px}
.al-x:hover{color:#fff}
.ped{border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--navy);color:var(--texto-suave);text-align:left;width:100%;transition:border-color .15s}
.ped:hover{border-color:var(--orange)}
.ped .l1{display:flex;align-items:center;gap:8px}
.ped .num{font-weight:600;font-family:var(--mono);color:#fff}
.ped b{color:#fff;font-weight:600}
.mini-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mini-steps i{height:4px;border-radius:2px;background:var(--border)}
.mini-steps i.on{background:var(--orange)}
.mini-steps i.bad{background:var(--error)}
.mini-steps i.done{background:var(--verde)}
.seg-big{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg-big button{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:8px;padding:9px 6px;font-weight:500;font-size:13px;line-height:1.25;min-height:52px}
.seg-big button small{display:block;font-weight:400;font-size:11px;color:var(--aux)}
.seg-big button[aria-pressed="true"]{background:var(--navy);border-color:var(--orange);color:#fff;box-shadow:inset 0 0 0 1px var(--orange)}
.ph-search{position:relative}
.ph-search input{width:100%;min-height:44px;font-size:16px;padding-left:38px}
.ph-search .lupa{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.mat{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.mat:last-child{border-bottom:0}
.mat .info{flex:1;min-width:0}
.mat .nm{font-weight:500;line-height:1.3;color:#fff}
.mat .dp{font-size:12px;color:var(--muted)}
.mat .dp b{color:var(--verde);font-weight:600}
.mat.ast .dp{color:var(--ambar)}
.mat.cinza{opacity:.55}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--navy)}
.stepper button{width:40px;height:40px;border:0;background:transparent;color:#fff;font-size:18px}
.stepper button:hover{background:var(--navy-hover)}
.stepper span{min-width:34px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;color:#fff}
.add-btn{min-height:40px}
.datas{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.dt{flex:none;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--background);color:#fff;text-align:center;min-width:64px;line-height:1.2}
.dt b{display:block;font-size:15px}
.dt small{font-size:11px;color:var(--muted)}
.dt[aria-pressed="true"]{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange);background:var(--navy-hover)}
.dt[disabled]{opacity:.4;cursor:not-allowed}
.dt .em{color:var(--vermelho);font-size:10px;font-weight:600;display:block}
.box{border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--navy);color:var(--texto-suave)}
.box h4{margin:0;font-size:13px;font-weight:600;color:#fff}
.box b{color:#fff}
.box .tbl th{background:var(--background)}
.box .tbl td,.box .tbl .fix{background:var(--navy)}
.vsteps{display:flex;flex-direction:column}
.vs{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:14px}
.vs:last-child{padding-bottom:0}
.vs::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--border)}
.vs:last-child::before{display:none}
.vs .c{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:var(--navy);color:var(--muted);display:grid;place-items:center;font-size:11px;font-weight:700;z-index:1}
.vs.done .c{background:var(--verde-bg);border-color:var(--verde);color:var(--verde)}
.vs.cur .c{border-color:var(--orange);color:var(--orange)}
.vs.bad .c{background:var(--vermelho-bg);border-color:var(--erro-borda);color:var(--vermelho)}
.vs .t{font-weight:500;color:#fff}
.vs .w{font-size:12px;color:var(--muted)}
.lado{display:flex;flex-direction:column;gap:14px;max-width:62ch}
.lado h3{font-size:15px;font-weight:600}
.lado ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.lado li b{color:#fff;font-weight:600}
.det{container:det/inline-size;display:flex;flex-direction:column;gap:14px;min-width:0}
.det-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.det-h h2{font-size:20px;font-weight:600;color:#fff}
.info.card{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.info .k{font-size:12px;color:var(--aux);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.info .v{font-weight:500;color:#fff}
.emerg{border:1px solid var(--erro-borda);background:var(--erro-fundo);color:var(--texto-suave);border-radius:8px;padding:12px 16px;font-size:13px}
.emerg b{color:var(--vermelho)}
.qty{display:inline-flex;align-items:center;gap:4px}
.tbl.ap th{white-space:normal;line-height:1.2;padding:8px;min-width:60px;vertical-align:bottom}
.tbl.ap td{padding-inline:8px}
.qty input{width:46px;min-height:32px;padding:0 6px;-moz-appearance:textfield;text-align:right;font-variant-numeric:tabular-nums}
.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.qty button{width:28px;height:32px;border-radius:6px;border:1px solid var(--border);background:transparent;color:#fff}
.qty button:hover{border-color:var(--orange)}
.tbl tr.div td{background:var(--div-fundo)}
.tbl tr.div td.fix{background:var(--div-solido)}
.tbl tr.div:hover td{background:var(--div-solido)}
.tbl tr.zer td{opacity:.55}
.notas{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;white-space:normal}
.depois{font-weight:600;color:#fff}
.resumo{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-radius:12px;background:var(--navy);border:1px solid var(--border);color:var(--texto-suave)}
.resumo b{color:#fff}
.corte{border-radius:8px;padding:12px 16px;background:var(--div-fundo);border:1px solid var(--ambar-bg);font-size:13px;color:var(--texto-suave)}
.corte b{color:var(--ambar)}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.incl{position:relative;flex:1 1 260px;min-width:0}
.incl input{width:100%}
.incl-res{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--navy);border:1px solid var(--border);border-radius:8px;padding:4px;box-shadow:0 12px 30px rgba(0,0,0,.45);overflow:hidden}
.incl-res button{display:flex;width:100%;border:0;background:transparent;color:#fff;padding:8px;min-height:40px;border-radius:6px;text-align:left;gap:8px;align-items:center}
.incl-res button:hover{background:var(--border)}
.okmsg{border-radius:8px;padding:12px 16px;border:1px solid var(--ok-borda);background:var(--ok-fundo);color:var(--texto-suave);font-size:13px}
.okmsg b{color:var(--verde)}

/* ------------------------------ novo na rodada 2B ------------------------------ */
:root{
  /* Séries de gráfico (validadas no fundo navy e no fundo da página: banda de luminosidade, croma, daltonismo, contraste) */
  --s1:#3d8fe0;--s2:#e2541f;--s3:#9b6ae3;
}
.mk-tabs{flex-wrap:wrap}
.mk-data{font-size:12px;color:var(--muted)}
@media (max-width:640px){.mk-data{display:none}}
.dlg-in{container:area/inline-size}
.lado-p{font-size:13px;color:var(--muted)}
.tabs-in{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tab-in{border:0;background:none;color:var(--muted);padding:10px 12px;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;min-height:44px}
.tab-in:hover{color:#fff}
.tab-in[aria-selected="true"]{color:#fff;border-bottom-color:var(--orange)}
.pill-seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.pill-seg button{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:999px;padding:4px 12px;min-height:32px;font-size:13px}
.pill-seg button:hover{border-color:var(--muted);color:#fff}
.pill-seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--orange);color:#fff}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.h3{font-size:16px;font-weight:600;color:#fff}
.small{font-size:12px;color:var(--aux)}
.risc{text-decoration:line-through;color:var(--muted-dark)}
.neg{color:var(--vermelho)}.pos{color:var(--verde)}
.num-in{width:72px;text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.num-in::-webkit-inner-spin-button{-webkit-appearance:none}
.prog{height:8px;border-radius:4px;background:var(--border);overflow:hidden}
.prog i{display:block;height:100%;background:var(--orange);border-radius:4px;transition:width .2s}
.prog.ok i{background:var(--verde)}
.prog-l{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px}
.prog-l b{color:#fff;font-weight:600}
.pendbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;border-radius:12px;border:1px solid var(--ambar-bg);background:var(--div-fundo);color:var(--texto-suave);font-size:13px}
.pendbar b{color:var(--ambar)}
.lista-erros{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

.tbl tr.sel td{background:rgba(240,90,40,.08)}
.tbl tr.apagado td{opacity:.55}
/* Tabelas largas viram cartões quando a área é estreita (mesmo padrão da aprovação na rodada 1) */
@container area (max-width:559.98px){
  .tbl-wrap:has(.tbl.cv){border:0;border-radius:0;overflow:visible}
  .tbl.cv thead{display:none}
  .tbl.cv,.tbl.cv tbody{display:block}
  .tbl.cv tbody{display:flex;flex-direction:column;gap:8px}
  .tbl.cv tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--navy)}
  .tbl.cv tr td,.tbl.cv tr.lin:hover td,.tbl.cv tr td.fix{background:transparent;padding:0;border:0;white-space:normal;text-align:left;position:static;min-width:0}
  .tbl.cv td.wide,.tbl.cv td.fix{grid-column:1/-1;color:#fff}
  .tbl.cv td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--aux);margin-bottom:2px;font-weight:400}
  .tbl.cv td.r{font-size:15px}
  .tbl.cv tr.div{background:var(--div-solido);border-color:var(--ambar-bg)}
  .tbl.cv tr.sel{border-color:var(--orange)}
  .tbl.cv tr.apagado{opacity:.6}
  .tbl.cv .inp{width:100%!important;min-height:40px;font-size:16px}
  .tbl.cv .num-in{width:100%!important;text-align:left}
  .tbl.cv .qty{width:100%}
  .tbl.cv .qty input{flex:1;width:auto}
  .tbl.cv .qty button{width:40px;height:40px}
  .tbl.cv td.ck{grid-column:1/-1}
}
.tbl td.ck,.tbl th.ck{width:36px}
.ck input{accent-color:var(--orange);width:18px;height:18px}

/* Seção 12: agenda de entregas */
.grp{display:flex;flex-direction:column;gap:8px}
.grp-t{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
.grp-t.atr{color:var(--vermelho)}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--navy);color:var(--texto-suave)}
.ent.atr{border-color:var(--erro-borda);background:linear-gradient(90deg,var(--erro-fundo),var(--navy) 60%)}
.ent .l1{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ent .num{font-family:var(--mono);font-weight:600;color:#fff}
.ent-f{font-weight:500;color:#fff}
.ent-s{font-size:13px;color:var(--muted)}
.ent-s b{color:var(--texto-suave);font-weight:500}
@container area (max-width:480px){.ent{grid-template-columns:minmax(0,1fr)}.ent .btn{width:100%}}
.foto{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);max-width:100%}
.foto span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.thumb{width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--border);flex:none}
.res ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* Seção 14: celular de contagem */
.ph-grid{display:grid;grid-template-columns:400px minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:900px){.ph-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.ph-grid .phone{width:100%;height:auto;min-height:680px;border:1px solid var(--border);border-radius:12px;box-shadow:none}.ph-grid .ph-notch{display:none}.ph-grid .phone .ph-body{overflow:visible}}
.cnt{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.cnt:last-child{border-bottom:0}
.cnt .info{flex:1;min-width:0}
.cnt .nm{font-weight:500;line-height:1.3;color:#fff}
.cnt .dp{font-size:12px;color:var(--muted)}
.cnt .ctl{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.cnt input{width:84px;min-height:44px;font-size:18px;text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.cnt input::-webkit-inner-spin-button{-webkit-appearance:none}
.cnt.feito input{border-color:var(--ok-borda);background:var(--ok-fundo)}
.cnt .nao{border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:2px 0;min-height:24px}
.cnt .nao:hover{color:#fff}
.est-btn{display:flex;flex-direction:column;gap:8px}

/* Seção 16: tablet do balcão e assinatura */
.tablet{max-width:860px;border:14px solid var(--frame);border-radius:30px;background:var(--background);box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 1px var(--border);overflow:hidden}
.tb-top{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--navy);border-bottom:1px solid var(--border);font-size:13px;color:var(--muted)}
.tb-top b{color:#fff}
.tb-body{padding:20px;display:flex;flex-direction:column;gap:14px}
@media (max-width:640px){.tablet{border:1px solid var(--border);border-radius:12px;box-shadow:none}.tb-body{padding:14px}}
.termo{background:var(--navy);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--texto-suave)}
.termo h3{font-size:16px;color:#fff}
.termo .txt{font-size:14px;line-height:1.6;max-width:70ch}
.termo .tot{display:flex;justify-content:space-between;font-weight:600;color:#fff;border-top:1px solid var(--border);padding-top:8px}
.sig-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
@media (max-width:760px){.sig-grid{grid-template-columns:minmax(0,1fr)}}
.sig-box{display:flex;flex-direction:column;gap:6px;min-width:0}
canvas.sig{display:block;width:100%;height:190px;border:1px dashed var(--muted-dark);border-radius:12px;background:var(--input-bg);touch-action:none;cursor:crosshair}
.sig-l{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.pin-col{display:flex;flex-direction:column;align-items:center;gap:10px}
.pin-col .keypad{grid-template-columns:repeat(3,64px);gap:8px}
.pin-col .keypad button{height:50px;font-size:20px}
.sig-img{max-width:100%;height:auto;max-height:140px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg)}
.tl{display:flex;flex-direction:column}
.tl .h{display:grid;grid-template-columns:86px minmax(0,1fr);gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.tl .h:last-child{border:0}
.tl .h span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.ficha-h{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}

/* Seção 17: indicadores */
.ind-grp{display:flex;flex-direction:column;gap:10px}
.ind-grp>h2{font-size:15px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px}
.ind-grp>h2::after{content:"";flex:1;height:1px;background:var(--border)}
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px}
.ind{display:flex;flex-direction:column;gap:10px;padding:16px}
.ind h3{font-size:14px;font-weight:600;color:#fff}
.ind .q{font-size:12px;color:var(--aux)}
.big{font-size:30px;line-height:1.1;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.big small{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.big-s{font-size:13px;color:var(--muted)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{font-size:12px;color:var(--aux);border-top:1px solid var(--border);padding-top:8px;margin-top:auto}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;font-size:13px}
.hb .lb{grid-column:1/-1;color:var(--texto-suave);font-size:12px;line-height:1.3;margin-top:4px}
.hb .tr{height:14px;display:flex;align-items:center}
.hb .tr i{display:block;height:100%;min-width:2px;background:var(--s1);border-radius:0 4px 4px 0}
.hb .tr i.dim{opacity:.35}
.hb .vl{font-variant-numeric:tabular-nums;color:#fff;text-align:right;white-space:nowrap}
.hb [data-tip]{cursor:default}
.st100{display:flex;height:18px;gap:2px;border-radius:4px;overflow:hidden}
.st100 i{display:block;height:100%}
.st100 i:first-child{border-radius:4px 0 0 4px}.st100 i:last-child{border-radius:0 4px 4px 0}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--texto-suave)}
.leg .sw{border-radius:3px}
.leg b{font-variant-numeric:tabular-nums;color:#fff}
.lc{width:100%;height:auto;display:block;overflow:visible}
.lc text{font-size:10px;fill:var(--muted);font-family:var(--fonte)}
.lc .vlab{fill:#fff;font-weight:600}
.pend-v{border:1px dashed var(--nota-borda);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;color:var(--texto-suave);background:transparent}
.pend-v .badge{align-self:flex-start}
details.tv{font-size:12px;color:var(--muted)}
details.tv summary{cursor:pointer;min-height:28px;display:flex;align-items:center}
details.tv table{width:100%;border-collapse:collapse;margin-top:4px}
details.tv td{padding:3px 0;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
details.tv td:last-child{text-align:right;color:#fff}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--background);border:1px solid var(--muted-dark);border-radius:8px;padding:6px 10px;font-size:12px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:240px}

/* Seção 18 */
.esc{display:flex;flex-direction:column;gap:8px;max-width:80ch}

<script>
"use strict";
/* ---------- utilidades (as mesmas da rodada 1) ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const casa=(texto,q)=>{const t=norm(texto);return norm(q).split(/\s+/).filter(Boolean).every(k=>t.includes(k));};
const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const brlS=v=>(v>0?"+":v<0?"−":"")+brl(Math.abs(v));
const brlK=v=>v>=1000?`R$ ${(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})} mil`:brl(v);
const num=v=>Number(v).toLocaleString("pt-BR");
const pct=v=>`${Math.round(v)}%`;
const DIAS=["dom","seg","ter","qua","qui","sex","sáb"];
const dia=(dd,mm=11)=>new Date(2026,mm-1,dd);
const fmtD=x=>`${DIAS[x.getDay()]} ${String(x.getDate()).padStart(2,"0")}/${String(x.getMonth()+1).padStart(2,"0")}`;
const fmtC=x=>`${String(x.getDate()).padStart(2,"0")}/${String(x.getMonth()+1).padStart(2,"0")}`;

const diasEntre=(a,b)=>Math.round((b-a)/864e5);

 {id:"luva",cod:"EPI-0011",d:"Luva de vaqueta",un:"par",f:"EPI",cmc:12.5,s:{BASE:30,DPSP:6,PROFARMA:10},e:{},min:{DPSP:10,PROFARMA:8}},
 {id:"oculos",cod:"EPI-0030",d:"Óculos de proteção incolor",un:"un",f:"EPI",cmc:8.9,s:{BASE:20,DPSP:12,PROFARMA:7},e:{},min:{DPSP:5,PROFARMA:5}},

/* ---------- estados genéricos (iguais à rodada 1) ---------- */
const ESTADOS=[["carregando","Carregando"],["dados","Com dados"],["vazio","Vazio"],["erro","Erro ao carregar"],["semperm","Sem permissão"]];
function seletorEstado(sec,atual,extra=""){

  <span class="seg">${ESTADOS.map(([k,r])=>`<button data-a="estado" data-s="${sec}" data-v="${k}" aria-pressed="${k===atual}">${r}</button>`).join("")}</span>${extra}</div>`;
}
function bloco(tipo,titulo,texto,botoes=""){
  const ico={vazio:"∅",erro:"!",perm:"⌂",ok:"✓"}[tipo];
  return `<div class="est est-${tipo}"><div class="ico">${ico}</div><h3>${titulo}</h3><p>${texto}</p>${botoes?`<div class="acoes">${botoes}</div>`:""}</div>`;
}
function shell(ativo,user,papel,corpo){
  const ini=user.split(" ").map(x=>x[0]).slice(0,2).join("");
  const nome=`<div><span class="lat-nome">Almoxarifado</span><span class="volta">← Voltar ao Hub</span></div>`;
  return `<div class="shell" data-gaveta="nao"><div class="sh-app">
  <div class="topo-cel">${nome}<button type="button" class="ic-btn" data-a="sh-menu" aria-label="Abrir menu"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button></div>
  <aside class="lat" aria-label="Menu do módulo"><div class="lat-cab">${nome}<button type="button" class="lat-fecha" data-a="sh-fecha" aria-label="Fechar menu">×</button></div>
  <nav class="lat-grupo">${NAV.map(n=>n===ativo?`<span class="item" aria-current="page">${n}</span>`:`<span class="item" aria-disabled="true" title="Fora desta seção do mockup">${n}</span>`).join("")}</nav>
  <div class="lat-pe"><div class="quem"><span class="avatar" aria-hidden="true">${ini}</span><div class="quem-txt"><b>${user}</b><span>${papel}</span></div></div><span class="item" aria-disabled="true">Sair</span></div></aside>
  <main class="sh-main">${corpo}</main></div><div class="veu" data-a="sh-fecha"></div></div>`;
}
function tentar(o,render){o.estado="carregando";render();setTimeout(()=>{o.estado="dados";render();},900);}
function skel(linhas=6,tiles=4){
  return `<div class="tiles">${"<div class='card tile'><div class='skel' style='width:60%'></div><div class='skel' style='height:22px;margin-top:10px;width:80%'></div></div>".repeat(tiles)}</div>
  <div class="tbl-wrap" style="padding:14px;display:flex;flex-direction:column;gap:14px">${Array.from({length:linhas},(_,i)=>`<div style="display:grid;grid-template-columns:2fr repeat(4,1fr);gap:16px"><div class="skel" style="width:${55+(i*13)%40}%"></div>${"<div class='skel'></div>".repeat(4)}</div>`).join("")}</div>
  <p class="muted" style="margin-top:10px;font-size:13px">Carregando…</p>`;
}
const tile=(k,v,s,cls="")=>`<div class="card tile ${cls}"><div class="label-mono">${k}</div><div class="v n">${v}</div><div class="s">${s}</div></div>`;
const tiles=arr=>`<div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))">${arr.join("")}</div>`;

/* ---------- diálogo ---------- */
const dlg=$("#dlg");
function abrir(html){$("#dlg-in").innerHTML=html;if(!dlg.open)dlg.showModal();}
function fechar(){if(dlg.open)dlg.close();}
dlg.addEventListener("click",e=>{if(e.target===dlg)fechar();});
const dlgCab=(t,sub="")=>`<div class="dlg-h"><div style="flex:1;min-width:0"><h2>${t}</h2>${sub?`<p class="muted" style="margin-top:4px">${sub}</p>`:""}</div><button class="btn btn-ghost btn-sm" data-a="fechar" aria-label="Fechar">Fechar</button></div>`;

/* ---------- importação de planilha (usada nas seções 13 e 16) ---------- */
let IMP=null;
function importDlg(cfg){IMP={cfg,res:null,arq:""};renderImp();}
function lerCSV(txt){
  const L=txt.replace(/\r/g,"").split("\n");
  return L.map((l,i)=>({n:i+1,c:l.split(/[;,\t]/).map(x=>x.trim())})).filter((r,i)=>i>0&&r.c.some(Boolean));
}
function processaImp(txt,nome){IMP.arq=nome;IMP.res=IMP.cfg.validar(lerCSV(txt));renderImp();}
function renderImp(){
  const c=IMP.cfg,r=IMP.res;
  let res="";
  if(r&&r.xlsx)res=`<div class="faixa al-avi"><div class="al"><span class="mk">◆</span><span class="tx">No mockup só dá para ler arquivo .csv. No sistema, a planilha do Excel (.xlsx) entra direto. Use um dos exemplos abaixo ou salve a planilha como CSV.</span></div></div>`;
  else if(r&&r.erros.length)res=`<div class="est est-erro" style="padding:16px"><h3>${r.erros.length} ${plural(r.erros.length,"linha com erro","linhas com erro")} em “${esc(IMP.arq)}”</h3>
    <ul class="lista-erros" style="color:var(--vermelho)">${r.erros.map(e=>`<li><b style="color:#fff">Linha ${e.l}:</b> ${e.m}</li>`).join("")}</ul>
    <p><b style="color:#fff">Nada foi importado.</b> Corrija essas linhas na planilha e envie de novo. As outras ${r.ok.length} linhas estão certas.</p></div>`;
  else if(r)res=`<div class="okmsg"><b>${r.ok.length} linhas certas em “${esc(IMP.arq)}”.</b> ${r.resumo}</div>${r.previa||""}`;
  abrir(`${dlgCab(c.titulo,c.sub)}
   <div class="box"><h4>Colunas da planilha, nesta ordem</h4><div class="mono" style="font-size:12px;overflow-wrap:anywhere">${c.colunas}</div><p class="muted" style="font-size:12px">${c.dica}</p></div>
   <div class="campo"><label for="imp-file">Arquivo (.xlsx ou .csv)</label><input class="inp" id="imp-file" type="file" accept=".csv,.xlsx,text/csv" style="padding:6px"></div>
   <div class="mk-ctrl"><b>Mockup</b> Sem arquivo à mão? <button class="btn btn-outline btn-xs" style="border-style:dashed" data-a="imp-ex" data-v="erro">Usar exemplo com erro</button><button class="btn btn-outline btn-xs" style="border-style:dashed" data-a="imp-ex" data-v="certo">Usar exemplo certo</button></div>
   ${res}
   <div class="dlg-f"><button class="btn btn-outline" data-a="fechar">Cancelar</button><button class="btn" data-a="imp-ok" ${r&&!r.xlsx&&!r.erros.length&&r.ok.length?"":"disabled"}>${c.botao(r&&r.ok?r.ok.length:0)}</button></div>`);
}

const PC=[

const itensTxt=pc=>pc.itens.map(i=>`${esc(PID[i.id].d)} <b>${num(i.q)} ${PID[i.id].un}</b>`).join(" · ");
function s12Card(pc){
  const d=diasEntre(pc.prev,HOJE);
  const bd=d>0?`<span class="badge b-des">Atrasada · ${d} ${plural(d,"dia","dias")}</span>`:d===0?`<span class="badge b-avi">Chega hoje</span>`:`<span class="badge b-out">Previsão ${fmtD(pc.prev)}</span>`;
  const mud=pc.antes?`<div class="ent-s">A previsão mudou no Compras: <span class="risc">${fmtD(pc.antes)}</span> → <b>${fmtD(pc.prev)}</b></div>`:"";
  return `<div class="ent${d>0?" atr":""}"><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><div class="l1"><span class="num">Pedido ${pc.n}</span>${bd}</div>

  const cab=`<div class="row"><h3 class="h3">Conferido pelo almox, falta entrada no Omie</h3><span class="badge b-sec n">${FALTA.length}</span></div>

  if(!FALTA.length)return cab+bloco("ok","Nenhum pedido esperando entrada no Omie","Tudo o que o almox conferiu já entrou no estoque do Omie.");

function s12Agenda(){
  const ab=PC.filter(p=>p.st==="aberto").sort((a,b)=>a.prev-b.prev);

const IMP_MIN={
  titulo:"Importar mínimos da planilha",sub:"Atualiza mínimo e estoque alvo de muitos produtos de uma vez.",
  colunas:"código do produto ; estoque (BASE, DPSP ou PROFARMA) ; mínimo ; estoque alvo (opcional)",

  validar(rows){

  },

  aplicar(ok){ok.forEach(o=>{MIN[kk(o.p.id,o.E)]={min:o.mn,alvo:o.al};});S13.minMudou=true;S13.estado="dados";S13.aba="min";S13.msg=`<b>${ok.length} mínimos importados às ${relogio()}.</b> A versão anterior fica guardada no histórico de configurações.`;s13Render();}
};
function s13Salvar(){

    const mn=v.min!==undefined?v.min:cur?String(cur.min):"";const al=v.alvo!==undefined?v.alvo:cur&&cur.alvo!=null?String(cur.alvo):"";
    if(mn!==""&&!/^\d+$/.test(mn))E.push(`${esc(p.d)} (${locNome(l)}): mínimo “${esc(mn)}” não é número inteiro.`);

    Object.entries(S13.pend).forEach(([k,v])=>{const cur=MIN[k];const mn=v.min!==undefined?v.min:cur?String(cur.min):"";const al=v.alvo!==undefined?v.alvo:cur&&cur.alvo!=null?String(cur.alvo):"";

}

function initSig(){

  const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);ctx.lineWidth=2.6;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#ffffff";
  let des=false,ult=null;
  const pt=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];};
  cv.addEventListener("pointerdown",e=>{des=true;ult=pt(e);cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(ult[0],ult[1],1.2,0,Math.PI*2);ctx.fillStyle="#ffffff";ctx.fill();e.preventDefault();});
  cv.addEventListener("pointermove",e=>{if(!des)return;const p=pt(e);ctx.beginPath();ctx.moveTo(ult[0],ult[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();ult=p;});

}

      abrir(`${dlgCab(`Enviar a reposição do ${CTN[S13.ct]} ao Compras?`,`${T.n} ${plural(T.n,"item","itens")} · ${brl(T.v)} estimados · ${CC[S13.ct]}`)}

      <div class="conseq"><b>O que acontece se você enviar</b><ul><li>Vai para o Compras como <b>sugestão</b> de reposição, com o centro de custo ${CC[S13.ct]}.</li><li><b>Nada vai sozinho a fornecedor.</b> Um comprador abre a solicitação a partir da sugestão, e ela segue o fluxo normal do Compras: cotação, aprovação e pedido.</li><li>Depois de enviado, este rascunho fica travado aqui. O próximo nasce no cálculo diário de amanhã.</li>${R.itens.some(i=>i.tirado||i.fin===0)?"<li>Itens tirados ou com quantidade zero não vão.</li>":""}</ul></div>
      <div class="dlg-f"><button class="btn btn-outline" data-a="fechar">Voltar</button><button class="btn" data-a="s13-enviar-ok">Enviar ao Compras</button></div>`);break;}
    case "s13-enviar-ok":{const R=S13.sug[S13.ct],T=s13Tot(R);R.enviado={hora:relogio(),por:"Paulo Mendes",n:T.n,v:T.v};S13.msgSug=null;fechar();s13Render();break;}
    /* 14 */
    case "c14-tentar":tentar(S14,s14Render);break;
    case "c14-est":S14.est=v;S14.tela="onda";S14.filtro="faltam";s14Render();break;
    case "c14-lista":S14.tela="lista";s14Render();break;
    case "c14-filtro":S14.filtro=v;s14Render();break;
    case "c14-comeca":CIC[S14.est].onda=0;s14Render();break;
    case "c14-zero":{const c=CIC[S14.est];c.cont[v]=0;const i=$(`[data-cnt="${v}"]`);if(i)i.value="0";$(`#ci-${v}`)?.classList.add("feito");s14Progresso();break;}
    case "c14-preenche":{const c=CIC[S14.est];ondaAtual(c).forEach((id,i)=>{if(c.cont[id]===undefined)c.cont[id]=(i*7)%23+1;});s14Render();break;}
    case "c14-fechar":{const c=CIC[S14.est],O=ondas(c),ult=c.onda===O.length-1;
      abrir(`${dlgCab(`Fechar a onda ${c.onda+1} do ${c.nome}?`,`${ondaAtual(c).length} itens contados`)}<div class="conseq"><b>O que acontece se você fechar</b><ul>
      <li>As contagens vão para conferência: o sistema compara cada uma com o saldo do Omie relido agora.</li>
      <li>Se algum item der diferença, vira um ajuste para um admin aprovar. Você não fica sabendo quais.</li>
      <li>Depois de fechar, não dá para mudar estas contagens pelo app. Se lembrou de algum erro, avise o admin antes de ele aprovar.</li>
      <li>${ult?`Era a última onda: o ${c.nome} fica com “Inventário físico em dia ✓ (${fmtC(HOJE)})”.`:`A onda ${c.onda+2} é sorteada na hora.`}</li></ul></div>
      <div class="dlg-f"><button class="btn btn-outline" data-a="fechar">Voltar e revisar</button><button class="btn" data-a="c14-fechar-ok">Fechar onda ${c.onda+1}</button></div>`);break;}
    case "c14-fechar-ok":{const c=CIC[S14.est],O=ondas(c),n=ondaAtual(c).length,on=c.onda+1;c.onda++;c.cont={};c.marca=null;
      if(c.onda>=O.length){c.emDia=HOJE;S14.fim={emDia:true};}else S14.fim={emDia:false,ondaN:on,n};
      S14.tela="fim";fechar();s14Render();break;}
    case "c14-seguir":S14.tela="onda";S14.filtro="faltam";s14Render();break;
    /* 15 */
    case "s15-tentar":tentar(S15,s15Render);break;
    case "s15-papel":S15.papel=v;S15.erro="";s15Render();break;
    case "s15-filtro":S15.filtro=v;s15Render();break;
    case "s15-aprovar":s15AprovarDlg();break;
    case "s15-recusar":s15RecusarDlg();break;
    case "s15-aprovar-ok":{const S=[...S15.sel].map(id=>AJ.find(a=>a.id===id)),h=relogio();
      S.forEach(a=>{const p=PID[a.pid];if(LOCS.includes(a.loc))p.s[a.loc]=a.contado;else p.e[a.loc]=a.contado;
        const d={...a,res:"aprovado",por:"Jose Guilherme",hora:h,omieSt:"fila",cod:`HUBALX-AJU-${String(codAj++).padStart(4,"0")}`};S15.dec.unshift(d);
        setTimeout(()=>{d.omieSt="ok";s15Render();},1400+S.indexOf(a)*500);AJ.splice(AJ.indexOf(a),1);});
      S15.sel.clear();S15.msg=`<b>${S.length} ${plural(S.length,"ajuste aprovado","ajustes aprovados")} às ${h}.</b> As gravações no Omie estão na fila; cada uma mostra o código quando terminar.`;fechar();s15Render();break;}
    case "s15-recusar-ok":{const nota=$("#s15-nota").value.trim(),S=[...S15.sel].map(id=>AJ.find(a=>a.id===id)),h=relogio();
      S.forEach(a=>{S15.dec.unshift({...a,res:"recusado",por:"Jose Guilherme",hora:h,nota});AJ.splice(AJ.indexOf(a),1);});
      S15.sel.clear();S15.msg=`<b>${S.length} ${plural(S.length,"ajuste recusado","ajustes recusados")}.</b> O Omie não mudou; ${plural(S.length,"o item volta","os itens voltam")} na próxima onda.`;fechar();s15Render();break;}
    case "s15-novo-ok":{const t=$("#s15-novo").value.trim();
      if(t.length<3){s15NovoDlg("Escreva o nome do motivo, com pelo menos 3 letras.");break;}
      if(MOTIVOS.some(m=>norm(m.m)===norm(t))){s15NovoDlg(`Já existe o motivo “${esc(MOTIVOS.find(m=>norm(m.m)===norm(t)).m)}”. Escolha ele na lista.`);break;}
      MOTIVOS.push({m:t,por:"Jose Guilherme",em:HOJE});const a=AJ.find(x=>x.id===S15.novoPara);if(a)a.mot=t;
      S15.msg=`<b>Motivo “${esc(t)}” criado por Jose Guilherme em ${fmtC(HOJE)}.</b> Já aparece na lista para todos os admins.`;fechar();s15Render();break;}
    /* 16 */
    case "f-tentar":tentar(S16,s16Render);break;
    case "f-aba":S16.aba=v;S16.msg=null;s16Render();break;
    case "f-fil":S16.fil=v;s16Render();break;
    case "f-imp":importDlg(IMP_FER);break;
    case "f-ent":{ENT={c:"carlos",sel:{},q:{}};const f=FID(v);if(f.pat)ENT.sel[v]=true;else ENT.q[v]=1;entDlg();break;}
    case "f-ent-c":ENT={c:v,sel:{},q:{}};entDlg();break;
    case "ent-q":{const f=FID(v);ENT.q[v]=Math.max(0,Math.min(noAlmoxQ(f),(ENT.q[v]||0)+Number(el.dataset.d)));entDlg();break;}
    case "ent-ok":{const I=entItens();if(I.length)mandarTablet("entrega",ENT.c,I,null);break;}
    case "f-dev":{const f=FID(v);DEV={fid:v,c:el.dataset.c,q:f.pat?1:f.campo[el.dataset.c].n,estado:"ok",forn:"Assistência Ferramentas Paulista",prev:"2026-11-26",obs:"",err:false};devDlg();break;}
    case "dev-q":{const f=FID(DEV.fid);DEV.q=Math.max(1,Math.min(f.campo[DEV.c].n,DEV.q+Number(el.dataset.d)));devDlg();break;}
    case "dev-est":DEV.estado=v;devDlg();break;
    case "dev-ok":{if(DEV.estado==="dano"&&!DEV.obs.trim()){DEV.err=true;devDlg();break;}const f=FID(DEV.fid);
      mandarTablet("devolucao",DEV.c,[{fid:f.id,nm:f.nm,pat:f.pat,q:DEV.q,v:f.v,estado:DEV.estado}],{estado:DEV.estado,forn:DEV.forn||"fornecedor de conserto",prev:DEV.prev||"2026-11-26",obs:DEV.obs});break;}
    case "f-epi":{const C=COL[v];EPI={c:v,pid:"luva",est:C.ct,q:1};epiDlg();break;}
    case "epi-q":EPI.q=Math.max(1,EPI.q+Number(el.dataset.d));epiDlg();break;
    case "epi-ok":{const p=PID[EPI.pid];if(EPI.q>sal(p,EPI.est))break;mandarTablet("epi",EPI.c,[{nm:p.d,q:EPI.q,un:p.un,v:p.cmc}],{pid:p.id,est:EPI.est});break;}
    case "f-termo":termoVer(v);break;
    case "f-volta":{const f=FID(v);f.st="almox";HIST.push({c:"marcos",data:HOJE,txt:`${f.nm} (${f.pat}) voltou do conserto com ${f.cons.forn}`});f.cons=null;S16.msg=`<b>${esc(f.nm)} (${f.pat}) voltou do conserto.</b> Está no almox, pronta para entregar.`;s16Render();break;}
    case "f-baixa":{const f=FID(v);abrir(`${dlgCab(`Baixar ${esc(f.nm)} (${f.pat})?`,`Em conserto com ${esc(f.cons.forn)} desde ${fmtC(f.cons.saiu)}`)}
      <div class="campo"><label for="bx-mot">Motivo da baixa <span class="erro-t">obrigatório</span></label><input class="inp" id="bx-mot" placeholder="Ex.: conserto sai mais caro que uma nova"></div>
      <div class="conseq"><b>O que acontece se você baixar</b><ul><li>A ferramenta sai da lista de disponíveis e fica como “baixada”, com o motivo, a data e quem baixou.</li><li>O valor dela (${brl(f.v)}) entra no indicador de perdas do ferramental.</li><li>Não dá para desfazer pela tela. Se ela voltar a funcionar, precisa ser cadastrada de novo.</li></ul></div>
      <div class="dlg-f"><button class="btn btn-outline" data-a="fechar">Voltar</button><button class="btn btn-destructive-solid" data-a="f-baixa-ok" data-v="${f.id}">Baixar ferramenta</button></div>`);break;}
    case "f-baixa-ok":{const m=$("#bx-mot").value.trim();if(m.length<3){$("#bx-mot").style.borderColor="var(--erro-borda)";$("#bx-mot").placeholder="Escreva o motivo da baixa";$("#bx-mot").focus();break;}
      const f=FID(v);f.st="baixada";f.baixa={mot:m,data:HOJE};f.cons=null;fechar();S16.msg=`<b>${esc(f.nm)} (${f.pat}) baixada.</b> Motivo: ${esc(m)}.`;s16Render();break;}
    case "tab-dig":if(TAB.pin.length<6){TAB.pin+=v;tabUI();}break;
    case "tab-apaga":TAB.pin=TAB.pin.slice(0,-1);tabUI();break;
    case "tab-limpa":TAB.tracos=0;{const cv=$("#sig");cv.getContext("2d").clearRect(0,0,cv.width,cv.height);}tabUI();break;
    case "tab-assina":assinar();break;
    case "tab-cancela":TAB=null;S16.msg="O termo foi cancelado no tablet. Nada mudou na ficha nem nas ferramentas.";s16Render();break;
    case "tab-libera":TAB=null;s16Render();break;
    /* 17 */
    case "i-tentar":tentar(S17,s17Render);break;
    case "i-per":S17.per=v;s17Render();break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.c12o!=null){S12.conf[Number(t.dataset.c12o)].obs=t.value;}
  else if(t.dataset.mn!=null||t.dataset.al!=null){
    const id=t.dataset.mn??t.dataset.al,campo=t.dataset.mn!=null?"min":"alvo",k=kk(id,S13.est);
    S13.pend[k]={...(S13.pend[k]||{}),[campo]:t.value.trim()};
    const mv=pv(id,"min"),av=pv(id,"alvo");
    $(`#st-${id}`).innerHTML=sitMin(sal(PID[id],S13.est),mv);
    const ai=$(`[data-al="${id}"]`);ai.placeholder=/^\d+$/.test(mv)?String(Number(mv)*2):"—";
    $(`#al-${id}`).textContent=av!==""?"definido à mão":mv!==""?"padrão: 2 × mínimo":"";
    $("#s13-pend").innerHTML=s13PendBar();
  }
  else if(t.dataset.fin!=null){const R=S13.sug[S13.ct],ix=Number(t.dataset.fin),i=R.itens[ix];i.fin=Math.max(0,Math.floor(Number(t.value))||0);
    $(`#sv-${ix}`).textContent=brl(i.fin*PID[i.id].cmc);t.closest("tr").classList.toggle("apagado",i.fin===0);
    const T=s13Tot(R);$("#s13-tot").textContent=`${T.n} ${plural(T.n,"item","itens")} · ${brl(T.v)}`;$("#s13-enviar").disabled=!T.n;}
  else if(t.dataset.cnt!=null){const c=CIC[S14.est],id=t.dataset.cnt;
    if(t.value==="")delete c.cont[id];else c.cont[id]=Math.max(0,Math.floor(Number(t.value))||0);
    $(`#ci-${id}`)?.classList.toggle("feito",c.cont[id]!==undefined);s14Progresso();}
  else if(t.id==="f-busca"){S16.busca=t.value;$("#f-corpo").innerHTML=(()=>{const tmp=s16Ferr();const d=document.createElement("div");d.innerHTML=tmp;return d.querySelector("#f-corpo").innerHTML;})();}
  else if(t.id==="dev-obs"){DEV.obs=t.value;}
  else if(t.id==="dev-forn"){DEV.forn=t.value;}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.c12q!=null)s12Qtd(Number(t.dataset.c12q),Number(t.value));
  else if(t.dataset.c12s!=null){const ix=Number(t.dataset.c12s),pc=PC.find(p=>p.n===S12.pc),c=S12.conf[ix];c.sit=t.value;if(c.sit==="ok"&&c.q<pc.itens[ix].q)c.q=pc.itens[ix].q;s12AtualizaConf();}
  else if(t.dataset.c12f!=null){const f=t.files&&t.files[0];if(!f)return;const ix=Number(t.dataset.c12f);const r=new FileReader();r.onload=()=>{S12.conf[ix].foto={nome:f.name,url:r.result};s12AtualizaConf();};r.readAsDataURL(f);}
  else if(t.id==="imp-file"){const f=t.files&&t.files[0];if(!f)return;if(/\.xlsx?$/i.test(f.name)){IMP.arq=f.name;IMP.res={xlsx:true};renderImp();return;}const r=new FileReader();r.onload=()=>processaImp(String(r.result),f.name);r.readAsText(f);}
  else if(t.dataset.aj!=null){const id=Number(t.dataset.aj);t.checked?S15.sel.add(id):S15.sel.delete(id);S15.erro="";s15Render();}
  else if(t.id==="s15-todos"){const L=AJ.filter(a=>S15.filtro==="todos"||(S15.filtro==="EQUIPES"?EQ.includes(a.loc):a.loc===S15.filtro));L.forEach(a=>t.checked?S15.sel.add(a.id):S15.sel.delete(a.id));S15.erro="";s15Render();}
  else if(t.dataset.mot!=null){const a=AJ.find(x=>x.id===Number(t.dataset.mot));if(t.value==="__novo"){t.value=a.mot;S15.novoPara=a.id;s15NovoDlg();}else{a.mot=t.value;if(S15.erro){S15.erro="";s15Render();}}}
  else if(t.id==="f-colab"){S16.colab=t.value;S16.msg=null;s16Render();}
  else if(t.id==="ent-c"){ENT.c=t.value;entDlg();}
  else if(t.dataset.entp!=null){ENT.sel[t.dataset.entp]=t.checked;entDlg();}
  else if(t.id==="dev-prev"){DEV.prev=t.value;}
  else if(t.id==="epi-p"){EPI.pid=t.value;EPI.q=1;epiDlg();}
  else if(t.id==="epi-e"){EPI.est=t.value;epiDlg();}
  else if(t.id==="i-est"){S17.est=t.value;s17Render();}
});
/* dica dos gráficos: um balão só, segue o mouse; no toque, aparece no toque */
const tip=$("#tip");
function mostraTip(el,x,y){tip.textContent=el.dataset.tip;tip.hidden=false;const w=tip.offsetWidth;tip.style.left=Math.min(window.innerWidth-w-8,x+12)+"px";tip.style.top=(y+14)+"px";}
document.addEventListener("pointermove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)mostraTip(el,e.clientX,e.clientY);else tip.hidden=true;});
document.addEventListener("pointerdown",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el&&e.pointerType!=="mouse")mostraTip(el,e.clientX,e.clientY);});
window.addEventListener("scroll",()=>{tip.hidden=true;},{passive:true});
window.addEventListener("hashchange",()=>{const m=location.hash.match(/^#secao-(1[2-8])$/);if(m)irSec(m[1]);});

renderTudo();
{const m=location.hash.match(/^#secao-(1[2-8])$/);irSec(m?m[1]:"12");}
</script>
