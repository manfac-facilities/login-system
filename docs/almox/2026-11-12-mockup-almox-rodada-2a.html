<title>Almoxarifado rodada 2A</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra do mockup (âmbar tracejado, fora do produto) fixa no topo, uma seção por vez; telas do hub dentro da moldura do hub
   (lateral navy de 256 px a partir de 768 px, topo navy com menu abaixo disso); telas do técnico dentro de um celular, sem moldura do hub.
   Tema único, o escuro do hub, de propósito: tokens iguais aos de app/globals.css e ao mockup aprovado do RH (2026-11-08-rh-layout-hub.html). */
:root{
  color-scheme:dark;
  --background:#0a1628;--navy:#0d2050;--navy-hover:#10285f;--orange:#f05a28;--orange-hover:#d94e22;
  --muted:#94a3b8;--muted-dark:#4a6080;--border:#1e3a5f;--input-bg:#0f1f3d;--error:#ef4444;
  --texto:#ffffff;--texto-suave:#e8eef7;
  --verde-bg:#0d542b;--verde:#7bf1a8;--ambar-bg:#7b3306;--ambar:#ffd230;
  --vermelho-bg:#82181a;--vermelho:#ffa2a2;--azul-bg:#1c398e;--azul:#8ec5ff;
  --erro-borda:#e7000b;--erro-fundo:#460809;--ok-borda:#008236;--ok-fundo:#052e16;
  --div-fundo:rgba(123,51,6,.42);--div-solido:#3a2219;
  /* Texto auxiliar: #94a3b8, a opção legível da decisão D7 do RH. */
  --aux:var(--muted);
  /* Só do mockup: âmbar tracejado, para nunca parecer parte do produto. */
  --nota:#fbbf24;--nota-fundo:#2a2108;--nota-borda:#7a5c0e;--mk-fundo:#060e1c;--frame:#050b16;
  /* Nomes que o JavaScript usa em estilos inline. */
  --primary:var(--orange);--primary-foreground:#ffffff;--aviso:var(--ambar);--aviso-bg:var(--div-fundo);--ok:var(--verde);--destructive:var(--vermelho);
  --fonte:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background-color:var(--background);color:var(--texto)}
body{margin:0;font:400 14px/1.5 var(--fonte);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--mk-fundo)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.n,.tab{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.label-mono{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:500;color:var(--aux)}
.sp{flex:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ------------------------------ fora do produto: o mockup ------------------------------ */
.mk-in,.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mk-cab{background:var(--mk-fundo)}
.mk-cab .wrap{padding-block:12px 4px}
.mk-tit{font-weight:600;color:var(--nota)}
.mk-tit small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.mk-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--mk-fundo);border-bottom:1px dashed var(--nota-borda)}
.mk-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:8px}
.mk-tabs{display:flex;gap:4px;min-width:0}
.mk-tab{border:1px dashed var(--nota-borda);background:transparent;color:var(--texto-suave);border-radius:8px;min-height:34px;padding:0 12px;font-size:13px;white-space:nowrap}
.mk-tab:hover{border-color:var(--nota)}
.mk-tab[aria-selected="true"]{background:var(--nota);border:1px solid var(--nota);color:#1a1405;font-weight:600}
.mk-tab .tc{display:none}
.mk-hora{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px dashed var(--nota-borda);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:6px;padding:4px 9px;font-size:12px;color:var(--texto-suave)}
.seg button:hover{background:var(--nota-fundo)}
.seg button[aria-pressed="true"]{background:var(--nota);color:#1a1405;font-weight:600}
.mk-ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--texto-suave);padding:8px 10px;border:1px dashed var(--nota-borda);border-radius:10px;background:var(--nota-fundo)}
.mk-ctrl b{font-weight:600;color:var(--nota)}
@media (max-width:640px){
  .mk-in{gap:6px 8px;padding-block:6px}
  .mk-in>.sp{display:none}
  .mk-hora{margin-left:auto}
  .mk-tabs{gap:3px}
  .mk-tab{padding:0 7px;min-width:34px}
  .mk-tab .tl,.mk-tab .tc{display:none}
  .mk-tab[aria-selected="true"] .tc{display:inline}
  .mk-hora .hd,.mk-hora .mk-hora-r{display:none}
  .mk-hora .seg::before{content:"Hora";align-self:center;padding:0 1px 0 4px;font-size:10px;color:var(--muted)}
  .mk-hora .seg button{padding:7px 5px}
}

main.pg{padding-block:20px 80px}
.sec-h{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.sec-h h1{font-size:22px;font-weight:700;color:var(--texto)}
.sec-h p{color:var(--muted);max-width:72ch}

/* ------------------------------ componentes do hub ------------------------------ */
/* Botões: btn-p, btn-s e btn-er do RH/Frotas */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 16px;border-radius:8px;border:1px solid transparent;background:var(--orange);color:#fff;font-size:14px;font-weight:500;white-space:nowrap;transition:background-color .15s,border-color .15s,transform .15s;text-decoration:none}
.btn:hover{background:var(--orange-hover)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-outline{background:transparent;border-color:var(--border);color:var(--texto-suave)}
.btn-outline:hover{background:transparent;border-color:var(--muted)}
.btn-secondary{background:var(--border);color:#fff}
.btn-secondary:hover{background:var(--navy-hover)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--border);color:#fff}
.btn-destructive{background:transparent;border-color:var(--erro-borda);color:#fff}
.btn-destructive:hover{background:var(--vermelho-bg)}
.btn-destructive-solid{background:var(--erro-borda);color:#fff}
.btn-destructive-solid:hover{background:#c10007}
.btn-sm{min-height:32px;padding:0 12px;font-size:13px}
.btn-xs{min-height:26px;padding:0 8px;font-size:12px;border-radius:6px}
.btn-lg{min-height:44px;padding:0 18px;font-size:15px}
.btn-block{width:100%}
/* Etiquetas: chips do BaseTabela; a forma fica, para o tom não depender só da cor */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:500;line-height:1.45;white-space:nowrap;background:var(--border);color:var(--texto-suave)}
.badge::before{font-size:9px;line-height:1}
.b-ok{background:var(--verde-bg);color:var(--verde)}.b-ok::before{content:'✓'}
.b-avi{background:var(--ambar-bg);color:var(--ambar)}.b-avi::before{content:'◆'}
.b-des{background:var(--vermelho-bg);color:var(--vermelho)}.b-des::before{content:'▲'}
.b-sec{background:var(--azul-bg);color:var(--azul)}.b-sec::before{content:'●'}
.b-out{background:var(--border);color:var(--texto-suave)}
/* Cartões navy */
.card{background:var(--navy);border:1px solid var(--border);border-radius:12px;padding:20px;min-width:0}
/* Campos: veiculos/novo/_form.tsx */
.inp{min-height:36px;border:1px solid var(--border);background:var(--input-bg);color:#fff;border-radius:8px;padding:0 12px;font-size:14px;min-width:0;outline:none}
.inp::placeholder{color:var(--muted-dark)}
.inp:focus{border-color:var(--orange)}
textarea.inp{padding:10px 12px;resize:vertical;width:100%}
select.inp{padding-right:8px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--orange);width:16px;height:16px;flex:none}

/* Moldura do hub: lateral de components/sofia/Sidebar.tsx; abaixo de 768 px vira topo navy com menu, como no Frotas */
.shell{container:sh/inline-size;position:relative;isolation:isolate;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--background)}
.sh-app{display:flex;flex-direction:column;min-height:560px}
.lat{position:absolute;inset:0 auto 0 0;z-index:50;width:256px;max-width:85%;flex:none;background:var(--navy);border-right:1px solid var(--border);padding:16px;overflow-y:auto;display:flex;flex-direction:column;transform:translateX(-100%);visibility:hidden;transition:transform .2s ease-in-out,visibility .2s}
.shell[data-gaveta="sim"] .lat{transform:none;visibility:visible}
.lat-cab{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;padding:0 8px}
.lat-nome{font-size:18px;font-weight:700;line-height:1.25;display:block;color:#fff}
.volta{color:var(--muted);font-size:12px;display:inline-flex;align-items:center}
.lat-fecha{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;display:grid;place-items:center;border-radius:8px;width:44px;height:44px}
.lat-fecha:hover{color:#fff}
.lat-grupo{display:flex;flex-direction:column;gap:4px;margin-bottom:24px}
.item{display:flex;align-items:center;width:100%;min-height:44px;padding:8px;border-radius:4px;font-size:14px;color:var(--muted);transition:background-color .15s,color .15s}
.item[aria-disabled="true"]{cursor:default}
.item[aria-disabled="true"]:hover{background:var(--border);color:#fff}
.item[aria-current="page"]{background:var(--orange);color:#fff}
.lat-pe{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.quem{display:flex;align-items:center;gap:10px;padding:4px 8px 8px}
.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--border);font-size:12px;font-weight:500;color:#fff;flex:none}
.quem-txt{min-width:0;font-size:12px;line-height:1.35}
.quem-txt b{display:block;font-weight:500;color:#fff;font-size:13px}
.quem-txt span{color:var(--muted);overflow-wrap:anywhere}
.topo-cel{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--navy);border-bottom:1px solid var(--border);padding:10px 16px}
.ic-btn{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--muted);flex:none}
.ic-btn:hover{color:#fff;border-color:var(--muted)}
.veu{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.shell[data-gaveta="sim"] .veu{display:block}
.sh-main{container:area/inline-size;flex:1;min-width:0;padding:16px}
@container sh (min-width:640px){.sh-main{padding:24px}}
@container sh (min-width:1100px){.sh-main{padding:32px}}
@container sh (min-width:768px){
  .topo-cel,.veu{display:none!important}
  .sh-app{flex-direction:row}
  .lat{position:static;z-index:auto;transform:none;visibility:visible;max-width:none;transition:none}
  .lat-fecha{display:none}
  .item{min-height:0}
}
/* Título de página: app/(operacoes)/sofia/page.tsx */
.pg-tit{font-size:24px;line-height:1.33;font-weight:700;color:#fff}

/* Estados: vazio é convite (tracejado), erro é alarme (vermelho cheio), sem acesso é cartão navy */
.est{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:24px;border-radius:12px;font-size:14px}
.est h3{font-size:16px;font-weight:600;color:#fff}
.est p{max-width:60ch;color:var(--muted)}
.est .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;font-weight:700}
.est-vazio,.est-ok{border:1px dashed var(--border);align-items:center;text-align:center;padding:40px 16px}
.est-vazio h3{font-weight:500;color:var(--texto-suave)}
.est-vazio .ico{background:var(--border);color:var(--muted)}
.est-ok .ico{background:var(--verde-bg);color:var(--verde)}
.est-erro{border:1px solid var(--erro-borda);background:var(--erro-fundo)}
.est-erro p{color:var(--vermelho)}
.est-erro .ico{background:var(--erro-borda);color:#fff}
.est-erro .btn{background:transparent;border-color:var(--erro-borda)}
.est-erro .btn:hover{background:var(--vermelho-bg)}
.est-perm{border:1px solid var(--border);background:var(--navy)}
.est-perm .ico{background:var(--border);color:var(--muted)}
.skel{background:var(--navy);border-radius:6px;height:14px;animation:sk 1.6s ease-in-out infinite}
.card .skel,.fi .skel,.ped .skel{background:var(--border)}
@keyframes sk{50%{opacity:.45}}

/* Seção 1 */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:20px}
@container area (min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container area (min-width:860px){.tiles{grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}}
.tile{padding:16px;transition:border-color .15s}
.tile[data-a]:hover{border-color:var(--orange)}
.tile .v{font-size:22px;line-height:1.25;font-weight:700;color:#fff;margin-top:4px;overflow-wrap:anywhere}
.tile .s{font-size:12px;color:var(--aux);margin-top:4px}
.tile.alerta .v{color:var(--vermelho)}
@container area (max-width:420px){.tile .v{font-size:19px}}
.filtros{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px}
.filtros .busca{flex:1 1 240px;min-width:0}
.filtros .busca input{width:100%}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--aux);margin-bottom:8px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
/* Tabela: BaseTabela do Frotas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;max-width:100%;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{padding:10px 12px;text-align:left;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--border);background:var(--navy)}
.tbl td{padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--texto-suave)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr.lin:hover td{background:var(--navy)}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td.r{font-variant-numeric:tabular-nums}
.tbl .col-on{box-shadow:inset 0 -2px 0 var(--orange)}
.tbl .fix{position:sticky;left:0;z-index:1;background:var(--background)}
.tbl th.fix{background:var(--navy);z-index:2}
.tbl tbody tr.lin:hover td.fix{background:var(--navy)}
.prod-btn{border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;max-width:280px;color:#fff}
.prod-btn .nm{font-weight:500;white-space:normal;line-height:1.3}
.prod-btn:hover .nm{color:var(--orange);text-decoration:underline;text-underline-offset:3px}
.prod-btn .cd{font-family:var(--mono);font-size:11px;color:var(--aux)}
.tbl td.c-red{background:var(--vermelho-bg);color:var(--vermelho);font-weight:600}
.tbl td.c-amb{background:var(--ambar-bg);color:var(--ambar);font-weight:600}
.zero{color:var(--muted-dark)}
.tbl .zero{color:var(--aux)}
.eq-btn{border:1px solid var(--border);background:transparent;color:var(--texto-suave);border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
.eq-btn:hover{border-color:var(--orange)}
.tbl .sub td{background:var(--navy);font-size:13px;white-space:normal}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;border-radius:4px;padding:2px 8px;font-size:12px;background:var(--border);color:var(--texto-suave)}
.chip b{color:#fff}
.min-t{font-size:12px;color:var(--aux)}
.atual{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--aux)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--verde);animation:pul 2.2s ease-in-out infinite}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.4}}

/* Diálogo */
dialog.dlg{border:1px solid var(--border);padding:0;border-radius:12px;background:var(--navy);color:#fff;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 20px 60px rgba(0,0,0,.55)}
dialog.dlg::backdrop{background:rgba(0,0,0,.6)}
.dlg-in{display:flex;flex-direction:column;gap:14px;padding:20px;max-height:calc(100vh - 48px);overflow:auto}
.dlg-h{display:flex;align-items:flex-start;gap:12px}
.dlg-h h2{font-size:18px;font-weight:600}
.dlg .tbl .fix,.dlg .tbl td{background:var(--navy)}
.dlg .tbl th{background:var(--background)}
.dlg-f{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.conseq{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-radius:8px;background:var(--erro-fundo);border:1px solid var(--erro-borda);color:var(--texto-suave)}
.conseq b{color:#fff}
.conseq ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:14px;color:var(--muted)}
.erro-t{color:var(--vermelho);font-size:13px}
.hist{display:flex;flex-direction:column}
.hist .h{display:grid;grid-template-columns:92px 1fr auto;gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--border)}
.hist .h:last-child{border:0}
.hist .q{font-weight:600;font-variant-numeric:tabular-nums}
.q.pos{color:var(--verde)}

/* Seção 2: celular do técnico. Sem moldura do hub, mesma paleta e mesmos componentes */
.s2-grid{display:grid;grid-template-columns:400px minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:900px){.s2-grid{grid-template-columns:minmax(0,1fr)}}
.phone{width:390px;max-width:100%;height:800px;border:11px solid var(--frame);border-radius:46px;overflow:hidden;display:flex;flex-direction:column;background:var(--background);box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 1px var(--border);position:relative}
.ph-notch{height:26px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600;background:var(--navy);color:#fff}
@media (max-width:520px){.s2-grid .phone{width:100%;height:auto;min-height:680px;border:1px solid var(--border);border-radius:12px;box-shadow:none}.ph-notch{display:none}.phone .ph-body{overflow:visible}}
.ph-head{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--navy);color:#fff}
.ph-head .t1{font-weight:700;font-size:16px;line-height:1.25}
.ph-head .t2{font-size:12px;color:var(--muted)}
.bell{position:relative;border:1px solid var(--border);background:none;color:#fff;width:44px;height:44px;border-radius:8px;display:grid;place-items:center}
.bell .ct{position:absolute;top:-6px;right:-6px;background:var(--orange);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.ph-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.ph-foot{flex:none;border-top:1px solid var(--border);background:var(--navy);position:sticky;bottom:0}
.tabs-b{display:grid;grid-template-columns:1fr 1fr}
.tabs-b button{border:0;background:transparent;min-height:56px;padding:8px 6px;font-size:12px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs-b button[aria-current="page"]{color:var(--orange);font-weight:600}
.tabs-b .ic{font-size:17px;line-height:1}
.cartbar{display:flex;align-items:center;gap:10px;padding:10px 16px}
.cartbar .muted{color:var(--muted)}
.pin-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 20px;text-align:center}
.pin-logo{width:56px;height:56px;border-radius:14px;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px}
.pin-wrap h2{color:#fff}
.pin-dots{display:flex;gap:12px;height:18px}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots span.f{background:var(--orange);border-color:var(--orange)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.keypad button{height:60px;border-radius:12px;border:1px solid var(--border);background:var(--navy);color:#fff;font-size:22px;font-weight:500}
.keypad button:active{background:var(--navy-hover)}
.faixa{border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--texto-suave);border:1px solid var(--border)}
.faixa .al{display:flex;gap:8px;align-items:flex-start}
.faixa .al .tx{flex:1}
.al-avi{background:var(--div-fundo);border-color:var(--ambar-bg)}
.al-des{background:var(--erro-fundo);border-color:var(--erro-borda)}
.al-ok{background:var(--ok-fundo);border-color:var(--ok-borda)}
.al-sec{background:rgba(28,57,142,.35);border-color:var(--azul-bg)}
.al .mk{font-weight:700;width:18px;text-align:center;flex:none}
.al-avi .mk{color:var(--ambar)}.al-des .mk{color:var(--vermelho)}.al-ok .mk{color:var(--verde)}.al-sec .mk{color:var(--azul)}
.al-x{border:0;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline;padding:6px 0;min-height:32px}
.al-x:hover{color:#fff}
.ped{border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--navy);color:var(--texto-suave);text-align:left;width:100%;transition:border-color .15s}
.ped:hover{border-color:var(--orange)}
.ped .l1{display:flex;align-items:center;gap:8px}
.ped .num{font-weight:600;font-family:var(--mono);color:#fff}
.ped b{color:#fff;font-weight:600}
.mini-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mini-steps i{height:4px;border-radius:2px;background:var(--border)}
.mini-steps i.on{background:var(--orange)}
.mini-steps i.bad{background:var(--error)}
.mini-steps i.done{background:var(--verde)}
.seg-big{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg-big button{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:8px;padding:9px 6px;font-weight:500;font-size:13px;line-height:1.25;min-height:52px}
.seg-big button small{display:block;font-weight:400;font-size:11px;color:var(--aux)}
.seg-big button[aria-pressed="true"]{background:var(--navy);border-color:var(--orange);color:#fff;box-shadow:inset 0 0 0 1px var(--orange)}
.ph-search{position:relative}
.ph-search input{width:100%;min-height:44px;font-size:16px;padding-left:38px}
.ph-search .lupa{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.mat{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.mat:last-child{border-bottom:0}
.mat .info{flex:1;min-width:0}
.mat .nm{font-weight:500;line-height:1.3;color:#fff}
.mat .dp{font-size:12px;color:var(--muted)}
.mat .dp b{color:var(--verde);font-weight:600}
.mat.ast .dp{color:var(--ambar)}
.mat.cinza{opacity:.55}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--navy)}
.stepper button{width:40px;height:40px;border:0;background:transparent;color:#fff;font-size:18px}
.stepper button:hover{background:var(--navy-hover)}
.stepper span{min-width:34px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;color:#fff}
.add-btn{min-height:40px}
.datas{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.dt{flex:none;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--background);color:#fff;text-align:center;min-width:64px;line-height:1.2}
.dt b{display:block;font-size:15px}
.dt small{font-size:11px;color:var(--muted)}
.dt[aria-pressed="true"]{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange);background:var(--navy-hover)}
.dt[disabled]{opacity:.4;cursor:not-allowed}
.dt .em{color:var(--vermelho);font-size:10px;font-weight:600;display:block}
.box{border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--navy);color:var(--texto-suave)}
.box h4{margin:0;font-size:13px;font-weight:600;color:#fff}
.box b{color:#fff}
.box .tbl th{background:var(--background)}
.box .tbl td,.box .tbl .fix{background:var(--navy)}
.vsteps{display:flex;flex-direction:column}
.vs{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:14px}
.vs:last-child{padding-bottom:0}
.vs::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--border)}
.vs:last-child::before{display:none}
.vs .c{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:var(--navy);color:var(--muted);display:grid;place-items:center;font-size:11px;font-weight:700;z-index:1}
.vs.done .c{background:var(--verde-bg);border-color:var(--verde);color:var(--verde)}
.vs.cur .c{border-color:var(--orange);color:var(--orange)}
.vs.bad .c{background:var(--vermelho-bg);border-color:var(--erro-borda);color:var(--vermelho)}
.vs .t{font-weight:500;color:#fff}
.vs .w{font-size:12px;color:var(--muted)}
.lado{display:flex;flex-direction:column;gap:14px;max-width:62ch}
.lado h3{font-size:15px;font-weight:600}
.lado ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.lado li b{color:#fff;font-weight:600}

/* Seção 3 */
.s3-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@container area (min-width:840px){.s3-grid{grid-template-columns:232px minmax(0,1fr)}}
.fila{display:flex;flex-direction:column;gap:8px}
.fila h3{color:#fff}
.fi{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--navy);color:var(--texto-suave);display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;transition:border-color .15s}
.fi:hover{border-color:var(--muted)}
.fi[aria-current="true"]{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.fi .l1{display:flex;gap:8px;align-items:center;color:#fff}
.fi .num{font-family:var(--mono);font-weight:600}
.fi .bs{display:flex;flex-wrap:wrap;gap:4px}
.det{container:det/inline-size;display:flex;flex-direction:column;gap:14px;min-width:0}
.det-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.det-h h2{font-size:20px;font-weight:600;color:#fff}
.info.card{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.info .k{font-size:12px;color:var(--aux);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.info .v{font-weight:500;color:#fff}
.emerg{border:1px solid var(--erro-borda);background:var(--erro-fundo);color:var(--texto-suave);border-radius:8px;padding:12px 16px;font-size:13px}
.emerg b{color:var(--vermelho)}
.qty{display:inline-flex;align-items:center;gap:4px}
.tbl.ap th{white-space:normal;line-height:1.2;padding:8px;min-width:60px;vertical-align:bottom}
.tbl.ap td{padding-inline:8px}
.qty input{width:46px;min-height:32px;padding:0 6px;-moz-appearance:textfield;text-align:right;font-variant-numeric:tabular-nums}
.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.qty button{width:28px;height:32px;border-radius:6px;border:1px solid var(--border);background:transparent;color:#fff}
.qty button:hover{border-color:var(--orange)}
.tbl tr.div td{background:var(--div-fundo)}
.tbl tr.div td.fix{background:var(--div-solido)}
.tbl tr.div:hover td{background:var(--div-solido)}
.tbl tr.zer td{opacity:.55}
.notas{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;white-space:normal}
.depois{font-weight:600;color:#fff}
.resumo{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-radius:12px;background:var(--navy);border:1px solid var(--border);color:var(--texto-suave)}
.resumo b{color:#fff}
.corte{border-radius:8px;padding:12px 16px;background:var(--div-fundo);border:1px solid var(--ambar-bg);font-size:13px;color:var(--texto-suave)}
.corte b{color:var(--ambar)}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.incl{position:relative;flex:1 1 260px;min-width:0}
.incl input{width:100%}
.incl-res{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--navy);border:1px solid var(--border);border-radius:8px;padding:4px;box-shadow:0 12px 30px rgba(0,0,0,.45);overflow:hidden}
.incl-res button{display:flex;width:100%;border:0;background:transparent;color:#fff;padding:8px;min-height:40px;border-radius:6px;text-align:left;gap:8px;align-items:center}
.incl-res button:hover{background:var(--border)}
.okmsg{border-radius:8px;padding:12px 16px;border:1px solid var(--ok-borda);background:var(--ok-fundo);color:var(--texto-suave);font-size:13px}
.okmsg b{color:var(--verde)}
/* Itens da aprovação em área estreita: a mesma tabela vira um cartão por material, sem rolar de lado */
@container det (max-width:559.98px){
  .det .tbl-wrap:has(.tbl.ap){border:0;border-radius:0;overflow:visible}
  .tbl.ap thead{display:none}
  .tbl.ap,.tbl.ap tbody{display:block}
  .tbl.ap tbody{display:flex;flex-direction:column;gap:8px}
  .tbl.ap tr.lin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--navy)}
  .tbl.ap tr.lin:hover td,.tbl.ap tr.lin td,.tbl.ap tr.lin td.fix{background:transparent;padding:0;border:0;white-space:normal;text-align:left;position:static}
  .tbl.ap td.fix{grid-column:1/-1;min-width:0!important;color:#fff}
  .tbl.ap td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--aux);margin-bottom:2px;font-weight:400}
  .tbl.ap td.r{font-size:15px}
  .tbl.ap tr.div{background:var(--div-solido);border-color:var(--ambar-bg)}
  .tbl.ap tr.zer{opacity:.7}
  .tbl.ap tr.zer td{opacity:1}
  .qty button{width:40px;height:40px}
  .qty input{min-height:40px;font-size:16px}
}

/* Seção 4 */
.sup{display:flex;flex-direction:column;gap:12px;max-width:72ch}
.sup .card{display:grid;grid-template-columns:28px 1fr;gap:10px;color:var(--texto-suave);padding:16px 20px}
.sup .card b{color:#fff}
.sup .lt{font-family:var(--mono);font-weight:700;color:var(--orange)}

/* ------------------------------ rodada 2A: o que é novo ------------------------------ */
/* Papel do documento impresso (folha de separação, requisição): a única superfície clara, de propósito. */
:root{--papel:#ffffff;--tinta:#0f172a;--tinta-suave:#475569;--papel-borda:#cbd5e1}
button.item{border:0;background:transparent;text-align:left;font:inherit;cursor:pointer}
button.item:hover{background:var(--border);color:#fff}
button.item[aria-current="page"]{background:var(--orange);color:#fff}
.ini-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:20px}
@container area (min-width:640px){.ini-tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
.tile-btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;color:var(--texto-suave);width:100%;font:inherit;cursor:pointer}
.tile-btn:hover{border-color:var(--orange)}
.tile-btn .label-mono,.tile-btn .v,.tile-btn .s{display:block}
.tile-btn .vai{margin-top:auto;padding-top:10px;font-size:12px;color:var(--orange);font-weight:500}
.tile-btn .vai.fora{color:var(--muted)}
.como-cel{max-width:390px;margin:0 auto}
.lista-a{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.lista-a .la{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--navy)}
.lista-a .la:last-child{border-bottom:0}
.lista-a .la .tx{flex:1 1 220px;min-width:0;color:var(--texto-suave);font-size:13px}
.lista-a .la .tx b{color:#fff;font-weight:600}
.h3s{font-size:15px;font-weight:600;color:#fff;margin:20px 0 8px}
.grupo-d{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--aux);font-weight:500;margin-top:6px}
.prog{height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.prog i{display:block;height:100%;background:var(--verde)}
.fora-sep{border:1px dashed var(--ambar-bg);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--texto-suave);background:var(--div-fundo);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.fora-sep .tx{flex:1 1 240px;min-width:0}
.fora-sep b{color:var(--ambar)}
.cdg{font-family:var(--mono);font-size:11px;color:var(--aux)}
/* Tabelas que viram um cartão por linha quando a área é estreita (celular, coluna de detalhe, tablet em pé) */
@container area (max-width:620px){
  .tbl-wrap:has(.tbl.cd){border:0;border-radius:0;overflow:visible}
  .tbl.cd thead{display:none}
  .tbl.cd,.tbl.cd tbody{display:block}
  .tbl.cd tbody{display:flex;flex-direction:column;gap:8px}
  .tbl.cd tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--navy)}
  .tbl.cd tr td,.tbl.cd tbody tr.lin:hover td{padding:0;border:0;white-space:normal;text-align:left;background:transparent}
  .tbl.cd td.full{grid-column:1/-1}
  .tbl.cd td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--aux);margin-bottom:2px}
}
@container det (max-width:560px){
  .tbl-wrap:has(.tbl.cd){border:0;border-radius:0;overflow:visible}
  .tbl.cd thead{display:none}
  .tbl.cd,.tbl.cd tbody{display:block}
  .tbl.cd tbody{display:flex;flex-direction:column;gap:8px}
  .tbl.cd tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--navy)}
  .tbl.cd tr td,.tbl.cd tbody tr.lin:hover td{padding:0;border:0;white-space:normal;text-align:left;background:transparent}
  .tbl.cd td.full{grid-column:1/-1}
  .tbl.cd td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--aux);margin-bottom:2px}
}
@container tb (max-width:620px){
  .tbl-wrap:has(.tbl.cd){border:0;border-radius:0;overflow:visible}
  .tbl.cd thead{display:none}
  .tbl.cd,.tbl.cd tbody{display:block}
  .tbl.cd tbody{display:flex;flex-direction:column;gap:8px}
  .tbl.cd tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--navy)}
  .tbl.cd tr td,.tbl.cd tbody tr.lin:hover td{padding:0;border:0;white-space:normal;text-align:left;background:transparent}
  .tbl.cd td.full{grid-column:1/-1}
  .tbl.cd td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--aux);margin-bottom:2px}
}
/* Tablet do balcão: modo balcão, sem menu lateral */
.tablet{container:tb/inline-size;width:100%;max-width:980px;margin:0 auto;border:14px solid var(--frame);border-radius:28px;background:var(--background);min-height:640px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 1px var(--border)}
@media (max-width:640px){.tablet{border:1px solid var(--border);border-radius:12px;box-shadow:none;min-height:0}}
.tb-top{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;background:var(--navy);border-bottom:1px solid var(--border)}
.tb-top .t1{font-weight:700;color:#fff;font-size:15px}
.tb-top .t2{font-size:12px;color:var(--muted)}
.tb-top.tec{box-shadow:inset 0 3px 0 var(--orange)}
.tb-body{flex:1;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
@container tb (max-width:520px){.tb-body{padding:14px}}
.passos{display:flex;flex-wrap:wrap;gap:6px}
.passos span{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.passos span.on{border-color:var(--orange);color:#fff}
.passos span.ok{border-color:var(--ok-borda);color:var(--verde)}
.entrega{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:40px 16px;flex:1}
.entrega .big{font-size:24px;font-weight:700;color:#fff;text-wrap:balance}
.entrega p{max-width:48ch;color:var(--muted)}
.assin-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@container tb (min-width:700px){.assin-grid{grid-template-columns:240px minmax(0,1fr)}}
@container det (min-width:640px){.assin-grid{grid-template-columns:240px minmax(0,1fr)}}
.assin-pin{display:flex;flex-direction:column;align-items:center;gap:10px}
.keypad.sm{grid-template-columns:repeat(3,64px);gap:8px}
.keypad.sm button{height:50px;font-size:20px}
canvas.assin{display:block;width:100%;height:200px;max-width:100%;background:var(--input-bg);border:1px dashed var(--muted);border-radius:12px;touch-action:none;cursor:crosshair}
.grav{display:flex;flex-direction:column;gap:8px}
.grav .g{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--texto-suave)}
.grav .g .st{flex:none;width:18px;height:18px;display:grid;place-items:center;font-weight:700}
.grav .g b{color:#fff;font-weight:500}
.spin{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:gira .8s linear infinite;display:inline-block}
@keyframes gira{to{transform:rotate(360deg)}}
/* Documento (folha e requisição) */
.doc{background:var(--papel);color:var(--tinta);border-radius:6px;padding:22px;font-size:12px;line-height:1.45;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);min-width:0}
.doc h3{font-size:15px;color:var(--tinta)}
.doc b{color:var(--tinta)}
.doc .dk{color:var(--tinta-suave)}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 16px}
.doc-wrap{overflow-x:auto;max-width:100%}
.doc table{width:100%;border-collapse:collapse;font-size:12px}
.doc th,.doc td{border-bottom:1px solid var(--papel-borda);padding:5px 6px;text-align:left;vertical-align:top;color:var(--tinta)}
.doc th{color:var(--tinta-suave);font-weight:600}
.doc td.r,.doc th.r{text-align:right;font-variant-numeric:tabular-nums}
.doc .ass{border-top:1px solid var(--tinta);padding-top:4px;max-width:340px}
.doc .ass img{display:block;height:84px;max-width:100%}
.doc .cx{display:inline-block;width:12px;height:12px;border:1.5px solid var(--tinta);border-radius:2px}
.doc .ped-f{border:1px solid var(--papel-borda);border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:6px}
.doc .emg{color:#b91c1c;font-weight:700}
/* Transferência */
.radio{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:#fff;font-weight:500}
.radio input{accent-color:var(--orange);width:18px;height:18px;flex:none}
.radio.off{color:var(--muted);cursor:not-allowed}
/* Convite e cadastro */
.link-box{display:flex;gap:8px;flex-wrap:wrap}
.link-box input{flex:1 1 240px;font-family:var(--mono);font-size:13px}
.zap{white-space:pre-wrap;background:var(--background);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:13px;color:var(--texto-suave);overflow-wrap:anywhere}
.modo{display:inline-flex;border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.modo button{border:0;background:transparent;border-radius:6px;padding:6px 12px;font-size:13px;color:var(--muted)}
.modo button[aria-pressed="true"]{background:var(--border);color:#fff}
.rh-res{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow:auto}
.rh-res button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--border);background:var(--background);color:var(--texto-suave);border-radius:8px;padding:8px 12px;font-size:13px}
.rh-res button b{color:#fff;font-weight:500;font-size:14px}
.rh-res button[aria-pressed="true"]{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}

<script>
"use strict";
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const casa=(texto,q)=>{const t=norm(texto);return norm(q).split(/\s+/).filter(Boolean).every(k=>t.includes(k));};
const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const num=v=>Number(v).toLocaleString("pt-BR");
const DIAS=["dom","seg","ter","qua","qui","sex","sáb"];
const dia=(dd,mm=11)=>new Date(2026,mm-1,dd);
const fmtD=x=>`${DIAS[x.getDay()]} ${String(x.getDate()).padStart(2,"0")}/${String(x.getMonth()+1).padStart(2,"0")}`;
const fmtH=x=>`${String(x.getHours()).padStart(2,"0")}:${String(x.getMinutes()).padStart(2,"0")}`;

const G={hora:"09:30",sec:"1"};

const espera=env=>{const m=Math.max(0,Math.round((agora()-env)/6e4));if(m<60)return`${m} min`;const h=Math.floor(m/60),r=m%60;return r?`${h}h${String(r).padStart(2,"0")}`:`${h}h`;};

 {id:"cabo25",cod:"ELE-0410",d:"Cabo flexível 2,5mm² (metro)",un:"m",f:"Elétrica",cmc:3.1,s:{BASE:300,DPSP:120},e:{"MANFAC 2":30,"MANFAC-25":15},min:{BASE:100,DPSP:100,PROFARMA:80},ec:{q:200,prev:"13/11"}},

const OBRAS=[

/* ---------- estados genéricos ---------- */

/* =====================================================================
   RODADA 2A — moldura, dados e utilidades novas

const ALMOX="Paulo Mendes";
const nmL=l=>({BASE:"Base",DPSP:"DPSP",PROFARMA:"Profarma"})[l]||l;
const pri=s=>String(s).split(" ")[0];

/* Pedidos aprovados (continuação da rodada 1: a aprovação já aconteceu) */

const PD=[

 {n:1041,tec:"Carlos Souza",eq:"MANFAC 2",ct:"DPSP",dest:"man",os:[],env:new Date(2026,10,9,14,10),ret:dia(11),emerg:false,etapa:"separado",por:"Fernanda Rocha",sepEm:"ter 10/11 17:20",itens:[it2("led9",6,{sep:6}),it2("oculos",1,{sep:1})]},
 {n:1042,tec:"Carlos Souza",eq:"MANFAC 2",ct:"DPSP",dest:"man",os:[],env:new Date(2026,10,11,8,40),ret:dia(12),emerg:false,etapa:"aprovado",por:"Fernanda Rocha",itens:[it2("ledtub",6),it2("fita",4),it2("disj20c",4,{transf:2}),it2("cabo25",50)]},
 {n:1045,tec:"Marcos Pereira",eq:"MANFAC-25",ct:"Obra/Spot",dest:"obra",os:["48213"],env:new Date(2026,10,10,15,20),ret:dia(12),emerg:false,etapa:"aprovado",por:"Fernanda Rocha",itens:[it2("cabo25",100),it2("tomada",10),it2("bucha",2),it2("sifao",2,{transf:2})]},
 {n:1040,tec:"Carlos Souza",eq:"MANFAC 2",ct:"DPSP",dest:"man",os:[],env:new Date(2026,10,10,9,30),ret:dia(13),emerg:false,etapa:"aprovado",por:"Fernanda Rocha",itens:[it2("reator",2,{transf:2}),it2("fita",2)]},
];
const ATIVO=["aprovado","separado"];
const locDe=pd=>pd.dest==="obra"?"BASE":pd.ct;
const aSep=i=>Math.max(0,i.ap-i.transf);
function comp(id,l){let t=0;for(const pd of PD){if(!ATIVO.includes(pd.etapa)||locDe(pd)!==l)continue;for(const i of pd.itens)if(i.id===id)t+=aSep(i);}return t;}

/* Gravações no Omie (fila) */

/* Assinatura: PIN + traço do dedo (compartilhada pela retirada e pela devolução) */
const SIG={s7:()=>S7,s9:()=>S9};
function assinBloco(pref,st,nome){
  return `<div class="assin-grid"><div class="assin-pin"><div class="label-mono">1 · PIN de ${esc(pri(nome))}</div>
  <div class="pin-dots" aria-label="${st.pin.length} dígitos digitados">${Array.from({length:6},(_,k)=>`<span class="${k<st.pin.length?"f":""}" ${k>=4&&k>=st.pin.length?'style="opacity:.35"':""}></span>`).join("")}</div>
  ${st.pinErr?`<p class="erro-t" style="text-align:center">PIN errado. Mais ${5-st.pinErr} ${5-st.pinErr===1?"tentativa":"tentativas"} e o acesso fica bloqueado por 15 minutos.</p>`:`<p class="muted" style="font-size:12px;text-align:center">O mesmo PIN que ${esc(pri(nome))} usa no celular.</p>`}
  <div class="keypad sm">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-a="pin" data-s="${pref}" data-v="${n}">${n}</button>`).join("")}<button type="button" data-a="pin-del" data-s="${pref}" aria-label="Apagar">⌫</button><button type="button" data-a="pin" data-s="${pref}" data-v="0">0</button><span></span></div>
  <p class="mk-ctrl" style="font-size:11px">Mockup: qualquer PIN de 4 dígitos vale; 0000 mostra o erro.</p></div>
  <div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div class="label-mono">2 · Assinatura com o dedo</div><canvas class="assin" id="${pref}-sig" aria-label="Quadro para assinar com o dedo"></canvas>
  <div class="acoes"><span class="muted" style="font-size:12px" id="${pref}-sig-st">${st.tr.length?"Assinado. Se errou, toque em Limpar.":"Assine com o dedo (ou o mouse) dentro do quadro"}</span><div class="sp"></div><button type="button" class="btn btn-ghost btn-xs" data-a="sig-limpa" data-s="${pref}">Limpar</button></div></div></div>`;
}
function desenhaTr(ctx,tr,w,h,cor,lw){
  ctx.clearRect(0,0,w,h);ctx.lineWidth=lw;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=cor;
  for(const t of tr){ctx.beginPath();t.forEach(([x,y],k)=>{k?ctx.lineTo(x*w,y*h):ctx.moveTo(x*w,y*h);});if(t.length===1)ctx.lineTo(t[0][0]*w+.5,t[0][1]*h);ctx.stroke();}
}
function montaAssin(pref){
  const cv=document.getElementById(pref+"-sig");if(!cv)return;
  const st=SIG[pref]();const dpr=window.devicePixelRatio||1;const r=cv.getBoundingClientRect();
  if(!r.width)return;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  const ctx=cv.getContext("2d");const cor=getComputedStyle(document.documentElement).getPropertyValue("--texto").trim()||"#fff";
  const pinta=()=>desenhaTr(ctx,st.tr,cv.width,cv.height,cor,2.6*dpr);pinta();
  let cur=null;

function s11Render(){
  $("#sec-11").innerHTML=`${secH("Para o Jose e o almox responderem","11","Escolhas desta versão","Pontos em que o desenho não dizia como fazer, e o mockup escolheu. Se algum estiver errado, responda pelo WhatsApp com a letra.")}
  <div class="sup">${ESC.map(([t,x],k)=>`<div class="card"><span class="lt">${String.fromCharCode(97+k)}</span><p><b>${t}.</b> ${x}</p></div>`).join("")}</div>`;
}

/* =====================================================================
   NAVEGAÇÃO E EVENTOS
   ===================================================================== */
const R={5:s5Render,6:s6Render,7:s7Render,8:s8Render,9:s9Render,10:s10Render,11:s11Render};
const SECS=["5","6","7","8","9","10","11"];
function renderTudo(){SECS.forEach(k=>R[k]());}
function irSec(v){
  G.sec=v;SECS.forEach(k=>{$(`#sec-${k}`).hidden=k!==v;$(`#tab-${k}`).setAttribute("aria-selected",String(k===v));});
  R[v]();
  if(location.hash!==`#secao-${v}`)history.replaceState(null,"",`#secao-${v}`);
}
function marcaHora(){document.querySelectorAll("#seg-hora button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===G.hora)));}
const pedN=v=>PD.find(p=>p.n===Number(v));

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  const a=el.dataset.a,v=el.dataset.v;
  switch(a){
    case "sec":fechar();irSec(v);window.scrollTo({top:0});break;
    case "hora":G.hora=v;marcaHora();renderTudo();break;
    case "fechar":fechar();break;
    case "sh-menu":el.closest(".shell").dataset.gaveta="sim";break;
    case "sh-fecha":el.closest(".shell").dataset.gaveta="nao";break;
    case "estado":{const s=el.dataset.s;({5:S5,6:S6,7:S7,8:S8,9:S9,10:S10})[s].estado=v;R[s]();break;}
    /* 5 */
    case "s5-tentar":tentar(S5,s5Render);break;
    case "s5-como":S5.como=v;s5Render();break;
    case "s5-ir":if(v==="falhas")falhasDlg();else if(v.startsWith("fora:")){S5.nota=`<b>Mockup</b> A tela de ${v.slice(5)} entra na rodada 2B. Aqui o cartão só mostra o número do dia.`;s5Render();}else{S5.nota=null;irSec(v);window.scrollTo({top:0});}break;
    case "s5-falhas":falhasDlg();break;
    case "s5-retry":{const t=TAR.find(x=>x.id===v);t.st="tentando";falhasDlg();setTimeout(()=>{t.st="ok";if(dlg.open)falhasDlg();s5Render();},1300);break;}
    case "s5-sep":S6.sel=Number(v);S6.msg=null;irSec("6");window.scrollTo({top:0});break;
    case "s5-ret":Object.assign(S7,{tela:"conf",sel:Number(v),conf:false,pin:"",tr:[],pinErr:0,erro:"",estado:"dados"});irSec("7");window.scrollTo({top:0});break;
    case "s5-tr":S8.sel=v;S8.msg=null;irSec("8");window.scrollTo({top:0});break;
    case "s5-dev":S9.sel=v;S9.fase="conf";irSec("9");window.scrollTo({top:0});break;
    /* 6 */
    case "s6-sel":S6.sel=Number(v);S6.msg=null;s6Render();if(window.innerWidth<980)$("#s6-det")?.scrollIntoView({behavior:"smooth",block:"start"});break;
    case "s6-q":{const pd=pedN(S6.sel);const i=pd.itens[Number(v)];i.sep=Math.max(0,Math.min(aSep(i),i.sep+Number(el.dataset.d)));s6Render();break;}
    case "s6-tudo":{const pd=pedN(S6.sel);const i=pd.itens[Number(v)];i.sep=aSep(i);s6Render();break;}
    case "s6-concluir":s6ConcluirDlg(Number(v));break;
    case "s6-concluir-ok":s6Concluir(Number(v));break;
    case "s6-folha":s6Folha();break;
    case "s6-tr":S8.sel=v;S8.msg=null;irSec("8");window.scrollTo({top:0});break;
    case "s6-tentar":tentar(S6,s6Render);break;
    /* 7 */
    case "s7-abrir":Object.assign(S7,{tela:"conf",sel:Number(v),conf:false,pin:"",tr:[],pinErr:0,erro:""});s7Render();break;
    case "s7-tela":S7.tela=v;S7.erro="";if(v==="lista"){S7.sel=null;S7.conf=false;}if(v==="assina"){S7.pin="";S7.tr=[];}s7Render();break;
    case "s7-ok":s7Confirmar();break;
    case "s7-nova":Object.assign(S7,{tela:"lista",sel:null,conf:false,pin:"",tr:[],res:null});s7Render();break;
    case "s7-omie":S7.omieOk=v==="ok";s7Render();break;
    case "s7-tentar":tentar(S7,s7Render);break;
    case "pin":{const st=SIG[el.dataset.s]();if(st.pin.length<6){st.pin+=v;st.erro="";R[el.dataset.s==="s7"?"7":"9"]();}break;}
    case "pin-del":{const st=SIG[el.dataset.s]();st.pin=st.pin.slice(0,-1);R[el.dataset.s==="s7"?"7":"9"]();break;}
    case "sig-limpa":{const st=SIG[el.dataset.s]();st.tr=[];R[el.dataset.s==="s7"?"7":"9"]();break;}
    /* 8 */
    case "s8-sel":S8.sel=v;S8.msg=null;s8Render();if(window.innerWidth<980)$("#s8-det")?.scrollIntoView({behavior:"smooth",block:"start"});break;
    case "s8-q":S8.q[v]=(S8.q[v]||0)+Number(el.dataset.d);s8Render();break;
    case "s8-ok":s8Confirma(v);break;
    case "s8-recusar":S8.mot="";s8RecusaDlg(v);break;
    case "s8-recusa-ok":{const m=$("#s8-motivo").value.trim();if(m.length<5){S8.mot=m;s8RecusaDlg(v,"Escreva o motivo. O técnico e o aprovador precisam saber por que não vem.");break;}
      const x=trFila().find(t=>t.k===v);const {pd,i}=x,p=PID[i.id];const n=i.transf;i.ap-=i.transf;i.transf=0;
      const enc=!pd.itens.some(j=>j.ap>0);if(enc)pd.etapa="encerrado";
      S8.msg={html:`<b>Transferência recusada.</b> ${n} ${p.un} de ${esc(p.d)} saíram do pedido #${pd.n}. ${pd.tec} (app) e ${pd.por} (e-mail) receberam o seu motivo.${enc?" O pedido ficou sem itens e foi encerrado como “Não atendido”.":""}`};
      S8.sel=null;fechar();s5Render();s6Render();s8Render();break;}
    case "s8-tentar":tentar(S8,s8Render);break;
    /* 9 */
    case "s9-mais":{const p=PID[v];S9.q[v]=Math.min(pode9(p),(S9.q[v]||0)+1);S9.phErro="";s9Render();break;}
    case "s9-menos":S9.q[v]=Math.max(0,(S9.q[v]||0)-1);if(!S9.q[v])delete S9.q[v];s9Render();break;
    case "s9-ph":S9.ph=v;s9Render();break;
    case "s9-pedir":{const ids=Object.keys(S9.q).filter(k=>S9.q[k]>0);if(!ids.length){S9.phErro="Toque em “Devolver” em pelo menos um item.";s9Render();break;}
      const n=`D-${String(devN++).padStart(4,"0")}`;DEV.push({n,tec:TEC9.nome,eq:TEC9.eq,ct:TEC9.ct,em:agora(),mot:S9.mot,itens:ids.map(id=>({id,q:S9.q[id],c:S9.q[id]})),st:"conferir"});
      S9.q={};S9.ultima=n;S9.ph="ok";S9.sel=n;S9.fase="conf";S9.fim=null;S9.pin="";S9.tr=[];s9Render();s5Render();break;}
    case "s9-sel":Object.assign(S9,{sel:v,fase:"conf",pin:"",tr:[],pinErr:0,erro:"",fim:null});s9Render();break;
    case "s9-q":{const d=DEV.find(x=>x.n===S9.sel);const x=d.itens[Number(v)];x.c=Math.max(0,Math.min(x.q,x.c+Number(el.dataset.d)));s9Render();break;}
    case "s9-assina":S9.fase="assina";S9.pin="";S9.tr=[];S9.erro="";s9Render();break;
    case "s9-voltar":S9.fase="conf";s9Render();break;
    case "s9-ok":s9Confirmar();break;
    case "s9-tentar":tentar(S9,s9Render);break;
    /* 10 */
    case "s10-cad":S10.cad={modo:"rh",busca:"",esc:null,nome:"",cpf:"",eq:"",cel:"",erro:""};cadDlg();break;
    case "s10-modo":S10.cad.modo=v;S10.cad.erro="";cadDlg();break;
    case "s10-rh":{S10.cad.esc=v;S10.cad.erro="";const r=RHC.find(x=>x.id===v);document.querySelectorAll("#rh-res button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));if(r&&!S10.cad.nome)S10.cad.nome=r.nome;break;}
    case "s10-salvar":s10Salvar();break;
    case "s10-conv":{const c=COL.find(x=>x.id===Number(v));c.conv={tok:tok(),ate:addUteis(hoje(),5)};c.ac="convite";S10.msg=null;s10Render();convDlg(c.id,true);break;}
    case "s10-ver":convDlg(Number(v),false);break;
    case "s10-reem":reemDlg(Number(v));break;
    case "s10-reem-ok":{const c=COL.find(x=>x.id===Number(v));c.conv={tok:tok(),ate:addUteis(hoje(),5)};c.ac="convite";c.info="";S10.msg=`<b>Convite novo de ${esc(c.nome)}.</b> O link anterior parou de funcionar${c.cel?" e o celular dele foi desconectado":""}.`;s10Render();convDlg(c.id,true);break;}
    case "s10-bloq":bloqDlg(Number(v));break;
    case "s10-bloq-ok":{const c=COL.find(x=>x.id===Number(v));const m=$("#bq-mot").value;c.ac="bloqueado";c.info=`Bloqueado por ${ALMOX} em ${fmtD(hoje())} ${G.hora} · ${m}`;S10.msg=`<b>${esc(c.nome)} bloqueado.</b> Ele saiu do app e não entra até ser desbloqueado.`;fechar();s10Render();break;}
    case "s10-desb":desbDlg(Number(v));break;
    case "s10-desb-ok":{const c=COL.find(x=>x.id===Number(v));c.ac="ativo";c.info=`Desbloqueado por ${ALMOX} em ${fmtD(hoje())} ${G.hora}`;S10.msg=`<b>${esc(c.nome)} desbloqueado.</b> Ele já pode entrar com o mesmo PIN.`;fechar();s10Render();break;}
    case "s10-limpa":S10.busca="";S10.fil="todos";s10Render();break;
    case "s10-tentar":tentar(S10,s10Render);break;
    case "cv-copiar":{const inp=$("#cv-link"),st=$("#cv-st");const falha=()=>{inp.focus();inp.select();st.textContent="Não deu para copiar sozinho. O link está selecionado: use Ctrl+C (no celular, segure e copie).";};
      try{navigator.clipboard.writeText(inp.value).then(()=>{st.textContent="Link copiado.";},falha);}catch(_){falha();}break;}
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="s10-busca"){S10.busca=t.value;$("#s10-corpo").innerHTML=s10Linhas();}
  else if(t.id==="rh-busca"){S10.cad.busca=t.value;const jaTem=nome=>COL.some(c=>c.nome===nome);$("#rh-res").innerHTML=rhRes(RHC.filter(r=>!t.value||casa(`${r.nome} ${r.cargo}`,t.value)),jaTem);}
  else if(t.id==="cad-nome")S10.cad.nome=t.value;
  else if(t.id==="cad-cpf")S10.cad.cpf=t.value;
  else if(t.id==="cad-cel")S10.cad.cel=t.value;
  else if(t.id==="s8-motivo")S8.mot=t.value;
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.sq!=null){const pd=pedN(S6.sel);const i=pd.itens[Number(t.dataset.sq)];i.sep=Math.max(0,Math.min(aSep(i),Math.floor(Number(t.value)||0)));s6Render();}
  else if(t.id==="s7-curto"){S7.curto=t.checked;s7Render();}
  else if(t.id==="s7-conf"){S7.conf=t.checked;const b=$("#s7-passar");if(b){const pd=pedN(S7.sel);b.disabled=!(S7.conf&&entregaItens(pd).some(x=>x.q>0));}}
  else if(t.name==="s8-orig"){const x=s8Atual();S8.orig[x.k]=t.value;delete S8.q[x.k];s8Render();}
  else if(t.id==="s8-qtd"){const x=s8Atual();S8.q[x.k]=Math.floor(Number(t.value)||1);s8Render();}
  else if(t.id==="s9-mot")S9.mot=t.value;
  else if(t.dataset.cq!=null){const d=DEV.find(x=>x.n===S9.sel);const x=d.itens[Number(t.dataset.cq)];x.c=Math.max(0,Math.min(x.q,Math.floor(Number(t.value)||0)));s9Render();}
  else if(t.id==="s10-fil"){S10.fil=t.value;$("#s10-corpo").innerHTML=s10Linhas();}
  else if(t.id==="cad-eq")S10.cad.eq=t.value;
});
window.addEventListener("hashchange",()=>{const m=location.hash.match(/^#secao-(5|6|7|8|9|10|11)$/);if(m)irSec(m[1]);});
let rzT;window.addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(G.sec==="7")s7Render();if(G.sec==="9")s9Render();},200);});

marcaHora();
{const m=location.hash.match(/^#secao-(5|6|7|8|9|10|11)$/);irSec(m?m[1]:"5");}
</script>
