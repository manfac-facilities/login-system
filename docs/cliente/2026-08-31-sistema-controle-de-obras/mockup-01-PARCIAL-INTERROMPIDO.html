<title>Diário de Obras Manfac</title>
<style data-pagina>
  :root{
    /* Tema do hub Manfac — escuro por decisão, sem variante clara */
    --bg:#0a1628;
    --panel:#0b1b36;
    --panel-2:#0d2050;
    --line:#1e3a5f;
    --line-soft:#162c4a;
    --ink:#e9f0fa;
    --ink-dim:#94a3b8;
    --ink-faint:#64748b;
    --accent:#f05a28;
    --accent-soft:rgba(240,90,40,.14);
    --ok:#35c98a;
    --ok-soft:rgba(53,201,138,.13);
    --warn:#f4b73f;
    --warn-soft:rgba(244,183,63,.13);
    --crit:#ff4d6d;
    --crit-soft:rgba(255,77,109,.14);
    --info:#5aa9f0;
    --info-soft:rgba(90,169,240,.13);

    --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

    --r:8px;
    --r-sm:5px;
  }

  *{box-sizing:border-box}
  /* precisa vir depois de qualquer display: garante que hidden esconde mesmo */
  [hidden]{display:none !important}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .lbl{
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:600;
  }

  /* ---------- Shell ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:var(--panel-2);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:10px 20px;
  }
  .brand{display:flex;align-items:baseline;gap:9px;margin-right:4px}
  .brand b{font-size:14px;letter-spacing:-.01em}
  .brand span{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint)}
  .tabs{display:flex;gap:2px;background:rgba(0,0,0,.22);padding:3px;border-radius:var(--r);border:1px solid var(--line-soft)}
  .tabs button{
    background:none;border:0;padding:6px 13px;border-radius:var(--r-sm);
    color:var(--ink-dim);font-size:13px;font-weight:500;white-space:nowrap;
  }
  .tabs button[aria-current="true"]{background:var(--accent);color:#fff;font-weight:600}
  .tabs button:hover:not([aria-current="true"]){color:var(--ink);background:rgba(255,255,255,.05)}
  .who{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--ink-dim);font-size:12px}
  .who .av{
    width:26px;height:26px;border-radius:50%;background:var(--accent-soft);
    border:1px solid rgba(240,90,40,.4);color:var(--accent);
    display:grid;place-items:center;font-size:11px;font-weight:700;
  }

  main{max-width:1220px;margin:0 auto;padding:22px 20px 90px}

  .page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .page-head h1{font-size:20px;margin:0 0 3px;letter-spacing:-.015em;text-wrap:balance}
  .page-head p{margin:0;color:var(--ink-dim);font-size:13px}
  .page-head .demo{margin-left:auto;display:flex;align-items:center;gap:8px}
  .page-head .demo select{
    background:rgba(0,0,0,.25);border:1px dashed var(--line);border-radius:var(--r-sm);
    padding:5px 8px;font-size:12px;color:var(--ink-dim);
  }

  /* ---------- Contador da fila ---------- */
  .fila-status{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:13px 16px;margin-bottom:18px;
  }
  .fila-status .big{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1;color:var(--accent)}
  .fila-txt{font-size:13px;color:var(--ink-dim)}
  .barra{flex:1 1 180px;min-width:120px;height:5px;background:var(--line-soft);border-radius:99px;overflow:hidden}
  .barra i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}

  /* ---------- Cards de obra (diário) ---------- */
  .fila{display:flex;flex-direction:column;gap:12px}
  .obra{
    position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);border-left:3px solid var(--sev,var(--line));
    padding:14px 16px 14px 15px;
    transition:opacity .25s ease,transform .25s ease;
  }
  .obra.saindo{opacity:0;transform:translateY(-6px)}
  .obra-head{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .obra-id{min-width:0;flex:1 1 300px}
  .obra-os{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.02em}
  .obra-loja{
    font-size:15px;font-weight:650;letter-spacing:-.01em;margin:1px 0 4px;
    background:none;border:0;padding:0;text-align:left;color:var(--ink);
  }
  .obra-loja:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  .obra-desc{color:var(--ink-dim);font-size:12.5px;margin:0 0 6px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-dim)}
  .meta b{color:var(--ink);font-weight:600}

  /* coluna de sinais: no máximo duas linhas, alinhadas, sem repetir número */
  .obra-sinais{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:0 1 auto;max-width:340px}
  .sinal-linha{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
  .nota{
    width:100%;text-align:right;border-radius:var(--r-sm);padding:4px 9px;
    font-size:11.5px;font-weight:600;border:1px solid;
  }
  .nota .n{font-family:var(--mono)}
  .nota.crit{color:var(--crit);background:var(--crit-soft);border-color:rgba(255,77,109,.38)}
  .nota.warn{color:var(--warn);background:var(--warn-soft);border-color:rgba(244,183,63,.32)}
  @media (max-width:640px){
    .obra-sinais{align-items:flex-start;max-width:none;width:100%}
    .sinal-linha{justify-content:flex-start}
    .nota{text-align:left}
  }

  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;
    letter-spacing:.02em;white-space:nowrap;border:1px solid transparent;
  }
  .pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .pill.andamento{color:var(--ok);background:var(--ok-soft);border-color:rgba(53,201,138,.3)}
  .pill.paralisado{color:var(--crit);background:var(--crit-soft);border-color:rgba(255,77,109,.32)}
  .pill.levantamento{color:var(--info);background:var(--info-soft);border-color:rgba(90,169,240,.3)}
  .pill.finalizado{color:var(--ink-dim);background:rgba(148,163,184,.1);border-color:var(--line)}
  .pill.definir{color:var(--accent);background:var(--accent-soft);border-color:rgba(240,90,40,.42)}

  .dias{
    display:inline-flex;align-items:baseline;gap:5px;padding:3px 9px;border-radius:99px;
    font-family:var(--mono);font-size:11px;font-weight:600;white-space:nowrap;
    border:1px solid var(--line);color:var(--ink-dim);background:rgba(0,0,0,.18);
  }
  .dias.atencao{color:var(--warn);border-color:rgba(244,183,63,.35);background:var(--warn-soft)}
  .dias.critico{color:var(--crit);border-color:rgba(255,77,109,.4);background:var(--crit-soft)}
  .dias small{font-family:var(--sans);font-weight:500;font-size:10.5px;letter-spacing:.02em;opacity:.85}

  .pend{
    margin-top:10px;font-size:12.5px;color:var(--ink-dim);
    border-left:2px solid var(--line);padding-left:10px;
  }
  .pend b{color:var(--ink);font-weight:600}

  /* ---------- Perguntas ---------- */
  .perguntas{
    margin-top:13px;padding-top:13px;border-top:1px dashed var(--line-soft);
    display:flex;flex-direction:column;gap:11px;
  }
  .q{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
  .q > .lbl{flex:0 0 130px}
  @media (max-width:640px){.q > .lbl{flex:1 1 100%}}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    background:rgba(0,0,0,.2);border:1px solid var(--line);color:var(--ink-dim);
    padding:6px 12px;border-radius:var(--r-sm);font-size:12.5px;font-weight:500;
    transition:background .12s ease,color .12s ease,border-color .12s ease;
  }
  .chip:hover{border-color:#2b4f7d;color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .chip.sim[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#04231a}
  .chip.nao[aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:#2a0410}

  .obs-linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .obs-btn{
    background:none;border:0;color:var(--ink-faint);font-size:12px;padding:2px 0;
    text-decoration:underline;text-underline-offset:3px;text-decoration-style:dotted;
  }
  .obs-btn:hover{color:var(--accent)}
  .obs-in{
    flex:1 1 260px;background:rgba(0,0,0,.25);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:7px 10px;font-size:13px;
  }
  .obs-in::placeholder{color:var(--ink-faint)}

  /* Bloco de escalonamento (3º dia sem andar) */
  .escala{
    border:1px solid rgba(255,77,109,.4);background:var(--crit-soft);
    border-radius:var(--r);padding:11px 13px;display:flex;flex-direction:column;gap:9px;
  }
  .escala-top{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
  .escala-top strong{color:var(--crit);font-size:12.5px}
  .escala-top span{color:var(--ink-dim);font-size:12px}

  .acoes{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:2px}
  .btn{
    background:var(--accent);border:1px solid var(--accent);color:#fff;font-weight:600;
    padding:8px 16px;border-radius:var(--r-sm);font-size:13px;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{background:transparent;color:var(--ink-faint);border-color:var(--line);cursor:not-allowed;filter:none}
  .btn.ghost{background:transparent;color:var(--ink-dim);border-color:var(--line);font-weight:500}
  .btn.ghost:hover{color:var(--ink);border-color:#2b4f7d;filter:none}
  .hint{font-size:12px;color:var(--ink-faint)}
  .hint.alerta{color:var(--warn)}

  /* Respondidas */
  .feitas{margin-top:26px}
  .feitas h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 9px;font-weight:600}
  .feita{
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    background:rgba(53,201,138,.05);border:1px solid var(--line-soft);
    border-left:3px solid var(--ok);border-radius:var(--r-sm);padding:8px 12px;margin-bottom:6px;
  }
  .feita .ck{color:var(--ok);font-weight:700}
  .feita .nm{font-weight:600;font-size:13px}
  .feita .rs{color:var(--ink-dim);font-size:12px}
  .feita .un{margin-left:auto}

  /* ---------- Estados da tela 1 ---------- */
  .sucesso{
    border:1px solid rgba(53,201,138,.4);background:rgba(53,201,138,.07);
    border-radius:var(--r);padding:26px 22px;text-align:center;
  }
  .sucesso .mark{
    width:42px;height:42px;border-radius:50%;margin:0 auto 12px;
    display:grid;place-items:center;font-size:20px;font-weight:700;
    color:#04231a;background:var(--ok);
  }
  .sucesso h2{margin:0 0 6px;font-size:17px;color:var(--ok);letter-spacing:-.01em}
  .sucesso p{margin:0 auto;max-width:52ch;color:var(--ink-dim);font-size:13px}
  .sucesso .placar{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;
  }
  .sucesso .placar span{
    border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:99px;
    padding:5px 12px;font-size:12px;color:var(--ink-dim);
  }
  .sucesso .placar b{font-family:var(--mono);color:var(--ink);font-size:13px}

  .sk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .sk + .sk{margin-top:12px}
  .sk i{display:block;height:11px;border-radius:4px;background:var(--line-soft);margin-bottom:9px}
  .sk i.a{width:120px;height:9px}
  .sk i.b{width:44%}
  .sk i.c{width:70%;height:9px}
  .sk i.d{width:100%;height:30px;margin-bottom:0;margin-top:14px}
  .sk-pulso{animation:pulso 1.1s ease-in-out infinite}
  @keyframes pulso{0%,100%{opacity:.45}50%{opacity:.9}}
  .carregando-txt{color:var(--ink-faint);font-size:12.5px;margin:0 0 12px}

  .estado{
    border-radius:var(--r);padding:22px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;
    border:1px solid var(--line);background:var(--panel);
  }
  .estado .ico{
    flex:none;width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;
    font-size:17px;font-weight:700;
  }
  .estado h2{margin:0 0 6px;font-size:16px;letter-spacing:-.01em}
  .estado p{margin:0 0 4px;color:var(--ink-dim);font-size:13px;max-width:58ch}
  .estado .corpo{flex:1 1 260px}
  .estado .acoes{margin-top:12px}
  .estado.erro{border-color:rgba(255,77,109,.45);background:var(--crit-soft)}
  .estado.erro .ico{background:var(--crit);color:#2a0410}
  .estado.erro h2{color:var(--crit)}
  .estado.bloqueio .ico{background:rgba(148,163,184,.15);color:var(--ink-dim);border:1px solid var(--line)}

  /* ---------- Aviso da fila de definição ---------- */
  .aviso-def{
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;width:100%;
    border:1px solid rgba(240,90,40,.4);background:rgba(240,90,40,.07);
    border-radius:var(--r);padding:11px 14px;margin-bottom:14px;text-align:left;
  }
  .aviso-def .n{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--accent);line-height:1}
  .aviso-def .txt{font-size:12.5px;color:var(--ink-dim)}
  .aviso-def .txt b{color:var(--ink)}
  .aviso-def .ir{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:600;white-space:nowrap}
  .aviso-def:hover{border-color:var(--accent)}

  /* ---------- Triagem da obra nova ---------- */
  .triagem-aviso{
    display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;
    border:1px solid rgba(240,90,40,.42);background:rgba(240,90,40,.07);
    border-left:4px solid var(--accent);border-radius:var(--r);padding:14px 16px;margin-bottom:18px;
  }
  .triagem-aviso h3{margin:0 0 4px;font-size:14px;color:var(--accent)}
  .triagem-aviso p{margin:0;font-size:13px;color:var(--ink-dim);max-width:64ch}
  .triagem-aviso p b{color:var(--ink)}
  .triagem-aviso .cont{
    font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);
    border:1px solid rgba(240,90,40,.45);border-radius:99px;padding:3px 10px;white-space:nowrap;
  }
  .campo{
    display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;
    padding:11px 0;border-bottom:1px dashed var(--line-soft);
  }
  .campo:last-child{border-bottom:0}
  .campo > .rot{flex:0 0 168px;display:flex;align-items:center;gap:8px}
  .campo .mk{
    width:16px;height:16px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:10px;font-weight:700;border:1px solid var(--line);color:var(--ink-faint);
  }
  .campo.ok .mk{background:var(--ok);border-color:var(--ok);color:#04231a}
  .campo .rot span{font-size:12.5px;font-weight:600}
  .campo.ok .rot span{color:var(--ink-dim);font-weight:500}
  @media (max-width:640px){.campo > .rot{flex:1 1 100%}}
  .campo select,.campo input{
    background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:6px 9px;font-size:12.5px;color:var(--ink);
  }
  .campo input[type="number"]{width:88px}
  .campo .dica{font-size:11.5px;color:var(--ink-faint)}
  .liberar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}

  /* ---------- Caixas de decisão ---------- */
  .decisao{
    border:1px solid rgba(240,90,40,.35);background:rgba(240,90,40,.05);
    border-radius:var(--r);padding:12px 14px;margin:18px 0 0;
    display:flex;gap:13px;align-items:flex-start;
  }
  .decisao .tag{
    flex:none;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;
    color:var(--accent);border:1px solid rgba(240,90,40,.45);border-radius:var(--r-sm);
    padding:4px 8px;background:rgba(240,90,40,.1);white-space:nowrap;
  }
  .decisao p{margin:0 0 6px;font-size:13px;line-height:1.5}
  .decisao p:last-child{margin-bottom:0}
  .decisao .opt{font-size:12.5px;color:var(--ink-dim)}
  .decisao .opt b{color:var(--ink)}
  .decisao .opt em{color:var(--accent);font-style:normal;font-weight:600}

  /* ---------- Campos de retorno ---------- */
  .fb{
    margin:10px 0 26px;border:1px dashed var(--line);border-radius:var(--r);
    padding:11px 14px;background:rgba(0,0,0,.15);
  }
  .fb-h{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
  .fb-h .t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
  .fb-h .t b{color:var(--ink-dim)}
  .fb-radios{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .fb-radios label{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-dim);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 11px;cursor:pointer;
    background:rgba(0,0,0,.2);
  }
  .fb-radios label:hover{border-color:#2b4f7d;color:var(--ink)}
  .fb-radios input{accent-color:var(--accent);margin:0}
  .fb-radios label:has(input:checked){border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
  .fb-radios label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
  .fb-in{
    min-height:44px;border:1px solid var(--line);border-radius:var(--r-sm);
    background:rgba(0,0,0,.25);padding:9px 11px;font-size:13px;line-height:1.5;
  }
  .fb-in:empty::before{content:attr(data-ph);color:var(--ink-faint)}
  .fb-in:focus{border-color:var(--accent);outline:none}
  .fb-st{display:block;margin-top:6px;font-size:11.5px;color:var(--ink-faint);min-height:15px}
  .fb-st.erro{color:var(--warn)}

  /* ---------- Tela 2 ---------- */
  .toolbar{
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:11px 14px;margin-bottom:14px;
  }
  .seg{display:flex;gap:2px;background:rgba(0,0,0,.25);padding:3px;border-radius:var(--r-sm);border:1px solid var(--line-soft)}
  .seg button{background:none;border:0;padding:6px 15px;border-radius:4px;color:var(--ink-dim);font-size:12.5px;font-weight:500}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
  .filtro{display:flex;align-items:center;gap:7px}
  .filtro select{
    background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:6px 9px;font-size:12.5px;color:var(--ink);
  }
  .conta{margin-left:auto;font-size:12px;color:var(--ink-dim)}
  .conta b{font-family:var(--mono);color:var(--ink)}

  .resumo{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .kpi{
    flex:1 1 150px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:11px 13px;border-top:2px solid var(--kc,var(--line));
  }
  .kpi .v{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1.1;color:var(--kc,var(--ink))}
  .kpi .k{font-size:11.5px;color:var(--ink-dim);margin-top:2px}

  .tabela-wrap{

  /* Vermelho só para o que é de fato crítico: obra em aberto que já passou
     de quatro vezes a duração combinada (ou de 120 dias, quando não há duração). */
  function estourou(o){
    if(o.etapa === "finalizado" || o.etapa === "definir") return false;
    return o.duracao ? o.dias > o.duracao * 4 : o.dias >= 120;
  }
  function travado(o){
    return o.etapa !== "finalizado" && o.bloqueadaDias >= 3 && o.bloqueio !== "Sem bloqueio";
  }
  function sev(o){
    if(o.etapa === "definir") return "var(--accent)";
    if(o.etapa === "finalizado") return "var(--ink-faint)";
    if(estourou(o)) return "var(--crit)";
    if(o.etapa === "paralisado") return "var(--crit)";
    if(o.atraso != null && o.atraso > 0) return "var(--warn)";
    if(o.etapa === "levantamento") return "var(--info)";
    return "var(--ok)";
  }
  function classeDias(o){
    if(o.etapa === "finalizado") return "";
    if(estourou(o)) return "critico";
    if(o.dias >= 30) return "atencao";
    return "";
  }

    return '<span class="pill ' + o.etapa + '"><span class="dot"></span>' + ETAPAS[o.etapa].nome + '</span>';

    return '<span class="dias ' + classeDias(o) + '">' + o.dias +

  function statusFb(id, txt, erro){
    var el = document.querySelector('[data-fb-st="' + id + '"]');

  /* Documento a publicar: montado do zero a partir dos dados da página.
     Nunca serializa o DOM vivo — nem o app renderizado, nem os scripts que
     o visualizador injeta. Sempre o mesmo esqueleto + o retorno escrito. */
  function documentoParaPublicar(){
    var p = [];
    p.push("<!doctype html>");
    p.push('<html lang="pt-BR">');
    p.push("<head>");
    p.push('<meta charset="utf-8">');
    p.push('<meta name="viewport" content="width=device-width,initial-scale=1">');
    p.push("<title>" + esc(document.title) + "</title>");
    Array.prototype.forEach.call(document.querySelectorAll("style[data-pagina]"), function(s){ p.push(s.outerHTML); });
    p.push("</head>");
    p.push("<body>");
    p.push('<div id="app"></div>');
    p.push('<script id="feedback-state" type="application/json">' + JSON.stringify(feedback) + "<\/script>");
    Array.prototype.forEach.call(document.querySelectorAll("script[data-pagina]"), function(s){ p.push(s.outerHTML); });
    p.push("</body>");
    p.push("</html>");
    return p.join("\n");
  }

  var pubTimer = null, publicando = false, pubPendente = false, ultimaSecao = null;
  function agendarPublicacao(id){
    if(!artefato) return;
    ultimaSecao = id;
    statusFb(id, "salvando…");
    clearTimeout(pubTimer);
    pubTimer = setTimeout(publicar, 1400);
  }
  function publicar(){
    if(!artefato) return;
    if(publicando){ pubPendente = true; return; }
    publicando = true;
    var id = ultimaSecao;
    artefato.publish(documentoParaPublicar()).then(function(){
      statusFb(id, "salvo na página");
    }, function(e){
      var cod = e && e.code;
      if(cod === "conflict"){
        statusFb(id, "outra versão foi publicada; a página vai recarregar", true);
      } else if(cod === "not_writer" || cod === "not_granted" || cod === "not_declared" ||
                cod === "capability_disabled" || cod === "capability_removed" || cod === "consent_required"){
        esconderCamposFb();
      } else if(cod === "rate_limited"){
        statusFb(id, "muitas gravações seguidas; espere alguns segundos", true);
      } else {
        statusFb(id, "não deu para salvar. Copie o texto e mande pelo WhatsApp", true);
      }
    }).then(function(){
      publicando = false;
      if(pubPendente){ pubPendente = false; agendarPublicacao(ultimaSecao); }
    });
  }

  function precisaEscalar(o, d){
    return d.andou === "Não" && o.naoAndouSeguidos >= 2;
  }
  function validar(o, d){
    if(!d.andou) return "Responda se a obra andou hoje.";
    if(d.andou === "Não" && !d.motivo) return "Diga por que não andou.";
    if(precisaEscalar(o, d) && (!d.resp || !d.prazo)) return "Terceiro dia sem andar: escolha quem resolve e até quando.";
    return null;
  }

  function atualizarCard(card){
    var o = PORID[card.dataset.id], d = rascunho[o.id];
    var naoAndou = d.andou === "Não";
    card.querySelector(".q-motivo").hidden = !naoAndou;
    card.querySelector(".escala").hidden = !precisaEscalar(o, d);
    var erro = validar(o, d);
    var btn = card.querySelector(".salvar");
    var hint = card.querySelector(".hint");
    btn.disabled = !!erro;
    hint.textContent = erro || "";
    hint.className = "hint" + (erro && d.andou ? " alerta" : "");
  }

  function salvar(o, card){
    var d = rascunho[o.id];
    if(validar(o, d)) return;
    respostas[o.id] = {
      andou:d.andou, item:d.item || "Não faltou", motivo:d.motivo,
      resp:d.resp, prazo:d.prazo, obs:d.obs
    };
    o.diario = o.diario.concat([{
      data:"2026-08-31", andou:d.andou === "Sim", motivo:d.motivo,
      item:d.item || "Não faltou", obs:d.obs,
      escalada: d.resp ? (d.resp + " até " + d.prazo.toLowerCase()) : null
    }]);
    card.classList.add("saindo");
    var reduz = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(renderDiario, reduz ? 0 : 240);
  }

  function desfazer(id){
    var o = PORID[id];
    delete respostas[id];
    o.diario = o.diario.filter(function(x){ return x.data !== "2026-08-31"; });
    renderDiario();
  }

        '</div></div>';

    if(estadoTela === "sem-permissao"){
      alvo.innerHTML =
        '<div class="estado bloqueio"><div class="ico" aria-hidden="true">&#8722;</div><div class="corpo">' +
        '<h2>Esta tela é de quem é responsável pelas obras</h2>' +
        '<p>Você está entrando como analista. Quem responde o diário destas obras é o responsável por elas — hoje, o Yuri.</p>' +
        '<p>Se você precisa responder no lugar dele, peça ao administrador para incluir seu acesso. A base de obras continua aberta para consulta.</p>' +
        '<div class="acoes"><button type="button" class="btn ghost" data-tela="base">Ver a base de obras</button></div>' +
        '</div></div>';
      return;
    }

    if(estadoTela === "vazio"){
      var andaram = FILA.filter(function(o){ return o.etapa !== "paralisado"; }).length;
      alvo.innerHTML = barraHTML(0, FILA.length) +
                       sucessoHTML(FILA.length, andaram, FILA.length - andaram, 3);
      return;
    }

    /* estado normal */
    var pendentes = FILA.filter(function(o){ return !respostas[o.id]; });
    var feitas = FILA.filter(function(o){ return respostas[o.id]; });
    pendentes.sort(function(a,b){ return b.dias - a.dias; });

    if(!pendentes.length){
      var an = feitas.filter(function(o){ return respostas[o.id].andou === "Sim"; }).length;
      var esc2 = feitas.filter(function(o){ return respostas[o.id].resp; }).length;
      alvo.innerHTML = barraHTML(0, feitas.length) + sucessoHTML(feitas.length, an, feitas.length - an, esc2);
      return;
    }

    var html = barraHTML(pendentes.length, feitas.length);

    if(feitas.length){
      html += '<div class="feitas"><h2>Respondidas hoje</h2>' + feitas.map(function(o){
        var r = respostas[o.id];
        var resumo = r.andou === "Sim" ? "Andou hoje" : "Não andou · " + r.motivo;
        if(r.item && r.item !== "Não faltou") resumo += " · faltou " + r.item.toLowerCase();
        if(r.resp) resumo += " · escalada: " + r.resp + " até " + r.prazo.toLowerCase();
        return '<div class="feita"><span class="ck">&#10003;</span><span class="nm">' + esc(o.loja) + '</span>' +
               '<span class="rs">' + esc(resumo) + '</span>' +
               '<button class="btn ghost un" data-desfazer="' + o.id + '">Desfazer</button></div>';
      }).join("") + '</div>';

    Array.prototype.forEach.call(alvo.querySelectorAll(".obra"), atualizarCard);

    pcms.sort();
    document.getElementById("f-pcm").innerHTML = '<option value="todos">Todos</option>' +
      pcms.map(function(p){ return '<option value="' + p + '"' + (fPcm === p ? " selected" : "") + '>' + p + '</option>'; }).join("") +
      '<option value="__sem"' + (fPcm === "__sem" ? " selected" : "") + '>Ainda sem responsável</option>';
    document.getElementById("f-etapa").innerHTML = '<option value="todas">Todas</option>' +
      Object.keys(ETAPAS).map(function(k){
        return '<option value="' + k + '"' + (fEtapa === k ? " selected" : "") + '>' + ETAPAS[k].nome + '</option>';
      }).join("");
    document.getElementById("thead-row").innerHTML = COLS.map(function(c){
      return '<th scope="col"><button data-col="' + c.k + '">' + c.t + ' <span class="ar"></span></button></th>';
    }).join("");
  }

  function setVis(v){
    vis = v;
    document.getElementById("btn-tabela").setAttribute("aria-pressed", v === "tabela" ? "true" : "false");
    document.getElementById("btn-kanban").setAttribute("aria-pressed", v === "kanban" ? "true" : "false");
    document.getElementById("vis-tabela").hidden = v !== "tabela";
    document.getElementById("vis-kanban").hidden = v !== "kanban";
    renderBase();
  }

  function filtradas(){
    return OBRAS.filter(function(o){
      if(fPcm === "__sem"){ if(o.pcm) return false; }
      else if(fPcm !== "todos" && o.pcm !== fPcm) return false;
      if(fEtapa !== "todas" && o.etapa !== fEtapa) return false;
      return true;
    });
  }

  function renderBase(){
    var lista = filtradas();
    document.getElementById("conta").textContent = lista.length;
    var andamento = lista.filter(function(o){ return o.etapa === "andamento"; }).length;
    var paralisadas = lista.filter(function(o){ return o.etapa === "paralisado"; }).length;
    var velhas = lista.filter(function(o){ return o.etapa !== "finalizado" && o.dias >= 60; }).length;
    var estouradas = lista.filter(function(o){ return o.etapa !== "finalizado" && o.atraso != null && o.atraso > 0; }).length;
    var aDefinir = lista.filter(function(o){ return o.etapa === "definir"; });
    var maisVelha = aDefinir.reduce(function(m,o){ return Math.max(m, o.dias); }, 0);
    document.getElementById("resumo").innerHTML = [
      {v:aDefinir.length, k:aDefinir.length ? "aguardando definição · a mais antiga há " + maisVelha + " dias" : "aguardando definição", c:"var(--accent)"},
      {v:andamento, k:"em andamento", c:"var(--ok)"},
      {v:paralisadas, k:"paralisadas", c:"var(--crit)"},
      {v:velhas, k:"aprovadas há mais de 60 dias", c:"var(--warn)"},
      {v:estouradas, k:"passaram da duração planejada", c:"var(--warn)"}
    ].map(function(x){
      return '<div class="kpi" style="--kc:' + x.c + '"><div class="v">' + x.v + '</div><div class="k">' + x.k + '</div></div>';
    }).join("");
    if(vis === "tabela") renderTabela(lista); else renderKanban(lista);
  }

  function renderTabela(lista){
    var k = ordem.col, dir = ordem.dir;
    lista = lista.slice().sort(function(a,b){
      var x = a[k], y = b[k];
      if(x == null) x = dir > 0 ? Infinity : -Infinity;
      if(y == null) y = dir > 0 ? Infinity : -Infinity;
      if(typeof x === "string") return dir * x.localeCompare(y, "pt-BR");
      return dir * (x - y);
    });
    Array.prototype.forEach.call(document.querySelectorAll("#thead-row button"), function(b){
      b.querySelector(".ar").textContent = b.dataset.col === k ? (dir > 0 ? "▲" : "▼") : "";
    });
    document.getElementById("tbody").innerHTML = lista.map(function(o){
      var tr = '<tr' + (estourou(o) ? ' class="alerta"' : "") + '>';
      tr += '<td class="os">' + esc(o.os) + '</td>';
      tr += '<td class="loja"><button data-abrir="' + o.id + '">' + esc(o.loja) + '</button></td>';
      tr += '<td>' + esc(o.tipo) + '</td>';
      tr += '<td>' + (o.pcm ? esc(o.pcm) : '<span style="color:var(--accent)">a definir</span>') + '</td>';
      tr += '<td>' + esc(o.equipe) + '</td>';
      tr += '<td>' + pill(o) + '</td>';
      tr += '<td class="bloq">' + (o.bloqueio === "Sem bloqueio" || o.etapa === "finalizado"
              ? '<span style="color:var(--ink-faint)">—</span>'
              : esc(o.bloqueio) + (travado(o) ? ' <span class="d">' + o.bloqueadaDias + 'd</span>' : "")) + '</td>';
      tr += '<td class="n">' + badgeDias(o, true) + '</td>';
      tr += '<td class="n">' + (o.duracao != null ? o.duracao : '<span style="color:var(--ink-faint)">a definir</span>') + '</td>';
      tr += '<td>' + (o.avanco != null
              ? '<span class="av-bar"><i><b style="width:' + o.avanco + '%"></b></i><span>' + o.avanco + '%</span></span>'
              : '<span style="color:var(--ink-faint)">—</span>') + '</td>';
      tr += '<td class="n">' + br(o.atualizacao) + '</td>';
      tr += '</tr>';
      return tr;
    }).join("");
  }

  function renderKanban(lista){
    document.getElementById("kanban").innerHTML = ["levantamento","andamento","paralisado","finalizado"].map(function(k){
      var itens = lista.filter(function(o){ return o.etapa === k; }).sort(function(a,b){ return b.dias - a.dias; });
      var h = '<div class="col"><div class="col-h"><span class="nm" style="color:' + ETAPAS[k].cor + '">' +
              ETAPAS[k].nome + '</span><span class="ct">' + itens.length + '</span></div><div class="col-b">';
      h += itens.length ? itens.map(function(o){
        var c = '<button class="card" data-abrir="' + o.id + '" style="--sev:' + sev(o) + '">';
        c += '<div class="os">OS ' + esc(o.os) + '</div>';
        c += '<div class="nm">' + esc(o.loja) + '</div>';
        c += '<div class="ln"><span>' + esc(o.tipo) + '</span><span>' + rotuloResp(o) + '</span>' +
             (o.equipe ? '<span>' + esc(o.equipe) + '</span>' : "") + '</div>';
        c += '<div class="ft">' + badgeDias(o, true) + notaAlerta(o) + '</div>';
        c += '</button>';
        return c;
      }).join("") : '<div class="col-vazia">nenhuma obra</div>';
      return h + '</div></div>';
    }).join("");
  }

  /* ---------------------------------------------------------------
     TELA 3 — Ficha da obra
     --------------------------------------------------------------- */
  function renderFicha(){
    var o = PORID[obraAberta];
    if(o.etapa === "definir"){ renderTriagem(o); return; }
    var h = "";

    h += '<div class="page-head"><div>';
    h += '<h1>' + esc(o.loja) + '</h1>';
    h += '<p class="num">OS ' + esc(o.os) + ' · ' + esc(o.tipo) + ' · ' + moeda(o.valor) + '</p>';
    h += '</div><div style="display:flex;gap:8px;flex-wrap:wrap">' + pill(o) + badgeDias(o) + '</div></div>';

    if(estourou(o) && o.duracao){
      h += '<div class="alerta-box">';
      h +=   '<div><div class="n">' + o.dias + '</div><div class="lbl" style="text-align:center;margin-top:3px">dias em aberto</div></div>';
      h +=   '<div><h3>Obra aprovada em ' + br(o.aprovacao) + ' e ainda não concluída.</h3>' +
             '<p>A duração planejada é de <b>' + o.duracao + ' dias</b>. Estão contados <b>' + o.dias +
             ' dias</b> desde a aprovação — <b>' + Math.round(o.dias / o.duracao) + ' vezes</b> o prazo combinado. ' +
             'O cliente enxerga essa mesma OS aberta no sistema dele.</p></div>';
      h += '</div>';
    } else if(o.etapa !== "finalizado" && o.atraso != null && o.atraso > 0){
      h += '<div class="alerta-box" style="border-color:rgba(244,183,63,.45);background:var(--warn-soft);border-left-color:var(--warn)">';
      h +=   '<div><div class="n" style="color:var(--warn)">' + o.atraso + '</div><div class="lbl" style="text-align:center;margin-top:3px">dias além do prazo</div></div>';
      h +=   '<div><h3 style="color:var(--warn)">Passou da duração planejada.</h3>' +
             '<p>Início em <b>' + br(o.inicioReal || o.inicioPlan) + '</b> com <b>' + o.duracao +
             ' dias</b> de duração: deveria ter terminado em <b>' + br(o.fimCalc) + '</b>.</p></div>';
      h += '</div>';
    }

    h += '<div class="ficha-grid"><div>';

    h += '<div class="box"><div class="box-h">Identificação</div><div class="box-b"><dl class="dl">';
    h += '<dt>Nº OS</dt><dd class="num">' + esc(o.os) + '</dd>';
    h += '<dt>Loja</dt><dd>' + esc(o.loja) + '</dd>';
    h += '<dt>Chamado</dt><dd>' + esc(o.desc) + '</dd>';
    h += '<dt>Tipo</dt><dd>' + esc(o.tipo) + '</dd>';
    h += '<dt>Valor</dt><dd class="num">' + moeda(o.valor) + '</dd>';
    h += '<dt>Analista</dt><dd>' + esc(o.analista) + '</dd>';
    h += '<dt>Responsável da obra</dt><dd>' + (o.pcm ? esc(o.pcm) : '<span style="color:var(--accent)">a definir</span>') + '</dd>';
    h += '<dt>Equipe / prestador</dt><dd>' + esc(o.equipe) + '</dd>';
    h += '<dt>Origem</dt><dd>' + esc(o.origem) + '</dd>';
    h += '<dt>Bloqueio atual</dt><dd>' + (o.bloqueio === "Sem bloqueio"
            ? '<span style="color:var(--ink-faint)">sem bloqueio</span>'
            : '<span style="color:var(--crit);font-weight:600">' + esc(o.bloqueio) + '</span>' +
              (travado(o) ? ' <span class="num" style="color:var(--ink-dim)">há ' + o.bloqueadaDias + ' dias</span>' : "")) + '</dd>';
    h += '</dl></div></div>';

    h += '<div class="box"><div class="box-h">Cronograma</div><div class="box-b"><div class="crono">';
    h +=   '<div class="crono-c"><div class="k">Início planejado</div><div class="v">' + br(o.inicioPlan) + '</div></div>';
    h +=   '<div class="crono-c"><div class="k">Início real</div><div class="v">' + br(o.inicioReal) + '</div></div>';
    h +=   '<div class="crono-c destaque"><div class="k">Duração</div><div class="v">' +
             (o.duracao != null ? o.duracao + " dias" : "a definir") + '</div></div>';
    h +=   '<div class="crono-c calc"><div class="k">Final calculado</div><div class="v">' + br(o.fimCalc) + '</div></div>';
    h += '</div><p class="crono-nota">A obra é planejada por <b style="color:var(--ink)">duração</b>, não por data de entrega. ' +
         'O final é consequência do início mais os dias combinados e se recalcula sozinho a cada remarcação — ' +
         'ninguém precisa reescrever data final.</p></div></div>';

    h += '<div class="box"><div class="box-h">Remarcações <span class="num" style="color:var(--warn)">' + o.remarcacoes.length + '</span></div><div class="box-b">';
    if(o.remarcacoes.length){
      h += '<div class="remarc">' + o.remarcacoes.map(function(r){
        return '<div class="remarc-i"><span class="d">' + br(r.data) + '</span><div>' +
               '<div class="mv">início de <b>' + br(r.de) + '</b> para <b>' + br(r.para) + '</b></div>' +
               '<div class="mt">' + esc(r.motivo) + '</div></div></div>';
      }).join("") + '</div>';
    } else {
      h += '<p style="margin:0;color:var(--ink-faint);font-size:12.5px">Nenhuma remarcação registrada.</p>';
    }
    h += '</div></div>';

    h += '</div><div>';

    h += '<div class="box"><div class="box-h">Linha do tempo do diário</div><div class="box-b">';
    if(o.diario.length){
      h += '<div class="tl">' + o.diario.slice().reverse().map(function(e){
        var cor = e.andou ? "var(--ok)" : "var(--crit)";
        var t = '<div class="tl-i" style="--sev:' + cor + '">';
        t += '<div class="col-l">' + br(e.data).slice(0,5) + '</div>';
        t += '<div class="col-m"><i></i></div>';
        t += '<div class="col-r">';
        t += '<div class="tl-t ' + (e.andou ? "sim" : "nao") + '">' + (e.andou ? "Andou" : "Não andou") + '</div>';
        var sub = [];
        if(!e.andou && e.motivo) sub.push(e.motivo);
        if(e.item && e.item !== "Não faltou") sub.push("faltou " + e.item.toLowerCase());
        if(e.escalada) sub.push("escalada: " + e.escalada);
        if(sub.length) t += '<div class="tl-s">' + esc(sub.join(" · ")) + '</div>';
        if(e.obs) t += '<div class="tl-obs">' + esc(e.obs) + '</div>';
        return t + '</div></div>';
      }).join("") + '</div>';
    } else {
      h += '<p style="margin:0;color:var(--ink-faint);font-size:12.5px">Nenhum dia respondido ainda nesta obra. ' +
           'Hoje é assim em todas: a informação só existe na cabeça de quem está em campo.</p>';
    }
    if(o.gap){
      h += '<div class="tl-gap">' + o.gap.dias + ' dias sem nenhum registro' +
           '<span>De ' + br(o.gap.de) + ' (aprovação) até ' + br(o.gap.ate) +
           ' ninguém respondeu nada sobre esta obra. É exatamente esse buraco que o diário fecha.</span></div>';
    }
    h += '</div></div>';

    h += '<div class="box"><div class="box-h">Pendências e próxima ação</div><div class="box-b"><dl class="dl">';
    h += '<dt>Pendência</dt><dd>' + (o.pendencia ? esc(o.pendencia) : '<span style="color:var(--ink-faint)">nenhuma</span>') + '</dd>';
    h += '<dt>Responsável</dt><dd>' + (o.pendResp ? esc(o.pendResp) : "—") + '</dd>';
    h += '<dt>Prazo</dt><dd class="num">' + br(o.pendPrazo) + '</dd>';
    h += '<dt>Próxima ação</dt><dd>' + (o.proxAcao ? esc(o.proxAcao) : "—") + '</dd>';
    h += '<dt>Última atualização</dt><dd class="num">' + br(o.atualizacao) + '</dd>';
    h += '</dl></div></div>';

    h += '<div class="box"><div class="box-h">Vindo do Field</div><div class="box-b">';
    h += '<div class="placeholder"><b>Relatório fotográfico</b> — as fotos que o técnico tira em campo entram aqui quando a OS é preenchida no Field.</div>';
    h += '<div class="placeholder"><b>Fechamento da OS</b> — data de fechamento, status no sistema do cliente e liberação para faturamento.</div>';
    h += '</div></div>';

    h += '</div></div>';

    document.getElementById("ficha").innerHTML = h;
  }

  /* ---------------------------------------------------------------
     TELA 3-B — Triagem da obra que acabou de chegar do Field
     --------------------------------------------------------------- */
  function opcoes(lista, valor, vazio){
    return '<option value="">' + vazio + '</option>' +
      lista.map(function(v){
        return '<option value="' + esc(v) + '"' + (valor === v ? " selected" : "") + '>' + esc(v) + '</option>';
      }).join("");
  }

  function renderTriagem(o){
    var t = tri(o), faltam = faltamTri(o), h = "";

    h += '<div class="page-head"><div>';
    h += '<h1>' + esc(o.loja) + '</h1>';
    h += '<p class="num">OS ' + esc(o.os) + ' · ' + esc(o.tipo) + ' · ' + moeda(o.valor) + '</p>';
    h += '</div><div style="display:flex;gap:8px;flex-wrap:wrap">' + pill(o) + badgeDias(o) + '</div></div>';

    h += '<div class="triagem-aviso">';
    h +=   '<div style="flex:1 1 300px"><h3>Obra nova, ainda sem responsável</h3>' +
           '<p>Ela entrou pelo Field em <b>' + br(o.aprovacao) + '</b> e está esperando há <b>' + o.dias +
           ' dias</b>. Só entra no diário do dia quando estes cinco campos estiverem preenchidos — ' +
           'é o checklist antes de começar a obra.</p></div>';
    h +=   '<span class="cont">' + (CAMPOS_TRI.length - faltam) + ' de ' + CAMPOS_TRI.length + ' preenchidos</span>';
    h += '</div>';

    h += '<div class="ficha-grid"><div>';

    h += '<div class="box"><div class="box-h">O que veio do Field</div><div class="box-b"><dl class="dl">';
    h += '<dt>Nº OS</dt><dd class="num">' + esc(o.os) + '</dd>';
    h += '<dt>Loja</dt><dd>' + esc(o.loja) + '</dd>';
    h += '<dt>Chamado</dt><dd>' + esc(o.desc) + '</dd>';
    h += '<dt>Tipo</dt><dd>' + esc(o.tipo) + '</dd>';
    h += '<dt>Valor</dt><dd class="num">' + (o.valor == null
            ? '<span style="color:var(--accent)">ainda sem orçamento</span>' : moeda(o.valor)) + '</dd>';
    h += '<dt>Analista</dt><dd>' + esc(o.analista) + '</dd>';
    h += '<dt>Origem</dt><dd>' + esc(o.origem) + '</dd>';
    h += '<dt>Aprovada em</dt><dd class="num">' + br(o.aprovacao) + '</dd>';
    h += '</dl></div></div>';

    h += '<div class="box"><div class="box-h">Como esta obra apareceu aqui</div><div class="box-b">';
    h += '<p style="margin:0 0 8px;font-size:12.5px;color:var(--ink-dim)">A obra é aprovada pelo cliente, alguém abre a OS no Field ' +
         'e o sistema traz a linha para a base sozinho — com o que o Field tem, que é pouco.</p>';
    h += '<div class="placeholder"><b>O Field não manda</b> responsável, equipe, prioridade nem cronograma. ' +
         'Por isso a obra para aqui antes de virar rotina de diário.</div>';
    h += '</div></div>';

    h += '</div><div>';

    h += '<div class="box"><div class="box-h">O que falta definir</div><div class="box-b">';

    h += '<div class="campo' + (t.resp ? " ok" : "") + '"><span class="rot"><span class="mk">' +
         (t.resp ? "&#10003;" : "1") + '</span><span>Responsável da obra</span></span>' +
         '<select data-tri="resp" aria-label="Responsável da obra">' + opcoes(RESPONSAVEIS_OBRA, t.resp, "— escolher —") + '</select></div>';

    h += '<div class="campo' + (t.equipe ? " ok" : "") + '"><span class="rot"><span class="mk">' +
         (t.equipe ? "&#10003;" : "2") + '</span><span>Equipe / prestador</span></span>' +
         '<select data-tri="equipe" aria-label="Equipe ou prestador">' + opcoes(EQUIPES, t.equipe, "— escolher —") + '</select></div>';

    h += '<div class="campo' + (t.prioridade ? " ok" : "") + '"><span class="rot"><span class="mk">' +
         (t.prioridade ? "&#10003;" : "3") + '</span><span>Prioridade</span></span>' +
         '<select data-tri="prioridade" aria-label="Prioridade">' + opcoes(["Normal","Urgente"], t.prioridade, "— escolher —") + '</select></div>';

    h += '<div class="campo' + (t.inicio ? " ok" : "") + '"><span class="rot"><span class="mk">' +
         (t.inicio ? "&#10003;" : "4") + '</span><span>Data de início</span></span>' +
         '<input type="date" data-tri="inicio" aria-label="Data de início" value="' + esc(t.inicio) + '">' +
         '<span class="dica">quando a equipe entra na loja</span></div>';

    h += '<div class="campo' + (t.duracao ? " ok" : "") + '"><span class="rot"><span class="mk">' +
         (t.duracao ? "&#10003;" : "5") + '</span><span>Duração em dias</span></span>' +
         '<input type="number" min="1" max="180" data-tri="duracao" aria-label="Duração em dias" value="' + esc(t.duracao) + '">' +
         '<span class="dica">a data final o sistema calcula</span></div>';

    h += '<div class="liberar"><button type="button" class="btn" id="btn-liberar"' + (faltam ? " disabled" : "") + '>' +
         'Liberar para o diário do dia</button>';
    h += '<span class="hint">' + textoFaltam(faltam) + '</span>';
    h += '</div>';

    h += '</div></div>';
    h += '</div></div>';

    h += '<div class="decisao"><span class="tag">DECISÃO D</span><div>';
    h += '<p>A obra chega do Field crua, sem responsável. <b>Quem completa esses cinco campos?</b></p>';
    h += '<p class="opt"><em>O que está na tela:</em> <b>fila aberta, sem dono fixo.</b> A obra nova cai numa fila que todo mundo vê ' +
         '(o aviso no alto do diário do dia e a primeira coluna da base), e quem abrir primeiro completa. ' +
         'O sistema cobra a fila, não uma pessoa: mostra quantas estão esperando e há quantos dias.</p>';
    h += '<p class="opt"><em>Alternativa 1:</em> <b>uma pessoa do escritório tria tudo que chega</b>, todo dia, como primeira tarefa. ' +
         'Nada fica parado por falta de dono, mas tudo depende dessa pessoa estar lá.</p>';
    h += '<p class="opt"><em>Alternativa 2:</em> <b>você ou o Eduardo distribuem caso a caso</b> e o responsável escolhido completa o resto. ' +
         'Mantém com a diretoria a decisão de quem pega qual obra, mas põe mais um passo antes de a obra andar.</p>';
    h += '</div></div>';
    h += fbHTML(SECOES_FB[6]);

    document.getElementById("ficha").innerHTML = h;
  }

  function textoFaltam(faltam){
    return faltam
      ? "Faltam " + faltam + (faltam === 1 ? " campo" : " campos") + ". Enquanto isso a obra não aparece para ninguém responder."
      : "Pronta. Ao liberar, ela entra na base como Levantamento e passa a ser cobrada todo dia.";
  }

  function atualizarTriagem(){
    var o = PORID[obraAberta];
    if(!o || o.etapa !== "definir") return;
    var t = tri(o), faltam = faltamTri(o);
    var campos = document.querySelectorAll("#ficha .campo");
    CAMPOS_TRI.forEach(function(c, i){
      var el = campos[i];
      if(!el) return;
      var cheio = !!t[c.k];
      el.classList.toggle("ok", cheio);
      el.querySelector(".mk").innerHTML = cheio ? "&#10003;" : String(i + 1);
    });
    var cont = document.querySelector("#ficha .triagem-aviso .cont");
    if(cont) cont.textContent = (CAMPOS_TRI.length - faltam) + " de " + CAMPOS_TRI.length + " preenchidos";
    var btn = document.getElementById("btn-liberar");
    if(btn){
      btn.disabled = faltam > 0;
      var hint = btn.parentNode.querySelector(".hint");
      if(hint) hint.textContent = textoFaltam(faltam);
    }
  }

  function liberarObra(o){
    if(!o || o.etapa !== "definir" || faltamTri(o)) return;
    var t = tri(o);
    o.pcm = t.resp;
    o.equipe = t.equipe;
    o.prioridade = t.prioridade;
    o.inicioPlan = t.inicio;
    o.duracao = parseInt(t.duracao, 10);
    o.etapa = "levantamento";
    o.atualizacao = "2026-08-31";
    o.pendencia = "Finalizar levantamento, confirmar material e programar a equipe";
    o.pendResp = t.resp;
    o.proxAcao = "Concluir levantamento";
    o.fimCalc = somaDias(o.inicioPlan, o.duracao);
    o.atraso = diasDesde(o.fimCalc);
    FILA = OBRAS.filter(function(x){ return x.pcm === "YURI" && x.etapa !== "finalizado"; });
    renderDiario();
    montarFiltros();
    irPara("base");
  }

  /* ---------------------------------------------------------------
     Eventos (delegados no #app, que é sempre reconstruído por JS)
     --------------------------------------------------------------- */
  var app = document.getElementById("app");

  app.addEventListener("click", function(e){
    var t;

    t = e.target.closest("[data-retry]");
    if(t){ estadoTela = "normal"; var sel = document.getElementById("sel-estado"); if(sel) sel.value = "normal"; renderDiario(); return; }

    t = e.target.closest("[data-ir-definir]");
    if(t){ fPcm = "todos"; fEtapa = "definir"; montarFiltros(); irPara("base"); return; }

    if(e.target.closest("#btn-liberar")){ liberarObra(PORID[obraAberta]); return; }

    t = e.target.closest("[data-tela]");
    if(t){ irPara(t.dataset.tela); return; }

    t = e.target.closest("[data-abrir]");
    if(t){ abrirFicha(t.dataset.abrir, tela === "diario" ? "diario" : "base"); return; }

    if(e.target.closest("#voltar")){ irPara(voltarPara); return; }
    if(e.target.closest("#btn-tabela")){ setVis("tabela"); return; }
    if(e.target.closest("#btn-kanban")){ setVis("kanban"); return; }

    t = e.target.closest("#thead-row button[data-col]");
    if(t){
      var k = t.dataset.col;
      if(ordem.col === k) ordem.dir = -ordem.dir; else { ordem.col = k; ordem.dir = 1; }
      renderBase();
      return;
    }

    t = e.target.closest("[data-desfazer]");
    if(t){ desfazer(t.dataset.desfazer); return; }

    var card = e.target.closest(".obra");
    if(!card) return;
    var o = PORID[card.dataset.id], d = rascunho[o.id];

    var chip = e.target.closest(".chip");
    if(chip){
      var g = chip.dataset.grupo, v = chip.dataset.valor;
      d[g] = (d[g] === v) ? null : v;
      if(g === "andou"){
        /* "Sim" zera bloqueio e escalada; sem isso a tela pediria "quem resolve"
           para uma obra que andou. */
        if(d.andou !== "Não"){ d.motivo = null; d.resp = null; d.prazo = null; }
      }
      ["andou","item","motivo","resp","prazo"].forEach(function(grupo){
        Array.prototype.forEach.call(card.querySelectorAll('.chip[data-grupo="' + grupo + '"]'), function(c){
          c.setAttribute("aria-pressed", c.dataset.valor === d[grupo] ? "true" : "false");
        });
      });
      atualizarCard(card);
      return;
    }

    if(e.target.closest(".obs-btn")){
      d.obsAberta = true;
      card.querySelector(".obs-btn").hidden = true;
      var inp = card.querySelector(".obs-in");
      inp.hidden = false;
      inp.focus();
      return;
    }

    if(e.target.closest(".salvar")) salvar(o, card);
  });

  app.addEventListener("change", function(e){
    if(e.target.id === "sel-estado"){ estadoTela = e.target.value; renderDiario(); return; }
    if(e.target.dataset && e.target.dataset.tri){
      tri(PORID[obraAberta])[e.target.dataset.tri] = e.target.value;
      atualizarTriagem();
      return;
    }
    if(e.target.id === "f-pcm"){ fPcm = e.target.value; renderBase(); return; }
    if(e.target.id === "f-etapa"){ fEtapa = e.target.value; renderBase(); return; }
    if(e.target.dataset && e.target.dataset.fbVoto){
      var id = e.target.dataset.fbVoto;
      fbDe(id).voto = e.target.value;
      agendarPublicacao(id);
      return;
    }
  });

  app.addEventListener("input", function(e){
    if(e.target.classList && e.target.classList.contains("obs-in")){
      var card = e.target.closest(".obra");
      if(card) rascunho[card.dataset.id].obs = e.target.value;
    }
  });

  app.addEventListener("focusout", function(e){
    var el = e.target;
    if(el && el.dataset && el.dataset.fbTexto){
      var id = el.dataset.fbTexto;
      var texto = (el.innerText || "").trim();
      if(texto !== (fbDe(id).texto || "")){
        fbDe(id).texto = texto;
        agendarPublicacao(id);
      }
    }
  });

  /* ---------------------------------------------------------------
     Início
     --------------------------------------------------------------- */
  app.innerHTML = shellHTML();
  montarFiltros();
  renderDiario();
  setVis("tabela");
  irPara("diario");

  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(ns){
      if(!ns) return;               // sem capability: a página segue sem os campos
      artefato = ns;
      mostrarCamposFb();
    }, function(){ /* indisponível: segue sem os campos */ });
  }
})();
</script>
