    atualizarContadorTarefas();
    window.scrollTo(0, 0);
  }

  /* O número na aba é o que faz alguém clicar nela: sem ele, a tarefa aberta
     fica num lugar que ninguém abre. Some quando não há nada em aberto. */
  function atualizarContadorTarefas(){
    var el = document.getElementById("tab-tarefas-n");
    if(!el) return;
    var n = tarefasAbertas().length;
    el.textContent = n ? String(n) : "";
    el.hidden = !n;
    el.className = "num" + (tarefasVencidas().length ? " venc" : "");
  }

  /* Trocar quem está olhando é um controle de demonstração: o mesmo sistema
     visto pelo analista, que responde, e pelo administrador, que recebe o
     aviso das 19h. O Painel do dia só existe para o administrador. */
  function setPapel(p){
    papel = p;
    var info = PAPEIS[0];
    PAPEIS.forEach(function(x){ if(x.k === p) info = x; });
    var av  = document.getElementById("quem-av");
    var tab = document.getElementById("tab-adm");
    var sel = document.getElementById("sel-quem");
    if(av)  av.textContent = info.ini;
    if(tab) tab.hidden = p !== "admin";
    if(sel) sel.value = p;
    irPara(p === "admin" ? "adm" : "diario");
  }
  var ROTULO_VOLTAR = {diario:"o diário do dia", tarefas:"as tarefas", base:"a base de obras", adm:"o painel do dia"};
  function abrirFicha(id, origem){
    obraAberta = id;
    voltarPara = origem || "base";
    var b = document.getElementById("voltar");
    if(b) b.innerHTML = "&#8592; Voltar para " + (ROTULO_VOLTAR[voltarPara] || "a base de obras");
    irPara("ficha");
  }

  /* ---------------------------------------------------------------
     TELA 1 — Diário do dia
     --------------------------------------------------------------- */
  function chipsHTML(grupo, lista, valorAtual, cores){
    return lista.map(function(v){
      var cls = "chip";
      if(cores) cls += v === "Sim" ? " sim" : v === "Não" ? " nao" : "";
      return '<button type="button" class="' + cls + '" data-grupo="' + grupo + '" data-valor="' + esc(v) + '"' +
             ' aria-pressed="' + (valorAtual === v ? "true" : "false") + '">' + esc(v) + '</button>';
    }).join("");
  }

  function rasc(o){
    return rascunho[o.id] || (rascunho[o.id] = {andou:null, item:null, motivo:null, obs:"", obsAberta:false, foto:false});
  }

  /* DECISÃO C — o contador aparece, mas não trava nada. Ele existe para o
     número não sumir da vista de quem responde; a cobrança fica com o
     dashboard e com o agente. */
  function contadorHTML(o){
    var partes = [];
    if(o.naoAndouSeguidos >= 2) partes.push('<span><b>' + o.naoAndouSeguidos + '</b> dias seguidos sem andar</span>');
    if(travado(o)) partes.push('<span><b>' + o.bloqueadaDias + '</b> dias no mesmo bloqueio · ' + esc(o.bloqueio) + '</span>');
    if(!partes.length) return "";
    return '<div class="contador">' + partes.join("") +
           '<span class="obs">Registre e siga: o contador continua correndo até a obra andar.</span></div>';
  }

  function cardHTML(o){
    var d = rasc(o);
    var h = "";
    h += '<article class="obra" data-id="' + o.id + '" style="--sev:' + sev(o) + '">';
    h +=   '<div class="obra-head">';
    h +=     '<div class="obra-id">';
    h +=       '<div class="obra-os">OS ' + esc(o.os) + ' · ' + esc(o.tipo) + '</div>';
    h +=       '<button class="obra-loja" data-abrir="' + o.id + '">' + esc(o.loja) + '</button>';
    h +=       '<p class="obra-desc">' + esc(o.desc) + '</p>';
    h +=       '<div class="meta"><span>Equipe <b>' + esc(o.equipe) + '</b></span>' +
                 '<span>Analista <b>' + esc(o.analista) + '</b></span>' +
                 '<span>Prazo <b class="num">' + prazoTxt(o) + '</b></span>' + '</div>';
    h +=     '</div>';
    h +=     '<div class="obra-sinais"><div class="sinal-linha">' + pill(o) + badgeDias(o) + '</div>' +
               notaAlerta(o) + '</div>';
    h +=   '</div>';
    if(o.pendencia){
      h += '<div class="pend"><b>Pendência:</b> ' + esc(o.pendencia) +
           (o.pendResp ? ' · responsável <b>' + esc(o.pendResp) + '</b>' : "") + '</div>';
    }
    h +=   contadorHTML(o);
    h +=   '<div class="perguntas">';
    h +=     '<div class="q"><span class="lbl">Andou hoje?</span><div class="chips">' +
               chipsHTML("andou", ["Sim","Não"], d.andou, true) + '</div></div>';
    h +=     '<div class="q"><span class="lbl">Faltou algum item?</span><div class="chips">' +
               chipsHTML("item", ITENS, d.item) + '</div></div>';
    h +=     '<div class="q q-motivo" hidden><span class="lbl">Por que não andou?</span><div class="chips">' +
               chipsHTML("motivo", BLOQUEIOS, d.motivo) + '</div></div>';
    h +=     '<div class="obs-linha"><button type="button" class="obs-btn">+ observação</button>' +
               /* A foto entra junto com a evolução do dia, no mesmo gesto de
                  responder. Só obra em campo tem o que fotografar. */
               (pedeFoto(o) ? '<button type="button" class="obs-btn foto" aria-pressed="' +
                 (d.foto ? "true" : "false") + '">' +
                 (d.foto ? "✓ foto do dia anexada" : "+ anexar foto do dia") + '</button>' : "") +
               '<input class="obs-in" type="text" maxlength="120" placeholder="Uma linha, se quiser" hidden value=""></div>';
    h +=     '<div class="acoes"><button type="button" class="btn salvar" disabled>Salvar e sair da fila</button>' +
               '<span class="hint"></span></div>';
    h +=   '</div>';
    h += '</article>';
    return h;
  }

  /* Uma única regra barra o salvamento, e é a que o cliente pediu: "não
     andou" tem que vir com motivo. Nada mais trava. */
  function validar(o, d){
    if(!d.andou) return "Responda se a obra andou hoje.";
    if(d.andou === "Não" && !d.motivo) return "Diga por que não andou.";
    return null;
  }

  /* O texto ao lado do botão descreve SEMPRE o que o botão vai fazer de
     verdade. Enquanto falta resposta, diz o que falta; quando está pronto,
     diz o que acontece ao salvar. */
  function textoAcao(o, d){
    /* Quando faltou alguma coisa, o texto diz para quem a tarefa vai antes de
       ela ir — quem responde não é surpreendido por uma cobrança que ele
       disparou sem saber. Uma frase a mais, nunca duas. */
    var rota = d.item && d.item !== "Não faltou" ? destinoDe(d.item) : null;
    var extra = rota ? " Abre tarefa para " + pessoaDe(rota.chave).area + " · " +
                       pessoaDe(rota.chave).nome.split(" ")[0] + "." : "";
    if(d.andou === "Sim") return "Ao salvar: a obra sai da fila e hoje (" + DIA_REF_CURTO +
                                 ") entra na ficha dela como dia que andou." + extra;
    if(d.andou === "Não") return "Ao salvar: a obra sai da fila e hoje (" + DIA_REF_CURTO +
                                 ") entra na ficha dela como dia parado por " + String(d.motivo).toLowerCase() + "." + extra;
    return "";
  }

  function atualizarCard(card){
    var o = PORID[card.dataset.id], d = rascunho[o.id];
    card.querySelector(".q-motivo").hidden = d.andou !== "Não";

    var erro = validar(o, d);
    var btn = card.querySelector(".salvar");
    var hint = card.querySelector(".hint");
    btn.disabled = !!erro;
    hint.textContent = erro || textoAcao(o, d);
    hint.className = "hint" + (erro && d.andou ? " alerta" : "");
  }

  function gravar(o){
    var d = rasc(o);
    if(validar(o, d)) return false;
    var item = d.item || "Não faltou";
    respostas[o.id] = {andou:d.andou, item:item, motivo:d.motivo, obs:d.obs,
                       semFoto: pedeFoto(o) && !d.foto};
    o.diario = o.diario.concat([{
      data:DIA_REF, andou:d.andou === "Sim", motivo:d.motivo,
      item:item, obs:d.obs, foto: pedeFoto(o) && !!d.foto
    }]);
    /* AQUI a falta deixa de terminar em registro. Salvou "faltou alguma
       coisa", nasce a tarefa, com dono e prazo, e o agente cobra a pessoa.
       Ninguém digitou tarefa nenhuma: o analista respondeu só o que ele sabe. */
    if(item !== "Não faltou") abrirTarefa(o, item, d.obs);
    /* A obra pode ter andado e a foto não ter vindo. São duas faltas
       diferentes, e a segunda também vira tarefa — com dono e prazo, na mesma
       mecânica. Sem isso, a tela prometeria uma cobrança que não acontece. */
    if(pedeFoto(o) && !d.foto) abrirTarefa(o, "Foto", "");
    return true;
  }

  /* A tarefa que a falta gerou. O dono sai da tabela de roteamento, o prazo é
     o padrão ("até o fim do dia"), e a mensagem é montada com as cinco partes
     que você descreveu. */
  function abrirTarefa(o, item, obs){
    var rota = destinoDe(item);
    if(!rota) return null;
    var dono = rota.chave === "__EQUIPE__" ? chaveDaEquipe(o) : rota.chave;
    var nova = {
      id:"tn-" + o.id + "-" + item.replace(/[^A-Za-zÀ-ú]/g, "").slice(0, 6).toLowerCase(),
      obra:o.id, item:item, dono:dono,
      aberta:DIA_REF, horaAberta:HORA_AVISO, prazo:prazoPadrao(DIA_REF, HORA_AVISO),
      registrou:"YURI", situacao:"aberta", obs:obs || "", esperando:true, nova:true,
      pe:'Saiu no <b>instante em que você salvou o diário</b>, não às 19h — e foi para o WhatsApp ' +
         'da pessoa, não para uma caixa de entrada que ela precisa aprender a abrir.'
    };
    nova.msgs = [{de:"agente", hora:HORA_AVISO, dia:"hoje", texto:mensagemNova(nova)}];
    TAREFAS.push(nova);
    indexarTarefas();
    respostas[o.id].tarefa = respostas[o.id].tarefa || nova.id;
    respostas[o.id].tarefas = (respostas[o.id].tarefas || []).concat([nova.id]);
    atualizarContadorTarefas();
    return nova;
  }

  /* O retorno de UMA LINHA no diário. O diário é a tela que sustenta o hábito
     das 18h: ela não pode virar burocracia por causa da tarefa. */
  function abriuHTML(idTarefa){
    var t = TAR_POR_ID[idTarefa];
    if(!t) return "";
    var p = pessoaDe(t.dono);
    return '<div class="abriu"><span class="ck">&#10003;</span><span>Tarefa aberta para <b>' +
      esc(p.area) + ' · ' + esc(p.nome.split(" ")[0]) + '</b> — será cobrada no WhatsApp ' +
      (t.prazo === t.aberta ? "até o fim do dia" : "até o fim do dia " + br(t.prazo).slice(0,5)) + '.</span></div>';
  }

  function salvar(o, card){
    if(!gravar(o)) return;
    card.classList.add("saindo");
    var reduz = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(renderDiario, reduz ? 0 : 240);
  }

  function desfazer(id){
    var o = PORID[id];
    delete respostas[id];
    o.diario = o.diario.filter(function(x){ return x.data !== DIA_REF; });
    /* Desfazer a resposta desfaz a tarefa que ela abriu. Tarefa órfã de uma
       falta que não existe mais é pior que tarefa nenhuma. */
    TAREFAS = TAREFAS.filter(function(t){ return !(t.nova && t.obra === id); });
    indexarTarefas();
    atualizarContadorTarefas();
    renderDiario();
  }

  function barraHTML(pendentes, feitas){
    var h = '<div class="fila-status">';
    h += '<span class="big num" style="' + (pendentes ? "" : "color:var(--ok)") + '">' + pendentes + '</span>';
    h += '<span class="fila-txt">' + (pendentes === 1 ? "obra para responder hoje" : "obras para responder hoje") + '</span>';
    h += '<span class="barra" aria-hidden="true"><i style="width:' + (feitas / FILA.length * 100) + '%' +
         (pendentes ? "" : ";background:var(--ok)") + '"></i></span>';
    h += '<span class="fila-txt num">' + feitas + ' de ' + FILA.length + ' respondidas</span>';
    h += '</div>';
    return h;
  }

  function feitasHTML(feitas){
    if(!feitas.length) return "";
    return '<div class="feitas"><h2>Já respondidas</h2>' + feitas.map(function(o){
      var r = respostas[o.id];
      var resumo = r.andou === "Sim" ? "Andou hoje" : "Não andou hoje · " + r.motivo;
      if(r.item && r.item !== "Não faltou") resumo += " · faltou " + r.item.toLowerCase();
      if(r.semFoto) resumo += " · sem foto";
      var abriu = (r.tarefas || (r.tarefa ? [r.tarefa] : [])).map(abriuHTML).join("");
      return '<div class="feita"><span class="ck">&#10003;</span><span class="nm">' + esc(o.loja) + '</span>' +
             '<span class="rs">' + esc(resumo) + '</span>' +
             '<button class="btn ghost un" data-desfazer="' + o.id + '">Desfazer</button>' +
             abriu + '</div>';
    }).join("") + '</div>';
  }

  function sucessoHTML(total, andaram, naoAndaram, paradasSeguidas){
    var h = '<div class="sucesso">';
    h += '<div class="mark" aria-hidden="true">&#10003;</div>';
    h += '<h2>Diário de hoje fechado</h2>';
    h += '<p>As ' + total + ' obras foram respondidas. A base de obras já está atualizada e ' +
         'quem precisa cobrar alguma coisa hoje sabe o que é.</p>';
    h += '<div class="placar"><span><b>' + andaram + '</b> andaram</span>' +
         '<span><b>' + naoAndaram + '</b> não andaram</span>' +
         '<span><b>' + paradasSeguidas + '</b> paradas há 3 dias ou mais</span></div>';
    h += '</div>';
    return h;
  }

  function renderAvisoDef(){
    var el = document.getElementById("aviso-def");
    if(!el) return;
    var lista = OBRAS.filter(function(o){ return o.etapa === "definir"; });
    var escondido = !lista.length || estadoTela === "carregando" || estadoTela === "erro" || estadoTela === "sem-permissao";
    if(escondido){ el.innerHTML = ""; return; }
    var velha = lista.reduce(function(m,o){ return Math.max(m, o.dias); }, 0);
    el.innerHTML = '<button type="button" class="aviso-def" data-ir-definir="1">' +
      '<span class="n">' + lista.length + '</span>' +
      '<span class="txt"><b>Antes das obras do dia: ' + (lista.length === 1
        ? "1 obra chegou do Field e espera você definir."
        : lista.length + " obras chegaram do Field e esperam você definir.") +
      '</b> Definir a obra que chega é tarefa do analista de obras. ' +
      'A mais antiga espera há <b>' + velha +
      ' dias</b>, e ' + (lista.length === 1 ? "ela não entra" : "nenhuma delas entra") +
      ' no diário enquanto ficar assim.</span>' +
      '<span class="ir">Definir agora &#8594;</span></button>';
  }

  var FORMA_EXPL = {
    cartoes:  "Uma obra por vez: responde, salva, ela sai da fila. Dá para parar no meio.",
    planilha: "Todas as obras na mesma tela, uma por linha. Responde na linha e salva tudo no fim."
  };

  function setForma(f){
    formaDiario = f;
    var b1 = document.getElementById("btn-cartoes"), b2 = document.getElementById("btn-planilha");
    if(b1) b1.setAttribute("aria-pressed", f === "cartoes" ? "true" : "false");
    if(b2) b2.setAttribute("aria-pressed", f === "planilha" ? "true" : "false");
    var ex = document.getElementById("forma-expl");
    if(ex) ex.textContent = FORMA_EXPL[f];
    renderDiario();
  }

  function renderDiario(){
    var alvo = document.getElementById("diario-corpo");
    if(!alvo) return;
    renderAvisoDef();

    var barra = document.querySelector(".forma-barra");
    if(barra) barra.hidden = estadoTela !== "normal";

    if(estadoTela === "carregando"){
      var s = '<p class="carregando-txt">Buscando suas obras em aberto…</p>';
      for(var i = 0; i < 3; i++){
        s += '<div class="sk"><i class="a sk-pulso"></i><i class="b sk-pulso"></i><i class="c sk-pulso"></i><i class="d sk-pulso"></i></div>';
      }
      alvo.innerHTML = s;
      return;
    }

    if(estadoTela === "erro"){
      alvo.innerHTML =
        '<div class="estado erro"><div class="ico" aria-hidden="true">!</div><div class="corpo">' +
        '<h2>Não deu para carregar o diário de hoje</h2>' +
        '<p>A lista de obras não chegou. <b>Nada do que você já respondeu foi perdido</b> — o que estava salvo continua salvo.</p>' +
        '<p>Tente de novo. Se continuar assim por mais de alguns minutos, avise o suporte da Manfac e responda hoje pelo WhatsApp.</p>' +
        '<div class="acoes"><button type="button" class="btn" data-retry="1">Tentar de novo</button></div>' +
        '</div></div>';
      return;
    }

    if(estadoTela === "sem-permissao"){
      alvo.innerHTML =
        '<div class="estado bloqueio"><div class="ico" aria-hidden="true">&#8722;</div><div class="corpo">' +
        '<h2>Esta tela é de quem é responsável pelas obras</h2>' +
        '<p>Seu acesso não inclui o diário destas obras. Quem responde é o analista responsável por elas — hoje, o Yuri.</p>' +
        '<p>Se você precisa responder no lugar dele, peça ao administrador para incluir seu acesso. A base de obras continua aberta para consulta.</p>' +
        '<div class="acoes"><button type="button" class="btn ghost" data-tela="base">Ver a base de obras</button></div>' +
        '</div></div>';
      return;
    }

    /* 19h — o registro não aconteceu e o aviso já subiu. Tom de fato
       consumado, não de punição: a tela conta o que já é verdade e o caminho
       para responder continua aberto, porque a DECISÃO C não trava nada. */
    if(estadoTela === "atraso"){
      var semResposta = FILA.filter(function(o){ return !respostas[o.id]; }).length;
      alvo.innerHTML =
        '<div class="estado atraso"><div class="ico" aria-hidden="true">!</div><div class="corpo">' +
        '<h2>Passou das 19h e o diário de hoje não foi preenchido</h2>' +
        '<p>O aviso das 18h chegou e <b>' + semResposta + ' obras</b> continuam sem resposta. ' +
        'Uma hora depois, o sistema avisou os administradores do hub — com o seu nome. Já foi enviado:</p>' +
        '<div class="push">' +
          '<div class="de"><span class="hora">' + HORA_ESCALADA + '</span>' +
          '<span>aviso automático do hub</span></div>' +
          '<p class="tx"><b>Yuri Nascimento</b> não preencheu o diário de hoje, ' + DIA_REF_CURTO + '. ' +
          '<b>' + semResposta + ' obras</b> ficaram sem registro.</p>' +
          '<p class="pra">Para José Guilherme e Eduardo · administradores do hub</p>' +
        '</div>' +
        '<p style="margin-top:14px">Continua dando para responder: nada foi travado e o registro entra com a data de hoje. ' +
        'Assim que você salvar, o Painel do dia da diretoria muda junto.</p>' +
        '<div class="acoes"><button type="button" class="btn" data-retry="1">Responder agora</button></div>' +
        '</div></div>';
      return;
    }

    if(estadoTela === "vazio"){
      var andaram = FILA.filter(function(o){ return o.etapa !== "paralisado"; }).length;
      var travadas = FILA.filter(function(o){ return o.naoAndouSeguidos >= 3; }).length;
      alvo.innerHTML = barraHTML(0, FILA.length) +
                       sucessoHTML(FILA.length, andaram, FILA.length - andaram, travadas);
      return;
    }

    /* estado normal */
    var pendentes = FILA.filter(function(o){ return !respostas[o.id]; });
    var feitas = FILA.filter(function(o){ return respostas[o.id]; });
    pendentes.sort(function(a,b){ return b.dias - a.dias; });

    /* Fila zerada de verdade: a conquista aparece, mas a lista do que foi
       respondido continua embaixo — errar a última obra não pode deixar o
       Yuri sem como desfazer. */
    if(!pendentes.length){
      var an = feitas.filter(function(o){ return respostas[o.id].andou === "Sim"; }).length;
      var tr3 = feitas.filter(function(o){ return o.naoAndouSeguidos >= 3; }).length;
      alvo.innerHTML = barraHTML(0, feitas.length) +
                       sucessoHTML(feitas.length, an, feitas.length - an, tr3) +
                       feitasHTML(feitas);
      return;
    }

    var html = barraHTML(pendentes.length, feitas.length);
    if(formaDiario === "planilha"){
      html += planilhaHTML(pendentes);
      html += feitasHTML(feitas);
      alvo.innerHTML = html;
      atualizarPlanilha();
      return;
    }
    html += '<div class="fila">' + pendentes.map(cardHTML).join("") + '</div>';
    html += feitasHTML(feitas);

    alvo.innerHTML = html;
    Array.prototype.forEach.call(alvo.querySelectorAll(".obra"), atualizarCard);
  }

  /* ---------------------------------------------------------------
     DECISÃO B, forma 2 — lista única, no formato de planilha.
     Uma linha por obra, tudo aberto na mesma tela, e a resposta acontece
     dentro da própria linha: nada abre, nada some, nada muda de página.
     Um único botão salva tudo no fim.
     --------------------------------------------------------------- */
  function planilhaHTML(pendentes){
    var h = '<div class="planilha-wrap"><table class="planilha">';
    h += '<thead><tr>' +
           '<th scope="col">Obra</th>' +
           '<th scope="col">Andou hoje?</th>' +
           '<th scope="col">Por que não andou?</th>' +
           '<th scope="col">Faltou algum item?</th>' +
           '<th scope="col">Observação e foto</th>' +
         '</tr></thead><tbody>';

    h += pendentes.map(function(o){
      var d = rasc(o);
      var sinal = [];
      if(o.naoAndouSeguidos >= 2) sinal.push(o.naoAndouSeguidos + " dias seguidos sem andar");
      if(travado(o)) sinal.push(o.bloqueadaDias + " dias no mesmo bloqueio");

      var tr = '<tr data-linha="' + o.id + '">';
      tr += '<td><span class="pl-os">OS ' + esc(o.os) + '</span>' +
              '<button type="button" class="pl-loja" data-abrir="' + o.id + '">' + esc(o.loja) + '</button>' +
              '<div class="pl-sub">' + esc(o.equipe || "sem equipe") +
              (sinal.length ? ' · <span style="color:var(--warn)">' + esc(sinal.join(" · ")) + '</span>' : "") +
              '</div></td>';
      tr += '<td><div class="chips">' + chipsHTML("andou", ["Sim","Não"], d.andou, true) + '</div></td>';
      tr += '<td><select data-grupo="motivo" aria-label="Por que não andou — ' + esc(o.loja) + '">' +
              opcoes(BLOQUEIOS, d.motivo, "— escolher —") + '</select>' +
              '<span class="pl-aviso" hidden>Obrigatório para salvar</span></td>';
      tr += '<td><select data-grupo="item" aria-label="Faltou algum item — ' + esc(o.loja) + '">' +
              opcoes(ITENS.slice(1), d.item, "Não faltou") + '</select></td>';
      tr += '<td><input class="obs-in" type="text" maxlength="120" placeholder="opcional" value="' +
              esc(d.obs || "") + '">' +
              (pedeFoto(o) ? '<div style="margin-top:5px"><button type="button" class="obs-btn foto" ' +
                'aria-pressed="' + (d.foto ? "true" : "false") + '">' +
                (d.foto ? "✓ foto anexada" : "+ foto do dia") + '</button></div>' : "") +
            '</td>';
      tr += '</tr>';
      return tr;
    }).join("");

    h += '</tbody></table></div>';
    h += '<div class="planilha-rodape">' +
           '<button type="button" class="btn" id="salvar-tudo">Salvar tudo</button>' +
           '<span class="hint" id="hint-tudo"></span>' +
         '</div>';
    return h;
  }

  /* Estado de cada linha: quantas estão prontas, quantas estão faltando
     motivo. O botão só barra o que a DECISÃO C manda barrar. */
  function contaPlanilha(){
    var pendentes = FILA.filter(function(o){ return !respostas[o.id]; });
    var prontas = 0, faltando = 0;
    pendentes.forEach(function(o){
      var d = rasc(o);
      if(!d.andou) return;
      if(validar(o, d)) faltando++; else prontas++;
    });
    return {total:pendentes.length, prontas:prontas, faltando:faltando};
  }

  function atualizarPlanilha(){
    var c = contaPlanilha();
    Array.prototype.forEach.call(document.querySelectorAll("tr[data-linha]"), function(tr){
      var o = PORID[tr.dataset.linha], d = rasc(o);
      var naoAndou = d.andou === "Não";
      var selMotivo = tr.querySelector('select[data-grupo="motivo"]');
      var aviso = tr.querySelector(".pl-aviso");
      selMotivo.disabled = !naoAndou;
      selMotivo.classList.toggle("falta", naoAndou && !d.motivo);
      aviso.hidden = !(naoAndou && !d.motivo);
      tr.classList.toggle("falta", !!(d.andou && validar(o, d)));
      tr.classList.toggle("pronta", !!(d.andou && !validar(o, d)));
    });
    var btn = document.getElementById("salvar-tudo");
    var hint = document.getElementById("hint-tudo");
    if(!btn || !hint) return;
    btn.disabled = c.prontas === 0;
    if(c.faltando){
      hint.textContent = c.faltando + (c.faltando === 1 ? " obra está" : " obras estão") +
        ' marcada como "não andou" sem motivo. Sem o motivo, essa linha não salva.';
      hint.className = "hint alerta";
    } else if(c.prontas){
      hint.textContent = "Salva " + c.prontas + (c.prontas === 1 ? " obra respondida" : " obras respondidas") +
        " de uma vez. As " + (c.total - c.prontas) + " que faltam continuam na lista.";
      hint.className = "hint";
    } else {
      hint.textContent = "Responda pelo menos uma obra para salvar.";
      hint.className = "hint";
    }
  }

  function salvarTudo(){
    var pendentes = FILA.filter(function(o){ return !respostas[o.id]; });
    var salvou = 0;
    pendentes.forEach(function(o){ if(gravar(o)) salvou++; });
    if(salvou) renderDiario();
  }

  /* ---------------------------------------------------------------
     TELA 2 — Base de obras
     --------------------------------------------------------------- */
  var COLS = [
    {k:"os",     t:"Nº OS"},
    {k:"loja",   t:"Loja"},
    {k:"tipo",   t:"Tipo"},
    {k:"pcm",    t:"Responsável"},
    {k:"equipe", t:"Equipe / prestador"},
    {k:"etapa",  t:"Etapa da obra"},
    {k:"dono",   t:"Com quem está"},
    {k:"paradaEtapa", t:"Parada nesta etapa"},
    {k:"osAprovada", t:"OS do cliente"},
    {k:"bloqueio", t:"Bloqueio"},
    {k:"dias",   t:"Dias desde a aprovação"},
    {k:"fracPrazo", t:"Prazo consumido"},
    {k:"atualizacao", t:"Última atualização"}
  ];

  function montarFiltros(){
    var pcms = [];
    OBRAS.forEach(function(o){ if(o.pcm && pcms.indexOf(o.pcm) < 0) pcms.push(o.pcm); });
    pcms.sort();
    document.getElementById("f-pcm").innerHTML = '<option value="todos">Todos</option>' +
      pcms.map(function(p){ return '<option value="' + p + '"' + (fPcm === p ? " selected" : "") + '>' + p + '</option>'; }).join("") +
      '<option value="__sem"' + (fPcm === "__sem" ? " selected" : "") + '>Ainda sem responsável</option>';
    /* O filtro segue a ordem do ciclo e agrupa por fase, para a lista de nove
       etapas continuar legível e para dar de uma vez "tudo o que já foi
       executado e ainda não virou dinheiro". */
    document.getElementById("f-etapa").innerHTML =
      '<option value="todas">Todas</option>' +
      '<option value="__esteira"' + (fEtapa === "__esteira" ? " selected" : "") +
        '>Executadas, ainda na esteira</option>' +
      FASES.map(function(f){
        return '<optgroup label="' + f.nome + '">' +
          '<option value="fase:' + f.k + '"' + (fEtapa === "fase:" + f.k ? " selected" : "") +
            '>Toda a fase ' + f.nome.toLowerCase() + '</option>' +
          CICLO.filter(function(c){ return c.fase === f.k; }).map(function(c){
            return '<option value="' + c.k + '"' + (fEtapa === c.k ? " selected" : "") + '>' + c.nome + '</option>';
          }).join("") + '</optgroup>';
      }).join("");
    document.getElementById("thead-row").innerHTML = COLS.map(function(c){
      return '<th scope="col"><button data-col="' + c.k + '">' + c.t + ' <span class="ar"></span></button></th>';
    }).join("");
  }

  function setVis(v){
    vis = v;
    document.getElementById("btn-tabela").setAttribute("aria-pressed", v === "tabela" ? "true" : "false");
    document.getElementById("btn-kanban").setAttribute("aria-pressed", v === "kanban" ? "true" : "false");
    document.getElementById("vis-tabela").hidden = v !== "tabela";
    document.getElementById("vis-kanban").hidden = v !== "kanban";
    renderBase();
  }

  function filtradas(){
    return OBRAS.filter(function(o){
      if(fPcm === "__sem"){ if(o.pcm) return false; }
      else if(fPcm !== "todos" && o.pcm !== fPcm) return false;
      if(fEtapa === "__esteira"){ if(!posCampo(o) || encerrada(o)) return false; }
      else if(fEtapa.indexOf("fase:") === 0){ if(faseDe(o) !== fEtapa.slice(5)) return false; }
      else if(fEtapa !== "todas" && o.etapa !== fEtapa) return false;
      if(fOs === "sim" && !o.osAprovada) return false;
      if(fOs === "nao" && o.osAprovada) return false;
      if(fOs === "liberada" && !(!o.osAprovada && liberada(o))) return false;
      if(fOs === "semcob" && !semCobertura(o)) return false;
      if(fMau === "sim" && !o.mauUso) return false;
      if(fMau === "nao" && o.mauUso) return false;
      return true;
    });
  }

  function renderBase(){
    var lista = filtradas();
    document.getElementById("conta").textContent = lista.length;
    // Os indicadores olham sempre a base inteira, nunca o filtro: filtrar por uma
    // etapa nao pode fazer o painel zerar e dar a impressao de que a operacao parou.
    var todas = OBRAS;
    var andamento = todas.filter(function(o){ return o.etapa === "andamento"; }).length;
    var paralisadas = todas.filter(function(o){ return o.etapa === "paralisado"; }).length;
    var velhas = todas.filter(function(o){ return !posCampo(o) && o.dias >= 60; }).length;
    var estouradas = todas.filter(function(o){ return !posCampo(o) && o.atraso != null && o.atraso > 0; }).length;
    var aDefinir = todas.filter(function(o){ return o.etapa === "definir"; });
    var maisVelha = aDefinir.reduce(function(m,o){ return Math.max(m, o.dias); }, 0);
    /* O indicador que não existia: obra já executada em campo e ainda presa
       numa etapa de papel. Na planilha inteira são 89 — é onde o dinheiro
       está parado. */
    var esteira = todas.filter(function(o){ return posCampo(o) && !encerrada(o); });
    var esteiraVelha = esteira.reduce(function(m,o){ return Math.max(m, o.paradaEtapa || 0); }, 0);
    var semOS = todas.filter(function(o){ return !o.osAprovada && !encerrada(o); }).length;
    /* O número que hoje ninguém consegue responder: quantas obras estão sendo
       feitas sem documento E sem ninguém nomeado que tenha autorizado. */
    var semCob = todas.filter(semCobertura).length;
    document.getElementById("resumo").innerHTML = [
      {v:aDefinir.length, k:aDefinir.length ? "aguardando definição · a mais antiga há " + maisVelha + " dias" : "aguardando definição", c:"var(--accent)"},
      {v:andamento, k:"em andamento", c:"var(--ok)"},
      {v:paralisadas, k:"paralisadas", c:"var(--crit)"},
      {v:esteira.length, k:esteira.length ? "executadas, ainda na esteira · a mais parada há " + esteiraVelha + " dias" : "executadas, ainda na esteira", c:"var(--warn)"},
      {v:semOS, k:"sem OS aprovada no cliente", c:"var(--crit)"},
      {v:semCob, k:"sem cobertura — nem OS nem liberação", c:"var(--crit)"},
      {v:velhas, k:"aprovadas há mais de 60 dias", c:"var(--warn)"},
      {v:estouradas, k:"passaram da duração planejada", c:"var(--warn)"}
    ].map(function(x){
      return '<div class="kpi" style="--kc:' + x.c + '"><div class="v">' + x.v + '</div><div class="k">' + x.k + '</div></div>';
    }).join("");
    if(vis === "tabela") renderTabela(lista); else renderKanban(lista);
  }

  function renderTabela(lista){
    var k = ordem.col, dir = ordem.dir;
    lista = lista.slice().sort(function(a,b){
      var x = a[k], y = b[k];
      if(x == null) x = dir > 0 ? Infinity : -Infinity;
      if(y == null) y = dir > 0 ? Infinity : -Infinity;
      if(typeof x === "string") return dir * x.localeCompare(y, "pt-BR");
      return dir * (x - y);
    });
    Array.prototype.forEach.call(document.querySelectorAll("#thead-row button"), function(b){
      b.querySelector(".ar").textContent = b.dataset.col === k ? (dir > 0 ? "▲" : "▼") : "";
    });
    document.getElementById("tbody").innerHTML = lista.map(function(o){
      var tr = '<tr' + (critico(o) || semCobertura(o) ? ' class="alerta"' : "") + '>';
      tr += '<td class="os">' + esc(o.os) + '</td>';
      tr += '<td class="loja"><button data-abrir="' + o.id + '">' + esc(o.loja) + '</button></td>';
      tr += '<td>' + esc(o.tipo) + '</td>';
      tr += '<td>' + (o.pcm ? esc(o.pcm) : '<span style="color:var(--accent)">a definir</span>') + '</td>';
      tr += '<td>' + esc(o.equipe) + '</td>';
      tr += '<td>' + pill(o) + (o.mauUso ? " " + mauChip(o) : "") + '</td>';
      tr += '<td class="dono">' + esc(o.dono) + '</td>';
      tr += '<td class="n">' + (o.paradaEtapa != null && !encerrada(o)
              ? '<span class="parada' + (encalhada(o) ? " alto" : "") + '">' + o.paradaEtapa + ' <small>dias</small></span>'
              : '<span style="color:var(--ink-faint)">—</span>') + '</td>';
      tr += '<td>' + osChip(o) + (covChip(o) ? ' ' + covChip(o) : "") + '</td>';
      tr += '<td class="bloq">' + (o.bloqueio === "Sem bloqueio" || posCampo(o)
              ? '<span style="color:var(--ink-faint)">—</span>'
              : esc(o.bloqueio) + (travado(o) ? ' <span class="d">' + o.bloqueadaDias + 'd</span>' : "")) + '</td>';
      tr += '<td class="n">' + badgeDias(o, true) + '</td>';
      tr += '<td>' + prazoHTML(o) + '</td>';
      tr += '<td class="n">' + br(o.atualizacao) + '</td>';
      tr += '</tr>';
      return tr;
    }).join("");
  }

  /* O Kanban agrupa por FASE, não por etapa. São nove etapas no ciclo inteiro —
     nove colunas viram uma parede que ninguém lê, e a leitura de quadro se
     perde. Cada fase é uma coluna; dentro dela, a etapa exata vira um
     subtítulo com a contagem, e o detalhe fino fica na ficha da obra. */
  function cardKanban(o){
    var c = '<button class="card" data-abrir="' + o.id + '" style="--sev:' + sev(o) + '">';
    c += '<div class="os">OS ' + esc(o.os) + '</div>';
    c += '<div class="nm">' + esc(o.loja) + '</div>';
    c += '<div class="ln"><span>' + esc(o.tipo) + '</span><span>' + rotuloResp(o) + '</span>' +
         (o.equipe ? '<span>' + esc(o.equipe) + '</span>' : "") + '</div>';
    if(posCampo(o) && !encerrada(o)){
      c += '<div class="ln com' + (critico(o) ? " crit" : (encalhada(o) ? " alto" : "")) +
           '">Com <b>' + esc(o.dono) + '</b> há <b class="num">' + o.paradaEtapa + '</b> dias</div>';
    }
    c += '<div class="ft">' + badgeDias(o, true) +
         (o.osAprovada ? "" : osChip(o)) + covChip(o) + mauChip(o) + notaAlerta(o) + '</div>';
    c += '</button>';
    return c;
  }

  function renderKanban(lista){
    document.getElementById("kanban").innerHTML = FASES.map(function(f){
      var itens = lista.filter(function(o){ return faseDe(o) === f.k; });
      var h = '<div class="col"><div class="col-h"><span class="nm" style="color:' + f.cor + '">' +
              esc(f.nome) + '</span><span class="ct">' + itens.length + '</span></div><div class="col-b">';
      if(!itens.length){
        h += '<div class="col-vazia">nenhuma obra</div>';
      } else {
        CICLO.forEach(function(c){
          if(c.fase !== f.k) return;
          var dela = itens.filter(function(o){ return o.etapa === c.k; }).sort(function(a,b){
            var x = a.paradaEtapa != null ? a.paradaEtapa : a.dias;
            var y = b.paradaEtapa != null ? b.paradaEtapa : b.dias;
            return y - x;
          });
          if(!dela.length) return;
          h += '<div class="col-etapa"><span style="color:' + c.cor + '">' + esc(c.nome) + '</span>' +
               '<b>' + dela.length + '</b></div>';
          h += dela.map(cardKanban).join("");
        });
      }
      return h + '</div></div>';
    }).join("");
  }

  /* ---------------------------------------------------------------
     A ESTEIRA — o que acontece depois de a equipe sair de campo
     A sequência é a que o cliente escreveu, na ordem em que ele escreveu:
       equipe termina → relatório de entrega no Field → responsável anexa e
       encerra a OS no sistema do cliente → cliente libera o faturamento →
       obra faturada, e só aí ela está finalizada.
     O desvio existe porque a obra pode ter começado sem OS aprovada: nesse
     caso, ao sair de campo ela vai primeiro cobrar a aprovação do cliente, e
     só depois o resto do caminho segue.
     --------------------------------------------------------------- */
  var MARCO_DE = {relatorio:"relatorio", aprovarOS:"osAprov", fecharOS:"fechouOS",
                  pendFat:"liberouFat", faturado:"faturou"};

  function passoHTML(p){
    var h = '<li class="passo ' + p.cls + (p.desvio ? " desvio" : "") + '">';
    h += '<div class="marca"><i></i></div>';
    h += '<div class="corpo">';
    h +=   '<div class="l1"><span class="nome">' + esc(p.nome) + '</span>' +
             (p.cls === "atual" ? '<span class="aqui">a obra está aqui</span>' : "") + '</div>';
    h +=   '<div class="l2"><span class="dono">' + esc(p.dono) + '</span>' +
             '<span class="onde">' + esc(p.onde) + '</span>' +
             (p.cod ? '<span class="cod">' + esc(p.cod) + '</span>' : "") + '</div>';
    if(p.detalhe) h += '<div class="l3">' + p.detalhe + '</div>';
    h += '</div>';
    h += '<div class="quando ' + p.cls + '">' + p.quando + '</div>';
    h += '</li>';
    return h;
  }

  function esteiraHTML(o){
    var h = '<ol class="esteira">';

    /* Passo zero: a execução em campo, que é onde o diário do dia atua. */
    var campoFeito = !!(o.marcos && o.marcos.execFim);
    h += passoHTML({
      cls: campoFeito ? "feito" : "atual",
      nome:"Execução em campo",
      dono: o.equipe ? "Equipe " + o.equipe : "Equipe a definir",
      onde:"Campo · diário do dia",
      cod:"EXECUTAR",
      quando: campoFeito ? br(o.marcos.execFim) : "em curso",
      detalhe: campoFeito ? "" : (esc(prazoTxt(o)) + ' · ' + esc(paradaTxt(o)))
    });

    ESTEIRA.forEach(function(k){
      var c = ETAPAS[k];

      /* O DESVIO. Quando a obra já tinha OS aprovada, ele não acontece — mas
         continua desenhado, apagado, para o caminho inteiro ficar visível. */
      if(k === "aprovarOS" && o.osAprovada){
        h += '<li class="passo pulado desvio">';
        h +=   '<div class="marca"><i></i></div>';
        h +=   '<div class="corpo"><div class="l1"><span class="nome">Pendente fechamento</span></div>' +
                 '<div class="l2">Desvio não usado — a OS já estava aprovada em ' + br(o.marcos.osAprov || o.aprovacao) +
                 ', então, com o relatório existindo, a obra vai direto para Fechar OS.</div></div>';
        h +=   '<div class="quando pulado">não se aplica</div>';
        h += '</li>';
        return;
      }

      var data = o.marcos ? o.marcos[MARCO_DE[k]] : null;
      var cls = data ? "feito" : (o.etapa === k ? "atual" : "futuro");
      var quando = data ? br(data)
                        : (cls === "atual" ? "há " + o.paradaEtapa + (o.paradaEtapa === 1 ? " dia" : " dias") : "—");
      var det = "";
      if(cls === "atual" && encalhada(o)){
        det = '<span class="alerta-passo">Parada aqui há <b>' + o.paradaEtapa + ' dias</b>. ' +
              'Enquanto não sair desta etapa, a obra não vira dinheiro.</span>';
      }
      /* O relatório não é marcado por ninguém — ele é DEDUZIDO. Dizer isso no
         próprio passo tira o ar de "campo que alguém esqueceu de preencher". */
      if(k === "relatorio"){
        det += '<span class="sem-status">Ninguém marca esta etapa à mão. O sistema lê o fechamento da OS ' +
               'no Field Control: <b>OS fechada no Field, o relatório existe</b>. Enquanto o Field não ' +
               'devolver o fechamento, a obra fica parada aqui.</span>';
      }
      /* A cobrança precisa ter NOME. Quem liberou a execução é a pessoa a
         quem a Manfac vai recorrer para a OS sair. */
      if(k === "aprovarOS"){
        det += liberada(o)
          ? '<span class="sem-status">Relatório pronto, OS não aprovada: quem destrava é o cliente, não nós. ' +
            'A execução foi liberada por <b>' + esc(o.liberadoPor) + '</b> em ' + br(o.liberadoEm) +
            ' — é com ele que a cobrança da OS começa.</span>'
          : '<span class="alerta-passo">Ninguém liberou esta obra: não há OS aprovada e não há nome de quem ' +
            'autorizou a execução. A cobrança fica <b>sem a quem recorrer</b>.</span>';
      }
      h += passoHTML({
        cls: cls,
        desvio: k === "aprovarOS",
        nome: c.nome,
        dono: c.dono === "Responsável da obra" ? (o.pcm ? "Responsável " + o.pcm : "Responsável a definir") : c.dono,
        onde: c.onde,
        cod: c.planilha === null ? "sem status na planilha" : c.planilha,
        quando: quando,
        detalhe: det
      });
    });

    h += '</ol>';
    return h;
  }

  /* ---------------------------------------------------------------
     TELA 3 — Ficha da obra
     --------------------------------------------------------------- */
  function renderFicha(){
    var o = PORID[obraAberta];
    if(o.etapa === "definir"){ renderTriagem(o); return; }
    var h = "";

    h += '<div class="page-head"><div>';
    h += '<h1>' + esc(o.loja) + '</h1>';
    h += '<p class="num">OS ' + esc(o.os) + ' · ' + esc(o.tipo) + ' · ' + moeda(o.valor) + '</p>';
    h += '</div><div style="display:flex;gap:8px;flex-wrap:wrap">' + pill(o) + mauChip(o) +
         osChip(o) + covChip(o) + badgeDias(o) + '</div></div>';

    /* Obra já executada e encalhada: a manchete não pode ser a duração da obra,
       que acabou. É há quanto tempo ela está parada e quanto dinheiro está ali. */
    var alertou = false;
    if(posCampo(o) && !encerrada(o) && (critico(o) || encalhada(o))){
      alertou = true;
      var grave = critico(o);
      h += '<div class="alerta-box"' + (grave ? "" :
             ' style="border-color:rgba(244,183,63,.45);background:var(--warn-soft);border-left-color:var(--warn)"') + '>';
      h +=   '<div><div class="n"' + (grave ? "" : ' style="color:var(--warn)"') + '>' + o.paradaEtapa + '</div>' +
               '<div class="lbl" style="text-align:center;margin-top:3px">dias parada aqui</div></div>';
      h +=   '<div><h3' + (grave ? "" : ' style="color:var(--warn)"') + '>Obra entregue em ' +
               br(o.marcos.execFim) + ' e ainda não faturada.</h3>' +
             '<p>Ela saiu de campo e está na etapa <b>' + esc(ETAPAS[o.etapa].nome) + '</b> desde <b>' +
               br(o.desdeEtapa) + '</b>, com <b>' + esc(o.dono) + '</b>.' +
               (o.valor != null ? ' São <b>' + moeda(o.valor) + '</b> de serviço entregue que ainda não viraram nota.' : "") +
             '</p></div>';
      h += '</div>';
    } else if(critico(o) && o.duracao){
      h += '<div class="alerta-box">';
      h +=   '<div><div class="n">' + o.dias + '</div><div class="lbl" style="text-align:center;margin-top:3px">dias em aberto</div></div>';
      h +=   '<div><h3>Obra aprovada em ' + br(o.aprovacao) + ' e ainda não concluída.</h3>' +
             '<p>A duração planejada é de <b>' + o.duracao + ' dias</b>. Estão contados <b>' + o.dias +
             ' dias</b> desde a aprovação — <b>' + Math.round(o.dias / o.duracao) + ' vezes</b> o prazo combinado. ' +
             'O cliente enxerga essa mesma OS aberta no sistema dele.</p></div>';
      h += '</div>';
    } else if(!posCampo(o) && o.atraso != null && o.atraso > 0){
      h += '<div class="alerta-box" style="border-color:rgba(244,183,63,.45);background:var(--warn-soft);border-left-color:var(--warn)">';
      h +=   '<div><div class="n" style="color:var(--warn)">' + o.atraso + '</div><div class="lbl" style="text-align:center;margin-top:3px">dias além do prazo</div></div>';
      h +=   '<div><h3 style="color:var(--warn)">Passou da duração planejada.</h3>' +
             '<p>Início em <b>' + br(o.inicioReal || o.inicioPlan) + '</b> com <b>' + o.duracao +
             ' dias</b> de duração: deveria ter terminado em <b>' + br(o.fimCalc) + '</b>.</p></div>';
      h += '</div>';
    }

    /* O risco que a obra carrega desde o primeiro dia. Quando a caixa de
       alerta acima já contou essa história, não repetimos a mesma coisa duas
       vezes empilhadas. */
    /* SEM COBERTURA é o caso que o cliente não consegue enxergar hoje: nem
       documento, nem nome. Ele aparece SEMPRE, mesmo quando a caixa de alerta
       acima já falou, porque é um risco de natureza diferente — não é atraso,
       é serviço feito sem autorização de ninguém. */
    if(semCobertura(o)){
      h += '<div class="risco-os">';
      h +=   '<span class="tag">Sem cobertura</span>';
      h +=   '<p>Esta obra ' + (posCampo(o) ? "foi executada" : "está sendo executada") +
               ' <b>sem OS aprovada na DPSP e sem ninguém que tenha liberado a execução</b>. ' +
               'Não existe documento e não existe nome: se a DPSP não aprovar a OS, não há a quem recorrer, ' +
               'porque não há registro de quem disse "pode fazer". ' +
               (o.valor != null ? 'São <b>' + moeda(o.valor) + '</b> de serviço sem cobertura nenhuma. ' : "") +
               'É o estado de maior risco da base, e é ele que o campo <b>Liberado por</b> existe para evitar.</p>';
      h += '</div>';
    } else if(!o.osAprovada && !alertou){
      h += '<div class="risco-os">';
      h +=   '<span class="tag">Sem OS aprovada</span>';
      h +=   '<p>Esta obra ' + (posCampo(o) ? "foi executada" : "está sendo executada") +
               ' <b>sem OS aprovada no sistema da DPSP</b>. ' +
               (posCampo(o)
                 ? 'Ela não pode ser encerrada nem faturada enquanto a DPSP não aprovar a OS. ' +
                   'O serviço já foi entregue e ainda não tem cobertura no sistema do cliente.'
                 : 'Se ela terminar em campo antes de a OS ser aprovada, não vai direto para o fechamento: ' +
                   'entra na etapa de cobrar a aprovação, e o faturamento fica parado ali.') + '</p>';
      h += '</div>';
    }

    /* ---- CICLO DE VIDA: a esteira, a tela principal desta rodada ---- */
    h += '<div class="box esteira-box"><div class="box-h">Ciclo de vida da obra' +
         '<span class="box-sub">onde ela está, de quem é a vez e há quanto tempo</span></div>';
    h += '<div class="box-b">';
    h +=   '<div class="agora">';
    h +=     '<div class="agora-p"><div class="lbl">Etapa atual</div><div class="v">' + pill(o) + '</div></div>';
    h +=     '<div class="agora-p"><div class="lbl">Dono da etapa</div><div class="v">' + esc(o.dono) + '</div></div>';
    h +=     '<div class="agora-p"><div class="lbl">' + (posCampo(o) ? "Parada nesta etapa" : "Prazo") + '</div>' +
               '<div class="v ' + (encalhada(o) ? "aviso" : "") + '">' +
               (posCampo(o)
                 ? (encerrada(o) ? "encerrada" : o.paradaEtapa + (o.paradaEtapa === 1 ? " dia" : " dias"))
                 : esc(prazoTxt(o))) + '</div></div>';
    h +=     '<div class="agora-p"><div class="lbl">Caminho</div><div class="v">' +
               (o.osAprovada ? "direto — a OS já estava aprovada" : "com desvio — vai parar em Pendente fechamento") +
               '</div></div>';
    h +=   '</div>';
    h +=   esteiraHTML(o);
    h +=   '<p class="esteira-nota">Os nomes das etapas são os que a Manfac já usa na coluna ' +
           '<b>STATUS MANFAC</b> da planilha. Hoje a planilha guarda o status, mas nunca ' +
           '<b>desde quando</b> — é esse número, o "parada há N dias", que não existe em lugar nenhum ' +
           'e faz a obra sumir por semanas depois de entregue.<br><br>' +
           'Duas filas diferentes, que hoje estão embaraçadas dentro das mesmas 89 obras executadas e ' +
           'não faturadas: <b>Fechar OS</b> é o que depende de nós — alguém pega o relatório e encerra. ' +
           '<b>Pendente fechamento</b> é o que depende do cliente — só a aprovação da OS destrava, e o que ' +
           'resolve é insistir com o analista que liberou.<br><br>' +
           '<b>Mau uso</b> não é etapa, é classificação: a obra de mau uso percorre esta mesma esteira e só ' +
           'carrega uma etiqueta. Por isso as 22 obras que estavam paradas no status "MAU USO - APROVAR OS" ' +
           'voltaram para a contagem normal do funil.</p>';
    h += '</div></div>';

    h += '<div class="ficha-grid"><div>';

    /* AUTORIZAÇÃO — os dois destravamentos, um embaixo do outro. A liberação
       é o OK verbal do analista do cliente ("pode executar, a OS eu aprovo
       depois"); a OS aprovada é o ato formal. São datas diferentes e coisas
       diferentes, e é a falta das duas juntas que cria o risco. */
    h += '<div class="box"><div class="box-h">Autorização' +
         '<span class="box-sub">o que destrava a execução e o que destrava o fechamento</span></div>' +
         '<div class="box-b"><dl class="dl">';
    h += '<dt>Liberação</dt><dd>' + (liberada(o)
            ? 'Liberado por <b>' + esc(o.liberadoPor) + '</b> · <span class="num">' +
              br(o.liberadoEm).slice(0,5) + '</span>'
            : '<span style="color:var(--crit);font-weight:600">Ninguém liberou esta obra</span>') + '</dd>';
    h += '<dt>OS do cliente</dt><dd>' + (o.osAprovada
            ? 'OS aprovada · <span class="num">' + br(o.marcos.osAprov || o.aprovacao).slice(0,5) + '</span>'
            : '<span style="color:var(--crit);font-weight:600">OS ainda não aprovada</span>' +
              (diasSemOS(o) != null ? ' · <span class="num">há ' + diasSemOS(o) + ' dias</span>' : "")) + '</dd>';
    h += '</dl>';
    h += '<p class="crono-nota">' + (
           o.osAprovada && liberada(o)
             ? 'A obra tem as duas coberturas: alguém autorizou a execução <b style="color:var(--ink)">e</b> ' +
               'existe OS aprovada no sistema do cliente. É o caso normal.'
           : o.osAprovada
             ? 'A obra não precisou de liberação: a <b style="color:var(--ink)">OS já estava aprovada</b> ' +
               'quando a equipe foi a campo, e a OS é a própria autorização.'
           : liberada(o)
             ? 'A execução aconteceu com o <b style="color:var(--ink)">OK de ' + esc(o.liberadoPor) + '</b>, ' +
               'que se comprometeu a aprovar a OS depois. Faz <b style="color:var(--ink)">' + diasSemOS(o) +
               ' dias</b> que essa OS não sai — e é o ' + esc(o.liberadoPor) + ' quem a Manfac vai procurar.'

    h += '</div></div>';

    h += '<div class="box"><div class="box-h">Identificação</div><div class="box-b"><dl class="dl">';

    h += '<dt>Loja</dt><dd>' + esc(o.loja) + '</dd>';
    h += '<dt>Chamado</dt><dd>' + esc(o.desc) + '</dd>';
    h += '<dt>Tipo</dt><dd>' + esc(o.tipo) + '</dd>';
    if(o.mauUso){
      h += '<dt>Classificação</dt><dd>' + mauChip(o) +
           '<div style="color:var(--ink-faint);font-size:11.5px;margin-top:4px;line-height:1.5">' +
           'Dano por uso indevido do cliente — a Manfac conserta e cobra. É etiqueta, não etapa: ' +
           'a obra segue a mesma esteira de todas as outras.</div></dd>';
    }
    h += '<dt>Valor</dt><dd class="num">' + moeda(o.valor) + '</dd>';
    h += '<dt>Analista</dt><dd>' + esc(o.analista) + '</dd>';
    h += '<dt>Responsável da obra</dt><dd>' + (o.pcm ? esc(o.pcm) : '<span style="color:var(--accent)">a definir</span>') + '</dd>';
    h += '<dt>Equipe / prestador</dt><dd>' + esc(o.equipe) + '</dd>';
    h += '<dt>Origem</dt><dd>' + esc(o.origem) + '</dd>';
    h += '<dt>Bloqueio atual</dt><dd>' + (o.bloqueio === "Sem bloqueio"
            ? '<span style="color:var(--ink-faint)">sem bloqueio</span>'
            : '<span style="color:var(--crit);font-weight:600">' + esc(o.bloqueio) + '</span>' +
              (travado(o) ? ' <span class="num" style="color:var(--ink-dim)">há ' + o.bloqueadaDias + ' dias</span>' : "")) + '</dd>';
    h += '</dl></div></div>';

    h += '<div class="box"><div class="box-h">Cronograma</div><div class="box-b"><div class="crono">';
    h +=   '<div class="crono-c"><div class="k">Início planejado</div><div class="v">' + br(o.inicioPlan) + '</div></div>';
    h +=   '<div class="crono-c"><div class="k">Início real</div><div class="v">' + br(o.inicioReal) + '</div></div>';
    h +=   '<div class="crono-c destaque"><div class="k">Duração</div><div class="v">' +
             (o.duracao != null ? o.duracao + " dias" : "a definir") + '</div></div>';
    h +=   '<div class="crono-c calc"><div class="k">Final calculado</div><div class="v">' + br(o.fimCalc) + '</div></div>';
    h += '</div><p class="crono-nota">A obra é planejada por <b style="color:var(--ink)">duração</b>, não por data de entrega. ' +
         'O final é consequência do início mais os dias combinados e se recalcula sozinho a cada remarcação — ' +
         'ninguém precisa reescrever data final.</p></div></div>';

    h += '<div class="box"><div class="box-h">Remarcações <span class="num" style="color:var(--warn)">' + o.remarcacoes.length + '</span></div><div class="box-b">';
    if(o.remarcacoes.length){
      h += '<div class="remarc">' + o.remarcacoes.map(function(r){
        return '<div class="remarc-i"><span class="d">' + br(r.data) + '</span><div>' +
               '<div class="mv">início de <b>' + br(r.de) + '</b> para <b>' + br(r.para) + '</b></div>' +
               '<div class="mt">' + esc(r.motivo) + '</div></div></div>';
      }).join("") + '</div>';
    } else {
      h += '<p style="margin:0;color:var(--ink-faint);font-size:12.5px">Nenhuma remarcação registrada.</p>';
    }
    h += '</div></div>';

    h += '</div><div>';

    /* A FAIXA DE EVOLUÇÃO — o pedido em uma frase: "pra gente acompanhar a
       evolução". Os últimos dias em sequência, para bater o olho e ver a obra
       andando. O dia sem foto não fica em branco: ele é escrito, porque é a
       ausência que vira cobrança. */
    if(pedeFoto(o) && o.diario.length){
      var ultimos = o.diario.slice(-8);
      var comFoto = ultimos.filter(function(e){ return e.foto; }).length;
      h += '<div class="box"><div class="box-h">Evolução em fotos' +
           '<span class="box-sub">os últimos dias, na ordem em que aconteceram</span></div><div class="box-b">';
      h += '<div class="faixa">' + ultimos.map(function(e){
             return '<div class="faixa-d' + (e.foto ? "" : " sem") + '">' +
                    '<div class="foto-mini">' + (e.foto ? "foto da obra" : "sem foto") + '</div>' +
                    '<div class="dt">' + br(e.data).slice(0,5) + '</div></div>';
           }).join("") + '</div>';
      h += '<p class="faixa-nota"><b>' + comFoto + ' de ' + ultimos.length +
           ' dias com foto.</b> Uma foto por dia, em sequência: é assim que dá para ver a obra andando sem ' +
           'ir até a loja. O dia em que a foto não veio aparece marcado — a falta de foto é falta como ' +
           'qualquer outra e vira tarefa com dono e prazo, na mesma mecânica das outras faltas.<br><br>' +
           '<b>Próximo passo:</b> a foto vai poder chegar pelo WhatsApp, respondendo ao agente das 18h, ' +
           'e cai exatamente neste mesmo lugar. Hoje ela entra pela tela, no diário do dia.</p>';
      h += '</div></div>';
    }

    h += '<div class="box"><div class="box-h">Linha do tempo do diário</div><div class="box-b">';
    if(o.diario.length){
      h += '<div class="tl">' + o.diario.slice().reverse().map(function(e){
        var cor = e.andou ? "var(--ok)" : "var(--crit)";
        var t = '<div class="tl-i" style="--sev:' + cor + '">';
        t += '<div class="col-l">' + br(e.data).slice(0,5) + '</div>';
        t += '<div class="col-m"><i></i></div>';
        t += '<div class="col-r">';
        t += '<div class="tl-t ' + (e.andou ? "sim" : "nao") + '">' + (e.andou ? "Andou" : "Não andou") + '</div>';
        var sub = [];
        if(!e.andou && e.motivo) sub.push(e.motivo);
        if(e.item && e.item !== "Não faltou") sub.push("faltou " + e.item.toLowerCase());
        if(sub.length) t += '<div class="tl-s">' + esc(sub.join(" · ")) + '</div>';
        if(e.obs) t += '<div class="tl-obs">' + esc(e.obs) + '</div>';
        /* A foto do dia, dentro do próprio dia. Sem foto é estado visível: é
           ele que dispara a cobrança no dia seguinte. */
        if(pedeFoto(o)){
          t += e.foto
            ? '<div class="foto-dia"><span class="foto-mini">foto da obra</span>' +
              '<span class="lg">Foto da evolução recebida em ' + br(e.data).slice(0,5) + '</span></div>'
            : '<div class="foto-dia sem"><span class="foto-mini">sem foto</span>' +
              '<span class="lg">A foto deste dia não veio</span></div>';
        }
        var tf = tarefaDoDia(o.id, e.data);
        if(tf) t += tlTarefaHTML(tf);
        return t + '</div></div>';
      }).join("") + '</div>';
    } else {
      h += '<p style="margin:0;color:var(--ink-faint);font-size:12.5px">Nenhum dia respondido ainda nesta obra. ' +
           'Hoje é assim em todas: a informação só existe na cabeça de quem está em campo.</p>';
    }
    if(o.gap){
      h += '<div class="tl-gap">' + o.gap.dias + ' dias sem nenhum registro' +
           '<span>De ' + br(o.gap.de) + ' (aprovação) até ' + br(o.gap.ate) +
           ' ninguém respondeu nada sobre esta obra. É exatamente esse buraco que o diário fecha.</span></div>';
    }
    h += '</div></div>';

    /* As tarefas que as faltas desta obra geraram. A pergunta do dono — "tá na
       mão de quem?" — respondida sem sair da obra. */
    var tarObra = tarefasDaObra(o.id);
    if(tarObra.length){
      h += '<div class="box"><div class="box-h">Tarefas que as faltas geraram ' +
           '<span class="num" style="color:var(--accent)">' + tarObra.length + '</span></div><div class="box-b">';
      tarObra.slice().sort(function(a,b){ return a.aberta < b.aberta ? 1 : -1; }).forEach(function(t){
        var p = pessoaDe(t.dono);
        h += '<div class="tl-tarefa" style="--tc:' + corTarefa(t) + ';margin:0 0 8px">' +
             '<span class="t">Faltou ' + esc(t.item.toLowerCase()) + ' · ' + br(t.aberta).slice(0,5) + '</span>' +
             '<b>' + esc(p.area) + ' · ' + esc(p.nome) + '</b> · prazo fim do dia ' + br(t.prazo).slice(0,5) +
             ' · na mão dele há <b>' + diasNaMao(t) + (diasNaMao(t) === 1 ? " dia" : " dias") + '</b>' +
             '<div style="margin-top:6px">' + tchipHTML(t) + '</div></div>';
      });
      h += '<button type="button" class="ir-tarefas" data-tela="tarefas" style="margin-top:4px">' +
           'Ver a conversa do agente &#8594;</button>';
      h += '</div></div>';
    }

    h += '<div class="box"><div class="box-h">Pendências e próxima ação</div><div class="box-b"><dl class="dl">';
    h += '<dt>Pendência</dt><dd>' + (o.pendencia ? esc(o.pendencia) : '<span style="color:var(--ink-faint)">nenhuma</span>') + '</dd>';
    h += '<dt>Responsável</dt><dd>' + (o.pendResp ? esc(o.pendResp) : "—") + '</dd>';
    h += '<dt>Prazo</dt><dd class="num">' + br(o.pendPrazo) + '</dd>';
    h += '<dt>Próxima ação</dt><dd>' + (o.proxAcao ? esc(o.proxAcao) : "—") + '</dd>';
    h += '<dt>Última atualização</dt><dd class="num">' + br(o.atualizacao) + '</dd>';
    h += '</dl></div></div>';

    h += '<div class="box"><div class="box-h">Vindo do Field</div><div class="box-b">';
    h += '<div class="placeholder"><b>Relatório fotográfico</b> — as fotos que o técnico tira em campo entram aqui quando a OS é preenchida no Field.</div>';
    h += '<div class="placeholder"><b>Relatório de entrega (PDF)</b> — o arquivo final que o responsável anexa no sistema do cliente para encerrar a OS. É o documento que destrava toda a esteira acima.</div>';
    h += '</div></div>';

    h += '</div></div>';

    /* DECISÃO G — a pergunta que o feedback abriu e não fechou. */
    h += '<div class="decisao"><span class="tag">DECISÃO G</span><div>';
    h +=   '<p>Você descreveu a esteira inteira, mas não disse <b>quem aperta o botão de cada etapa</b>. ' +
             'Do relatório até encerrar a OS no sistema do cliente está claro: é o responsável da obra, ' +
             'você mesmo disse. <b>Depois disso, quem marca?</b> O financeiro? O próprio responsável? ' +
             'Ou isso deveria vir sozinho de uma integração?</p>';
    h +=   '<p class="opt"><em>Adotado por padrão — cada etapa é de quem consegue saber:</em> o responsável da obra ' +
             'marca até <b>Fechar OS</b>, porque é ele quem anexa o relatório e encerra no sistema do cliente. ' +
             '<b>Pendente faturamento</b> não é marcado por ninguém: entra sozinho no instante em que a OS é ' +
             'fechada, porque é consequência, não tarefa. E <b>Faturado</b> é marcado pelo financeiro, que é ' +
             'quem emite a nota e é o único que sabe o dia em que ela saiu.</p>';
    h +=   '<p class="opt"><em>Alternativa — o responsável fecha tudo:</em> o mesmo que abriu a obra a marca como ' +
             'faturada. Uma pessoa só, do começo ao fim, sem combinação entre áreas. O preço é que ele vai ' +
             'marcar de ouvido: não é ele quem emite a nota, então a data vai ser aproximada ou vai atrasar.</p>';
    h +=   '<p class="opt"><em>Alternativa — o financeiro assume mais cedo:</em> a obra sai da mão do responsável ' +
             'assim que a OS é fechada, e da liberação do faturamento em diante o dono é o financeiro. ' +
             'Fica mais fiel a quem de fato faz, mas exige o financeiro dentro do sistema todo dia.</p>';
    h +=   '<p class="opt"><em>Alternativa — ninguém marca, o sistema lê:</em> a etapa muda sozinha pela ' +
             'integração com o Field Control e com o sistema da DPSP. É o mais correto no papel e o único que ' +
             'não depende de disciplina — mas depende de uma integração que hoje não existe, e enquanto ela ' +
             'não existir a esteira fica sem dono nenhum.</p>';
    h +=   '<p class="opt">O critério que usei para o padrão: <b>etapa que ninguém consegue marcar com honestidade ' +
             'apodrece</b>. Foi o que aconteceu com o campo de avanço da planilha, que saiu desta tela ' +
             'justamente por isso. <b>Concorda com a divisão?</b></p>';
    h += '</div></div>';
    h += fbPor("decG");

    /* NOVO — liberado por + data de liberação (feedback de 03/09/2026) */
    h += '<div class="decisao"><span class="tag">NOVO · LIBERAÇÃO</span><div>';
    h +=   '<p>Você descreveu uma coisa que a operação faz todo dia e que a planilha nunca guardou direito: ' +
             'quando a obra não tem OS aprovada, <b>um analista do cliente dá o OK verbal</b> — "pode executar, ' +
             'a OS eu aprovo depois" — e a Manfac anota <b>liberado por Amanda</b>, <b>por Leandro</b>, ' +
             '<b>por Juan</b>, com a data.</p>';
    h +=   '<p class="opt"><em>Uma correção de fato, para constar:</em> essa coluna <b>não existe</b> na planilha ' +
             'que recebemos. O que existe é <b>ANALISTA</b> (o nome) numa coluna e <b>AUTORIZAÇÃO</b> (uma data) ' +
             'em outra, sem nada dizendo que as duas se referem ao mesmo ato. Isso não enfraquece o pedido, ' +
             'reforça: hoje não dá para saber, olhando a planilha, se alguém autorizou a obra ou se ninguém ' +
             'autorizou nada.</p>';
    h +=   '<p class="opt"><em>Como ficou:</em> passam a existir <b>dois destravamentos independentes</b>, cada um ' +
             'com quem e quando — a <b>liberação</b> (nome e data do analista) e a <b>OS aprovada</b> (o ato ' +
             'formal). Veja no bloco <b>Autorização</b>, aí em cima. São quatro combinações: liberada e com OS ' +
             '(normal); liberada, sem OS (executando com o OK, falta cobrar a OS); não liberada, com OS ' +
             '(normal, a OS já é a autorização); e <b>nem uma nem outra</b>.</p>';
    h +=   '<p class="opt"><em>O quarto caso é o que interessa:</em> <b>sem cobertura</b>. Serviço sendo feito sem ' +

  /* ---------------------------------------------------------------
     TELA 3-B — Triagem da obra que acabou de chegar do Field

  function opcoes(lista, valor, vazio){
    return '<option value="">' + vazio + '</option>' +
      lista.map(function(v){
        return '<option value="' + esc(v) + '"' + (valor === v ? " selected" : "") + '>' + esc(v) + '</option>';
      }).join("");
  }

    h += '<h1>' + esc(o.loja) + '</h1>';

    h += '</div><div style="display:flex;gap:8px;flex-wrap:wrap">' + pill(o) + badgeDias(o) + '</div></div>';

    h +=   '<div style="flex:1 1 300px"><h3>Obra nova, esperando você definir</h3>' +

    h += '<dt>Loja</dt><dd>' + esc(o.loja) + '</dd>';
    h += '<dt>Chamado</dt><dd>' + esc(o.desc) + '</dd>';
    h += '<dt>Tipo</dt><dd>' + esc(o.tipo) + '</dd>';
    h += '<dt>Valor</dt><dd class="num">' + (o.valor == null
            ? '<span style="color:var(--accent)">ainda sem orçamento</span>' : moeda(o.valor)) + '</dd>';
    h += '<dt>Analista</dt><dd>' + esc(o.analista) + '</dd>';
    h += '<dt>Origem</dt><dd>' + esc(o.origem) + '</dd>';
    h += '<dt>Aprovada em</dt><dd class="num">' + br(o.aprovacao) + '</dd>';
    h += '</dl></div></div>';

    h += '<div class="box"><div class="box-h">Como esta obra apareceu aqui</div><div class="box-b">';
    h += '<p style="margin:0 0 8px;font-size:12.5px;color:var(--ink-dim)">A obra é aprovada pelo cliente, alguém abre a OS no Field ' +
         'e o sistema traz a linha para a base sozinho — com o que o Field tem, que é pouco.</p>';
    h += '<div class="placeholder"><b>O Field não manda</b> responsável, equipe, prioridade nem cronograma. ' +
         'Por isso a obra para aqui antes de virar rotina de diário.</div>';
    h += '</div></div>';

    h += '</div><div>';

    h += '<div class="box"><div class="box-h">O que falta definir</div><div class="box-b tri-campos">';

    h += '<div class="campo' + (t.resp ? " ok" : "") + '"><span class="rot"><span class="mk">' +
         (t.resp ? "&#10003;" : "1") + '</span><span>Responsável da obra</span></span>' +

    h += '<div class="campo' + (t.equipe ? " ok" : "") + '"><span class="rot"><span class="mk">' +
         (t.equipe ? "&#10003;" : "2") + '</span><span>Equipe / prestador</span></span>' +
         '<select data-tri="equipe" aria-label="Equipe ou prestador">' + opcoes(EQUIPES, t.equipe, "— escolher —") + '</select></div>';

    h += '<div class="campo' + (t.prioridade ? " ok" : "") + '"><span class="rot"><span class="mk">' +
         (t.prioridade ? "&#10003;" : "3") + '</span><span>Prioridade</span></span>' +
         '<select data-tri="prioridade" aria-label="Prioridade">' + opcoes(["Normal","Urgente"], t.prioridade, "— escolher —") + '</select></div>';

    h += '<div class="campo' + (t.inicio ? " ok" : "") + '"><span class="rot"><span class="mk">' +

    h += '</div></div>';

    /* AUTORIZAÇÃO — fora do checklist de propósito. Os cinco campos de cima
       travam a obra; este não trava nada. Obra com OS aprovada não precisa de
       liberação nenhuma, e obrigar o campo faria alguém inventar um nome só
       para destravar a tela — que é exatamente o tipo de dado falso que este
       sistema existe para não ter. */
    h += '<div class="box"><div class="box-h">Autorização para executar</div><div class="box-b">';
    h += '<p style="margin:0 0 10px;font-size:12.5px;color:var(--ink-dim)">' +
         (o.osAprovada

              'DPSP autorizou começar mesmo assim, registre aqui quem foi e quando. É o que hoje ninguém ' +
              'anota em lugar nenhum — e sem isso a obra vai para campo sem ninguém nomeado que tenha ' +

    h += '<div class="campo' + (t.libPor ? " ok" : "") + '"><span class="rot"><span class="mk">' +

         '<select data-tri="libPor" aria-label="Liberado por">' +

         (t.libEm ? "&#10003;" : "&#183;") + '</span><span>Data da liberação</span></span>' +

         '<b>às 18h</b> — inclusive a de definir a obra que chegou. A tela continua sendo onde a resposta fica guardada.</p>';
    h += '</div></div>';
    h += fbPor("decD");

    document.getElementById("ficha").innerHTML = h;
  }

  function textoFaltam(faltam){
    return faltam
      ? "Faltam " + faltam + (faltam === 1 ? " campo" : " campos") + ". Enquanto isso a obra não aparece para ninguém responder."
      : "Pronta. Ao liberar, ela entra na base como Levantamento e passa a ser cobrada todo dia.";
  }

  function atualizarTriagem(){
    var o = PORID[obraAberta];
    if(!o || o.etapa !== "definir") return;
    var t = tri(o), faltam = faltamTri(o);
    var campos = document.querySelectorAll("#ficha .tri-campos .campo");
    CAMPOS_TRI.forEach(function(c, i){
      var el = campos[i];
      if(!el) return;
      var cheio = !!t[c.k];
      el.classList.toggle("ok", cheio);
      el.querySelector(".mk").innerHTML = cheio ? "&#10003;" : String(i + 1);
    });
    var cont = document.querySelector("#ficha .triagem-aviso .cont");
    if(cont) cont.textContent = (CAMPOS_TRI.length - faltam) + " de " + CAMPOS_TRI.length + " preenchidos";
    var btn = document.getElementById("btn-liberar");
    if(btn){
      btn.disabled = faltam > 0;
      var hint = btn.parentNode.querySelector(".hint");
      if(hint) hint.textContent = textoFaltam(faltam);
    }
  }

  function liberarObra(o){
    if(!o || o.etapa !== "definir" || faltamTri(o)) return;
    var t = tri(o);
    o.pcm = t.resp;
    o.equipe = t.equipe;
    o.prioridade = t.prioridade;
    o.inicioPlan = t.inicio;
    o.duracao = parseInt(t.duracao, 10);
    o.liberadoPor = t.libPor || null;
    o.liberadoEm = t.libPor ? (t.libEm || DIA_REF) : null;
    o.etapa = "levantamento";
    o.atualizacao = DIA_REF;
    o.pendencia = "Finalizar levantamento, confirmar material e programar a equipe";
    o.pendResp = t.resp;
    o.proxAcao = "Concluir levantamento";
    o.fimCalc = somaDias(o.inicioPlan, o.duracao);
    o.atraso = diasDesde(o.fimCalc);
    FILA = OBRAS.filter(function(x){ return x.pcm === "YURI" && !posCampo(x); });
    renderDiario();
    montarFiltros();
    irPara("base");
  }

  function streakHTML(a){
    return '<div class="streak" role="img" aria-label="Últimos dez dias úteis de ' + esc(a.nome) + ': ' +
      a.dias.filter(function(d){ return d === "falta"; }).length + ' sem registro">' +
      a.dias.map(function(d, i){
        return '<i class="' + d + (i === a.dias.length - 1 ? " hoje" : "") + '" title="' + DIAS_UTEIS[i] +
               (d === "ok" ? " · preencheu" : " · não preencheu") + '"></i>';
      }).join("") + '</div>';
  }

  function situacaoHTML(a){
    if(!a.hora){
      return '<span style="color:var(--warn);font-weight:600">Em falta desde hoje</span>' +
             '<div class="pl-sub">' + esc(a.nota) + '</div>';
    }
    return '<span style="color:var(--ink)">Em dia há <b class="num">' + a.desde + '</b> dias úteis</span>' +
           '<div class="pl-sub">' + esc(a.nota) + '</div>';
  }

         '</div>';

    h += '<p class="adm-fonte">As obras por analista vêm da planilha DPSP Rev.02. O histórico de preenchimento é ' +
         '<b>exemplo</b>: hoje esse dado não existe em lugar nenhum — é justamente ele que este painel passa a guardar.</p>';

    h += fbPor("telaAdm");

    /* DECISÃO F — respondida pelo cliente em 01/09/2026: "não, só atualiza".
       O aviso não escala e não muda de forma; o que muda é o número dentro dele. */
    h += '<div class="decisao fechada"><span class="tag">DECISÃO F</span><div>';
    h +=   '<p><span class="resp">Resolvida — você respondeu</span><b>O aviso não muda, só atualiza.</b> ' +
             'Todo dia às 19h sai o mesmo aviso para os administradores, ' +
             'com o número de dias seguidos escrito nele ("2º dia sem registro"), e o painel guarda a contagem. ' +
             'Nada é bloqueado e nada sobe sozinho para mais ninguém: quem decide agir é quem lê o número.</p>';
    h +=   '<p class="opt">É a mesma linha da DECISÃO C, um andar acima: o sistema <b>registra e mostra</b>, ' +
             'em vez de <b>forçar alguém a agir</b>. A falta repetida aparece como número que cresce, ' +
             'não como cobrança que muda de tom.</p>';
    h += '</div></div>';
    h += fbPor("decF");

    el.innerHTML = h;
  }

  /* ---------------------------------------------------------------
     TELA 5 — Tarefas
     Por que aba própria, e não uma seção do Painel do dia: o Painel do dia
     só existe para o administrador (a aba fica escondida no papel de
     analista). Mas o roteamento manda ferramenta e equipe para o YURI, que é
     analista — se as tarefas morassem lá dentro, o dono da maior parte delas
     nunca veria a própria lista. Aba própria, visível nos dois papéis.
     No Painel do dia fica o resumo: os números que o dono lê de relance.
     --------------------------------------------------------------- */

  function tchipHTML(t){
    var s = sitTarefa(t);
    if(s === "respondida"){
      return '<span class="tchip ok"><span class="dot"></span>Respondida em ' +
             br(t.respostaEm).slice(0,5) + ' às ' + t.respostaHora + '</span>';
    }
    if(s === "vencida"){
      var dv = diasVencida(t);
      return '<span class="tchip venc"><span class="dot"></span>Venceu há ' + dv +
             (dv === 1 ? " dia" : " dias") + '</span>';
    }
    return '<span class="tchip"><span class="dot"></span>Esperando resposta</span>';
  }

  /* A conversa como ela chega no celular da pessoa. É a convenção que você
     elogiou no aviso das 19h — mostrar a mensagem, não descrevê-la — aplicada
     ao canal em que a cobrança acontece de verdade. */
  function zapHTML(t){
    var p = pessoaDe(t.dono);
    var h = '<div class="zap">';
    h += '<div class="zap-h"><span class="av">' + esc(p.ini) + '</span>' +
           '<span><span class="nm">' + esc(p.nome) + '</span>' +
           '<span class="fn">' + esc(p.fn) + ' · ' + esc(p.fone) + '</span></span>' +
           '<span class="lin">' + esc(NUMERO_AGENTE) + '</span></div>';
    h += '<div class="zap-corpo">';
    t.msgs.forEach(function(m, i){
      var nos = m.de === "agente";
      var cls = "zap-b " + (nos ? "nos" : "dela") + (m.anat ? " anat" : "");
      h += '<div class="' + cls + '">';
      if(i === 0 || t.msgs[i-1].de !== m.de){
        h += '<span class="quem">' + (nos ? "Assistente Manfac Obras" : esc(p.nome)) + '</span>';
      }
      h += m.texto;
      h += '<span class="hr">' + esc(m.dia) + ' · ' + esc(m.hora) + '</span>';
      if(m.anat){
        h += '<ol class="anat-leg">' +
             '<li><span class="n">1</span>chama pelo nome</li>' +
             '<li><span class="n">2</span>diz de onde veio</li>' +
             '<li><span class="n">3</span>diz o que fazer</li>' +
             '<li><span class="n">4</span>pede resposta</li>' +
             '<li><span class="n">5</span>dá prazo</li>' +
             '</ol>';
      }
      h += '</div>';
    });
    if(t.esperando){
      h += '<div class="zap-esperando"><i></i>esperando a resposta · a tarefa fecha sozinha quando ela chegar</div>';
    }
    h += '</div>';
    if(t.pe) h += '<div class="zap-pe">' + t.pe + '</div>';
    h += '</div>';
    return h;
  }

  function tarefaHTML(t, comConversa){
    var o = PORID[t.obra];
    if(!o) return "";
    var s = sitTarefa(t);
    var d = destinoDe(t.item);
    var dias = diasNaMao(t);
    var h = '<article class="tarefa" style="--tc:' + corTarefa(t) + '">';
    h += '<div class="tarefa-h"><div class="tarefa-id">';
    h +=   '<div class="tarefa-os">OS ' + esc(o.os) + ' · ' + esc(o.tipo) + '</div>';
    h +=   '<button type="button" class="tarefa-loja" data-abrir="' + o.id + '">' + esc(o.loja) + '</button>';
    h +=   '<p class="tarefa-o">Faltou <b>' + esc(t.item.toLowerCase()) + '</b> · registrado por <b>' +
             esc(pessoaDe(t.registrou).nome.split(" ")[0]) + '</b> em <b>' + br(t.aberta).slice(0,5) +
             '</b> · o que fazer: ' + esc(d ? d.acao : "resolver") + '</p>';
    h += '</div><div class="tarefa-sit">' + tchipHTML(t);
    h +=   '<span class="tarefa-prazo">Prazo <b>' +
             (t.prazo === t.aberta ? "fim do dia " + br(t.prazo).slice(0,5) : "fim do dia " + br(t.prazo).slice(0,5)) +
             '</b>' + (s === "respondida" ? "" : ' · na mão do ' + esc(pessoaDe(t.dono).nome.split(" ")[0]) +
             ' há <b>' + dias + (dias === 1 ? " dia" : " dias") + '</b>') + '</span>';
    h += '</div></div>';
    if(t.resumo && s === "respondida"){
      h += '<div class="abriu"><span class="ck">&#10003;</span><span>Resolvido: <b>' + esc(t.resumo) + '</b></span></div>';
    }
    if(comConversa !== false) h += zapHTML(t);
    h += '</article>';
    return h;
  }

  function grupoDonoHTML(chave, lista){
    var p = pessoaDe(chave);
    var venc = lista.filter(function(t){ return sitTarefa(t) === "vencida"; }).length;
    var h = '<div class="grupo-dono' + (p.area === "Compras" ? " compras" : "") + '">';
    h += '<span class="av">' + esc(p.ini) + '</span>';
    h += '<span><span class="nm">' + esc(p.nome) + '</span>' +
           '<span class="fn">' + esc(p.area) + ' · ' + esc(p.fn) + '</span></span>';
    h += '<span class="ct"><b>' + lista.length + '</b> ' +
           (lista.length === 1 ? "tarefa na mão dele" : "tarefas na mão dele") +
           (venc ? ' · <b style="color:var(--warn)">' + venc + '</b> ' + (venc === 1 ? "vencida" : "vencidas") : "") +
         '</span>';

  function rotaHTML(){
    var h = '<div class="tabela-wrap"><table class="rota">';
    h += '<thead><tr><th scope="col">Faltou</th><th scope="col">A tarefa vai para</th>' +
         '<th scope="col">E a cobrança pede</th></tr></thead><tbody>';
    ITENS.slice(1).forEach(function(it){
      var r = ROTA_FALTA[it];
      if(!r) return;
      var p = pessoaDe(r.chave);
      h += '<tr><td class="it">' + esc(it) + '</td>' +
           '<td class="pes"><b>' + esc(p.area) + ' — ' + esc(p.nome.split(" ")[0]) + '</b>' +
           (r.nosso ? '<span class="marca-nossa">padrão nosso</span>' : "") + '</td>' +
           '<td class="pes">' + esc(r.acao) + '</td></tr>';
    });
    /* A foto é a única falta cuja cobrança sai da Manfac e vai para a ponta.
       Por isso ela não sai da lista de itens do diário — ela não é um botão,
       é o anexo que não veio. */
    h += '<tr><td class="it">Foto do dia</td>' +
         '<td class="pes"><b>Equipe em campo — a equipe definida na obra</b>' +
         '<span class="marca-nossa">padrão nosso</span></td>' +
         '<td class="pes">' + esc(ROTA_FALTA["Foto"].acao) + '</td></tr>';
    h += '</tbody></table></div>';
    return h;
  }

  /* A tarefa colada na falta que a gerou, dentro da linha do tempo da ficha.
     É onde a pergunta "tá na mão de quem?" é feita olhando a obra. */
  function tlTarefaHTML(t){
    var p = pessoaDe(t.dono);
    var s = sitTarefa(t);
    var fim;
    if(s === "respondida"){
      fim = 'respondida em ' + br(t.respostaEm).slice(0,5) + ' às ' + t.respostaHora +
            (t.resumo ? ' — ' + esc(t.resumo) : "");
    } else if(s === "vencida"){
      var dv = diasVencida(t);
      fim = 'sem resposta há <b>' + dv + (dv === 1 ? " dia" : " dias") + '</b>';
    } else {
      fim = 'esperando resposta';

    return '<div class="tl-tarefa" style="--tc:' + corTarefa(t) + '">' +
      '<span class="t">Tarefa que esta falta gerou</span>' +
      '<b>' + esc(p.area) + ' · ' + esc(p.nome) + '</b> · prazo fim do dia ' +
      br(t.prazo).slice(0,5) + ' · ' + fim + '</div>';
  }
