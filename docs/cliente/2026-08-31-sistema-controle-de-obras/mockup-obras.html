             'mensagem que faz alguém abrir a tela.</p>';
    h +=   '<p class="opt"><b>Qual dos três?</b> Se ficar em silêncio, vale o primeiro.</p>';
    h += '</div></div>';
    h += fbPor("decI");

    /* DECISÃO J — o destino que faltava na sua lista. */
    h += '<div class="decisao"><span class="tag">DECISÃO J</span><div>';
    h +=   '<p>Faltou dizer para quem vai a tarefa quando o analista marca <b>documento / ART</b> ou ' +
             '<b>outro</b>. Os dois estão na lista de faltas do diário e você não citou nenhum.</p>';
    h +=   '<p class="opt"><em>Adotado por padrão — os dois vão para o Yuri:</em> ' +
             '<b>documento / ART</b> porque o documento depende do engenheiro responsável e de contrato, ' +
             'e é a Manfac que resolve, não Compras. <b>Outro</b> porque é justamente o caso em que o sistema ' +
             'não sabe classificar — e quem já é o roteador do sistema é ele, pela <b>decisão D</b> ' +
             '("quem direciona é o Yuri"). Ele lê o que foi registrado e reencaminha.</p>';
    h +=   '<p class="opt"><em>Alternativa:</em> "outro" não gera tarefa nenhuma, só fica registrado. ' +
             'Mais leve, e é o que acontece hoje. O preço é o buraco que você quer fechar: ' +
             'a falta que ninguém classificou é exatamente a que some.</p>';
    h += '</div></div>';
    h += fbPor("decJ");

    el.innerHTML = h;
  }

  /* ---------------------------------------------------------------
     Eventos (delegados no #app, que é sempre reconstruído por JS)
     --------------------------------------------------------------- */
  var app = document.getElementById("app");

  app.addEventListener("click", function(e){
    var t;

    t = e.target.closest("[data-retry]");
    if(t){ estadoTela = "normal"; var sel = document.getElementById("sel-estado"); if(sel) sel.value = "normal"; renderDiario(); return; }

    t = e.target.closest("[data-ir-definir]");
    if(t){ fPcm = "todos"; fEtapa = "definir"; montarFiltros(); irPara("base"); return; }

    if(e.target.closest("#btn-liberar")){ liberarObra(PORID[obraAberta]); return; }

    t = e.target.closest("[data-tela]");
    if(t){ irPara(t.dataset.tela); return; }

    t = e.target.closest("[data-abrir]");
    if(t){ abrirFicha(t.dataset.abrir, (tela === "diario" || tela === "tarefas") ? tela : "base"); return; }

    if(e.target.closest("#voltar")){ irPara(voltarPara); return; }
    if(e.target.closest("#btn-tabela")){ setVis("tabela"); return; }
    if(e.target.closest("#btn-kanban")){ setVis("kanban"); return; }
    if(e.target.closest("#btn-cartoes")){ setForma("cartoes"); return; }
    if(e.target.closest("#btn-planilha")){ setForma("planilha"); return; }
    if(e.target.closest("#salvar-tudo")){ salvarTudo(); return; }

    /* Chips dentro de uma linha da planilha (DECISÃO B, forma 2) */
    var linha = e.target.closest("tr[data-linha]");
    if(linha){
      /* "+ anexar foto do dia" na lista única. No mockup ele só marca que a
         foto do dia veio — o arquivo em si é placeholder. */
      var fotoL = e.target.closest(".obs-btn.foto");
      if(fotoL){
        var dF = rasc(PORID[linha.dataset.linha]);
        dF.foto = !dF.foto;
        fotoL.setAttribute("aria-pressed", dF.foto ? "true" : "false");
        fotoL.textContent = dF.foto ? "✓ foto anexada" : "+ foto do dia";
        return;
      }
      var chipL = e.target.closest(".chip");
      if(chipL){
        var oL = PORID[linha.dataset.linha], dL = rasc(oL);
        var vL = chipL.dataset.valor;
        dL.andou = (dL.andou === vL) ? null : vL;
        if(dL.andou !== "Não") dL.motivo = null;
        Array.prototype.forEach.call(linha.querySelectorAll('.chip[data-grupo="andou"]'), function(c){
          c.setAttribute("aria-pressed", c.dataset.valor === dL.andou ? "true" : "false");
        });
        var selM = linha.querySelector('select[data-grupo="motivo"]');
        if(selM && dL.motivo === null) selM.value = "";
        atualizarPlanilha();
        return;
      }
    }

    t = e.target.closest("#thead-row button[data-col]");
    if(t){
      var k = t.dataset.col;
      if(ordem.col === k) ordem.dir = -ordem.dir; else { ordem.col = k; ordem.dir = 1; }
      renderBase();
      return;
    }

    t = e.target.closest("[data-desfazer]");
    if(t){ desfazer(t.dataset.desfazer); return; }

    var card = e.target.closest(".obra");
    if(!card) return;
    var o = PORID[card.dataset.id], d = rascunho[o.id];

    var chip = e.target.closest(".chip");
    if(chip){
      var g = chip.dataset.grupo, v = chip.dataset.valor;
      d[g] = (d[g] === v) ? null : v;
      if(g === "andou"){
        /* "Sim" zera o motivo: sem isso a tela guardaria um motivo de parada
           numa obra que andou. */
        if(d.andou !== "Não"){ d.motivo = null; }
      }
      ["andou","item","motivo"].forEach(function(grupo){
        Array.prototype.forEach.call(card.querySelectorAll('.chip[data-grupo="' + grupo + '"]'), function(c){
          c.setAttribute("aria-pressed", c.dataset.valor === d[grupo] ? "true" : "false");
        });
      });
      atualizarCard(card);
      return;
    }

    /* A foto do dia. Vem antes do "+ observação" porque as duas dividem a
       mesma classe de botão — sem esta checagem, anexar foto abriria a
       observação. */
    var btnFoto = e.target.closest(".obs-btn.foto");
    if(btnFoto){
      d.foto = !d.foto;
      btnFoto.setAttribute("aria-pressed", d.foto ? "true" : "false");
      btnFoto.textContent = d.foto ? "✓ foto do dia anexada" : "+ anexar foto do dia";
      return;
    }

    if(e.target.closest(".obs-btn")){
      d.obsAberta = true;
      card.querySelector(".obs-btn").hidden = true;
      var inp = card.querySelector(".obs-in");
      inp.hidden = false;
      inp.focus();
      return;
    }

    if(e.target.closest(".salvar")) salvar(o, card);
  });

  app.addEventListener("change", function(e){
    if(e.target.id === "sel-estado"){ estadoTela = e.target.value; renderDiario(); return; }
    if(e.target.id === "sel-quem"){ setPapel(e.target.value); return; }

    var linhaC = e.target.closest && e.target.closest("tr[data-linha]");
    if(linhaC && e.target.dataset && e.target.dataset.grupo){
      var oC = PORID[linhaC.dataset.linha];
      rasc(oC)[e.target.dataset.grupo] = e.target.value || null;
      atualizarPlanilha();
      return;
    }

    if(e.target.dataset && e.target.dataset.tri){
      tri(PORID[obraAberta])[e.target.dataset.tri] = e.target.value;
      atualizarTriagem();
      return;
    }
    if(e.target.id === "f-pcm"){ fPcm = e.target.value; renderBase(); return; }
    if(e.target.id === "f-etapa"){ fEtapa = e.target.value; renderBase(); return; }
    if(e.target.id === "f-os"){ fOs = e.target.value; renderBase(); return; }
    if(e.target.id === "f-mau"){ fMau = e.target.value; renderBase(); return; }
    if(e.target.dataset && e.target.dataset.fbVoto){
      var id = e.target.dataset.fbVoto;
      fbDe(id).voto = e.target.value;
      agendarPublicacao(id);
      return;
    }
  });

  app.addEventListener("input", function(e){
    if(e.target.classList && e.target.classList.contains("obs-in")){
      var card = e.target.closest(".obra");
      if(card){ rasc(PORID[card.dataset.id]).obs = e.target.value; return; }
      var linhaI = e.target.closest("tr[data-linha]");
      if(linhaI) rasc(PORID[linhaI.dataset.linha]).obs = e.target.value;
    }
  });

  app.addEventListener("focusout", function(e){
    var el = e.target;
    if(el && el.dataset && el.dataset.fbTexto){
      var id = el.dataset.fbTexto;
      var texto = (el.innerText || "").trim();
      if(texto !== (fbDe(id).texto || "")){
        fbDe(id).texto = texto;
        agendarPublicacao(id);
      }
    }
  });

  /* ---------------------------------------------------------------
     Início
     --------------------------------------------------------------- */
  app.innerHTML = shellHTML();
  montarFiltros();
  setForma(formaDiario);
  setVis("tabela");
  setPapel(papel);

  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(ns){
      if(!ns) return;               // sem capability: a página segue sem os campos
      artefato = ns;
      mostrarCamposFb();
    }, function(){ /* indisponível: segue sem os campos */ });
  }
})();
</script>
