<title>Diário de Obras Manfac</title>
<style data-pagina>
  :root{
    /* Tema do hub Manfac — escuro por decisão, sem variante clara */
    --bg:#0a1628;
    --panel:#0b1b36;
    --panel-2:#0d2050;
    --line:#1e3a5f;
    --line-soft:#162c4a;
    --ink:#e9f0fa;
    --ink-dim:#94a3b8;
    --ink-faint:#64748b;
    --accent:#f05a28;
    --accent-soft:rgba(240,90,40,.14);
    --ok:#35c98a;
    --ok-soft:rgba(53,201,138,.13);
    --warn:#f4b73f;
    --warn-soft:rgba(244,183,63,.13);
    --crit:#ff4d6d;
    --crit-soft:rgba(255,77,109,.14);
    --info:#5aa9f0;
    --info-soft:rgba(90,169,240,.13);

    --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

    --r:8px;
    --r-sm:5px;
  }

  *{box-sizing:border-box}
  /* precisa vir depois de qualquer display: garante que hidden esconde mesmo */
  [hidden]{display:none !important}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .lbl{
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:600;
  }

  /* ---------- Shell ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:var(--panel-2);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:10px 20px;
  }
  .brand{display:flex;align-items:baseline;gap:9px;margin-right:4px}
  .brand b{font-size:14px;letter-spacing:-.01em}
  .brand span{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint)}
  .tabs{display:flex;flex-wrap:wrap;gap:2px;background:rgba(0,0,0,.22);padding:3px;border-radius:var(--r);border:1px solid var(--line-soft)}
  .tabs button{
    background:none;border:0;padding:6px 13px;border-radius:var(--r-sm);
    color:var(--ink-dim);font-size:13px;font-weight:500;white-space:nowrap;
  }
  .tabs button[aria-current="true"]{background:var(--accent);color:#fff;font-weight:600}
  .tabs button:hover:not([aria-current="true"]){color:var(--ink);background:rgba(255,255,255,.05)}
  /* Contador de tarefas abertas na aba. Ele é o que faz alguém clicar ali. */
  .tabs button b{
    display:inline-block;margin-left:6px;padding:0 6px;border-radius:99px;
    font-size:10.5px;font-weight:700;line-height:16px;vertical-align:1px;
    color:var(--accent);background:rgba(240,90,40,.16);border:1px solid rgba(240,90,40,.42);
  }
  .tabs button b.venc{color:var(--warn);background:var(--warn-soft);border-color:rgba(244,183,63,.5)}
  .tabs button[aria-current="true"] b{color:#fff;background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.35)}
  .who{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--ink-dim);font-size:12px}
  .who .av{
    width:26px;height:26px;border-radius:50%;background:var(--accent-soft);
    border:1px solid rgba(240,90,40,.4);color:var(--accent);
    display:grid;place-items:center;font-size:11px;font-weight:700;
  }

  main{max-width:1220px;margin:0 auto;padding:22px 20px 90px}

  .page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .page-head h1{font-size:20px;margin:0 0 3px;letter-spacing:-.015em;text-wrap:balance}
  .page-head p{margin:0;color:var(--ink-dim);font-size:13px}
  .page-head .demo{margin-left:auto;display:flex;align-items:center;gap:8px}
  .page-head .demo select{
    background:rgba(0,0,0,.25);border:1px dashed var(--line);border-radius:var(--r-sm);
    padding:5px 8px;font-size:12px;color:var(--ink-dim);
  }

  /* ---------- Contador da fila ---------- */
  .fila-status{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:13px 16px;margin-bottom:18px;
  }
  .fila-status .big{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1;color:var(--accent)}
  .fila-txt{font-size:13px;color:var(--ink-dim)}
  .barra{flex:1 1 180px;min-width:120px;height:5px;background:var(--line-soft);border-radius:99px;overflow:hidden}
  .barra i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}

  /* ---------- Cards de obra (diário) ---------- */
  .fila{display:flex;flex-direction:column;gap:12px}
  .obra{
    position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);border-left:3px solid var(--sev,var(--line));
    padding:14px 16px 14px 15px;
    transition:opacity .25s ease,transform .25s ease;
  }
  .obra.saindo{opacity:0;transform:translateY(-6px)}
  .obra-head{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .obra-id{min-width:0;flex:1 1 300px}
  .obra-os{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.02em}
  .obra-loja{
    font-size:15px;font-weight:650;letter-spacing:-.01em;margin:1px 0 4px;
    background:none;border:0;padding:0;text-align:left;color:var(--ink);
  }
  .obra-loja:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  .obra-desc{color:var(--ink-dim);font-size:12.5px;margin:0 0 6px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-dim)}
  .meta b{color:var(--ink);font-weight:600}

  /* coluna de sinais: no máximo duas linhas, alinhadas, sem repetir número */
  .obra-sinais{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:0 1 auto;max-width:400px}
  .sinal-linha{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
  .nota{
    width:100%;text-align:right;border-radius:var(--r-sm);padding:4px 9px;
    font-size:11.5px;font-weight:600;border:1px solid;
  }
  .nota .n{font-family:var(--mono)}
  .nota.crit{color:var(--crit);background:var(--crit-soft);border-color:rgba(255,77,109,.38)}
  .nota.warn{color:var(--warn);background:var(--warn-soft);border-color:rgba(244,183,63,.32)}
  @media (max-width:640px){
    .obra-sinais{align-items:flex-start;max-width:none;width:100%}
    .sinal-linha{justify-content:flex-start}
    .nota{text-align:left}
  }

  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;
    letter-spacing:.02em;white-space:nowrap;border:1px solid transparent;
  }
  .pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .pill.andamento{color:var(--ok);background:var(--ok-soft);border-color:rgba(53,201,138,.3)}
  .pill.paralisado{color:var(--crit);background:var(--crit-soft);border-color:rgba(255,77,109,.32)}
  .pill.levantamento{color:var(--info);background:var(--info-soft);border-color:rgba(90,169,240,.3)}
  .pill.relatorio{color:var(--info);background:var(--info-soft);border-color:rgba(90,169,240,.3)}
  .pill.aprovarOS{color:var(--crit);background:var(--crit-soft);border-color:rgba(255,77,109,.32)}
  .pill.fecharOS{color:var(--warn);background:var(--warn-soft);border-color:rgba(244,183,63,.32)}
  .pill.pendFat{color:var(--warn);background:var(--warn-soft);border-color:rgba(244,183,63,.32)}
  .pill.faturado{color:var(--ink-dim);background:rgba(148,163,184,.1);border-color:var(--line)}

  /* A obra carrega desde o começo se tem ou não OS aprovada no sistema do
     cliente. Sem OS aprovada, executar é risco de faturamento — por isso o
     rótulo não é neutro. */
  .os-chip{
    display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
    letter-spacing:.03em;padding:2px 7px;border-radius:99px;border:1px solid;white-space:nowrap;
  }
  .os-chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
  .os-chip.sim{color:var(--ok);background:var(--ok-soft);border-color:rgba(53,201,138,.3)}
  .os-chip.nao{color:var(--crit);background:var(--crit-soft);border-color:rgba(255,77,109,.4)}

  /* LIBERAÇÃO PARA EXECUTAR — o segundo destravamento, ao lado da OS.
     Liberada sem OS é âmbar: dá para trabalhar, mas a OS precisa ser cobrada,
     e há um nome a quem recorrer. Sem OS e sem liberação é "sem cobertura":
     nem documento nem nome, e por isso pesa igual à obra crítica. */
  .os-chip.lib{color:var(--warn);background:var(--warn-soft);border-color:rgba(244,183,63,.42)}
  .os-chip.cob{color:var(--crit);background:rgba(255,77,109,.2);border-color:var(--crit);font-weight:700}

  /* MAU USO é CLASSIFICAÇÃO, não etapa. Por isso a etiqueta é neutra e anda
     ao lado da pílula de etapa, nunca no lugar dela. */
  .pill.mauuso{color:var(--ink-dim);background:rgba(148,163,184,.12);border-color:var(--line)}

  td.dono{color:var(--ink-dim);font-size:12px;white-space:nowrap}
  .parada{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-dim)}
  .parada small{font-family:var(--sans);font-size:10.5px}
  .parada.alto{color:var(--warn);font-weight:700}
  .pill.definir{color:var(--accent);background:var(--accent-soft);border-color:rgba(240,90,40,.42)}

  .dias{
    display:inline-flex;align-items:baseline;gap:5px;padding:3px 9px;border-radius:99px;
    font-family:var(--mono);font-size:11px;font-weight:600;white-space:nowrap;
    border:1px solid var(--line);color:var(--ink-dim);background:rgba(0,0,0,.18);
  }
  .dias.atencao{color:var(--warn);border-color:rgba(244,183,63,.35);background:var(--warn-soft)}
  .dias.critico{color:var(--crit);border-color:rgba(255,77,109,.4);background:var(--crit-soft)}
  .dias small{font-family:var(--sans);font-weight:500;font-size:10.5px;letter-spacing:.02em;opacity:.85}

  .pend{
    margin-top:10px;font-size:12.5px;color:var(--ink-dim);
    border-left:2px solid var(--line);padding-left:10px;
  }
  .pend b{color:var(--ink);font-weight:600}

  /* ---------- Perguntas ---------- */
  .perguntas{
    margin-top:13px;padding-top:13px;border-top:1px dashed var(--line-soft);
    display:flex;flex-direction:column;gap:11px;
  }
  .q{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
  .q > .lbl{flex:0 0 130px}
  @media (max-width:640px){.q > .lbl{flex:1 1 100%}}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    background:rgba(0,0,0,.2);border:1px solid var(--line);color:var(--ink-dim);
    padding:6px 12px;border-radius:var(--r-sm);font-size:12.5px;font-weight:500;
    transition:background .12s ease,color .12s ease,border-color .12s ease;
  }
  .chip:hover{border-color:#2b4f7d;color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .chip.sim[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#04231a}
  .chip.nao[aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:#2a0410}

  .obs-linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .obs-btn{
    background:none;border:0;color:var(--ink-faint);font-size:12px;padding:2px 0;
    text-decoration:underline;text-underline-offset:3px;text-decoration-style:dotted;
  }
  .obs-btn:hover{color:var(--accent)}
  .obs-in{
    flex:1 1 260px;background:rgba(0,0,0,.25);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:7px 10px;font-size:13px;
  }
  .obs-in::placeholder{color:var(--ink-faint)}

  /* Contador de dias parados — informa, nunca trava o salvamento */
  .contador{
    display:flex;gap:7px 16px;flex-wrap:wrap;align-items:baseline;
    border:1px solid rgba(244,183,63,.3);background:var(--warn-soft);
    border-radius:var(--r-sm);padding:8px 11px;font-size:12px;color:var(--ink-dim);
  }
  .contador b{font-family:var(--mono);color:var(--warn);font-size:13.5px;font-weight:700}
  .contador .obs{color:var(--ink-faint);font-size:11.5px;flex:1 1 220px}

  .acoes{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:2px}
  .btn{
    background:var(--accent);border:1px solid var(--accent);color:#fff;font-weight:600;
    padding:8px 16px;border-radius:var(--r-sm);font-size:13px;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{background:transparent;color:var(--ink-faint);border-color:var(--line);cursor:not-allowed;filter:none}
  .btn.ghost{background:transparent;color:var(--ink-dim);border-color:var(--line);font-weight:500}
  .btn.ghost:hover{color:var(--ink);border-color:#2b4f7d;filter:none}
  .hint{font-size:12px;color:var(--ink-faint)}
  .hint.alerta{color:var(--warn)}

  /* Respondidas */
  .feitas{margin-top:26px}
  .feitas h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 9px;font-weight:600}
  .feita{
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    background:rgba(53,201,138,.05);border:1px solid var(--line-soft);
    border-left:3px solid var(--ok);border-radius:var(--r-sm);padding:8px 12px;margin-bottom:6px;
  }
  .feita .ck{color:var(--ok);font-weight:700}
  .feita .nm{font-weight:600;font-size:13px}
  .feita .rs{color:var(--ink-dim);font-size:12px}
  .feita .un{margin-left:auto}

  /* ---------- Estados da tela 1 ---------- */
  .sucesso{
    border:1px solid rgba(53,201,138,.4);background:rgba(53,201,138,.07);
    border-radius:var(--r);padding:26px 22px;text-align:center;
  }
  .sucesso .mark{
    width:42px;height:42px;border-radius:50%;margin:0 auto 12px;
    display:grid;place-items:center;font-size:20px;font-weight:700;
    color:#04231a;background:var(--ok);
  }
  .sucesso h2{margin:0 0 6px;font-size:17px;color:var(--ok);letter-spacing:-.01em}
  .sucesso p{margin:0 auto;max-width:52ch;color:var(--ink-dim);font-size:13px}
  .sucesso .placar{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;
  }
  .sucesso .placar span{
    border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:99px;
    padding:5px 12px;font-size:12px;color:var(--ink-dim);
  }
  .sucesso .placar b{font-family:var(--mono);color:var(--ink);font-size:13px}

  .sk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .sk + .sk{margin-top:12px}
  .sk i{display:block;height:11px;border-radius:4px;background:var(--line-soft);margin-bottom:9px}
  .sk i.a{width:120px;height:9px}
  .sk i.b{width:44%}
  .sk i.c{width:70%;height:9px}
  .sk i.d{width:100%;height:30px;margin-bottom:0;margin-top:14px}
  .sk-pulso{animation:pulso 1.1s ease-in-out infinite}
  @keyframes pulso{0%,100%{opacity:.45}50%{opacity:.9}}
  .carregando-txt{color:var(--ink-faint);font-size:12.5px;margin:0 0 12px}

  .estado{
    border-radius:var(--r);padding:22px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;
    border:1px solid var(--line);background:var(--panel);
  }
  .estado .ico{
    flex:none;width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;
    font-size:17px;font-weight:700;
  }
  .estado h2{margin:0 0 6px;font-size:16px;letter-spacing:-.01em}
  .estado p{margin:0 0 4px;color:var(--ink-dim);font-size:13px;max-width:58ch}
  .estado .corpo{flex:1 1 260px}
  .estado .acoes{margin-top:12px}
  .estado.erro{border-color:rgba(255,77,109,.45);background:var(--crit-soft)}
  .estado.erro .ico{background:var(--crit);color:#2a0410}
  .estado.erro h2{color:var(--crit)}
  .estado.bloqueio .ico{background:rgba(148,163,184,.15);color:var(--ink-dim);border:1px solid var(--line)}

  /* ---------- Aviso da fila de definição ---------- */
  .aviso-def{
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;width:100%;
    border:1px solid rgba(240,90,40,.4);background:rgba(240,90,40,.07);
    border-radius:var(--r);padding:11px 14px;margin-bottom:14px;text-align:left;
  }
  .aviso-def .n{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--accent);line-height:1}
  .aviso-def .txt{font-size:12.5px;color:var(--ink-dim)}
  .aviso-def .txt b{color:var(--ink)}
  .aviso-def .ir{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:600;white-space:nowrap}
  .aviso-def:hover{border-color:var(--accent)}

  /* ---------- Triagem da obra nova ---------- */
  .triagem-aviso{
    display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;
    border:1px solid rgba(240,90,40,.42);background:rgba(240,90,40,.07);
    border-left:4px solid var(--accent);border-radius:var(--r);padding:14px 16px;margin-bottom:18px;
  }
  .triagem-aviso h3{margin:0 0 4px;font-size:14px;color:var(--accent)}
  .triagem-aviso p{margin:0;font-size:13px;color:var(--ink-dim);max-width:64ch}
  .triagem-aviso p b{color:var(--ink)}
  .triagem-aviso .cont{
    font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);
    border:1px solid rgba(240,90,40,.45);border-radius:99px;padding:3px 10px;white-space:nowrap;
  }
  .campo{
    display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;
    padding:11px 0;border-bottom:1px dashed var(--line-soft);
  }
  .campo:last-child{border-bottom:0}
  .campo > .rot{flex:0 0 168px;display:flex;align-items:center;gap:8px}
  .campo .mk{
    width:16px;height:16px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:10px;font-weight:700;border:1px solid var(--line);color:var(--ink-faint);
  }
  .campo.ok .mk{background:var(--ok);border-color:var(--ok);color:#04231a}
  .campo .rot span{font-size:12.5px;font-weight:600}
  .campo.ok .rot span{color:var(--ink-dim);font-weight:500}
  @media (max-width:640px){.campo > .rot{flex:1 1 100%}}
  .campo select,.campo input{
    background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:6px 9px;font-size:12.5px;color:var(--ink);
  }
  .campo input[type="number"]{width:88px}
  .campo .dica{font-size:11.5px;color:var(--ink-faint)}
  .liberar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}

  /* ---------- Caixas de decisão ---------- */
  .decisao{
    border:1px solid rgba(240,90,40,.35);background:rgba(240,90,40,.05);
    border-radius:var(--r);padding:12px 14px;margin:18px 0 0;
    display:flex;gap:13px;align-items:flex-start;
  }
  .decisao .tag{
    flex:none;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;
    color:var(--accent);border:1px solid rgba(240,90,40,.45);border-radius:var(--r-sm);
    padding:4px 8px;background:rgba(240,90,40,.1);white-space:nowrap;
  }
  .decisao p{margin:0 0 6px;font-size:13px;line-height:1.5}
  .decisao p:last-child{margin-bottom:0}
  .decisao .opt{font-size:12.5px;color:var(--ink-dim)}
  .decisao .opt b{color:var(--ink)}
  .decisao .opt em{color:var(--accent);font-style:normal;font-weight:600}

  /* Decisão já respondida: vira registro, não pergunta. Cor diferente
     para o cliente enxergar de longe o que ainda espera resposta dele. */
  .decisao.fechada{border-color:rgba(53,201,138,.32);background:rgba(53,201,138,.045)}
  .decisao.fechada .tag{color:var(--ok);border-color:rgba(53,201,138,.42);background:rgba(53,201,138,.1)}
  .decisao.fechada .opt em{color:var(--ok)}
  .decisao .resp{
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
    color:var(--ok);display:block;margin-bottom:4px;
  }

  /* Linha discreta sobre o caminho até o agente de IA */
  .nota-caminho{
    margin:0 0 16px;padding-left:10px;border-left:2px solid var(--line);
    color:var(--ink-faint);font-size:11.5px;line-height:1.55;max-width:78ch;
  }
  .nota-caminho b{color:var(--ink-dim);font-weight:600}

  /* ---------- Forma 2 do diário: lista única, formato planilha ---------- */
  .forma-barra{
    display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:10px 14px;margin-bottom:14px;
  }
  .forma-barra .expl{font-size:12px;color:var(--ink-faint);flex:1 1 240px}
  .planilha-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
  table.planilha{min-width:1000px}
  table.planilha tbody td{vertical-align:top;padding:10px 11px}
  table.planilha tbody tr.falta td{background:rgba(244,183,63,.06)}
  table.planilha tbody tr.pronta td{background:rgba(53,201,138,.05)}
  .pl-loja{background:none;border:0;padding:0;font-weight:650;font-size:13px;color:var(--ink);text-align:left}
  .pl-loja:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  .pl-os{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);display:block}
  .pl-sub{font-size:11.5px;color:var(--ink-faint);margin-top:3px}
  .planilha .chips{gap:5px}
  .planilha .chip{padding:5px 11px;font-size:12px}
  .planilha select{
    background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:6px 8px;font-size:12px;color:var(--ink);max-width:190px;
  }
  .planilha select:disabled{opacity:.4;cursor:not-allowed}
  .planilha select.falta{border-color:rgba(244,183,63,.6)}
  .planilha .obs-in{width:100%;min-width:150px;font-size:12px;padding:6px 8px}
  .pl-aviso{display:block;font-size:11px;color:var(--warn);margin-top:5px}
  .planilha-rodape{
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft);
  }

  /* ---------- Campos de retorno ---------- */
  .fb{
    margin:10px 0 26px;border:1px dashed var(--line);border-radius:var(--r);
    padding:11px 14px;background:rgba(0,0,0,.15);
  }
  .fb-h{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
  .fb-h .t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
  .fb-h .t b{color:var(--ink-dim)}
  .fb-radios{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .fb-radios label{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-dim);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 11px;cursor:pointer;
    background:rgba(0,0,0,.2);
  }
  .fb-radios label:hover{border-color:#2b4f7d;color:var(--ink)}
  .fb-radios input{accent-color:var(--accent);margin:0}
  .fb-radios label:has(input:checked){border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
  .fb-radios label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
  .fb-in{
    min-height:44px;border:1px solid var(--line);border-radius:var(--r-sm);
    background:rgba(0,0,0,.25);padding:9px 11px;font-size:13px;line-height:1.5;
  }
  .fb-in:empty::before{content:attr(data-ph);color:var(--ink-faint)}
  .fb-in:focus{border-color:var(--accent);outline:none}
  .fb-st{display:block;margin-top:6px;font-size:11.5px;color:var(--ink-faint);min-height:15px}
  .fb-st.erro{color:var(--warn)}

  /* ---------- Tela 2 ---------- */
  .toolbar{
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:11px 14px;margin-bottom:14px;
  }
  .seg{display:flex;gap:2px;background:rgba(0,0,0,.25);padding:3px;border-radius:var(--r-sm);border:1px solid var(--line-soft)}
  .seg button{background:none;border:0;padding:6px 15px;border-radius:4px;color:var(--ink-dim);font-size:12.5px;font-weight:500}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
  .filtro{display:flex;align-items:center;gap:7px}
  .filtro select{
    background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:6px 9px;font-size:12.5px;color:var(--ink);
  }
  .conta{margin-left:auto;font-size:12px;color:var(--ink-dim)}
  .conta b{font-family:var(--mono);color:var(--ink)}

  .resumo{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .kpi{
    flex:1 1 150px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:11px 13px;border-top:2px solid var(--kc,var(--line));
  }
  .kpi .v{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1.1;color:var(--kc,var(--ink))}
  .kpi .k{font-size:11.5px;color:var(--ink-dim);margin-top:2px}

  .tabela-wrap{
    overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  }
  table{border-collapse:collapse;width:100%;min-width:940px;font-size:12.5px}
  thead th{
    position:sticky;top:0;background:var(--panel-2);text-align:left;
    padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;
    font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);font-weight:600;
  }
  thead th button{background:none;border:0;padding:0;color:inherit;font:inherit;display:flex;gap:5px;align-items:center}
  thead th button:hover{color:var(--ink)}
  thead th .ar{opacity:.45;font-size:9px}
  tbody td{padding:9px 11px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tbody tr:hover{background:rgba(255,255,255,.028)}
  tbody tr:last-child td{border-bottom:0}
  td.loja button{background:none;border:0;padding:0;font-weight:600;font-size:13px;color:var(--ink);text-align:left}
  td.loja button:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  td.os{font-family:var(--mono);font-size:11px;color:var(--ink-faint);white-space:nowrap}
  td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .bloq{font-size:12px}
  .bloq .d{font-family:var(--mono);color:var(--warn)}
  /* NO LUGAR DO "AVANÇO %": prazo consumido. A barra não mede obra feita —
     mede dia decorrido do prazo combinado, que o sistema conta sozinho. */
  .prazo{display:flex;flex-direction:column;gap:4px;min-width:96px}
  .prazo .t{font-family:var(--mono);font-size:11.5px;color:var(--ink);white-space:nowrap}
  .prazo.estourado .t{color:var(--warn)}
  .prazo.sem .t{color:var(--ink-faint);font-family:var(--sans);font-style:italic}
  .prazo i{height:3px;background:var(--line-soft);border-radius:99px;overflow:hidden;display:block}
  .prazo i b{display:block;height:100%;background:var(--ok);border-radius:99px}
  .prazo.estourado i b{background:var(--warn)}
  .prazo.pronto i b{background:var(--ink-faint)}
  tr.alerta td{background:rgba(255,77,109,.055)}

  /* Kanban */
  .kanban-wrap{overflow-x:auto;padding-bottom:6px}
  .kanban{display:flex;gap:12px;min-width:1120px;align-items:flex-start}
  .col{flex:1 1 0;min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
  .col-h{
    display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);
    background:var(--panel-2);border-radius:var(--r) var(--r) 0 0;
  }
  .col-h .nm{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
  .col-h .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-dim);
    background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:99px;padding:1px 7px}
  .col-b{padding:9px;display:flex;flex-direction:column;gap:8px;min-height:60px}
  .card{
    background:rgba(0,0,0,.2);border:1px solid var(--line);border-left:3px solid var(--sev,var(--line));
    border-radius:var(--r-sm);padding:10px 11px;text-align:left;width:100%;
  }
  .card:hover{border-color:#2b4f7d;background:rgba(255,255,255,.035)}
  .card .os{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
  .card .nm{font-size:13px;font-weight:650;margin:1px 0 5px;letter-spacing:-.01em}
  .card .ln{display:flex;gap:6px 10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-dim);margin-bottom:6px}
  .card .ft{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .card .nota{width:auto;text-align:left;font-weight:500}
  .col-vazia{color:var(--ink-faint);font-size:12px;text-align:center;padding:14px 6px}
  .card .ln.com{margin-bottom:6px;font-size:11.5px}
  .card .ln.com b{color:var(--ink);font-weight:600}
  .card .ln.com.alto,.card .ln.com.alto b{color:var(--warn)}
  .card .ln.com.crit,.card .ln.com.crit b{color:var(--crit)}
  /* A etapa exata dentro da fase — o detalhe que o agrupamento não pode comer */
  .col-etapa{
    display:flex;align-items:center;gap:8px;padding:3px 2px 2px;margin-top:2px;
    font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
    border-top:1px solid var(--line-soft);
  }
  .col-etapa:first-child{border-top:0;margin-top:0}
  .col-etapa b{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:0}

  /* ---------- Tela 3 ---------- */
  .voltar{
    background:none;border:0;color:var(--ink-dim);font-size:12.5px;padding:0;margin-bottom:12px;
    display:inline-flex;gap:6px;align-items:center;
  }
  .voltar:hover{color:var(--accent)}
  .alerta-box{
    display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;
    border:1px solid rgba(255,77,109,.45);background:var(--crit-soft);
    border-left:4px solid var(--crit);border-radius:var(--r);padding:14px 16px;margin-bottom:18px;
  }
  .alerta-box .n{font-family:var(--mono);font-size:32px;font-weight:700;line-height:1;color:var(--crit)}
  .alerta-box h3{margin:0 0 4px;font-size:14px;color:var(--crit)}
  .alerta-box p{margin:0;font-size:13px;color:var(--ink-dim);max-width:62ch}
  .alerta-box p b{color:var(--ink)}

  .ficha-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:14px;align-items:start}
  @media (max-width:860px){.ficha-grid{grid-template-columns:1fr}}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .box-h{
    padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel-2);
    font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-dim);
    display:flex;align-items:center;gap:8px;
  }
  .box-b{padding:13px 14px}
  .box + .box{margin-top:14px}
  .box-sub{
    margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;
    font-size:11.5px;color:var(--ink-faint);
  }

  /* ---------- Ciclo de vida da obra: a esteira ---------- */
  .esteira-box{margin-bottom:16px}

  .risco-os{
    display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;
    border:1px solid rgba(255,77,109,.4);background:var(--crit-soft);
    border-left:4px solid var(--crit);border-radius:var(--r);padding:12px 15px;margin-bottom:16px;
  }
  .risco-os .tag{
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--crit);
    border:1px solid rgba(255,77,109,.42);background:rgba(255,77,109,.1);
    border-radius:99px;padding:3px 9px;white-space:nowrap;flex:none;
  }
  .risco-os p{margin:1px 0 0;font-size:13px;line-height:1.5;color:var(--ink-dim);max-width:74ch;flex:1 1 320px}
  .risco-os p b{color:var(--ink)}

  .agora{
    display:flex;gap:10px 26px;flex-wrap:wrap;
    padding-bottom:13px;margin-bottom:4px;border-bottom:1px solid var(--line-soft);
  }
  .agora-p{min-width:0}
  .agora-p .v{font-size:13px;font-weight:600;margin-top:3px}
  .agora-p .v.aviso{color:var(--warn)}

  .esteira{list-style:none;margin:0;padding:0}
  .passo{
    position:relative;display:grid;grid-template-columns:22px 1fr auto;
    gap:0 12px;align-items:start;padding:9px 0;
  }
  /* O trilho: uma linha contínua atrás dos marcadores, cortada no primeiro e
     no último passo para não sobrar ponta solta. */
  .passo::before{
    content:"";position:absolute;left:10px;top:0;bottom:0;width:1px;background:var(--line);
  }
  .passo:first-child::before{top:18px}
  .passo:last-child::before{bottom:auto;height:18px}
  .passo .marca{padding-top:3px}
  .passo .marca i{
    display:block;width:11px;height:11px;border-radius:50%;position:relative;z-index:1;
    border:2px solid var(--line);background:var(--panel);margin-left:5px;
  }
  .passo.feito .marca i{border-color:var(--ok);background:var(--ok)}
  .passo.atual .marca i{
    border-color:var(--accent);background:var(--panel);
    box-shadow:0 0 0 4px var(--accent-soft);
  }
  .passo.pulado .marca i{border-style:dashed;border-color:var(--line-soft);background:transparent}

  .passo .corpo{min-width:0}
  .passo .l1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .passo .nome{font-size:13.5px;font-weight:650;letter-spacing:-.01em}
  .passo.futuro .nome,.passo.pulado .nome{color:var(--ink-faint);font-weight:500}
  .passo .aqui{
    font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--accent);
    border:1px solid rgba(240,90,40,.45);background:var(--accent-soft);border-radius:99px;padding:2px 8px;
  }
  .passo .l2{
    display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center;
    margin-top:3px;font-size:12px;color:var(--ink-dim);
  }
  .passo.pulado .l2{color:var(--ink-faint);font-style:italic}
  .passo .l2 .dono{color:var(--ink);font-weight:600}
  .passo .l2 .onde::before{content:"·";margin-right:8px;color:var(--ink-faint)}
  .passo .l2 .cod{
    font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--ink-faint);
    border:1px solid var(--line-soft);border-radius:3px;padding:1px 6px;
  }
  .passo .l3{margin-top:6px;display:flex;flex-direction:column;gap:5px}
  .alerta-passo{
    font-size:12px;color:var(--warn);background:var(--warn-soft);
    border:1px solid rgba(244,183,63,.3);border-radius:var(--r-sm);padding:6px 9px;max-width:62ch;
  }
  .alerta-passo b{font-family:var(--mono)}
  .sem-status{
    font-size:11.5px;line-height:1.5;color:var(--ink-faint);
    border-left:2px solid var(--line);padding-left:9px;max-width:64ch;
  }
  .passo .quando{
    font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;
    color:var(--ink-dim);white-space:nowrap;padding-top:3px;text-align:right;
  }
  .passo .quando.futuro,.passo .quando.pulado{color:var(--ink-faint);font-family:var(--sans);font-style:italic}
  .passo .quando.atual{color:var(--accent);font-weight:700}

  /* O desvio: só existe quando a obra começou sem OS aprovada. Recuado e
     marcado, para ficar claro que é um caminho alternativo e não mais um passo. */
  .passo.desvio{margin-left:22px;border-left:1px dashed var(--line);padding-left:14px}
  .passo.desvio::before{display:none}
  .passo.desvio.pulado{opacity:.62}
  .passo.desvio .quando{padding-top:20px}
  .passo.desvio .corpo::before{
    content:"desvio · só quando a obra começou sem OS aprovada";
    display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
    font-weight:700;color:var(--ink-faint);margin-bottom:4px;
  }

  .esteira-nota{
    margin:12px 0 0;padding-top:11px;border-top:1px solid var(--line-soft);
    font-size:11.5px;line-height:1.6;color:var(--ink-faint);max-width:92ch;
  }
  .esteira-nota b{color:var(--ink-dim)}

  @media (max-width:620px){
    .passo{grid-template-columns:22px 1fr}
    .passo .quando{grid-column:2;text-align:left;padding-top:5px}
  }

  .dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13px}
  .dl dt{color:var(--ink-faint);font-size:11.5px;white-space:nowrap;padding-top:1px}
  .dl dd{margin:0;font-weight:500}

  .crono{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch}
  .crono-c{
    flex:1 1 128px;background:rgba(0,0,0,.2);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:10px 12px;
  }
  .crono-c .v{font-family:var(--mono);font-size:19px;font-weight:700;line-height:1.15}
  .crono-c .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px;font-weight:600}
  .crono-c.destaque{border-color:rgba(240,90,40,.4);background:var(--accent-soft)}
  .crono-c.destaque .v{color:var(--accent)}
  .crono-c.calc{opacity:.6;border-style:dashed}
  .crono-c.calc .v{font-size:15px;font-weight:600;color:var(--ink-dim)}
  .crono-nota{font-size:11.5px;color:var(--ink-faint);margin-top:10px;line-height:1.5}

  .remarc{display:flex;flex-direction:column;gap:0}
  .remarc-i{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line-soft);font-size:12.5px}
  .remarc-i:last-child{border-bottom:0}
  .remarc-i .d{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);white-space:nowrap;flex:none;width:62px}
  .remarc-i .mv{color:var(--ink-dim)}
  .remarc-i .mv b{color:var(--ink);font-family:var(--mono);font-size:11.5px}
  .remarc-i .mt{color:var(--warn);font-size:12px;margin-top:2px}

  .tl{display:flex;flex-direction:column}
  .tl-i{display:flex;gap:12px;padding:0 0 0 4px;position:relative}
  .tl-i .col-l{flex:none;width:56px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--ink-faint);padding-top:9px}
  .tl-i .col-m{flex:none;width:14px;position:relative}
  .tl-i .col-m::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:1px;background:var(--line)}
  .tl-i:first-child .col-m::before{top:14px}
  .tl-i:last-child .col-m::before{bottom:calc(100% - 14px)}
  .tl-i .col-m i{
    position:absolute;left:2px;top:11px;width:9px;height:9px;border-radius:50%;
    background:var(--bg);border:2px solid var(--sev,var(--ink-faint));
  }
  .tl-i .col-r{flex:1;padding:8px 0;min-width:0}
  .tl-t{font-size:13px;font-weight:600}
  .tl-t.sim{color:var(--ok)}
  .tl-t.nao{color:var(--crit)}
  .tl-s{font-size:12px;color:var(--ink-dim);margin-top:2px}
  .tl-obs{font-size:12px;color:var(--ink-dim);margin-top:3px;border-left:2px solid var(--line);padding-left:8px;font-style:italic}
  .tl-gap{
    margin:10px 0 2px 70px;border:1px dashed rgba(255,77,109,.45);background:var(--crit-soft);
    border-radius:var(--r-sm);padding:9px 12px;font-size:12.5px;color:var(--crit);font-weight:600;
  }

  /* A FOTO DE CADA DIA (feedback 05, 03/09/2026).
     Hoje a foto entra pela tela; numa segunda etapa ela chega pelo WhatsApp,
     respondendo ao agente das 18h, e cai exatamente no mesmo lugar.
     Só obra EM CAMPO recebe a cobrança diária — obra em levantamento ou já
     executada não tem evolução para fotografar.
     A lista abaixo é dos dias em que a foto NÃO veio. A ausência é dado, não
     cálculo: é ela que vira cobrança no dia seguinte. */
  var SEM_FOTO = {
    o1:["2026-08-24","2026-08-27","2026-08-28"],
    o2:["2026-08-28"],
    o5:["2026-08-27"],
    o7:["2026-08-25","2026-08-26","2026-08-27","2026-08-28"],
    o8:["2026-08-26","2026-08-27"],
    o9:["2026-08-24","2026-08-26","2026-08-27","2026-08-28"],
    o10:["2026-08-25","2026-08-27","2026-08-28"]
  };
  function pedeFoto(o){ return faseDe(o) === "campo"; }

  var PORID = {};
  OBRAS.forEach(function(o){
    /* Os dois destravamentos são independentes: `liberadoPor` é o OK verbal do
       analista do cliente, `osAprovada` é o ato formal. Obra sem nenhum dos
       dois está SEM COBERTURA. Quem não traz o campo, não foi liberada. */
    if(o.liberadoPor === undefined) o.liberadoPor = null;
    if(o.liberadoEm === undefined) o.liberadoEm = null;
    if(o.mauUso === undefined) o.mauUso = false;
    var semFoto = SEM_FOTO[o.id] || [];
    o.diario.forEach(function(e){
      if(e.foto === undefined) e.foto = pedeFoto(o) && semFoto.indexOf(e.data) < 0;
    });
    o.dias = diasDesde(o.aprovacao);
    o.fimCalc = (o.inicioReal || o.inicioPlan) && o.duracao ? somaDias(o.inicioReal || o.inicioPlan, o.duracao) : null;
    o.atraso = (!posCampo(o) && o.fimCalc) ? diasDesde(o.fimCalc) : null;
    if(!o.marcos) o.marcos = {execFim:null, relatorio:null, osAprov:o.osAprovada ? o.aprovacao : null,

    /* NO LUGAR DO "AVANÇO %" — dois números que o sistema calcula sozinho.
       Na planilha o avanço é preenchido no olho: a mesma coluna tem 0,9 · 0,2 ·
       0,5 misturados com 95 e 1, e 5 das 19 obras em branco. Ninguém confere.
       `diaDe` é quanto do prazo combinado já passou; onde não há duração
       planejada, fica null e a tela escreve "sem prazo definido" em vez de
       inventar número. */
    var ini = o.inicioReal || o.inicioPlan;
    if(ini && o.duracao && !posCampo(o)){
      var corridos = diasDesde(ini) + 1;
      o.diaDe = Math.max(1, corridos);
      o.fracPrazo = o.diaDe / o.duracao;
    } else if(posCampo(o) && o.duracao){
      o.diaDe = o.duracao; o.fracPrazo = 1;
    } else {
      o.diaDe = null; o.fracPrazo = null;
    }
    o.paradaEtapa = posCampo(o) ? paradaNaEtapa(o) : null;
    o.dono = donoDa(o);
    PORID[o.id] = o;

  /* ESCALA DE URGÊNCIA — uma decisão de leitura, não de enfeite.
     O vermelho fica reservado a uma coisa só: obra ainda em aberto há 100
     dias ou mais. São três na base inteira, e é o caso que justificou o
     projeto — precisa gritar sozinho. Passar da duração combinada, ficar

  }
  function diasNaMao(t){ return Math.max(0, diasDesde(t.aberta)); }
  function diasVencida(t){ return Math.max(0, diasDesde(t.prazo)); }
  function tarefasDaObra(id){
    return TAREFAS.filter(function(t){ return t.obra === id; });
  }
  function tarefaDoDia(obraId, dia){
    for(var i = 0; i < TAREFAS.length; i++){
      if(TAREFAS[i].obra === obraId && TAREFAS[i].aberta === dia) return TAREFAS[i];
    }
    return null;
  }
  function tarefasAbertas(){
    return TAREFAS.filter(function(t){ return sitTarefa(t) !== "respondida"; });
  }
  function tarefasVencidas(){
    return TAREFAS.filter(function(t){ return sitTarefa(t) === "vencida"; });
  }
  function tarefasDeHoje(){
    return TAREFAS.filter(function(t){ return t.aberta === DIA_REF; });
  }
  /* Quem está com tarefa aberta, na ordem de quem tem mais. */
  function porDono(){
    var m = {}, ordem = [];
    tarefasAbertas().forEach(function(t){
      if(!m[t.dono]){ m[t.dono] = []; ordem.push(t.dono); }
      m[t.dono].push(t);
    });
    return ordem.map(function(k){ return {chave:k, lista:m[k]}; })
                .sort(function(a,b){ return b.lista.length - a.lista.length; });
  }

  function obrasDe(chave){
    return OBRAS.filter(function(o){ return o.pcm === chave && !posCampo(o); }).length;
  }

  function statusFb(id, txt, erro){
    var el = document.querySelector('[data-fb-st="' + id + '"]');

  /* Documento a publicar: montado do zero a partir dos dados da página.
     Nunca serializa o DOM vivo — nem o app renderizado, nem os scripts que
     o visualizador injeta. Sempre o mesmo esqueleto + o retorno escrito. */
  function documentoParaPublicar(){
    var p = [];
    p.push("<!doctype html>");
    p.push('<html lang="pt-BR">');
    p.push("<head>");
    p.push('<meta charset="utf-8">');
    p.push('<meta name="viewport" content="width=device-width,initial-scale=1">');
    p.push("<title>" + esc(document.title) + "</title>");
    Array.prototype.forEach.call(document.querySelectorAll("style[data-pagina]"), function(s){ p.push(s.outerHTML); });
    p.push("</head>");
    p.push("<body>");
    p.push('<div id="app"></div>');
    p.push('<script id="feedback-state" type="application/json">' + JSON.stringify(feedback) + "<\/script>");
    Array.prototype.forEach.call(document.querySelectorAll("script[data-pagina]"), function(s){ p.push(s.outerHTML); });
    p.push("</body>");
    p.push("</html>");
    return p.join("\n");
  }

  /* Publicar recarrega todas as visões abertas, esta inclusive. Guardar a
     posição da página antes evita que o cliente perca o lugar em que estava
     a cada campo preenchido. */
  var CHAVE_POS = "manfac-cop-scroll";
  (function(){
    try{
      var y = sessionStorage.getItem(CHAVE_POS);
      if(y){
        sessionStorage.removeItem(CHAVE_POS);
        window.addEventListener("load", function(){ window.scrollTo(0, parseInt(y, 10) || 0); });
      }
    }catch(e){ /* sessão sem storage: segue sem restaurar */ }
  })();

  var pubTimer = null, publicando = false, pubPendente = false, ultimaSecao = null;
  function agendarPublicacao(id){
    if(!artefato) return;
    ultimaSecao = id;
    statusFb(id, "salvando…");
    clearTimeout(pubTimer);
    pubTimer = setTimeout(publicar, 2200);
  }
  function publicar(){
    if(!artefato) return;
    if(publicando){ pubPendente = true; return; }
    publicando = true;
    var id = ultimaSecao;
    try{ sessionStorage.setItem(CHAVE_POS, String(window.scrollY || 0)); }catch(e){}
    artefato.publish(documentoParaPublicar()).then(function(){
      statusFb(id, "salvo na página");
    }, function(e){
      var cod = e && e.code;
      if(cod === "conflict"){
        statusFb(id, "outra versão foi publicada; a página vai recarregar", true);
      } else if(cod === "not_writer" || cod === "not_granted" || cod === "not_declared" ||
                cod === "capability_disabled" || cod === "capability_removed" || cod === "consent_required"){
        esconderCamposFb();
      } else if(cod === "rate_limited"){
        statusFb(id, "muitas gravações seguidas; espere alguns segundos", true);
      } else {
        statusFb(id, "não deu para salvar. Copie o texto e mande pelo WhatsApp", true);
      }
    }).then(function(){
      publicando = false;
      if(pubPendente){ pubPendente = false; agendarPublicacao(ultimaSecao); }
    });
  }
