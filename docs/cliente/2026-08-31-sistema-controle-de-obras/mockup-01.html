<title>Diário de Obras Manfac</title>
<style data-pagina>
  :root{
    /* Tema do hub Manfac — escuro por decisão, sem variante clara */
    --bg:#0a1628;
    --panel:#0b1b36;
    --panel-2:#0d2050;
    --line:#1e3a5f;
    --line-soft:#162c4a;
    --ink:#e9f0fa;
    --ink-dim:#94a3b8;
    --ink-faint:#64748b;
    --accent:#f05a28;
    --accent-soft:rgba(240,90,40,.14);
    --ok:#35c98a;
    --ok-soft:rgba(53,201,138,.13);
    --warn:#f4b73f;
    --warn-soft:rgba(244,183,63,.13);
    --crit:#ff4d6d;
    --crit-soft:rgba(255,77,109,.14);
    --info:#5aa9f0;
    --info-soft:rgba(90,169,240,.13);

    --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

    --r:8px;
    --r-sm:5px;
  }

  *{box-sizing:border-box}
  /* precisa vir depois de qualquer display: garante que hidden esconde mesmo */
  [hidden]{display:none !important}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .lbl{
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:600;
  }

  /* ---------- Shell ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:var(--panel-2);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:10px 20px;
  }
  .brand{display:flex;align-items:baseline;gap:9px;margin-right:4px}
  .brand b{font-size:14px;letter-spacing:-.01em}
  .brand span{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint)}
  .tabs{display:flex;flex-wrap:wrap;gap:2px;background:rgba(0,0,0,.22);padding:3px;border-radius:var(--r);border:1px solid var(--line-soft)}
  .tabs button{
    background:none;border:0;padding:6px 13px;border-radius:var(--r-sm);
    color:var(--ink-dim);font-size:13px;font-weight:500;white-space:nowrap;
  }
  .tabs button[aria-current="true"]{background:var(--accent);color:#fff;font-weight:600}
  .tabs button:hover:not([aria-current="true"]){color:var(--ink);background:rgba(255,255,255,.05)}
  .who{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--ink-dim);font-size:12px}
  .who .av{
    width:26px;height:26px;border-radius:50%;background:var(--accent-soft);
    border:1px solid rgba(240,90,40,.4);color:var(--accent);
    display:grid;place-items:center;font-size:11px;font-weight:700;
  }

  main{max-width:1220px;margin:0 auto;padding:22px 20px 90px}

  .page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .page-head h1{font-size:20px;margin:0 0 3px;letter-spacing:-.015em;text-wrap:balance}
  .page-head p{margin:0;color:var(--ink-dim);font-size:13px}
  .page-head .demo{margin-left:auto;display:flex;align-items:center;gap:8px}
  .page-head .demo select{
    background:rgba(0,0,0,.25);border:1px dashed var(--line);border-radius:var(--r-sm);
    padding:5px 8px;font-size:12px;color:var(--ink-dim);
  }

  /* ---------- Contador da fila ---------- */
  .fila-status{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:13px 16px;margin-bottom:18px;
  }
  .fila-status .big{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1;color:var(--accent)}
  .fila-txt{font-size:13px;color:var(--ink-dim)}
  .barra{flex:1 1 180px;min-width:120px;height:5px;background:var(--line-soft);border-radius:99px;overflow:hidden}
  .barra i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}

  /* ---------- Cards de obra (diário) ---------- */
  .fila{display:flex;flex-direction:column;gap:12px}
  .obra{
    position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);border-left:3px solid var(--sev,var(--line));
    padding:14px 16px 14px 15px;
    transition:opacity .25s ease,transform .25s ease;
  }
  .obra.saindo{opacity:0;transform:translateY(-6px)}
  .obra-head{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .obra-id{min-width:0;flex:1 1 300px}
  .obra-os{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.02em}
  .obra-loja{
    font-size:15px;font-weight:650;letter-spacing:-.01em;margin:1px 0 4px;
    background:none;border:0;padding:0;text-align:left;color:var(--ink);
  }
  .obra-loja:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  .obra-desc{color:var(--ink-dim);font-size:12.5px;margin:0 0 6px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-dim)}
  .meta b{color:var(--ink);font-weight:600}

  /* coluna de sinais: no máximo duas linhas, alinhadas, sem repetir número */
  .obra-sinais{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:0 1 auto;max-width:400px}
  .sinal-linha{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
  .nota{
    width:100%;text-align:right;border-radius:var(--r-sm);padding:4px 9px;
    font-size:11.5px;font-weight:600;border:1px solid;
  }
  .nota .n{font-family:var(--mono)}
  .nota.crit{color:var(--crit);background:var(--crit-soft);border-color:rgba(255,77,109,.38)}
  .nota.warn{color:var(--warn);background:var(--warn-soft);border-color:rgba(244,183,63,.32)}
  @media (max-width:640px){
    .obra-sinais{align-items:flex-start;max-width:none;width:100%}
    .sinal-linha{justify-content:flex-start}
    .nota{text-align:left}
  }

  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;
    letter-spacing:.02em;white-space:nowrap;border:1px solid transparent;
  }
  .pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .pill.andamento{color:var(--ok);background:var(--ok-soft);border-color:rgba(53,201,138,.3)}
  .pill.paralisado{color:var(--crit);background:var(--crit-soft);border-color:rgba(255,77,109,.32)}
  .pill.levantamento{color:var(--info);background:var(--info-soft);border-color:rgba(90,169,240,.3)}
  .pill.finalizado{color:var(--ink-dim);background:rgba(148,163,184,.1);border-color:var(--line)}
  .pill.definir{color:var(--accent);background:var(--accent-soft);border-color:rgba(240,90,40,.42)}

  .dias{
    display:inline-flex;align-items:baseline;gap:5px;padding:3px 9px;border-radius:99px;
    font-family:var(--mono);font-size:11px;font-weight:600;white-space:nowrap;
    border:1px solid var(--line);color:var(--ink-dim);background:rgba(0,0,0,.18);
  }
  .dias.atencao{color:var(--warn);border-color:rgba(244,183,63,.35);background:var(--warn-soft)}
  .dias.critico{color:var(--crit);border-color:rgba(255,77,109,.4);background:var(--crit-soft)}
  .dias small{font-family:var(--sans);font-weight:500;font-size:10.5px;letter-spacing:.02em;opacity:.85}

  .pend{
    margin-top:10px;font-size:12.5px;color:var(--ink-dim);
    border-left:2px solid var(--line);padding-left:10px;
  }
  .pend b{color:var(--ink);font-weight:600}

  /* ---------- Perguntas ---------- */
  .perguntas{
    margin-top:13px;padding-top:13px;border-top:1px dashed var(--line-soft);
    display:flex;flex-direction:column;gap:11px;
  }
  .q{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
  .q > .lbl{flex:0 0 130px}
  @media (max-width:640px){.q > .lbl{flex:1 1 100%}}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    background:rgba(0,0,0,.2);border:1px solid var(--line);color:var(--ink-dim);
    padding:6px 12px;border-radius:var(--r-sm);font-size:12.5px;font-weight:500;
    transition:background .12s ease,color .12s ease,border-color .12s ease;
  }
  .chip:hover{border-color:#2b4f7d;color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .chip.sim[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#04231a}
  .chip.nao[aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:#2a0410}

  .obs-linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .obs-btn{
    background:none;border:0;color:var(--ink-faint);font-size:12px;padding:2px 0;
    text-decoration:underline;text-underline-offset:3px;text-decoration-style:dotted;
  }
  .obs-btn:hover{color:var(--accent)}
  .obs-in{
    flex:1 1 260px;background:rgba(0,0,0,.25);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:7px 10px;font-size:13px;
  }
  .obs-in::placeholder{color:var(--ink-faint)}

  /* Contador de dias parados — informa, nunca trava o salvamento */
  .contador{
    display:flex;gap:7px 16px;flex-wrap:wrap;align-items:baseline;
    border:1px solid rgba(244,183,63,.3);background:var(--warn-soft);
    border-radius:var(--r-sm);padding:8px 11px;font-size:12px;color:var(--ink-dim);
  }
  .contador b{font-family:var(--mono);color:var(--warn);font-size:13.5px;font-weight:700}
  .contador .obs{color:var(--ink-faint);font-size:11.5px;flex:1 1 220px}

  .acoes{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:2px}
  .btn{
    background:var(--accent);border:1px solid var(--accent);color:#fff;font-weight:600;
    padding:8px 16px;border-radius:var(--r-sm);font-size:13px;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{background:transparent;color:var(--ink-faint);border-color:var(--line);cursor:not-allowed;filter:none}
  .btn.ghost{background:transparent;color:var(--ink-dim);border-color:var(--line);font-weight:500}
  .btn.ghost:hover{color:var(--ink);border-color:#2b4f7d;filter:none}
  .hint{font-size:12px;color:var(--ink-faint)}
  .hint.alerta{color:var(--warn)}

  /* Respondidas */
  .feitas{margin-top:26px}
  .feitas h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 9px;font-weight:600}
  .feita{
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    background:rgba(53,201,138,.05);border:1px solid var(--line-soft);
    border-left:3px solid var(--ok);border-radius:var(--r-sm);padding:8px 12px;margin-bottom:6px;
  }
  .feita .ck{color:var(--ok);font-weight:700}
  .feita .nm{font-weight:600;font-size:13px}
  .feita .rs{color:var(--ink-dim);font-size:12px}
  .feita .un{margin-left:auto}

  /* ---------- Estados da tela 1 ---------- */
  .sucesso{
    border:1px solid rgba(53,201,138,.4);background:rgba(53,201,138,.07);
    border-radius:var(--r);padding:26px 22px;text-align:center;
  }
  .sucesso .mark{
    width:42px;height:42px;border-radius:50%;margin:0 auto 12px;
    display:grid;place-items:center;font-size:20px;font-weight:700;
    color:#04231a;background:var(--ok);
  }
  .sucesso h2{margin:0 0 6px;font-size:17px;color:var(--ok);letter-spacing:-.01em}
  .sucesso p{margin:0 auto;max-width:52ch;color:var(--ink-dim);font-size:13px}
  .sucesso .placar{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;
  }
  .sucesso .placar span{
    border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:99px;
    padding:5px 12px;font-size:12px;color:var(--ink-dim);
  }
  .sucesso .placar b{font-family:var(--mono);color:var(--ink);font-size:13px}

  .sk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .sk + .sk{margin-top:12px}
  .sk i{display:block;height:11px;border-radius:4px;background:var(--line-soft);margin-bottom:9px}
  .sk i.a{width:120px;height:9px}
  .sk i.b{width:44%}
  .sk i.c{width:70%;height:9px}
  .sk i.d{width:100%;height:30px;margin-bottom:0;margin-top:14px}
  .sk-pulso{animation:pulso 1.1s ease-in-out infinite}
  @keyframes pulso{0%,100%{opacity:.45}50%{opacity:.9}}
  .carregando-txt{color:var(--ink-faint);font-size:12.5px;margin:0 0 12px}

  .estado{
    border-radius:var(--r);padding:22px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;
    border:1px solid var(--line);background:var(--panel);
  }
  .estado .ico{
    flex:none;width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;
    font-size:17px;font-weight:700;
  }
  .estado h2{margin:0 0 6px;font-size:16px;letter-spacing:-.01em}
  .estado p{margin:0 0 4px;color:var(--ink-dim);font-size:13px;max-width:58ch}
  .estado .corpo{flex:1 1 260px}
  .estado .acoes{margin-top:12px}
  .estado.erro{border-color:rgba(255,77,109,.45);background:var(--crit-soft)}
  .estado.erro .ico{background:var(--crit);color:#2a0410}
  .estado.erro h2{color:var(--crit)}
  .estado.bloqueio .ico{background:rgba(148,163,184,.15);color:var(--ink-dim);border:1px solid var(--line)}

  /* ---------- Aviso da fila de definição ---------- */
  .aviso-def{
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;width:100%;
    border:1px solid rgba(240,90,40,.4);background:rgba(240,90,40,.07);
    border-radius:var(--r);padding:11px 14px;margin-bottom:14px;text-align:left;
  }
  .aviso-def .n{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--accent);line-height:1}
  .aviso-def .txt{font-size:12.5px;color:var(--ink-dim)}
  .aviso-def .txt b{color:var(--ink)}
  .aviso-def .ir{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:600;white-space:nowrap}
  .aviso-def:hover{border-color:var(--accent)}

  /* ---------- Triagem da obra nova ---------- */
  .triagem-aviso{
    display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;
    border:1px solid rgba(240,90,40,.42);background:rgba(240,90,40,.07);
    border-left:4px solid var(--accent);border-radius:var(--r);padding:14px 16px;margin-bottom:18px;
  }
  .triagem-aviso h3{margin:0 0 4px;font-size:14px;color:var(--accent)}
  .triagem-aviso p{margin:0;font-size:13px;color:var(--ink-dim);max-width:64ch}
  .triagem-aviso p b{color:var(--ink)}
  .triagem-aviso .cont{
    font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);
    border:1px solid rgba(240,90,40,.45);border-radius:99px;padding:3px 10px;white-space:nowrap;
  }
  .campo{
    display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;
    padding:11px 0;border-bottom:1px dashed var(--line-soft);
  }
  .campo:last-child{border-bottom:0}
  .campo > .rot{flex:0 0 168px;display:flex;align-items:center;gap:8px}
  .campo .mk{
    width:16px;height:16px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:10px;font-weight:700;border:1px solid var(--line);color:var(--ink-faint);
  }
  .campo.ok .mk{background:var(--ok);border-color:var(--ok);color:#04231a}
  .campo .rot span{font-size:12.5px;font-weight:600}
  .campo.ok .rot span{color:var(--ink-dim);font-weight:500}
  @media (max-width:640px){.campo > .rot{flex:1 1 100%}}
  .campo select,.campo input{
    background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:6px 9px;font-size:12.5px;color:var(--ink);
  }
  .campo input[type="number"]{width:88px}
  .campo .dica{font-size:11.5px;color:var(--ink-faint)}
  .liberar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}

  /* ---------- Caixas de decisão ---------- */
  .decisao{
    border:1px solid rgba(240,90,40,.35);background:rgba(240,90,40,.05);
    border-radius:var(--r);padding:12px 14px;margin:18px 0 0;
    display:flex;gap:13px;align-items:flex-start;
  }
  .decisao .tag{
    flex:none;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;
    color:var(--accent);border:1px solid rgba(240,90,40,.45);border-radius:var(--r-sm);
    padding:4px 8px;background:rgba(240,90,40,.1);white-space:nowrap;
  }
  .decisao p{margin:0 0 6px;font-size:13px;line-height:1.5}
  .decisao p:last-child{margin-bottom:0}
  .decisao .opt{font-size:12.5px;color:var(--ink-dim)}
  .decisao .opt b{color:var(--ink)}
  .decisao .opt em{color:var(--accent);font-style:normal;font-weight:600}

  /* Decisão já respondida: vira registro, não pergunta. Cor diferente
     para o cliente enxergar de longe o que ainda espera resposta dele. */
  .decisao.fechada{border-color:rgba(53,201,138,.32);background:rgba(53,201,138,.045)}
  .decisao.fechada .tag{color:var(--ok);border-color:rgba(53,201,138,.42);background:rgba(53,201,138,.1)}
  .decisao.fechada .opt em{color:var(--ok)}
  .decisao .resp{
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
    color:var(--ok);display:block;margin-bottom:4px;
  }

  /* Linha discreta sobre o caminho até o agente de IA */
  .nota-caminho{
    margin:0 0 16px;padding-left:10px;border-left:2px solid var(--line);
    color:var(--ink-faint);font-size:11.5px;line-height:1.55;max-width:78ch;
  }
  .nota-caminho b{color:var(--ink-dim);font-weight:600}

  /* ---------- Forma 2 do diário: lista única, formato planilha ---------- */
  .forma-barra{
    display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:10px 14px;margin-bottom:14px;
  }
  .forma-barra .expl{font-size:12px;color:var(--ink-faint);flex:1 1 240px}
  .planilha-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
  table.planilha{min-width:1000px}
  table.planilha tbody td{vertical-align:top;padding:10px 11px}
  table.planilha tbody tr.falta td{background:rgba(244,183,63,.06)}
  table.planilha tbody tr.pronta td{background:rgba(53,201,138,.05)}
  .pl-loja{background:none;border:0;padding:0;font-weight:650;font-size:13px;color:var(--ink);text-align:left}
  .pl-loja:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  .pl-os{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);display:block}
  .pl-sub{font-size:11.5px;color:var(--ink-faint);margin-top:3px}
  .planilha .chips{gap:5px}
  .planilha .chip{padding:5px 11px;font-size:12px}
  .planilha select{
    background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:6px 8px;font-size:12px;color:var(--ink);max-width:190px;
  }
  .planilha select:disabled{opacity:.4;cursor:not-allowed}
  .planilha select.falta{border-color:rgba(244,183,63,.6)}
  .planilha .obs-in{width:100%;min-width:150px;font-size:12px;padding:6px 8px}
  .pl-aviso{display:block;font-size:11px;color:var(--warn);margin-top:5px}
  .planilha-rodape{
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft);
  }

  /* ---------- Campos de retorno ---------- */
  .fb{
    margin:10px 0 26px;border:1px dashed var(--line);border-radius:var(--r);
    padding:11px 14px;background:rgba(0,0,0,.15);
  }

     O vermelho fica reservado a uma coisa só: obra ainda em aberto há 100
     dias ou mais. São três na base inteira, e é o caso que justificou o
     projeto — precisa gritar sozinho. Passar da duração combinada, ficar
     parada no mesmo bloqueio ou esperar definição é âmbar: preocupa, não
     é emergência. Quando tudo é vermelho, nada é. */
  function critico(o){
    return o.etapa !== "finalizado" && o.etapa !== "definir" && o.dias >= 100;
  }
  function estourou(o){
    if(o.etapa === "finalizado" || o.etapa === "definir") return false;

    if(estourou(o) || travado(o) || o.etapa === "paralisado") return "var(--warn)";
    if(o.atraso != null && o.atraso > 0) return "var(--warn)";
    if(o.etapa === "levantamento") return "var(--info)";
    return "var(--ok)";
  }

    if(o.etapa === "finalizado" || o.etapa === "definir") return "";

    h +=   '<div class="toolbar">';
    h +=     '<div class="seg" role="group" aria-label="Formato de visualização">' +
               '<button id="btn-tabela" aria-pressed="true">Tabela</button>' +
               '<button id="btn-kanban" aria-pressed="false">Kanban</button></div>';
    h +=     '<div class="filtro"><label class="lbl" for="f-pcm">Responsável da obra</label><select id="f-pcm"></select></div>';
    h +=     '<div class="filtro"><label class="lbl" for="f-etapa">Etapa da obra</label><select id="f-etapa"></select></div>';
    h +=     '<span class="conta"><b id="conta">0</b> obras nesta visão · base completa: <b>187</b></span>';
    h +=   '</div>';
    h +=   '<div class="decisao fechada"><span class="tag">DECISÃO A</span><div>';
    h +=     '<p><span class="resp">Resolvida — você respondeu</span><b>As duas ficam.</b> O botão acima continua trocando entre tabela e Kanban, com os mesmos dados nos dois formatos. Cada um serve para uma coisa:</p>';
    h +=     '<p class="opt"><em>Tabela:</em> parecida com a planilha de hoje, mostra todas as colunas de uma vez e ordena por qualquer uma delas (clique no cabeçalho). Boa para bater linha a linha e para achar quem está parado há mais tempo.</p>';
    h +=     '<p class="opt"><em>Kanban:</em> uma coluna por etapa da obra. Mostra menos informação por obra, mas dá a leitura de um relance de quanta coisa está parada. Boa para reunião.</p>';
    h +=   '</div></div>';
    h +=   fbPor("decA");
    h +=   '<div id="vis-tabela"><div class="tabela-wrap"><table>' +
             '<thead><tr id="thead-row"></tr></thead><tbody id="tbody"></tbody></table></div></div>';
    h +=   '<div id="vis-kanban" hidden><div class="kanban-wrap"><div class="kanban" id="kanban"></div></div></div>';
    h +=   fbPor("tela2");
    h += '</section>';

    /* ---- Tela 3 ---- */
    h += '<section id="tela-ficha" hidden>';
    h +=   '<button class="voltar" id="voltar">&#8592; Voltar para a base de obras</button>';
    h +=   '<div id="ficha"></div>';
    h +=   fbPor("tela3");
    h += '</section>';

    /* ---- Tela 4: o que a diretoria abre quando recebe o aviso das 19h ---- */
    h += '<section id="tela-adm" hidden><div id="adm"></div></section>';

    h += '</main>';

    h += '<footer class="rodape">Mockup para aprovação · Manfac Facilities · versão de 01/09/2026, ' +
         'com as respostas A, C, D e E já aplicadas. ' +
         'Dados reais da planilha DPSP Rev.02 (11 obras do Yuri, obras de outros responsáveis, obras recém-chegadas do Field e obras finalizadas). ' +
         'Nenhuma resposta do diário é gravada: só o seu retorno nos campos abaixo de cada seção.</footer>';
    return h;
  }

  /* ---------------------------------------------------------------
     Navegação
     --------------------------------------------------------------- */
  function irPara(t){
    tela = t;
    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function(b){
      b.setAttribute("aria-current", b.dataset.tela === t ? "true" : "false");
    });
    document.getElementById("tela-diario").hidden = t !== "diario";
    document.getElementById("tela-base").hidden   = t !== "base";
    document.getElementById("tela-ficha").hidden  = t !== "ficha";
    document.getElementById("tela-adm").hidden    = t !== "adm";
    if(t === "base") renderBase();
    if(t === "ficha") renderFicha();
    if(t === "adm") renderAdm();
    window.scrollTo(0, 0);
  }

  /* Trocar quem está olhando é um controle de demonstração: o mesmo sistema
     visto pelo analista, que responde, e pelo administrador, que recebe o
     aviso das 19h. O Painel do dia só existe para o administrador. */
  function setPapel(p){
    papel = p;
    var info = PAPEIS[0];
    PAPEIS.forEach(function(x){ if(x.k === p) info = x; });
    var av  = document.getElementById("quem-av");
    var tab = document.getElementById("tab-adm");
    var sel = document.getElementById("sel-quem");
    if(av)  av.textContent = info.ini;
    if(tab) tab.hidden = p !== "admin";
    if(sel) sel.value = p;
    irPara(p === "admin" ? "adm" : "diario");
  }
  function abrirFicha(id, origem){
    obraAberta = id;
    voltarPara = origem || "base";
    irPara("ficha");
  }

  /* ---------------------------------------------------------------
     TELA 1 — Diário do dia
     --------------------------------------------------------------- */
  function chipsHTML(grupo, lista, valorAtual, cores){
    return lista.map(function(v){
      var cls = "chip";
      if(cores) cls += v === "Sim" ? " sim" : v === "Não" ? " nao" : "";
      return '<button type="button" class="' + cls + '" data-grupo="' + grupo + '" data-valor="' + esc(v) + '"' +
             ' aria-pressed="' + (valorAtual === v ? "true" : "false") + '">' + esc(v) + '</button>';
    }).join("");
  }

  function rasc(o){
    return rascunho[o.id] || (rascunho[o.id] = {andou:null, item:null, motivo:null, obs:"", obsAberta:false});
  }

  /* DECISÃO C — o contador aparece, mas não trava nada. Ele existe para o
     número não sumir da vista de quem responde; a cobrança fica com o
     dashboard e com o agente. */
  function contadorHTML(o){
    var partes = [];
    if(o.naoAndouSeguidos >= 2) partes.push('<span><b>' + o.naoAndouSeguidos + '</b> dias seguidos sem andar</span>');
    if(travado(o)) partes.push('<span><b>' + o.bloqueadaDias + '</b> dias no mesmo bloqueio · ' + esc(o.bloqueio) + '</span>');
    if(!partes.length) return "";
    return '<div class="contador">' + partes.join("") +
           '<span class="obs">Registre e siga: o contador continua correndo até a obra andar.</span></div>';
  }

  function cardHTML(o){
    var d = rasc(o);
    var h = "";
    h += '<article class="obra" data-id="' + o.id + '" style="--sev:' + sev(o) + '">';
    h +=   '<div class="obra-head">';
    h +=     '<div class="obra-id">';
    h +=       '<div class="obra-os">OS ' + esc(o.os) + ' · ' + esc(o.tipo) + '</div>';
    h +=       '<button class="obra-loja" data-abrir="' + o.id + '">' + esc(o.loja) + '</button>';
    h +=       '<p class="obra-desc">' + esc(o.desc) + '</p>';
    h +=       '<div class="meta"><span>Equipe <b>' + esc(o.equipe) + '</b></span>' +
                 '<span>Analista <b>' + esc(o.analista) + '</b></span>' +
                 (o.avanco != null ? '<span>Avanço <b class="num">' + o.avanco + '%</b></span>' : "") + '</div>';
    h +=     '</div>';
    h +=     '<div class="obra-sinais"><div class="sinal-linha">' + pill(o) + badgeDias(o) + '</div>' +
               notaAlerta(o) + '</div>';
    h +=   '</div>';
    if(o.pendencia){
      h += '<div class="pend"><b>Pendência:</b> ' + esc(o.pendencia) +
           (o.pendResp ? ' · responsável <b>' + esc(o.pendResp) + '</b>' : "") + '</div>';
    }
    h +=   contadorHTML(o);
    h +=   '<div class="perguntas">';
    h +=     '<div class="q"><span class="lbl">Andou hoje?</span><div class="chips">' +
               chipsHTML("andou", ["Sim","Não"], d.andou, true) + '</div></div>';
    h +=     '<div class="q"><span class="lbl">Faltou algum item?</span><div class="chips">' +
               chipsHTML("item", ITENS, d.item) + '</div></div>';
    h +=     '<div class="q q-motivo" hidden><span class="lbl">Por que não andou?</span><div class="chips">' +
               chipsHTML("motivo", BLOQUEIOS, d.motivo) + '</div></div>';
    h +=     '<div class="obs-linha"><button type="button" class="obs-btn">+ observação</button>' +
               '<input class="obs-in" type="text" maxlength="120" placeholder="Uma linha, se quiser" hidden value=""></div>';
    h +=     '<div class="acoes"><button type="button" class="btn salvar" disabled>Salvar e sair da fila</button>' +
               '<span class="hint"></span></div>';
    h +=   '</div>';
    h += '</article>';
    return h;
  }

  /* Uma única regra barra o salvamento, e é a que o cliente pediu: "não
     andou" tem que vir com motivo. Nada mais trava. */
  function validar(o, d){
    if(!d.andou) return "Responda se a obra andou hoje.";
    if(d.andou === "Não" && !d.motivo) return "Diga por que não andou.";
    return null;
  }

  /* O texto ao lado do botão descreve SEMPRE o que o botão vai fazer de
     verdade. Enquanto falta resposta, diz o que falta; quando está pronto,
     diz o que acontece ao salvar. */
  function textoAcao(o, d){
    if(d.andou === "Sim") return "Ao salvar: a obra sai da fila e hoje (" + DIA_REF_CURTO +
                                 ") entra na ficha dela como dia que andou.";
    if(d.andou === "Não") return "Ao salvar: a obra sai da fila e hoje (" + DIA_REF_CURTO +
                                 ") entra na ficha dela como dia parado por " + String(d.motivo).toLowerCase() + ".";
    return "";
  }

  function atualizarCard(card){
    var o = PORID[card.dataset.id], d = rascunho[o.id];
    card.querySelector(".q-motivo").hidden = d.andou !== "Não";

    var erro = validar(o, d);
    var btn = card.querySelector(".salvar");
    var hint = card.querySelector(".hint");
    btn.disabled = !!erro;
    hint.textContent = erro || textoAcao(o, d);
    hint.className = "hint" + (erro && d.andou ? " alerta" : "");
  }

  function gravar(o){
    var d = rasc(o);
    if(validar(o, d)) return false;
    respostas[o.id] = {andou:d.andou, item:d.item || "Não faltou", motivo:d.motivo, obs:d.obs};
    o.diario = o.diario.concat([{
      data:DIA_REF, andou:d.andou === "Sim", motivo:d.motivo,
      item:d.item || "Não faltou", obs:d.obs
    }]);
    return true;
  }

  function salvar(o, card){
    if(!gravar(o)) return;
    card.classList.add("saindo");
    var reduz = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(renderDiario, reduz ? 0 : 240);
  }

  function desfazer(id){
    var o = PORID[id];
    delete respostas[id];
    o.diario = o.diario.filter(function(x){ return x.data !== DIA_REF; });
    renderDiario();
  }

  function barraHTML(pendentes, feitas){
    var h = '<div class="fila-status">';
    h += '<span class="big num" style="' + (pendentes ? "" : "color:var(--ok)") + '">' + pendentes + '</span>';
    h += '<span class="fila-txt">' + (pendentes === 1 ? "obra para responder hoje" : "obras para responder hoje") + '</span>';
    h += '<span class="barra" aria-hidden="true"><i style="width:' + (feitas / FILA.length * 100) + '%' +
         (pendentes ? "" : ";background:var(--ok)") + '"></i></span>';
    h += '<span class="fila-txt num">' + feitas + ' de ' + FILA.length + ' respondidas</span>';
    h += '</div>';
    return h;
  }

  function feitasHTML(feitas){
    if(!feitas.length) return "";
    return '<div class="feitas"><h2>Já respondidas</h2>' + feitas.map(function(o){
      var r = respostas[o.id];
      var resumo = r.andou === "Sim" ? "Andou hoje" : "Não andou hoje · " + r.motivo;
      if(r.item && r.item !== "Não faltou") resumo += " · faltou " + r.item.toLowerCase();
      return '<div class="feita"><span class="ck">&#10003;</span><span class="nm">' + esc(o.loja) + '</span>' +
             '<span class="rs">' + esc(resumo) + '</span>' +
             '<button class="btn ghost un" data-desfazer="' + o.id + '">Desfazer</button></div>';
    }).join("") + '</div>';
  }

  function sucessoHTML(total, andaram, naoAndaram, paradasSeguidas){
    var h = '<div class="sucesso">';
    h += '<div class="mark" aria-hidden="true">&#10003;</div>';
    h += '<h2>Diário de hoje fechado</h2>';
    h += '<p>As ' + total + ' obras foram respondidas. A base de obras já está atualizada e ' +
         'quem precisa cobrar alguma coisa hoje sabe o que é.</p>';
    h += '<div class="placar"><span><b>' + andaram + '</b> andaram</span>' +
         '<span><b>' + naoAndaram + '</b> não andaram</span>' +
         '<span><b>' + paradasSeguidas + '</b> paradas há 3 dias ou mais</span></div>';
    h += '</div>';
    return h;
  }

  function renderAvisoDef(){
    var el = document.getElementById("aviso-def");
    if(!el) return;
    var lista = OBRAS.filter(function(o){ return o.etapa === "definir"; });
    var escondido = !lista.length || estadoTela === "carregando" || estadoTela === "erro" || estadoTela === "sem-permissao";
    if(escondido){ el.innerHTML = ""; return; }
    var velha = lista.reduce(function(m,o){ return Math.max(m, o.dias); }, 0);
    el.innerHTML = '<button type="button" class="aviso-def" data-ir-definir="1">' +
      '<span class="n">' + lista.length + '</span>' +
      '<span class="txt"><b>Antes das obras do dia: ' + (lista.length === 1
        ? "1 obra chegou do Field e espera você definir."
        : lista.length + " obras chegaram do Field e esperam você definir.") +
      '</b> Definir a obra que chega é tarefa do analista de obras. ' +
      'A mais antiga espera há <b>' + velha +
      ' dias</b>, e ' + (lista.length === 1 ? "ela não entra" : "nenhuma delas entra") +
      ' no diário enquanto ficar assim.</span>' +
      '<span class="ir">Definir agora &#8594;</span></button>';
  }

  var FORMA_EXPL = {
    cartoes:  "Uma obra por vez: responde, salva, ela sai da fila. Dá para parar no meio.",
    planilha: "Todas as obras na mesma tela, uma por linha. Responde na linha e salva tudo no fim."
  };

  function setForma(f){
    formaDiario = f;
    var b1 = document.getElementById("btn-cartoes"), b2 = document.getElementById("btn-planilha");
    if(b1) b1.setAttribute("aria-pressed", f === "cartoes" ? "true" : "false");
    if(b2) b2.setAttribute("aria-pressed", f === "planilha" ? "true" : "false");
    var ex = document.getElementById("forma-expl");
    if(ex) ex.textContent = FORMA_EXPL[f];
    renderDiario();
  }

  function renderDiario(){
    var alvo = document.getElementById("diario-corpo");
    if(!alvo) return;
    renderAvisoDef();

    var barra = document.querySelector(".forma-barra");
    if(barra) barra.hidden = estadoTela !== "normal";

    if(estadoTela === "carregando"){
      var s = '<p class="carregando-txt">Buscando suas obras em aberto…</p>';
      for(var i = 0; i < 3; i++){
        s += '<div class="sk"><i class="a sk-pulso"></i><i class="b sk-pulso"></i><i class="c sk-pulso"></i><i class="d sk-pulso"></i></div>';
      }
      alvo.innerHTML = s;
      return;
    }

    if(estadoTela === "erro"){
      alvo.innerHTML =
        '<div class="estado erro"><div class="ico" aria-hidden="true">!</div><div class="corpo">' +
        '<h2>Não deu para carregar o diário de hoje</h2>' +
        '<p>A lista de obras não chegou. <b>Nada do que você já respondeu foi perdido</b> — o que estava salvo continua salvo.</p>' +
        '<p>Tente de novo. Se continuar assim por mais de alguns minutos, avise o suporte da Manfac e responda hoje pelo WhatsApp.</p>' +
        '<div class="acoes"><button type="button" class="btn" data-retry="1">Tentar de novo</button></div>' +
        '</div></div>';
      return;
    }

    if(estadoTela === "sem-permissao"){
      alvo.innerHTML =
        '<div class="estado bloqueio"><div class="ico" aria-hidden="true">&#8722;</div><div class="corpo">' +
        '<h2>Esta tela é de quem é responsável pelas obras</h2>' +
        '<p>Seu acesso não inclui o diário destas obras. Quem responde é o analista responsável por elas — hoje, o Yuri.</p>' +
        '<p>Se você precisa responder no lugar dele, peça ao administrador para incluir seu acesso. A base de obras continua aberta para consulta.</p>' +
        '<div class="acoes"><button type="button" class="btn ghost" data-tela="base">Ver a base de obras</button></div>' +
        '</div></div>';
      return;
    }

    /* 19h — o registro não aconteceu e o aviso já subiu. Tom de fato
       consumado, não de punição: a tela conta o que já é verdade e o caminho
       para responder continua aberto, porque a DECISÃO C não trava nada. */
    if(estadoTela === "atraso"){
      var semResposta = FILA.filter(function(o){ return !respostas[o.id]; }).length;
      alvo.innerHTML =
        '<div class="estado atraso"><div class="ico" aria-hidden="true">!</div><div class="corpo">' +
        '<h2>Passou das 19h e o diário de hoje não foi preenchido</h2>' +
        '<p>O aviso das 18h chegou e <b>' + semResposta + ' obras</b> continuam sem resposta. ' +
        'Uma hora depois, o sistema avisou os administradores do hub — com o seu nome. Já foi enviado:</p>' +
        '<div class="push">' +
          '<div class="de"><span class="hora">' + HORA_ESCALADA + '</span>' +
          '<span>aviso automático do hub</span></div>' +
          '<p class="tx"><b>Yuri Nascimento</b> não preencheu o diário de hoje, ' + DIA_REF_CURTO + '. ' +
          '<b>' + semResposta + ' obras</b> ficaram sem registro.</p>' +
          '<p class="pra">Para José Guilherme e Eduardo · administradores do hub</p>' +
        '</div>' +
        '<p style="margin-top:14px">Continua dando para responder: nada foi travado e o registro entra com a data de hoje. ' +
        'Assim que você salvar, o Painel do dia da diretoria muda junto.</p>' +
        '<div class="acoes"><button type="button" class="btn" data-retry="1">Responder agora</button></div>' +
        '</div></div>';
      return;
    }

    if(estadoTela === "vazio"){
      var andaram = FILA.filter(function(o){ return o.etapa !== "paralisado"; }).length;
      var travadas = FILA.filter(function(o){ return o.naoAndouSeguidos >= 3; }).length;
      alvo.innerHTML = barraHTML(0, FILA.length) +
                       sucessoHTML(FILA.length, andaram, FILA.length - andaram, travadas);
      return;
    }

    /* estado normal */
    var pendentes = FILA.filter(function(o){ return !respostas[o.id]; });
    var feitas = FILA.filter(function(o){ return respostas[o.id]; });
    pendentes.sort(function(a,b){ return b.dias - a.dias; });

    /* Fila zerada de verdade: a conquista aparece, mas a lista do que foi
       respondido continua embaixo — errar a última obra não pode deixar o
       Yuri sem como desfazer. */
    if(!pendentes.length){
      var an = feitas.filter(function(o){ return respostas[o.id].andou === "Sim"; }).length;
      var tr3 = feitas.filter(function(o){ return o.naoAndouSeguidos >= 3; }).length;
      alvo.innerHTML = barraHTML(0, feitas.length) +
                       sucessoHTML(feitas.length, an, feitas.length - an, tr3) +
                       feitasHTML(feitas);
      return;
    }

    var html = barraHTML(pendentes.length, feitas.length);
    if(formaDiario === "planilha"){
      html += planilhaHTML(pendentes);
      html += feitasHTML(feitas);
      alvo.innerHTML = html;
      atualizarPlanilha();
      return;
    }
    html += '<div class="fila">' + pendentes.map(cardHTML).join("") + '</div>';
    html += feitasHTML(feitas);

    alvo.innerHTML = html;
    Array.prototype.forEach.call(alvo.querySelectorAll(".obra"), atualizarCard);
  }

  /* ---------------------------------------------------------------
     DECISÃO B, forma 2 — lista única, no formato de planilha.
     Uma linha por obra, tudo aberto na mesma tela, e a resposta acontece
     dentro da própria linha: nada abre, nada some, nada muda de página.
     Um único botão salva tudo no fim.
     --------------------------------------------------------------- */
  function planilhaHTML(pendentes){
    var h = '<div class="planilha-wrap"><table class="planilha">';
    h += '<thead><tr>' +
           '<th scope="col">Obra</th>' +
           '<th scope="col">Andou hoje?</th>' +
           '<th scope="col">Por que não andou?</th>' +
           '<th scope="col">Faltou algum item?</th>' +
           '<th scope="col">Observação</th>' +
         '</tr></thead><tbody>';

    h += pendentes.map(function(o){
      var d = rasc(o);
      var sinal = [];
      if(o.naoAndouSeguidos >= 2) sinal.push(o.naoAndouSeguidos + " dias seguidos sem andar");
      if(travado(o)) sinal.push(o.bloqueadaDias + " dias no mesmo bloqueio");

      var tr = '<tr data-linha="' + o.id + '">';
      tr += '<td><span class="pl-os">OS ' + esc(o.os) + '</span>' +
              '<button type="button" class="pl-loja" data-abrir="' + o.id + '">' + esc(o.loja) + '</button>' +
              '<div class="pl-sub">' + esc(o.equipe || "sem equipe") +
              (sinal.length ? ' · <span style="color:var(--warn)">' + esc(sinal.join(" · ")) + '</span>' : "") +
              '</div></td>';
      tr += '<td><div class="chips">' + chipsHTML("andou", ["Sim","Não"], d.andou, true) + '</div></td>';
      tr += '<td><select data-grupo="motivo" aria-label="Por que não andou — ' + esc(o.loja) + '">' +
              opcoes(BLOQUEIOS, d.motivo, "— escolher —") + '</select>' +
              '<span class="pl-aviso" hidden>Obrigatório para salvar</span></td>';
      tr += '<td><select data-grupo="item" aria-label="Faltou algum item — ' + esc(o.loja) + '">' +
              opcoes(ITENS.slice(1), d.item, "Não faltou") + '</select></td>';
      tr += '<td><input class="obs-in" type="text" maxlength="120" placeholder="opcional" value="' +
              esc(d.obs || "") + '"></td>';
      tr += '</tr>';
      return tr;
    }).join("");

    h += '</tbody></table></div>';
    h += '<div class="planilha-rodape">' +
           '<button type="button" class="btn" id="salvar-tudo">Salvar tudo</button>' +
           '<span class="hint" id="hint-tudo"></span>' +
         '</div>';
    return h;
  }

  /* Estado de cada linha: quantas estão prontas, quantas estão faltando
     motivo. O botão só barra o que a DECISÃO C manda barrar. */
  function contaPlanilha(){
    var pendentes = FILA.filter(function(o){ return !respostas[o.id]; });
    var prontas = 0, faltando = 0;
    pendentes.forEach(function(o){
      var d = rasc(o);
      if(!d.andou) return;
      if(validar(o, d)) faltando++; else prontas++;
    });
    return {total:pendentes.length, prontas:prontas, faltando:faltando};
  }

  function atualizarPlanilha(){
    var c = contaPlanilha();
    Array.prototype.forEach.call(document.querySelectorAll("tr[data-linha]"), function(tr){
      var o = PORID[tr.dataset.linha], d = rasc(o);
      var naoAndou = d.andou === "Não";
      var selMotivo = tr.querySelector('select[data-grupo="motivo"]');
      var aviso = tr.querySelector(".pl-aviso");
      selMotivo.disabled = !naoAndou;
      selMotivo.classList.toggle("falta", naoAndou && !d.motivo);
      aviso.hidden = !(naoAndou && !d.motivo);
      tr.classList.toggle("falta", !!(d.andou && validar(o, d)));
      tr.classList.toggle("pronta", !!(d.andou && !validar(o, d)));
    });
    var btn = document.getElementById("salvar-tudo");
    var hint = document.getElementById("hint-tudo");
    if(!btn || !hint) return;
    btn.disabled = c.prontas === 0;
    if(c.faltando){
      hint.textContent = c.faltando + (c.faltando === 1 ? " obra está" : " obras estão") +
        ' marcada como "não andou" sem motivo. Sem o motivo, essa linha não salva.';
      hint.className = "hint alerta";
    } else if(c.prontas){
      hint.textContent = "Salva " + c.prontas + (c.prontas === 1 ? " obra respondida" : " obras respondidas") +
        " de uma vez. As " + (c.total - c.prontas) + " que faltam continuam na lista.";
      hint.className = "hint";
    } else {
      hint.textContent = "Responda pelo menos uma obra para salvar.";
      hint.className = "hint";
    }
  }

  function salvarTudo(){
    var pendentes = FILA.filter(function(o){ return !respostas[o.id]; });
    var salvou = 0;
    pendentes.forEach(function(o){ if(gravar(o)) salvou++; });
    if(salvou) renderDiario();
  }

  /* ---------------------------------------------------------------
     TELA 2 — Base de obras
     --------------------------------------------------------------- */
  var COLS = [
    {k:"os",     t:"Nº OS"},
    {k:"loja",   t:"Loja"},
    {k:"tipo",   t:"Tipo"},
    {k:"pcm",    t:"Responsável"},
    {k:"equipe", t:"Equipe / prestador"},
    {k:"etapa",  t:"Etapa da obra"},
    {k:"bloqueio", t:"Bloqueio"},
    {k:"dias",   t:"Dias desde a aprovação"},
    {k:"duracao", t:"Duração (dias)"},
    {k:"avanco", t:"Avanço"},
    {k:"atualizacao", t:"Última atualização"}
  ];

  function montarFiltros(){
    var pcms = [];
    OBRAS.forEach(function(o){ if(o.pcm && pcms.indexOf(o.pcm) < 0) pcms.push(o.pcm); });
    pcms.sort();
    document.getElementById("f-pcm").innerHTML = '<option value="todos">Todos</option>' +
      pcms.map(function(p){ return '<option value="' + p + '"' + (fPcm === p ? " selected" : "") + '>' + p + '</option>'; }).join("") +
      '<option value="__sem"' + (fPcm === "__sem" ? " selected" : "") + '>Ainda sem responsável</option>';
    document.getElementById("f-etapa").innerHTML = '<option value="todas">Todas</option>' +
      Object.keys(ETAPAS).map(function(k){
        return '<option value="' + k + '"' + (fEtapa === k ? " selected" : "") + '>' + ETAPAS[k].nome + '</option>';
      }).join("");
    document.getElementById("thead-row").innerHTML = COLS.map(function(c){
      return '<th scope="col"><button data-col="' + c.k + '">' + c.t + ' <span class="ar"></span></button></th>';
    }).join("");
  }

  function setVis(v){
    vis = v;
    document.getElementById("btn-tabela").setAttribute("aria-pressed", v === "tabela" ? "true" : "false");
    document.getElementById("btn-kanban").setAttribute("aria-pressed", v === "kanban" ? "true" : "false");
    document.getElementById("vis-tabela").hidden = v !== "tabela";
    document.getElementById("vis-kanban").hidden = v !== "kanban";
    renderBase();
  }

  function filtradas(){
    return OBRAS.filter(function(o){
      if(fPcm === "__sem"){ if(o.pcm) return false; }
      else if(fPcm !== "todos" && o.pcm !== fPcm) return false;
      if(fEtapa !== "todas" && o.etapa !== fEtapa) return false;
      return true;
    });
  }

  function renderBase(){
    var lista = filtradas();
    document.getElementById("conta").textContent = lista.length;
    // Os indicadores olham sempre a base inteira, nunca o filtro: filtrar por uma
    // etapa nao pode fazer o painel zerar e dar a impressao de que a operacao parou.
    var todas = OBRAS;
    var andamento = todas.filter(function(o){ return o.etapa === "andamento"; }).length;
    var paralisadas = todas.filter(function(o){ return o.etapa === "paralisado"; }).length;
    var velhas = todas.filter(function(o){ return o.etapa !== "finalizado" && o.dias >= 60; }).length;
    var estouradas = todas.filter(function(o){ return o.etapa !== "finalizado" && o.atraso != null && o.atraso > 0; }).length;
    var aDefinir = todas.filter(function(o){ return o.etapa === "definir"; });
    var maisVelha = aDefinir.reduce(function(m,o){ return Math.max(m, o.dias); }, 0);
    document.getElementById("resumo").innerHTML = [
      {v:aDefinir.length, k:aDefinir.length ? "aguardando definição · a mais antiga há " + maisVelha + " dias" : "aguardando definição", c:"var(--accent)"},
      {v:andamento, k:"em andamento", c:"var(--ok)"},
      {v:paralisadas, k:"paralisadas", c:"var(--crit)"},
      {v:velhas, k:"aprovadas há mais de 60 dias", c:"var(--warn)"},
      {v:estouradas, k:"passaram da duração planejada", c:"var(--warn)"}
    ].map(function(x){
      return '<div class="kpi" style="--kc:' + x.c + '"><div class="v">' + x.v + '</div><div class="k">' + x.k + '</div></div>';
    }).join("");
    if(vis === "tabela") renderTabela(lista); else renderKanban(lista);
  }

  function renderTabela(lista){
    var k = ordem.col, dir = ordem.dir;
    lista = lista.slice().sort(function(a,b){
      var x = a[k], y = b[k];
      if(x == null) x = dir > 0 ? Infinity : -Infinity;
      if(y == null) y = dir > 0 ? Infinity : -Infinity;
      if(typeof x === "string") return dir * x.localeCompare(y, "pt-BR");
      return dir * (x - y);
    });
    Array.prototype.forEach.call(document.querySelectorAll("#thead-row button"), function(b){
      b.querySelector(".ar").textContent = b.dataset.col === k ? (dir > 0 ? "▲" : "▼") : "";
    });
    document.getElementById("tbody").innerHTML = lista.map(function(o){
      var tr = '<tr' + (critico(o) ? ' class="alerta"' : "") + '>';
      tr += '<td class="os">' + esc(o.os) + '</td>';
      tr += '<td class="loja"><button data-abrir="' + o.id + '">' + esc(o.loja) + '</button></td>';
      tr += '<td>' + esc(o.tipo) + '</td>';
      tr += '<td>' + (o.pcm ? esc(o.pcm) : '<span style="color:var(--accent)">a definir</span>') + '</td>';
      tr += '<td>' + esc(o.equipe) + '</td>';
      tr += '<td>' + pill(o) + '</td>';
      tr += '<td class="bloq">' + (o.bloqueio === "Sem bloqueio" || o.etapa === "finalizado"
              ? '<span style="color:var(--ink-faint)">—</span>'
              : esc(o.bloqueio) + (travado(o) ? ' <span class="d">' + o.bloqueadaDias + 'd</span>' : "")) + '</td>';
      tr += '<td class="n">' + badgeDias(o, true) + '</td>';
      tr += '<td class="n">' + (o.duracao != null ? o.duracao : '<span style="color:var(--ink-faint)">a definir</span>') + '</td>';
      tr += '<td>' + (o.avanco != null
              ? '<span class="av-bar"><i><b style="width:' + o.avanco + '%"></b></i><span>' + o.avanco + '%</span></span>'
              : '<span style="color:var(--ink-faint)">—</span>') + '</td>';
      tr += '<td class="n">' + br(o.atualizacao) + '</td>';
      tr += '</tr>';
      return tr;
    }).join("");
  }

  function renderKanban(lista){
    document.getElementById("kanban").innerHTML = ["definir","levantamento","andamento","paralisado","finalizado"].map(function(k){
      var itens = lista.filter(function(o){ return o.etapa === k; }).sort(function(a,b){ return b.dias - a.dias; });
      var h = '<div class="col"><div class="col-h"><span class="nm" style="color:' + ETAPAS[k].cor + '">' +
              ETAPAS[k].nome + '</span><span class="ct">' + itens.length + '</span></div><div class="col-b">';
      h += itens.length ? itens.map(function(o){
        var c = '<button class="card" data-abrir="' + o.id + '" style="--sev:' + sev(o) + '">';
        c += '<div class="os">OS ' + esc(o.os) + '</div>';
        c += '<div class="nm">' + esc(o.loja) + '</div>';
        c += '<div class="ln"><span>' + esc(o.tipo) + '</span><span>' + rotuloResp(o) + '</span>' +
             (o.equipe ? '<span>' + esc(o.equipe) + '</span>' : "") + '</div>';
        c += '<div class="ft">' + badgeDias(o, true) + notaAlerta(o) + '</div>';
        c += '</button>';
        return c;
      }).join("") : '<div class="col-vazia">nenhuma obra</div>';
      return h + '</div></div>';
    }).join("");
  }

  /* ---------------------------------------------------------------
     TELA 3 — Ficha da obra
     --------------------------------------------------------------- */
  function renderFicha(){
    var o = PORID[obraAberta];
    if(o.etapa === "definir"){ renderTriagem(o); return; }
    var h = "";

    h += '<div class="page-head"><div>';
    h += '<h1>' + esc(o.loja) + '</h1>';
    h += '<p class="num">OS ' + esc(o.os) + ' · ' + esc(o.tipo) + ' · ' + moeda(o.valor) + '</p>';
    h += '</div><div style="display:flex;gap:8px;flex-wrap:wrap">' + pill(o) + badgeDias(o) + '</div></div>';

    if(critico(o) && o.duracao){
      h += '<div class="alerta-box">';
      h +=   '<div><div class="n">' + o.dias + '</div><div class="lbl" style="text-align:center;margin-top:3px">dias em aberto</div></div>';
      h +=   '<div><h3>Obra aprovada em ' + br(o.aprovacao) + ' e ainda não concluída.</h3>' +
             '<p>A duração planejada é de <b>' + o.duracao + ' dias</b>. Estão contados <b>' + o.dias +
             ' dias</b> desde a aprovação — <b>' + Math.round(o.dias / o.duracao) + ' vezes</b> o prazo combinado. ' +
             'O cliente enxerga essa mesma OS aberta no sistema dele.</p></div>';
      h += '</div>';
    } else if(o.etapa !== "finalizado" && o.atraso != null && o.atraso > 0){
      h += '<div class="alerta-box" style="border-color:rgba(244,183,63,.45);background:var(--warn-soft);border-left-color:var(--warn)">';
      h +=   '<div><div class="n" style="color:var(--warn)">' + o.atraso + '</div><div class="lbl" style="text-align:center;margin-top:3px">dias além do prazo</div></div>';
      h +=   '<div><h3 style="color:var(--warn)">Passou da duração planejada.</h3>' +
             '<p>Início em <b>' + br(o.inicioReal || o.inicioPlan) + '</b> com <b>' + o.duracao +
             ' dias</b> de duração: deveria ter terminado em <b>' + br(o.fimCalc) + '</b>.</p></div>';
      h += '</div>';
    }

    h += '<div class="ficha-grid"><div>';

    h += '<div class="box"><div class="box-h">Identificação</div><div class="box-b"><dl class="dl">';
    h += '<dt>Nº OS</dt><dd class="num">' + esc(o.os) + '</dd>';
    h += '<dt>Loja</dt><dd>' + esc(o.loja) + '</dd>';
    h += '<dt>Chamado</dt><dd>' + esc(o.desc) + '</dd>';
    h += '<dt>Tipo</dt><dd>' + esc(o.tipo) + '</dd>';
    h += '<dt>Valor</dt><dd class="num">' + moeda(o.valor) + '</dd>';
    h += '<dt>Analista</dt><dd>' + esc(o.analista) + '</dd>';
    h += '<dt>Responsável da obra</dt><dd>' + (o.pcm ? esc(o.pcm) : '<span style="color:var(--accent)">a definir</span>') + '</dd>';
    h += '<dt>Equipe / prestador</dt><dd>' + esc(o.equipe) + '</dd>';
    h += '<dt>Origem</dt><dd>' + esc(o.origem) + '</dd>';
    h += '<dt>Bloqueio atual</dt><dd>' + (o.bloqueio === "Sem bloqueio"
            ? '<span style="color:var(--ink-faint)">sem bloqueio</span>'
            : '<span style="color:var(--crit);font-weight:600">' + esc(o.bloqueio) + '</span>' +
              (travado(o) ? ' <span class="num" style="color:var(--ink-dim)">há ' + o.bloqueadaDias + ' dias</span>' : "")) + '</dd>';
    h += '</dl></div></div>';

    h += '<div class="box"><div class="box-h">Cronograma</div><div class="box-b"><div class="crono">';
    h +=   '<div class="crono-c"><div class="k">Início planejado</div><div class="v">' + br(o.inicioPlan) + '</div></div>';
    h +=   '<div class="crono-c"><div class="k">Início real</div><div class="v">' + br(o.inicioReal) + '</div></div>';
    h +=   '<div class="crono-c destaque"><div class="k">Duração</div><div class="v">' +
             (o.duracao != null ? o.duracao + " dias" : "a definir") + '</div></div>';
    h +=   '<div class="crono-c calc"><div class="k">Final calculado</div><div class="v">' + br(o.fimCalc) + '</div></div>';
    h += '</div><p class="crono-nota">A obra é planejada por <b style="color:var(--ink)">duração</b>, não por data de entrega. ' +
         'O final é consequência do início mais os dias combinados e se recalcula sozinho a cada remarcação — ' +
         'ninguém precisa reescrever data final.</p></div></div>';

    h += '<div class="box"><div class="box-h">Remarcações <span class="num" style="color:var(--warn)">' + o.remarcacoes.length + '</span></div><div class="box-b">';
    if(o.remarcacoes.length){
      h += '<div class="remarc">' + o.remarcacoes.map(function(r){
        return '<div class="remarc-i"><span class="d">' + br(r.data) + '</span><div>' +
               '<div class="mv">início de <b>' + br(r.de) + '</b> para <b>' + br(r.para) + '</b></div>' +
               '<div class="mt">' + esc(r.motivo) + '</div></div></div>';
      }).join("") + '</div>';
    } else {
      h += '<p style="margin:0;color:var(--ink-faint);font-size:12.5px">Nenhuma remarcação registrada.</p>';
    }
    h += '</div></div>';

    h += '</div><div>';

    h += '<div class="box"><div class="box-h">Linha do tempo do diário</div><div class="box-b">';
    if(o.diario.length){
      h += '<div class="tl">' + o.diario.slice().reverse().map(function(e){
        var cor = e.andou ? "var(--ok)" : "var(--crit)";
        var t = '<div class="tl-i" style="--sev:' + cor + '">';
        t += '<div class="col-l">' + br(e.data).slice(0,5) + '</div>';
        t += '<div class="col-m"><i></i></div>';
        t += '<div class="col-r">';
        t += '<div class="tl-t ' + (e.andou ? "sim" : "nao") + '">' + (e.andou ? "Andou" : "Não andou") + '</div>';
        var sub = [];
        if(!e.andou && e.motivo) sub.push(e.motivo);
        if(e.item && e.item !== "Não faltou") sub.push("faltou " + e.item.toLowerCase());
        if(sub.length) t += '<div class="tl-s">' + esc(sub.join(" · ")) + '</div>';
        if(e.obs) t += '<div class="tl-obs">' + esc(e.obs) + '</div>';
        return t + '</div></div>';
      }).join("") + '</div>';
    } else {
      h += '<p style="margin:0;color:var(--ink-faint);font-size:12.5px">Nenhum dia respondido ainda nesta obra. ' +
           'Hoje é assim em todas: a informação só existe na cabeça de quem está em campo.</p>';
    }
    if(o.gap){
      h += '<div class="tl-gap">' + o.gap.dias + ' dias sem nenhum registro' +
           '<span>De ' + br(o.gap.de) + ' (aprovação) até ' + br(o.gap.ate) +
           ' ninguém respondeu nada sobre esta obra. É exatamente esse buraco que o diário fecha.</span></div>';
    }
    h += '</div></div>';

    h += '<div class="box"><div class="box-h">Pendências e próxima ação</div><div class="box-b"><dl class="dl">';
    h += '<dt>Pendência</dt><dd>' + (o.pendencia ? esc(o.pendencia) : '<span style="color:var(--ink-faint)">nenhuma</span>') + '</dd>';
    h += '<dt>Responsável</dt><dd>' + (o.pendResp ? esc(o.pendResp) : "—") + '</dd>';
    h += '<dt>Prazo</dt><dd class="num">' + br(o.pendPrazo) + '</dd>';
    h += '<dt>Próxima ação</dt><dd>' + (o.proxAcao ? esc(o.proxAcao) : "—") + '</dd>';
    h += '<dt>Última atualização</dt><dd class="num">' + br(o.atualizacao) + '</dd>';
    h += '</dl></div></div>';

    h += '<div class="box"><div class="box-h">Vindo do Field</div><div class="box-b">';
    h += '<div class="placeholder"><b>Relatório fotográfico</b> — as fotos que o técnico tira em campo entram aqui quando a OS é preenchida no Field.</div>';
    h += '<div class="placeholder"><b>Fechamento da OS</b> — data de fechamento, status no sistema do cliente e liberação para faturamento.</div>';
    h += '</div></div>';

    h += '</div></div>';

    document.getElementById("ficha").innerHTML = h;
  }

  /* ---------------------------------------------------------------
     TELA 3-B — Triagem da obra que acabou de chegar do Field
     --------------------------------------------------------------- */
  function opcoes(lista, valor, vazio){
    return '<option value="">' + vazio + '</option>' +
      lista.map(function(v){
        return '<option value="' + esc(v) + '"' + (valor === v ? " selected" : "") + '>' + esc(v) + '</option>';
      }).join("");
  }

    h += '</div><div>';

         '<span class="dica">a data final o sistema calcula</span></div>';

    h += '</div>';

    h += '</div></div>';
    h += '</div></div>';

    h += '<div class="decisao fechada"><span class="tag">DECISÃO D</span><div>';
    h += '<p><span class="resp">Resolvida — você respondeu</span>Quem completa a obra que chega crua do Field é o ' +
         '<b>analista de obras</b> — hoje, o Yuri. Não é fila aberta: é tarefa dele, e aparece no alto do diário ' +
         'antes das obras do dia.</p>';
    h += '<p class="opt"><em>Como fica:</em> a obra nova entra na base como <b>Aguardando definição</b> e não aparece ' +
         'para ninguém responder até estes cinco campos estarem preenchidos. O contador de dias esperando fica à vista ' +
         'no diário e na base de obras.</p>';
    h += '<p class="opt"><em>Segunda etapa:</em> um <b>agente de IA</b> faz as perguntas aos analistas todo dia ' +
         '<b>às 18h</b> — inclusive a de definir a obra que chegou. A tela continua sendo onde a resposta fica guardada.</p>';
    h += '</div></div>';
    h += fbPor("decD");

    document.getElementById("ficha").innerHTML = h;
  }

  function textoFaltam(faltam){
    return faltam
      ? "Faltam " + faltam + (faltam === 1 ? " campo" : " campos") + ". Enquanto isso a obra não aparece para ninguém responder."
      : "Pronta. Ao liberar, ela entra na base como Levantamento e passa a ser cobrada todo dia.";
  }

  function atualizarTriagem(){
    var o = PORID[obraAberta];
    if(!o || o.etapa !== "definir") return;
    var t = tri(o), faltam = faltamTri(o);
    var campos = document.querySelectorAll("#ficha .campo");
    CAMPOS_TRI.forEach(function(c, i){
      var el = campos[i];
      if(!el) return;
      var cheio = !!t[c.k];
      el.classList.toggle("ok", cheio);
      el.querySelector(".mk").innerHTML = cheio ? "&#10003;" : String(i + 1);
    });
    var cont = document.querySelector("#ficha .triagem-aviso .cont");
    if(cont) cont.textContent = (CAMPOS_TRI.length - faltam) + " de " + CAMPOS_TRI.length + " preenchidos";
    var btn = document.getElementById("btn-liberar");
    if(btn){
      btn.disabled = faltam > 0;
      var hint = btn.parentNode.querySelector(".hint");
      if(hint) hint.textContent = textoFaltam(faltam);
    }
  }

  function liberarObra(o){
    if(!o || o.etapa !== "definir" || faltamTri(o)) return;
    var t = tri(o);
    o.pcm = t.resp;
    o.equipe = t.equipe;
    o.prioridade = t.prioridade;
    o.inicioPlan = t.inicio;
    o.duracao = parseInt(t.duracao, 10);
    o.etapa = "levantamento";
    o.atualizacao = DIA_REF;
    o.pendencia = "Finalizar levantamento, confirmar material e programar a equipe";
    o.pendResp = t.resp;
    o.proxAcao = "Concluir levantamento";
    o.fimCalc = somaDias(o.inicioPlan, o.duracao);
    o.atraso = diasDesde(o.fimCalc);
    FILA = OBRAS.filter(function(x){ return x.pcm === "YURI" && x.etapa !== "finalizado"; });
    renderDiario();
    montarFiltros();
    irPara("base");
  }

  /* ---------------------------------------------------------------
     TELA 4 — Painel do dia (visão do administrador do hub)
     É o que o José e o Eduardo abrem quando recebem o aviso das 19h: uma
     linha por analista, quem preencheu, a que horas, e há quanto tempo cada
     um está em dia ou em falta.
     --------------------------------------------------------------- */
  function streakHTML(a){
    return '<div class="streak" role="img" aria-label="Últimos dez dias úteis de ' + esc(a.nome) + ': ' +
      a.dias.filter(function(d){ return d === "falta"; }).length + ' sem registro">' +
      a.dias.map(function(d, i){
        return '<i class="' + d + (i === a.dias.length - 1 ? " hoje" : "") + '" title="' + DIAS_UTEIS[i] +
               (d === "ok" ? " · preencheu" : " · não preencheu") + '"></i>';
      }).join("") + '</div>';
  }

  function situacaoHTML(a){
    if(!a.hora){
      return '<span style="color:var(--warn);font-weight:600">Em falta desde hoje</span>' +
             '<div class="pl-sub">' + esc(a.nota) + '</div>';
    }
    return '<span style="color:var(--ink)">Em dia há <b class="num">' + a.desde + '</b> dias úteis</span>' +
           '<div class="pl-sub">' + esc(a.nota) + '</div>';
  }

  function renderAdm(){
    var el = document.getElementById("adm");
    if(!el) return;

    var faltosos = ANALISTAS.filter(function(a){ return !a.hora; });
    var semRegistro = faltosos.reduce(function(s, a){ return s + obrasDe(a.chave); }, 0);
    var h = "";

    h += '<div class="page-head"><div><h1>Painel do dia</h1>' +
         '<p>' + AGORA_LONGO.replace(", 18h", ", 19h") + ' · quem preencheu o diário de hoje e quem não preencheu</p></div></div>';

    h += '<div class="resumo">';
    h +=   '<div class="kpi" style="--kc:var(--ink)"><div class="v">' + ANALISTAS.length + '</div>' +
             '<div class="k">analistas com obras hoje</div></div>';
    h +=   '<div class="kpi" style="--kc:var(--ok)"><div class="v">' + (ANALISTAS.length - faltosos.length) + '</div>' +
             '<div class="k">preencheram o diário</div></div>';
    h +=   '<div class="kpi" style="--kc:var(--warn)"><div class="v">' + faltosos.length + '</div>' +
             '<div class="k">' + (faltosos.length === 1 ? "não preencheu" : "não preencheram") + ' até as 19h</div></div>';
    h +=   '<div class="kpi" style="--kc:var(--warn)"><div class="v">' + semRegistro + '</div>' +
             '<div class="k">obras sem registro hoje</div></div>';
    h += '</div>';

    /* O aviso, como ele chegou. A tela abre pelo motivo de ela ter sido aberta. */
    h += '<div class="push" style="margin:0 0 16px;max-width:none">';
    h +=   '<div class="de"><span class="hora">' + HORA_ESCALADA + '</span>' +
             '<span>aviso automático do hub · recebido por você</span></div>';
    h +=   '<p class="tx">' + faltosos.map(function(a){ return '<b>' + esc(a.nome) + '</b>'; }).join(", ") +
             (faltosos.length === 1 ? ' não preencheu' : ' não preencheram') + ' o diário de hoje, ' + DIA_REF_CURTO + '. ' +
             '<b>' + semRegistro + ' obras</b> ficaram sem registro.</p>';
    h +=   '<p class="pra">O aviso sai todo dia às 19h, uma hora depois do aviso que o analista recebe às 18h, ' +
             'e só quando alguém não preencheu.</p>';
    h += '</div>';

    h += '<div class="tabela-wrap"><table class="adm"><thead><tr>' +
           '<th scope="col">Analista</th>' +
           '<th scope="col">Diário de hoje</th>' +
           '<th scope="col">Obras sob responsabilidade</th>' +
           '<th scope="col">Últimos 10 dias úteis</th>' +
           '<th scope="col">Situação</th>' +
         '</tr></thead><tbody>';

    h += ANALISTAS.map(function(a){
      var n = obrasDe(a.chave);
      var tr = '<tr' + (a.hora ? "" : ' class="em-falta"') + '>';
      tr += '<td><span class="pessoa' + (a.hora ? "" : " falta") + '">' +
              '<span class="av">' + esc(a.ini) + '</span>' +
              '<span><span class="nm">' + esc(a.nome) + '</span>' +
              '<span class="fn">analista de obras</span></span></span></td>';
      tr += '<td>' + (a.hora
              ? '<span class="selo ok">&#10003; Preencheu às <b class="num">' + a.hora + '</b></span>'
              : '<span class="selo falta">&#9679; Não preencheu</span>') + '</td>';
      tr += '<td><span class="num">' + (a.hora ? n : 0) + ' de ' + n + '</span> respondidas' +
              '<div class="pl-sub">' + (a.hora ? "nenhuma obra sem registro" : n + " obras sem registro hoje") + '</div></td>';
      tr += '<td>' + streakHTML(a) + '</td>';
      tr += '<td>' + situacaoHTML(a) + '</td>';
      tr += '</tr>';
      return tr;
    }).join("");

    h += '</tbody></table></div>';

    h += '<div class="streak-leg">' +
           '<span><i style="background:rgba(53,201,138,.5)"></i> preencheu</span>' +
           '<span><i style="background:var(--warn)"></i> não preencheu</span>' +
           '<span>o último quadrado é hoje · passe o mouse para ver a data</span>' +
         '</div>';

    h += '<p class="adm-fonte">As obras por analista vêm da planilha DPSP Rev.02. O histórico de preenchimento é ' +
         '<b>exemplo</b>: hoje esse dado não existe em lugar nenhum — é justamente ele que este painel passa a guardar.</p>';

    h += fbPor("telaAdm");

    /* DECISÃO F — a pergunta que a resposta dele abriu e não fechou. */
    h += '<div class="decisao"><span class="tag">DECISÃO F</span><div>';
    h +=   '<p>O aviso das 19h resolve o primeiro dia. <b>E no segundo, no terceiro, no quinto?</b> ' +
             'Hoje o Yuri está em falta há um dia. Em agosto a Luana ficou dois dias seguidos sem preencher, ' +
             'e ninguém soube além do aviso de cada dia.</p>';
    h +=   '<p class="opt"><em>Adotado por padrão — o mesmo aviso, com a conta:</em> todo dia às 19h sai o mesmo aviso ' +
             'para os administradores, com o número de dias seguidos escrito nele ("2º dia sem registro"), e o painel guarda ' +
             'a contagem. Nada é bloqueado e nada sobe sozinho para mais ninguém: quem decide agir é quem lê o número.</p>';
    h +=   '<p class="opt"><em>Alternativa — o aviso escala:</em> a partir do 3º dia seguido ele muda de forma e de destinatário: ' +
             'vira um aviso separado, com outro peso, e passa a ir também para o superior direto do analista.</p>';
    h +=   '<p class="opt"><em>Alternativa — o aviso vira pauta:</em> depois de alguns dias a falta deixa de ser um aviso ' +
             'do dia e vira uma linha fixa da reunião semanal, com todo mundo que ficou sem registro na semana. ' +
             'A cobrança sai da pessoa e vira rotina.</p>';
    h +=   '<p class="opt">É a mesma escolha da DECISÃO C, um andar acima: <b>registrar e mostrar</b>, ou <b>forçar alguém a agir</b>. ' +
             'Lá você escolheu registrar. <b>Aqui vale a mesma coisa?</b></p>';
    h += '</div></div>';
    h += fbPor("decF");

    el.innerHTML = h;
  }

  /* ---------------------------------------------------------------
     Eventos (delegados no #app, que é sempre reconstruído por JS)
     --------------------------------------------------------------- */
  var app = document.getElementById("app");

  app.addEventListener("click", function(e){
    var t;

    t = e.target.closest("[data-retry]");
    if(t){ estadoTela = "normal"; var sel = document.getElementById("sel-estado"); if(sel) sel.value = "normal"; renderDiario(); return; }

    t = e.target.closest("[data-ir-definir]");
    if(t){ fPcm = "todos"; fEtapa = "definir"; montarFiltros(); irPara("base"); return; }

    if(e.target.closest("#btn-liberar")){ liberarObra(PORID[obraAberta]); return; }

    t = e.target.closest("[data-tela]");
    if(t){ irPara(t.dataset.tela); return; }

    t = e.target.closest("[data-abrir]");
    if(t){ abrirFicha(t.dataset.abrir, tela === "diario" ? "diario" : "base"); return; }

    if(e.target.closest("#voltar")){ irPara(voltarPara); return; }
    if(e.target.closest("#btn-tabela")){ setVis("tabela"); return; }
    if(e.target.closest("#btn-kanban")){ setVis("kanban"); return; }
    if(e.target.closest("#btn-cartoes")){ setForma("cartoes"); return; }
    if(e.target.closest("#btn-planilha")){ setForma("planilha"); return; }
    if(e.target.closest("#salvar-tudo")){ salvarTudo(); return; }

    /* Chips dentro de uma linha da planilha (DECISÃO B, forma 2) */
    var linha = e.target.closest("tr[data-linha]");
    if(linha){
      var chipL = e.target.closest(".chip");
      if(chipL){
        var oL = PORID[linha.dataset.linha], dL = rasc(oL);
        var vL = chipL.dataset.valor;
        dL.andou = (dL.andou === vL) ? null : vL;
        if(dL.andou !== "Não") dL.motivo = null;
        Array.prototype.forEach.call(linha.querySelectorAll('.chip[data-grupo="andou"]'), function(c){
          c.setAttribute("aria-pressed", c.dataset.valor === dL.andou ? "true" : "false");
        });
        var selM = linha.querySelector('select[data-grupo="motivo"]');
        if(selM && dL.motivo === null) selM.value = "";
        atualizarPlanilha();
        return;
      }
    }

    t = e.target.closest("#thead-row button[data-col]");
    if(t){
      var k = t.dataset.col;
      if(ordem.col === k) ordem.dir = -ordem.dir; else { ordem.col = k; ordem.dir = 1; }
      renderBase();
      return;
    }

    t = e.target.closest("[data-desfazer]");
    if(t){ desfazer(t.dataset.desfazer); return; }

    var card = e.target.closest(".obra");
    if(!card) return;
    var o = PORID[card.dataset.id], d = rascunho[o.id];

    var chip = e.target.closest(".chip");
    if(chip){
      var g = chip.dataset.grupo, v = chip.dataset.valor;
      d[g] = (d[g] === v) ? null : v;
      if(g === "andou"){
        /* "Sim" zera o motivo: sem isso a tela guardaria um motivo de parada
           numa obra que andou. */
        if(d.andou !== "Não"){ d.motivo = null; }
      }
      ["andou","item","motivo"].forEach(function(grupo){
        Array.prototype.forEach.call(card.querySelectorAll('.chip[data-grupo="' + grupo + '"]'), function(c){
          c.setAttribute("aria-pressed", c.dataset.valor === d[grupo] ? "true" : "false");
        });
      });
      atualizarCard(card);
      return;
    }

    if(e.target.closest(".obs-btn")){
      d.obsAberta = true;
      card.querySelector(".obs-btn").hidden = true;
      var inp = card.querySelector(".obs-in");
      inp.hidden = false;
      inp.focus();
      return;
    }

    if(e.target.closest(".salvar")) salvar(o, card);
  });

  app.addEventListener("change", function(e){
    if(e.target.id === "sel-estado"){ estadoTela = e.target.value; renderDiario(); return; }
    if(e.target.id === "sel-quem"){ setPapel(e.target.value); return; }

    var linhaC = e.target.closest && e.target.closest("tr[data-linha]");
    if(linhaC && e.target.dataset && e.target.dataset.grupo){
      var oC = PORID[linhaC.dataset.linha];
      rasc(oC)[e.target.dataset.grupo] = e.target.value || null;
      atualizarPlanilha();
      return;
    }

    if(e.target.dataset && e.target.dataset.tri){
      tri(PORID[obraAberta])[e.target.dataset.tri] = e.target.value;
      atualizarTriagem();
      return;
    }
    if(e.target.id === "f-pcm"){ fPcm = e.target.value; renderBase(); return; }
    if(e.target.id === "f-etapa"){ fEtapa = e.target.value; renderBase(); return; }
    if(e.target.dataset && e.target.dataset.fbVoto){
      var id = e.target.dataset.fbVoto;
      fbDe(id).voto = e.target.value;
      agendarPublicacao(id);
      return;
    }
  });

  app.addEventListener("input", function(e){
    if(e.target.classList && e.target.classList.contains("obs-in")){
      var card = e.target.closest(".obra");
      if(card){ rasc(PORID[card.dataset.id]).obs = e.target.value; return; }
      var linhaI = e.target.closest("tr[data-linha]");
      if(linhaI) rasc(PORID[linhaI.dataset.linha]).obs = e.target.value;
    }
  });

  app.addEventListener("focusout", function(e){
    var el = e.target;
    if(el && el.dataset && el.dataset.fbTexto){
      var id = el.dataset.fbTexto;
      var texto = (el.innerText || "").trim();
      if(texto !== (fbDe(id).texto || "")){
        fbDe(id).texto = texto;
        agendarPublicacao(id);
      }
    }
  });

  /* ---------------------------------------------------------------
     Início
     --------------------------------------------------------------- */
  app.innerHTML = shellHTML();
  montarFiltros();
  setForma(formaDiario);
  setVis("tabela");
  setPapel(papel);

  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(ns){
      if(!ns) return;               // sem capability: a página segue sem os campos
      artefato = ns;
      mostrarCamposFb();
    }, function(){ /* indisponível: segue sem os campos */ });
  }
})();
</script>
