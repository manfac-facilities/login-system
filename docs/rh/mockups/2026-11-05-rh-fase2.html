<script>
"use strict";
/* ---------- Dinheiro: tudo em centavos inteiros ---------- */
function brl(c){var n=Math.abs(c),r=Math.floor(n/100),ct=String(n%100).padStart(2,"0");return (c<0?"-":"")+"R$ "+String(r).replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+ct;}
function brlSem(c){return brl(c).replace("R$ ","");}
function lerValor(t){t=String(t).trim();if(!/^(\d{1,3}(\.\d{3})+|\d+)(,\d{1,2})?$/.test(t))return null;var p=t.replace(/\./g,"").split(",");return Number(p[0])*100+Number(((p[1]||"")+"00").slice(0,2));}
function pct(cs){return String(Math.floor(cs/100))+","+String(cs%100).padStart(2,"0")+"%";}
function lerPct(t){t=String(t).trim();if(!/^\d{1,3}(,\d{1,2})?$/.test(t))return null;var p=t.split(",");var v=Number(p[0])*100+Number(((p[1]||"")+"00").slice(0,2));return v<=10000?v:null;}
function divInt(a,b){return (a-a%b)/b;}
/* Divide por percentual; o que sobrar de centavo vai para a maior linha. */
function ratear(total,linhas){
  var saida=linhas.map(function(l){return {cc:l.cc,p:l.p,v:divInt(total*l.p,10000)};});
  var soma=saida.reduce(function(s,l){return s+l.v;},0),maior=0;
  saida.forEach(function(l,i){if(l.p>saida[maior].p)maior=i;});
  if(saida.length)saida[maior].v+=total-soma;
  return saida;
}
/* Percentual da solicitação: soma exatamente 100,00%; a diferença vai para a maior linha. */
function fecharPct(linhas,total){
  var somaP=0;
  linhas.forEach(function(l){l.pct=total?divInt(l.valor*10000,total):0;somaP+=l.pct;});
  if(linhas.length&&total)linhas[0].pct+=10000-somaP;
}
function consolidar(itens){
  var mapa={},total=0;
  itens.forEach(function(it){
    total+=it.valor;
    ratear(it.valor,rateioAtual(it.p).linhas).forEach(function(l){
      var m=mapa[l.cc]||(mapa[l.cc]={cc:l.cc,nome:CC[l.cc].nome,ativo:CC[l.cc].ativo,valor:0,de:[]});
      m.valor+=l.v;m.de.push({nome:it.p.nome,v:l.v,p:l.p});
    });
  });
  var linhas=Object.keys(mapa).map(function(k){return mapa[k];}).sort(function(a,b){return b.valor-a.valor;});
  fecharPct(linhas,total);
  var somaV=linhas.reduce(function(s,l){return s+l.valor;},0);
  return {total:total,linhas:linhas,confere:somaV===total,pessoas:itens.length};
}
/* Boleto manda no total: o valor calculado pelo cadastro serve só de peso entre os centros de custo. */
function porPesos(total,c){
  if(!c.total||!c.linhas.length)return {total:total,linhas:[],confere:false,pessoas:c.pessoas,calculado:c.total};
  var linhas=c.linhas.map(function(l){return {cc:l.cc,nome:l.nome,ativo:l.ativo,de:l.de,valor:divInt(total*l.valor,c.total)};});
  var soma=linhas.reduce(function(s,l){return s+l.valor;},0);
  linhas[0].valor+=total-soma;
  fecharPct(linhas,total);
  return {total:total,linhas:linhas,confere:linhas.reduce(function(s,l){return s+l.valor;},0)===total,pessoas:c.pessoas,calculado:c.total};
}

/* ---------- VR/VA ---------- */
function vrSit(p){
  if(p.tipo!=="clt")return {entra:false,fixo:true,motivo:"PJ: pagamento continua como está (decisão 3)"};
  if(!p.vr)return {entra:false,fixo:true,motivo:"A ficha diz que não recebe VR/VA"};
  var f=S.vr.fora[p.id];
  if(f)return {entra:false,marca:f,motivo:f.mot==="Outro"?(f.txt||""):f.mot};
  return {entra:true,motivo:""};
}
function vrCalc(){
  var dia=lerValor(S.vr.dia),dias=/^\d{1,2}$/.test(String(S.vr.dias).trim())?Number(S.vr.dias):null;
  var okDia=dia!==null&&dia>0,okDias=dias!==null&&dias>0&&dias<=31;
  var ok=okDia&&okDias,por=ok?dia*dias:0;
  var entram=[],fora=[];
  S.pessoas.forEach(function(p){var s=vrSit(p);(s.entra?entram:fora).push({p:p,s:s,valor:por});});
  var semMotivo=fora.filter(function(x){return x.s.marca&&!x.s.motivo;}).length;
  return {dia:dia,dias:dias,okDia:okDia,okDias:okDias,ok:ok,por:por,entram:entram,fora:fora,semMotivo:semMotivo,cons:consolidar(entram)};
}
function inativos(c){return c.linhas.filter(function(l){return !l.ativo&&l.valor>0;});}
function donoInativo(cc){var d=null;S.pessoas.forEach(function(p){if(rateioAtual(p).linhas.some(function(l){return l.cc===cc;}))d=d||p;});return d;}
function digitos(t){return String(t).replace(/\D/g,"").length;}
function vrBloqueios(){
  var c=vrCalc(),b=S.vr.boleto,bl=[],bv=lerValor(b.valor),f=fotoAtual("vr");
  if(!c.ok)bl.push("Preencha valor por dia e dias úteis (Seção 3.1).");
  if(c.semMotivo)bl.push("Informe o motivo de quem ficou de fora (Seção 3.1).");
  if(!c.entram.length)bl.push("Ninguém entrou neste VR/VA (Seção 3.1).");
  if(inativos(c.cons).length)bl.push("Troque o centro de custo inativo no rateio (Seção 3.3).");
  var dig=digitos(b.linha);
  if(!dig)bl.push("Preencha a linha digitável do boleto. Anexar o PDF não substitui esse campo (Seção 3.2).");
  else if(dig!==47&&dig!==48)bl.push("A linha digitável está incompleta: tem "+dig+" números, e o boleto usa 47 ou 48 (Seção 3.2).");
  if(bv===null||bv<=0)bl.push("Informe o valor do boleto (Seção 3.2).");
  else if(c.ok&&Math.abs(bv-c.cons.total)>TOLERANCIA)bl.push("O boleto é de "+brl(bv)+" e o calculado é "+brl(c.cons.total)+". A diferença de "+brl(Math.abs(bv-c.cons.total))+" passa da tolerância de "+brl(TOLERANCIA)+" (Seção 3.2).");
  if(!b.venc)bl.push("Informe o vencimento do boleto (Seção 3.2).");
  if(f.linhas.some(function(l){return l.valor<=0;}))bl.push("Há centro de custo com valor zerado, que o Financeiro recusa (Seção 3.3).");
  if(f.linhas.length>20)bl.push("São mais de 20 centros de custo, limite do Financeiro por solicitação (Seção 3.3).");
  return bl;
}

/* ---------- Folha ---------- */
function folhaItens(){return S.folha.linhas.filter(function(l){return l.pid;}).map(function(l){return {p:P(l.pid),valor:l.valor};});}
function folhaCons(){return consolidar(folhaItens());}
function folhaProblemas(){
  var imp=[],at=[],presentes={};
  S.folha.linhas.forEach(function(l){
    if(!l.pid){imp.push({t:"nao",l:l});return;}
    presentes[l.pid]=true;
    var p=P(l.pid),s=salarioAtual(p);
    if(s===null)imp.push({t:"semsal",l:l,p:p});
    else{var dif=Math.abs(l.valor-s)*100/s;if(dif>LIMITE_DIF)at.push({t:"dif",l:l,p:p,s:s,dif:dif});}
    if(usaInativo(p))imp.push({t:"inativo",p:p});
  });
  S.pessoas.forEach(function(p){if(p.tipo==="clt"&&!presentes[p.id])imp.push({t:"ausente",p:p});});
  return {imp:imp,at:at};
}

  return itens;
}
function pendPag(id){
  var q=S.pag[id];
  if(q.estado==="pago")return "Nenhuma pendência";
  if(q.estado==="aguardando")return "Com o Financeiro. Enviado não significa pago";
  if(q.estado==="devolvida")return "O Financeiro devolveu para correção: "+(q.motivo||"linha digitável não confere");
  if(q.estado==="recusada")return "O Financeiro recusou: "+(q.motivo||"boleto em duplicidade")+". Não será pago";
  if(q.estado==="lancada")return q.pedido?"Você pediu o cancelamento. Aguardando o Financeiro":"Lançada no Omie. Ainda não foi paga";
  if(id==="aj")return "O significado de “provisionar” está pendente (pergunta 6)";
  if(id==="folha"){
    if(q.estado==="rateio")return "Decisão 1 pendente. Nada foi enviado ao Financeiro";
    if(!S.folha.importado)return "Falta o arquivo da contabilidade";
    var pr=folhaProblemas();return pr.imp.length?plural(pr.imp.length,"item impede fechar o rateio","itens impedem fechar o rateio"):"Pronta para gerar o rateio";
  }
  if(id==="vr"){var bl=vrBloqueios();return bl.length?plural(bl.length,"item impede o envio","itens impedem o envio"):"Pronto para enviar";}
  return "Nenhuma pendência";
}
function simBts(id){
  var q=S.pag[id],a=[];
  if(q.estado==="aguardando")a=[["devolveu","Financeiro devolveu"],["recusou","Financeiro recusou"],["lancou","Financeiro lançou"]];
  if(q.estado==="lancada")a=q.pedido?[["cancelou","Financeiro cancelou"]]:[["pagou","Financeiro pagou"]];
  if(!a.length||!pode())return "";
  return '<div class="ctrl"><span>Só nesta demonstração:</span>'+a.map(function(x){return '<button class="limpar" data-act="simular" data-id="'+id+'" data-v="'+x[0]+'">'+x[1]+"</button>";}).join("")+"</div>";

/* ---------- Render e rotas ---------- */
var ROTAS=[["mapa","Mapa do RH"],["competencia","Competência do mês"],["vr","Gerar VR/VA"],["folha","Lançar folha"],["ficha","Ficha do colaborador"],["suposicoes","Suposições"]];
var TELAS={mapa:telaMapa,competencia:telaCompetencia,vr:telaVr,folha:telaFolha,ficha:telaFicha,suposicoes:telaSup};
function rota(){var r=(location.hash||"").replace("#","");return TELAS[r]?r:"mapa";}
function $(id){return document.getElementById(id);}
function render(){
  var r=rota(),a=document.activeElement,chave=null,sel=null;
  if(a&&a!==document.body&&$("tela").contains(a)){
    if(a.id)chave="#"+CSS.escape(a.id);
    else if(a.dataset.act)chave='[data-act="'+a.dataset.act+'"]'+(a.dataset.id?'[data-id="'+a.dataset.id+'"]':"");
    else if(a.dataset.in)chave='[data-in="'+a.dataset.in+'"]'+(a.dataset.i?'[data-i="'+a.dataset.i+'"]':"");
    if(a.type==="text")sel=a.selectionStart;
  }
  var rol=[].map.call(document.querySelectorAll("#tela .tbl"),function(t){return t.scrollLeft;});
  $("menu").innerHTML=ROTAS.map(function(x,i){return '<li><a href="#'+x[0]+'"'+(x[0]===r?' aria-current="page"':"")+"><span>"+(i+1)+"</span>"+x[1]+"</a></li>";}).join("");
  $("seg-papel").innerHTML=seg(S.papel,[["rh","RH"],["diretoria","Diretoria"],["sem","Sem papel"]],"papel");
  $("quem-papel").textContent={rh:"Controladoria/RH",diretoria:"Diretoria",sem:"Sem papel"}[S.papel];
  $("tela").innerHTML=TELAS[r]();
  [].forEach.call(document.querySelectorAll("#tela .tbl"),function(t,i){if(rol[i])t.scrollLeft=rol[i];});
  if(chave){var n=document.querySelector("#tela "+chave);if(n){n.focus({preventScroll:true});if(sel!==null&&n.setSelectionRange&&n.type==="text")n.setSelectionRange(sel,sel);}}
  var ativo=document.querySelector("nav.menu a[aria-current=page]"),nav=document.querySelector("nav.menu");
  if(ativo&&nav)nav.scrollLeft=ativo.offsetLeft-nav.offsetLeft-40;
  if(S.foco&&r==="ficha"&&S.demo.ficha==="dados"){
    var alvo=$("sec-"+S.foco);S.foco=null;
    if(alvo){alvo.scrollIntoView({block:"start"});window.scrollBy(0,-70);alvo.classList.add("realce");}
  }
}
function ir(r){if(rota()===r){render();}else{location.hash=r;}}
window.addEventListener("hashchange",function(){var f=S.foco;render();if(!f){window.scrollTo(0,0);var t=$("h1");if(t)t.focus({preventScroll:true});}});
var tmToast;
function toast(t){var el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(tmToast);tmToast=setTimeout(function(){el.classList.remove("on");},4200);}

/* ---------- Diálogos ---------- */
var dlgActs={};
function dialogo(o){
  var d=$("dlg");dlgActs={};
  var bts=o.botoes.map(function(b,i){dlgActs[i]=b.f;return '<button type="button" class="btn '+(b.tipo||"")+'" data-dlg="'+i+'"'+(b.motivo?' data-precisa="1" disabled':"")+">"+h(b.t)+"</button>";}).join("");
  d.innerHTML='<div class="dlg-c"><h2 id="dlg-t">'+h(o.titulo)+"</h2>"+(o.sub?'<p class="sec peq">'+h(o.sub)+"</p>":"")+o.corpo+(o.motivo?'<div class="campo"><label for="dlg-mot">Motivo (obrigatório, fica no histórico)</label><textarea id="dlg-mot" rows="2" data-motivo="1"></textarea></div>':"")+'</div><div class="dlg-b">'+bts+"</div>";
  if(d.open)d.close();
  d.showModal();
}
function fechar(){var d=$("dlg");if(d.open)d.close();}
$("dlg").addEventListener("click",function(ev){
  var b=ev.target.closest("[data-dlg]");if(!b||b.disabled)return;
  var f=dlgActs[b.dataset.dlg],m=$("dlg-mot");
  var ret=f?f(m?m.value.trim():""):undefined;
  if(ret!==false){fechar();render();}
});
$("dlg").addEventListener("input",function(ev){
  if(ev.target.dataset.motivo){var ok=ev.target.value.trim().length>=3;[].forEach.call($("dlg").querySelectorAll("[data-precisa]"),function(x){x.disabled=!ok;});}
});
function nomeSol(id){return "solicitação nº "+S.pag[id].num;}
function refazer(id){
  if(id==="vr")return "Conferir quem entra, conferir o boleto com o calculado e enviar a nova revisão.";
  return "Conferir o boleto e enviar a nova revisão.";
}
function dlgPago(id){
  var q=S.pag[id];
  dialogo({titulo:"Não é possível reabrir: já foi pago",sub:NOMES_PAG[id]+" de "+COMP_NOME+" · "+nomeSol(id),
   corpo:"<p>O Financeiro já pagou "+brl(q.foto.total)+". O dinheiro saiu, então este pagamento não pode ser refeito: um novo envio correria o risco de pagar duas vezes.</p><h3>O que fazer se houver erro</h3><ul><li>Valor pago a menos: crie outro pagamento só com a diferença.</li><li>Valor pago a mais: combine o acerto com o Financeiro.</li><li>Rateio errado: peça o ajuste ao Financeiro. Aqui o registro continua como foi pago.</li></ul>",
   botoes:[{t:"Entendi, manter como pago",tipo:"btn-p",f:function(){}}]});
}
function dlgLancada(id,titulo){
  var q=S.pag[id];
  dialogo({titulo:titulo,sub:NOMES_PAG[id]+" de "+COMP_NOME+" · "+nomeSol(id)+" · "+brl(q.foto.total),
   corpo:"<p>O Financeiro já validou e lançou no Omie. Daqui o RH não consegue desfazer isso sozinho.</p><h3>O que acontece se você pedir</h3><ul><li>O Financeiro recebe o seu pedido e o motivo.</li><li>Até ele cancelar no Omie, o pagamento continua “Lançada” e pode ser pago.</li><li>Quando ele cancelar, o pagamento volta para “Em conferência” aqui no RH, como revisão "+(q.rev+1)+".</li></ul><h3>O que será refeito depois</h3><p>"+refazer(id)+"</p>",
   motivo:true,
   botoes:[{t:"Manter como está",f:function(){}},{t:"Pedir ao Financeiro o cancelamento",tipo:"btn-d",motivo:true,f:function(){q.pedido=true;toast("Pedido enviado ao Financeiro. Continua lançada até ele responder.");}}]});
}
function limparEnvio(q){q.foto=null;q.num=null;q.pedido=false;q.motivo=null;q.boleto=null;q.fotoCalc=null;q.calculado=null;}
function novaRevisao(id){
  var q=S.pag[id],n=q.num;
  if(id==="vr")S.vr.boleto=Object.assign({},q.boleto);
  q.estado="conferencia";q.rev=(q.rev||1)+1;limparEnvio(q);
  if(id==="vr")S.vr.passo=1;
  toast(NOMES_PAG[id]+": a solicitação nº "+n+" não vale mais. Revisão "+q.rev+" em conferência.");
}
function acaoReabrir(id){
  var q=S.pag[id];
  if(q.estado==="pago")return dlgPago(id);
  if(q.estado==="lancada")return dlgLancada(id,"Reabrir competência já enviada: precisa do Financeiro");

function acaoCancelar(id){
  var q=S.pag[id];

   motivo:true,

     var n=q.num;q.estado="preparar";limparEnvio(q);q.rev=1;

function concluirEnvio(id,extra){
  var q=S.pag[id];
  if(S.enviando||enviado(id))return;
  S.enviando=id;render();
  setTimeout(function(){
    if(S.enviando!==id)return;
    q.foto=fotoAtual(id);q.num=S.proxNum;S.proxNum+=1;q.estado="aguardando";S.enviando=null;
    if(extra)extra(q);
    toast(NOMES_PAG[id]+": "+brl(q.foto.total)+" enviados. Solicitação nº "+q.num+", aguardando validação do Financeiro.");
    render();
  },600);
}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act]");if(!t||t.disabled)return;
  if(t.tagName!=="INPUT")ev.preventDefault();
  var f=A[t.dataset.act];if(f)f(t.dataset.id,t);
});
document.addEventListener("change",function(ev){
  var n=ev.target.dataset&&ev.target.dataset.in;if(!n)return;
  if(n==="selP"){S.sel=ev.target.value;S.draft=null;render();}
  if(n==="ratCc"){S.draft.linhas[Number(ev.target.dataset.i)].cc=ev.target.value;$("rat-total").innerHTML=ratTotalHtml();}
  if(n==="vrMot"){var f=S.vr.fora[ev.target.dataset.i];f.mot=ev.target.value;render();}
});
document.addEventListener("input",function(ev){
  var el=ev.target,n=el.dataset&&el.dataset.in;if(!n)return;
  function seg1(){var c=vrCalc(),b=$("vr-seg1");if(b)b.disabled=!(c.ok&&c.entram.length&&!c.semMotivo);}
  if(n==="vrDia"||n==="vrDias"){
    if(n==="vrDia")S.vr.dia=el.value;else S.vr.dias=el.value;
    var c=vrCalc();$("vr-calc").innerHTML=vrCalcHtml();$("vr-dia-e").hidden=c.okDia;$("vr-dias-e").hidden=c.okDias;seg1();
  }
  if(n==="vrTxt"){S.vr.fora[el.dataset.i].txt=el.value;seg1();}
  if(n==="bLinha"){S.vr.boleto.linha=el.value;}
  if(n==="bValor"||n==="bVenc"){if(n==="bValor")S.vr.boleto.valor=el.value;else S.vr.boleto.venc=el.value;$("vr-compara").innerHTML=comparaHtml();}
  if(n==="ratP"){S.draft.linhas[Number(el.dataset.i)].p=el.value;$("rat-total").innerHTML=ratTotalHtml();}
  if(n==="ratMes"){S.draft.mes=el.value;$("rat-total").innerHTML=ratTotalHtml();}
});
document.addEventListener("submit",function(ev){
  ev.preventDefault();
  var f=ev.target,k=f.dataset.sub,p=P(S.sel);
  if(k==="salvarSal"){
    var v=lerValor($("s-val").value),m=$("s-mes").value,er=$("s-erro");
    if(v===null||v<=0){er.textContent="Use um valor como 2.584,31.";er.hidden=false;$("s-val").focus();return;}
    if(!/^\d{4}-\d{2}$/.test(m)){er.textContent="Escolha o mês em que este salário começa.";er.hidden=false;$("s-mes").focus();return;}
    p.sal=p.sal.filter(function(x){return x.d!==m;});p.sal.push({d:m,c:v});p.sal.sort(function(a,b){return a.d<b.d?-1:1;});
    p.hist.push("05/11/2026: salário alterado para "+brl(v)+", a partir de "+mesNome(m));
    render();toast("Salário a partir de "+mesNome(m)+" salvo.");
  }
  if(k==="salvarCad"){
    var er2=$("c-erro"),vtOn=$("c-vt").checked,vtv=$("c-vtv").value.trim(),vt=null;
    if(vtOn){vt=lerValor(vtv);if(vt===null||vt<=0){er2.textContent="Informe o valor por dia do vale-transporte, como 17,60.";er2.hidden=false;$("c-vtv").focus();return;}}
    var mail=$("c-mail").value.trim();
    if(mail&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){er2.textContent="Confira o e-mail corporativo.";er2.hidden=false;$("c-mail").focus();return;}
    if(!$("c-nome").value.trim()){er2.textContent="O nome não pode ficar vazio.";er2.hidden=false;$("c-nome").focus();return;}
    p.nome=$("c-nome").value.trim();p.cargo=$("c-cargo").value.trim();p.tipo=$("c-tipo").value;p.adm=$("c-adm").value;p.status=$("c-st").value;p.email=mail;p.sub=$("c-sub").value;p.vr=$("c-vr").checked;p.vt=vt;p.seg=$("c-seg").checked;p.cel=$("c-cel").value.trim();
    var mot=$("c-mot").value.trim();
    p.hist.push("05/11/2026: cadastro alterado"+(mot?". Motivo: "+mot:""));
    render();toast("Alterações salvas.");
  }
});
inicial();
render();
