<script>
"use strict";
/* ---------- Dinheiro: tudo em centavos inteiros ---------- */
function brl(c){var n=Math.abs(c),r=Math.floor(n/100),ct=String(n%100).padStart(2,"0");return (c<0?"-":"")+"R$ "+String(r).replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+ct;}
function brlSem(c){return brl(c).replace("R$ ","");}
function lerValor(t){t=String(t).trim();if(!/^(\d{1,3}(\.\d{3})+|\d+)(,\d{1,2})?$/.test(t))return null;var p=t.replace(/\./g,"").split(",");return Number(p[0])*100+Number(((p[1]||"")+"00").slice(0,2));}
function pct(cs){return String(Math.floor(cs/100))+","+String(cs%100).padStart(2,"0")+"%";}
function divInt(a,b){return (a-a%b)/b;}
function ratear(total,linhas){
  var res=linhas.map(function(l){return {cc:l.cc,p:l.p,v:divInt(total*l.p,10000),r:(total*l.p)%10000};});
  distribuirSobra(res,"v",total-res.reduce(function(s,l){return s+l.v;},0));
  return res;
}
/* Maiores sobras: cada unidade restante vai para a linha que mais perdeu no truncamento. */
function distribuirSobra(linhas,campo,sobra){
  var ordem=linhas.map(function(l,i){return i;}).sort(function(a,b){return linhas[b].r-linhas[a].r||a-b;});
  for(var i=0;i<sobra&&ordem.length;i++)linhas[ordem[i%ordem.length]][campo]+=1;
}
function fecharPct(linhas,total){
  if(!total){linhas.forEach(function(l){l.pct=0;});return;}
  linhas.forEach(function(l){l.pct=divInt(l.valor*10000,total);l.r=(l.valor*10000)%total;});
  distribuirSobra(linhas,"pct",10000-linhas.reduce(function(s,l){return s+l.pct;},0));
}
function consolidar(itens){
  var mapa={},total=0;
  itens.forEach(function(it){
    total+=it.valor;
    ratear(it.valor,it.p.rat).forEach(function(l){
      var m=mapa[l.cc]||(mapa[l.cc]={cc:l.cc,nome:CC[l.cc].nome,ativo:CC[l.cc].ativo,valor:0});
      m.valor+=l.v;
    });
  });
  var linhas=Object.keys(mapa).map(function(k){return mapa[k];}).sort(function(a,b){return b.valor-a.valor;});
  return {total:total,linhas:linhas};
}
/* O total manda; o cálculo do cadastro serve só de peso entre os centros de custo. */
function porPesos(total,c){
  if(!c.total||!c.linhas.length)return {total:total,linhas:[]};
  var linhas=c.linhas.map(function(l){return {cc:l.cc,nome:l.nome,ativo:l.ativo,valor:divInt(total*l.valor,c.total)};});
  var soma=linhas.reduce(function(s,l){return s+l.valor;},0);
  linhas[0].valor+=total-soma;
  return {total:total,linhas:linhas};
}
/* Junta as linhas de rateio de vários pagamentos. */
function somar(itens){
  var m={},tot=0;
  itens.forEach(function(i){tot+=i.valor;i.linhas.forEach(function(l){var x=m[l.cc]||(m[l.cc]={cc:l.cc,nome:l.nome,ativo:l.ativo,valor:0});x.valor+=l.valor;});});
  var ls=Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return b.valor-a.valor;});
  fecharPct(ls,tot);
  return {total:tot,linhas:ls,confere:ls.reduce(function(s,l){return s+l.valor;},0)===tot};
}

/* ---------- Dados fictícios ---------- */

function linhaSit(l){
  var b=[],a=[];
  if(!l.pid)b.push(l.sugestao?"Sem CPF no arquivo: confirme a pessoa":"Não está no cadastro");
  else{
    var p=P(l.pid);
    if(!p.pix)b.push("Sem chave PIX");
    if(usaInativo(p))b.push("Centro de custo inativo");
    var d=Math.abs(l.valor-p.sal)*100/p.sal;
    if(d>LIMITE_DIF)a.push({dif:Math.round((l.valor-p.sal)*100/p.sal),sal:p.sal});

}

  return {dia:dia,dias:dias,ok:dia!==null&&dia>0&&dias!==null&&dias>0&&dias<=31};
}
function meioMes(p){return p.adm.slice(0,7)===COMP;}
function vrDiasPessoa(p){
  var n=vrNum(),a=S.vr.aus[p.id]==null||S.vr.aus[p.id]===""?"0":String(S.vr.aus[p.id]).trim();
  if(!n.ok)return null;
  if(!/^\d{1,2}$/.test(a)||Number(a)>n.dias)return null;
  return n.dias-Number(a);
}
function vrGrupos(){
  var ent=[],ficaFora=[],add=[];
  S.pessoas.forEach(function(p){
    if(p.tipo!=="clt")return;
    if(!p.vr){ficaFora.push({p:p,m:"A ficha diz que não recebe VR"});return;}
    if(meioMes(p)){add.push(p);return;}
    ent.push(p);
  });
  return {ent:ent,fora:ficaFora,add:add};
}
function vrCalc(){
  var n=vrNum(),g=vrGrupos(),erro=[],itens=[];
  g.ent.forEach(function(p){
    var d=vrDiasPessoa(p);
    if(d===null){if(n.ok)erro.push(p.nome);return;}
    if(d>0)itens.push({p:p,valor:d*n.dia,dias:d});
  });
  return {n:n,g:g,erroAus:erro,itens:itens,cons:consolidar(itens)};
}
function addCalc(){
  var n=vrNum(),g=vrGrupos(),itens=[],erro=[];
  g.add.forEach(function(p){
    var a=String(S.vr.addDias[p.id]==null?"":S.vr.addDias[p.id]).trim();
    if(!n.ok||!/^\d{1,2}$/.test(a)||Number(a)<1||Number(a)>31){erro.push(p.nome);return;}
    itens.push({p:p,valor:Number(a)*n.dia,dias:Number(a)});
  });
  return {itens:itens,erro:erro,cons:consolidar(itens)};
}
function codOk(o){
  var t=o.tipo,c=String(o.codigo||"").trim();
  if(!c)return "Preencha o código de pagamento.";
  if(t==="boleto"){var d=digitos(c);if(d!==47&&d!==48)return "O boleto usa 47 ou 48 números e este tem "+d+".";}
  else if(c.length<20)return "O código parece curto demais para "+(t==="pix"?"um QR Code ou PIX":"uma chave")+".";
  return null;
}

/* ---------- Plano de cada pagamento: o que dá para criar agora e o que fica de fora ---------- */
function plano(mod){
  var itens=[],fora=[],geral=[];
  if(mod==="folha"){
    if(!S.folha.lido)return {itens:itens,fora:fora,geral:["Falta enviar os arquivos da contabilidade."],espera:true};

    S.folha.linhas.forEach(function(l){
      var key=l.pid||l.nome;
      if(jaTem("folha",key))return;
      var ex=l.pid&&externoDe(l.pid);
      if(ex){fora.push({nome:l.nome,motivo:"Já lançado neste mês",valor:l.valor,pid:l.pid,dup:true});return;}
      var s=linhaSit(l);
      if(s.b.length)fora.push({nome:l.nome,motivo:s.b.join("; "),valor:l.valor,pid:l.pid});
      else itens.push(itemP("folha",P(l.pid),l.valor,S.folha.data,"Salário de "+COMP_NOME,"Chave PIX"));
    });
    if(!S.folha.data)geral.push("Informe a data de pagamento.");
  }
  if(mod==="fgts"||mod==="consig"){
    var gs=S.guias;
    if(!gs.lido)return {itens:itens,fora:fora,geral:["Falta ler a guia."],espera:true};
    if(jaTem(mod,mod))return {itens:itens,fora:fora,geral:geral};
    var g=gs[mod],pesos=mod==="fgts"?S.pessoas.filter(function(p){return p.tipo==="clt";}).map(function(p){return {p:p,valor:p.sal};}):[{p:P("rafael"),valor:60000},{p:P("tiago"),valor:40000}];
    var it=itemLote(mod,mod,mod==="fgts"?"Guia do FGTS":"Guia do consignado",mod==="fgts"?"Agente do FGTS (exemplo)":"Banco do consignado (exemplo)",g.valor,g.venc,(mod==="fgts"?"FGTS de ":"Consignado de ")+COMP_NOME,TIPOS_COD[g.tipo],consolidar(pesos));
    it.anexo=g.pdf;it.cat="FGTS e consignado";
    itens.push(it);
    var cg=codOk(g);if(cg)geral.push(cg);
    var ina=inativoEm([it]);if(ina.length)geral.push("O rateio usa centro de custo inativo ("+ina.join(", ")+"). Corrija o rateio de quem usa.");
  }
  if(mod==="vr"){
    var c=vrCalc();
    if(jaTem("vr","vr"))return {itens:itens,fora:fora,geral:geral};
    var bv=lerValor(S.vr.cod.valor),prev=c.cons.total,tot=bv!==null&&bv>0?bv:prev;
    if(!c.n.ok)geral.push("Preencha o valor por dia e os dias úteis.");
    if(c.erroAus.length)geral.push("Dias de ausência inválidos: "+c.erroAus.join(", ")+".");
    if(!c.itens.length&&c.n.ok&&!c.erroAus.length)geral.push("Ninguém entra neste VR.");
    var ce=codOk(S.vr.cod);if(ce)geral.push(ce);
    if(bv===null||bv<=0)geral.push("Informe o valor do boleto.");
    else if(c.n.ok&&Math.abs(bv-prev)>TOL)geral.push("O valor do boleto ("+brl(bv)+") difere da previsão ("+brl(prev)+") em "+brl(Math.abs(bv-prev))+", acima do limite provisório de "+brl(TOL)+" (limite a definir).");
    if(!S.vr.cod.venc)geral.push("Informe o vencimento.");
    if(c.itens.length&&tot>0){
      var iv=itemLote("vr","vr","VR de "+COMP_NOME,"Operadora de Benefícios Exemplo",tot,S.vr.cod.venc,"VR de "+COMP_NOME+" ("+plural(c.itens.length,"pessoa","pessoas")+")",TIPOS_COD[S.vr.cod.tipo],c.cons);
      iv.anexo=S.vr.cod.pdf;itens.push(iv);
      var ina2=inativoEm([iv]);if(ina2.length)geral.push("O rateio usa centro de custo inativo ("+ina2.join(", ")+"). Corrija o rateio de quem usa.");
    }
  }
  if(mod==="vradd"){
    var a=addCalc();
    if(jaTem("vradd","vradd"))return {itens:itens,fora:fora,geral:geral};
    if(!a.itens.length)return {itens:itens,fora:fora,geral:[],vazio:true};

    var ia=itemLote("vradd","vradd","Crédito à parte do VR","Operadora de Benefícios Exemplo",a.cons.total,S.vr.add.venc,"VR adicional de "+COMP_NOME+" (entrada no meio do mês)",TIPOS_COD[S.vr.add.tipo],a.cons);
    ia.anexo=S.vr.add.pdf;itens.push(ia);
    var ina3=inativoEm([ia]);if(ina3.length)geral.push("O rateio usa centro de custo inativo ("+ina3.join(", ")+").");
  }
  if(mod==="vt"){
    S.pessoas.filter(function(p){return p.aj;}).forEach(function(p){
      if(jaTem("vt",p.id))return;
      var l=S.vt.lin[p.id]||(S.vt.lin[p.id]={codigo:"",venc:"2026-11-10"});

    });
  }
  if(mod==="pj"){

      if(jaTem("pj",p.id))return;

      if(p.sal==null)mot.push("Sem valor no cadastro");
      if(p.emite){
        if(!m||m.estado==="aguardando")mot.push("Falta anexar a nota");
        else if(m.estado!=="confirmada")mot.push("Falta confirmar a nota");
        else valor=lerValor(m.valor);
      }else if(!m||m.estado!=="semnota")mot.push("Falta lançar sem nota");
      if(!p.pix)mot.push("Sem chave PIX");
      if(usaInativo(p))mot.push("Centro de custo inativo");
      if(mot.length)fora.push({nome:p.nome,motivo:mot.join("; "),valor:valor||p.sal||0,pid:p.id});
      else itens.push(itemP("pj",p,valor,S.pj.venc,"Prestação de serviço de "+COMP_NOME+(p.emite?" (nota nº "+m.numero+")":" (sem nota)"),"Chave PIX"));
    });
  }
  return {itens:itens,fora:fora,geral:geral};
}

/* ---------- Resumo por grupo (cartões da competência) ---------- */
function resumoGrupo(g){
  var r={pago:0,fin:0,rh:0,criados:0,previstos:0,estados:{},itens:0,fora:0,geral:[],valor:0,espera:false,dev:0};
  GRUPOS[g].forEach(function(m){
    S.pagtos.filter(function(q){return q.mod===m&&!q.subst;}).forEach(function(q){
      r.estados[q.estado]=(r.estados[q.estado]||0)+1;
      if(q.estado==="pago"){r.pago+=q.valor;r.criados++;}
      else if(q.estado==="aguardando"||q.estado==="lancada"){r.fin+=q.valor;r.criados++;}
      else{r.rh+=q.valor;r.dev++;}
    });
    var pl=plano(m);
    pl.itens.forEach(function(i){r.rh+=i.valor;r.itens++;});
    pl.fora.forEach(function(i){if(i.dup)return;r.rh+=i.valor;r.fora++;});
    if(pl.espera)r.espera=true;
    pl.geral.forEach(function(x){r.geral.push(x);});
  });
  r.valor=r.pago+r.fin+r.rh;
  r.previstos=r.criados+r.dev+r.itens+r.fora;
  return r;
}
function estadoGrupo(g){
  var r=resumoGrupo(g),e=r.estados;
  if(r.criados===0&&r.dev===0){
    var iniciado=g==="folha"?S.folha.lido:g==="guias"?S.guias.lido:g==="vr"?!!(S.vr.cod.codigo||S.vr.cod.valor):true;
    return iniciado?"conf":"preparar";
  }
  if(r.itens+r.fora>0)return "parcial";
  if(e.devolvida)return "devolvida";
  if(e.recusada)return "recusada";
  if(e.aguardando)return "aguardando";
  if(e.lancada)return "lancada";
  return "pago";
}

function qr(seed){
  var n=21,s=0,i,r="";
  for(i=0;i<seed.length;i++)s=(Math.imul(s,31)+seed.charCodeAt(i))>>>0;
  function fnd(x,y,a,b){var dx=x-a,dy=y-b;if(dx<0||dy<0||dx>6||dy>6)return null;return dx===0||dx===6||dy===0||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4);}
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){
    var f=fnd(x,y,0,0);if(f===null)f=fnd(x,y,14,0);if(f===null)f=fnd(x,y,0,14);
    if(f===null){s=(Math.imul(s,1103515245)+12345)>>>0;f=((s>>>16)&1)===0;}
    if(f)r+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';
  }
  return '<span class="qr"><svg viewBox="-1 -1 23 23" role="img" aria-label="QR Code de exemplo" shape-rendering="crispEdges" fill="#0a1628">'+r+"</svg></span>";
}

 sim:function(id,el){
   var mods=el.dataset.mod.split(","),f=false;
   S.pagtos.forEach(function(q){
     if(mods.indexOf(q.mod)<0||q.subst)return;
     if(id==="valida"&&q.estado==="aguardando")q.estado="lancada";
     else if(id==="paga"&&q.estado==="lancada")q.estado="pago";
     else if(id==="devolve"&&!f&&q.estado==="aguardando"){q.estado="devolvida";q.motivo="Dado de pagamento não confere";f=true;}
   });
   render();
 },

 corrigirCC:function(id){
   var p=P(id),ina=p.rat.filter(function(x){return !CC[x.cc].ativo;});

   dialogo({titulo:"Corrigir o rateio de "+p.nome,corpo:"<p>Hoje: "+ratTxt(p)+"</p><p>"+h(CC[ina[0].cc].nome)+" está inativo. Escolha o centro de custo que fica no lugar, com o mesmo percentual.</p>"+'<div class="campo"><label for="dl-cc">Novo centro de custo</label><select id="dl-cc">'+optsCC()+'</select></div><p class="peq sec">Vale para os próximos pagamentos. Pagamentos já criados não mudam.</p>',
    botoes:[{t:"Voltar",f:function(){}},{t:"Trocar o centro de custo",tipo:"btn-p",f:function(){
      var novo=$("dl-cc").value,m={};
      p.rat.forEach(function(x){var k=CC[x.cc].ativo?x.cc:novo;m[k]=(m[k]||0)+x.p;});
      p.rat=Object.keys(m).map(function(k){return {cc:k,p:m[k]};});
      toast("Rateio de "+p.nome+" corrigido.");
    }}]});

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act]");if(!t||t.disabled)return;
  if(t.tagName!=="INPUT")ev.preventDefault();
  var f=A[t.dataset.act];if(f)f(t.dataset.id,t);
});
document.addEventListener("change",function(ev){
  var n=ev.target.dataset&&ev.target.dataset.in;if(n==="selP"){S.sel=ev.target.value;render();}
});
document.addEventListener("input",function(ev){
  var el=ev.target,p=el.dataset&&el.dataset.p;if(!p)return;
  setPath(p,el.type==="checkbox"?el.checked:el.value);
  if(p==="folha.erroLeitura")aplicarErro();
  render();
});
document.addEventListener("submit",function(ev){
  ev.preventDefault();
  var f=ev.target;if(f.dataset.sub!=="salvarCad")return;
  var p=P(S.sel),er=$("c-erro");
  function falha(t,id){er.textContent=t;er.hidden=false;$(id).focus();}
  var mail=$("c-mail").value.trim();
  if(mail&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail))return falha("Confira o e-mail corporativo.","c-mail");
  if(!$("c-nome").value.trim())return falha("O nome não pode ficar vazio.","c-nome");
  var aj=p.aj;
  if(p.tipo==="clt"){
    var tipo=$("c-ajt").value;
    if(tipo){var v=lerValor($("c-ajv").value);if(v===null||v<=0)return falha("Informe o valor mensal, como 176,00.","c-ajv");aj={tipo:tipo,valor:v,forma:$("c-ajf").value};}
    else aj=null;
    p.vr=$("c-vr").checked;
  }else{
    var dd=$("c-doc").value.trim(),nd=dd.replace(/[^\d*]/g,"").length;
    if(nd!==11&&nd!==14)return falha("O documento deve ser um CPF (11 números) ou um CNPJ (14 números).","c-doc");
    var pv=$("c-pjv").value.trim(),pvv=null;if(pv){pvv=lerValor(pv);if(pvv===null||pvv<=0)return falha("Use um valor como 5.200,00 ou deixe vazio.","c-pjv");}
    p.doc=dd;p.sal=pvv;p.emite=$("c-emite").value==="sim";
  }
  p.aj=aj;p.nome=$("c-nome").value.trim();p.cargo=$("c-cargo").value.trim();p.adm=$("c-adm").value;p.status=$("c-st").value;p.email=mail;

  render();toast("Alterações salvas.");
});
inicial();
render();
</script>
