<title>RH Módulos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  color-scheme:light;
  --fundo:#f3f5fa;--card:#ffffff;--inset:#eef2f9;--hover:#e3eaf6;--sel:#dfe8f8;
  --borda:#c4d0e2;--texto:#0a1628;--sec:#475a76;
  --acento:#f05a28;--acento-t:#b8390f;--on-acento:#0a1628;
  --erro:#b3261e;--erro-fundo:#fdeceb;--aviso:#7a5200;--aviso-fundo:#fff3d1;
  --raio:10px;
  --fonte:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --fundo:#0a1628;--card:#0d2050;--inset:#0a1628;--hover:#12295f;--sel:#12295f;
    --borda:#1e3a5f;--texto:#f1f5f9;--sec:#94a3b8;
    --acento-t:#f05a28;
    --erro:#f2877f;--erro-fundo:#2a1320;--aviso:#e8c547;--aviso-fundo:#231f24;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --fundo:#0a1628;--card:#0d2050;--inset:#0a1628;--hover:#12295f;--sel:#12295f;
  --borda:#1e3a5f;--texto:#f1f5f9;--sec:#94a3b8;
  --acento-t:#f05a28;
  --erro:#f2877f;--erro-fundo:#2a1320;--aviso:#e8c547;--aviso-fundo:#231f24;
}
*{box-sizing:border-box}
html{background:var(--fundo);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--texto);font:15px/1.5 var(--fonte);overflow-x:hidden}
h1,h2,h3,p,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
h1{font-size:1.75rem;line-height:1.2;font-weight:650;letter-spacing:-.015em;display:flex;align-items:center;gap:10px}
h1:focus{outline:none}
h2{font-size:1.15rem;line-height:1.3;font-weight:650}
h3{font-size:.95rem;font-weight:650}
.letra{flex:none;display:inline-grid;place-items:center;width:1.55em;height:1.55em;border-radius:10px;background:var(--acento);color:var(--on-acento);font-weight:800}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lim{max-width:1120px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.sec{color:var(--sec)}
.peq{font-size:.82rem}
.forte{font-weight:650}
.pilha>*+*{margin-top:12px}
.pilha-g>*+*{margin-top:24px}
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.entre{justify-content:space-between}
.grow{flex:1 1 220px;min-width:0}

/* Barra de controle do mockup */
.faixa{position:sticky;top:0;z-index:30;background:var(--fundo);border-bottom:1px solid var(--borda)}
.faixa .lim{display:flex;flex-direction:column;gap:6px;padding:8px 0}
.faixa-t{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between;font-size:.78rem;color:var(--sec)}
.ctrls{display:flex;flex-wrap:wrap;gap:6px 16px}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.78rem;color:var(--sec)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--borda);border-radius:8px;overflow:hidden;background:var(--inset)}
.seg button{appearance:none;border:0;border-right:1px solid var(--borda);background:transparent;color:var(--sec);font:inherit;font-size:.82rem;padding:6px 10px;min-height:34px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--texto);background:var(--hover)}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--texto);box-shadow:inset 0 -2px 0 var(--acento);font-weight:600}
.seg button[disabled]{opacity:.5;cursor:not-allowed}
.limpar{appearance:none;background:none;border:0;color:var(--sec);font:inherit;font-size:.78rem;text-decoration:underline;cursor:pointer;padding:4px 2px;min-height:30px}
.limpar:hover{color:var(--texto)}

/* Cabeçalho como o do módulo real */
header.modulo{border-bottom:1px solid var(--borda);background:var(--fundo)}
header.modulo .lim{display:flex;align-items:center;gap:12px;min-height:56px}
.marca{font-weight:650;flex:none}
@media (min-width:700px){nav.menu ul{flex-wrap:wrap;width:auto!important}}
nav.menu{flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin}
nav.menu ul{display:flex;gap:2px;width:max-content;padding:4px 0}
nav.menu button,nav.menu .off{appearance:none;background:none;border:0;display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--sec);font:inherit;font-size:.88rem;white-space:nowrap;min-height:40px;cursor:pointer}
nav.menu .off{cursor:not-allowed;opacity:.75}
nav.menu button:hover{background:var(--hover);color:var(--texto)}
nav.menu button[aria-current=page]{background:var(--sel);color:var(--texto);font-weight:600;box-shadow:inset 0 -2px 0 var(--acento)}
nav.menu .tag{font-size:.7rem;border:1px solid var(--borda);border-radius:5px;padding:0 5px;color:var(--sec)}
nav.menu button[aria-current=page] .tag{background:var(--acento);border-color:var(--acento);color:var(--on-acento)}
nav.menu .sepa{align-self:center;width:1px;height:22px;background:var(--borda);margin:0 6px}
.quem{flex:none;text-align:right;font-size:.75rem;line-height:1.25}
@media (max-width:900px){.quem{display:none}}

main{padding-top:24px;padding-bottom:96px}
.cabeca{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.cabeca p{color:var(--sec);max-width:72ch}

/* Componentes */
.card{background:var(--card);border:1px solid var(--borda);border-radius:var(--raio);padding:16px}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:.9rem;font-weight:600;line-height:1.25;border-radius:8px;padding:9px 14px;min-height:42px;cursor:pointer;border:1px solid var(--borda);background:transparent;color:var(--texto);text-align:center}
.btn:hover{background:var(--hover)}
.btn-p{background:var(--acento);border-color:var(--acento);color:var(--on-acento)}
.btn-p:hover{background:#f4714a}
.btn-d{border-color:var(--erro);color:var(--erro)}
.btn-d:hover{background:var(--erro-fundo)}
.btn-dd{background:var(--erro);border-color:var(--erro);color:#fff}
.btn-dd:hover{filter:brightness(1.1)}
.btn[disabled]{opacity:.5;cursor:not-allowed;background:transparent;color:var(--sec);border-color:var(--borda)}
.mini{min-height:34px;padding:4px 10px;font-size:.82rem}
.link{appearance:none;background:none;border:0;padding:0;font:inherit;color:var(--acento-t);text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;border:1px solid var(--borda);color:var(--sec)}
.pill svg{width:11px;height:11px;flex:none}
.p-ok{background:var(--texto);border-color:var(--texto);color:var(--fundo)}
.p-and{border-color:var(--acento-t);color:var(--acento-t)}
.p-pend{border-style:dashed}
.p-bloq{border-color:var(--erro);color:var(--erro)}
.p-aviso{border-color:var(--aviso);color:var(--aviso)}
.p-na{background:var(--inset);color:var(--sec)}
.p-novo{background:var(--acento);border-color:var(--acento);color:var(--on-acento)}
.sis{border-color:var(--acento-t);color:var(--acento-t);font-weight:650;background:transparent}
.ref{display:inline-block;font-size:.68rem;font-weight:500;color:var(--sec);border:1px solid var(--borda);border-radius:4px;padding:0 4px;margin-right:3px;font-variant-numeric:tabular-nums;white-space:nowrap;vertical-align:1px}

.nota{border:1px solid var(--borda);border-left-width:3px;border-radius:8px;padding:10px 12px;background:var(--inset)}
.nota.info{border-left-color:var(--sec)}
.nota.dest{border-left-color:var(--acento)}
.nota.bloq{border-color:var(--erro);background:var(--erro-fundo)}
.nota.aviso{border-left-color:var(--aviso);background:var(--aviso-fundo)}
.nota .t{font-weight:650;display:block}
.nota.bloq .t{color:var(--erro)}
.nota.aviso .t{color:var(--aviso)}

.tbl{overflow-x:auto;border:1px solid var(--borda);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
table.larga{min-width:640px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--borda);vertical-align:top;background:var(--card)}
th{font-size:.76rem;font-weight:600;color:var(--sec);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.dest td{background:var(--aviso-fundo)}
.d{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.div{font-weight:700;color:var(--erro);text-decoration:underline;text-decoration-style:wavy;text-underline-offset:3px}

.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo label,.rot{font-size:.84rem;font-weight:550}
input[type=text],input[type=date],input[type=email],input[type=number],select,textarea{width:100%;min-height:42px;background:var(--inset);color:var(--texto);border:1px solid var(--borda);border-radius:8px;padding:8px 10px;font:inherit;font-size:16px}
textarea{min-height:84px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{opacity:.72;cursor:not-allowed}
td input,td select{min-height:34px;font-size:14px;padding:4px 8px}
.ajuda{font-size:.78rem;color:var(--sec)}
.erro-campo{font-size:.8rem;color:var(--erro)}
.grade{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.grade{grid-template-columns:1fr 1fr}.grade .todo{grid-column:1/-1}}
.grade3{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:760px){.grade3{grid-template-columns:1fr 1fr 1fr}}
.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer;min-height:28px}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--acento);flex:none}

.barra{height:8px;border-radius:4px;background:var(--inset);border:1px solid var(--borda);overflow:hidden}
.barra i{display:block;height:100%;background:var(--acento)}

.passos{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.passos div{border:1px solid var(--borda);border-radius:8px;padding:8px 10px;color:var(--sec);font-size:.82rem;display:flex;gap:8px;align-items:center;min-height:44px}
.passos b{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--borda);font-size:.74rem}
.passos .feito b{background:var(--texto);border-color:var(--texto);color:var(--fundo)}
.passos .atual{background:var(--sel);color:var(--texto);border-color:var(--acento);font-weight:600}
.passos .atual b{background:var(--acento);border-color:var(--acento);color:var(--on-acento)}

.lista>li{padding:12px 0;border-bottom:1px solid var(--borda)}
.lista>li:last-child{border-bottom:0}
.lista>li:first-child{padding-top:0}
.etapas>li{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--borda)}
.etapas>li:last-child{border-bottom:0}
.etapas .sit{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.etapas select{width:auto;min-width:170px}
.grupo{margin-top:6px;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--acento-t)}
.cartoes{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:980px){.cartoes{grid-template-columns:1fr 1fr}}
.cartoes>.card{min-width:0}
.valor{font-size:1.4rem;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}
.fin{border:1px solid var(--sec);border-radius:var(--raio);overflow:hidden;background:var(--inset)}
.fin-topo{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--sel)}
.fin-corpo{padding:14px}
.dados{display:grid;gap:10px 18px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.dados dt{font-size:.76rem;color:var(--sec)}
.drop{border:2px dashed var(--borda);border-radius:var(--raio);padding:18px;text-align:center}
.est-vazio{border:2px dashed var(--borda);border-radius:var(--raio);padding:32px 20px;text-align:center}
.est-erro{border:1px solid var(--erro);background:var(--erro-fundo);border-radius:var(--raio);padding:20px}
.est-erro h2{color:var(--erro)}
.est-vazio>*+*,.est-erro>*+*{margin-top:10px}
.esq{border-radius:8px;height:64px;background:linear-gradient(90deg,var(--card) 25%,var(--sel) 50%,var(--card) 75%);background-size:200% 100%;animation:esq 1.4s linear infinite;border:1px solid var(--borda)}
@keyframes esq{to{background-position:-200% 0}}
.mail{border:1px solid var(--borda);border-radius:8px;background:var(--inset);padding:12px;font-size:.88rem;white-space:pre-wrap}
.mail b{display:inline-block;min-width:64px}

dialog{border:1px solid var(--borda);border-radius:12px;background:var(--card);color:var(--texto);padding:0;width:min(600px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto}
dialog::backdrop{background:rgba(5,10,20,.7)}
.dlg-c{padding:18px}
.dlg-c>*+*{margin-top:12px}
.dlg-c h2:focus{outline:none}
.pontos li{padding-left:14px;position:relative;margin-top:6px}
.pontos li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--sec)}
.dlg-b{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:0 18px 18px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;background:var(--texto);color:var(--fundo);font-weight:600;font-size:.88rem;border-radius:8px;padding:10px 14px;max-width:calc(100vw - 32px);width:max-content;display:none}
#toast.on{display:block}
details>summary{cursor:pointer;color:var(--acento-t);min-height:32px;display:flex;align-items:center}
.como{margin-top:40px;border-top:1px solid var(--borda);padding-top:16px}
.como code{background:var(--inset);border:1px solid var(--borda);border-radius:5px;padding:1px 6px}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--sec)}
@media (max-width:480px){
  h1{font-size:1.45rem}
  .btn{width:100%}
  .mini,.seg button,.limpar{width:auto}
  .dlg-b .btn{width:100%}
  .marca{display:none}
  .linha>.btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){.esq{animation:none}html{scroll-behavior:auto}}
</style>

<div class="faixa gutter"><div class="lim">
  <div class="faixa-t"><span><b>Mockup</b> · dados de exemplo, nenhuma pessoa é real</span><button type="button" class="limpar" id="btn-reiniciar" data-act="reiniciar">Reiniciar demonstração</button></div>
  <div class="ctrls">
    <div class="ctrl"><span id="rot-papel">Ver como</span><span class="seg" role="group" aria-labelledby="rot-papel" id="seg-papel"></span></div>
    <div class="ctrl"><span id="rot-estado">Estado da tela</span><span class="seg" role="group" aria-labelledby="rot-estado" id="seg-estado"></span></div>
  </div>
</div></div>
<header class="modulo gutter"><div class="lim">
  <span class="marca">RH</span>
  <nav class="menu" aria-label="Telas do RH"><ul id="menu"></ul></nav>

</div></header>

<script>
"use strict";
/* ============ Núcleo ============ */
var HOJE="2026-11-06";

 {n:"Isabela Furtado",cpf:"941.082.735-19",t:"CLT",em:"isabela.furtado@exemplo.com.br",rat:[["Administrativo",10000]]},

];
function pes(n){return PES.filter(function(p){return p.n===n;})[0];}
function pessoasOpt(tipo){return PES.filter(function(p){return !tipo||p.t===tipo;}).map(function(p){return [p.n,p.n];});}
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function refs(h){return h.replace(/\[\[([\d.,\s]+)\]\]/g,function(m,a){return a.split(",").map(function(x){x=x.trim();return '<span class="ref" title="Item '+x+' da lista do RH">'+x+'</span>';}).join("");});}
function fd(iso){if(!iso)return "—";var p=iso.split("-");return p[2]+"/"+p[1]+"/"+p[0];}
function dias(iso){var p=iso.split("-");return Math.round((Date.UTC(+p[0],+p[1]-1,+p[2])-Date.UTC(2026,10,6))/86400000);}
function somaDias(iso,n){var p=iso.split("-"),d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n));return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");}
function agora(){return fd(HOJE)+" "+new Date().toTimeString().slice(0,5);}
function eu(){return S.papel==="rh"?"Ana Exemplo":"Marta Exemplo";}
function brl(c){var n=Math.abs(c),r=Math.floor(n/100),ct=String(n%100).padStart(2,"0");return (c<0?"-":"")+"R$ "+String(r).replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+ct;}
function lerValor(t){t=String(t==null?"":t).trim();if(!/^(\d{1,3}(\.\d{3})+|\d+)(,\d{1,2})?$/.test(t))return null;var p=t.replace(/\./g,"").split(",");return Number(p[0])*100+Number(((p[1]||"")+"00").slice(0,2));}
function hhmm(m){var s=m<0?"-":"+",a=Math.abs(m);return s+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0");}
function hh(m){var a=Math.abs(m);return String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0");}
function souRH(){return S.papel==="rh";}
function dis(){return souRH()?"":" disabled";}
function disIf(c){return (c||!souRH())?" disabled":"";}
function mask(cpf){return souRH()?cpf:"***."+cpf.slice(4,11)+"-**";}

function movPorId(id){return D.movs.filter(function(m){return m.id===id;})[0];}
function recDecididos(m){return REC.filter(function(r){return m.rec[r[0]].v!=="dec";}).length;}
function prog(m){
  var t=0,f=0;
  m.etapas.forEach(function(s){if(s.st==="auto")return;t++;if(feitoSt(efSt(m,s).st))f++;});
  if(m.tipo==="entrada"){t+=REC.length;f+=recDecididos(m);}
  return {f:f,t:t};
}
function ratTxt(a){return a.map(function(r){return r.cc+" "+r.p+"%";}).join(" · ");}
function ratSoma(a){return a.reduce(function(s,r){return s+(Number(r.p)||0);},0);}
function bloqueios(m){
  var b=[];
  m.etapas.forEach(function(s){if(s.st!=="auto"&&!feitoSt(efSt(m,s).st))b.push("Etapa "+s.id+" ainda não está feita");});
  if(m.tipo==="entrada"){
    REC.forEach(function(r){if(m.rec[r[0]].v==="dec")b.push("Recurso "+r[0]+" ("+r[1]+"): decidir se precisa");});
    if(lerValor(m.rem)===null)b.push("Remuneração com valor inválido");
    if(!m.cargo.trim())b.push("Cargo em branco");
  }else{
    if(!m.aprov)b.push("Falta registrar a aprovação");
    if(!m.vig)b.push("Falta a data de vigência");
    else if((m.campos.sal||m.campos.rat)&&m.vig.slice(8)!=="01")b.push("Salário e rateio só mudam no dia 1: ajuste a vigência");
    if(m.campos.sal&&lerValor(m.campos.sal.para)===null)b.push("Salário novo com valor inválido");
    if(m.campos.rat&&ratSoma(m.campos.rat.para)!==100)b.push("O rateio novo precisa somar 100%");
  }
  return b;
}

function distrib(total,pesos){
  var W=pesos.reduce(function(s,p){return s+p[1];},0);
  if(!W||total<=0)return pesos.map(function(p){return [p[0],0];});
  var res=pesos.map(function(p){var n=BigInt(total)*BigInt(p[1]);return {k:p[0],v:Number(n/BigInt(W)),r:Number(n%BigInt(W))};});
  var falta=total-res.reduce(function(s,x){return s+x.v;},0);
  res.slice().sort(function(a,b){return b.r-a.r;}).slice(0,falta).forEach(function(x){x.v++;});
  return res.map(function(x){return [x.k,x.v];});
}
function pesosCC(lista){ /* lista: [[pessoa, multiplicador]] */
  var w={};CCS.forEach(function(c){w[c]=0;});
  lista.forEach(function(it){var p=pes(it[0]),rt;if(p)rt=p.rat;else{var m=D.movs.filter(function(x){return x.nome===it[0]&&x.tipo==="entrada";})[0];rt=m?[[m.cc,10000]]:[];}rt.forEach(function(r){w[r[0]]+=r[1]*it[1];});});
  return CCS.map(function(c){return [c,w[c]];}).filter(function(x){return x[1]>0;});
}
