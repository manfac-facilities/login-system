<title>RH Módulos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  color-scheme:light;
  --fundo:#f3f5fa;--card:#ffffff;--inset:#eef2f9;--hover:#e3eaf6;--sel:#dfe8f8;
  --borda:#c4d0e2;--borda-l:#dde4ef;--texto:#0a1628;--sec:#475a76;
  --acento:#f05a28;--acento-t:#b8390f;--on-acento:#0a1628;
  --erro:#b3261e;--erro-fundo:#fdeceb;--aviso:#7a5200;--aviso-fundo:#fff3d1;
  --ok:#146c43;--ok-fundo:#e2f4ea;--info:#1d4f9c;--info-fundo:#e4edfb;
  --barra:#0d2050;--barra-2:#16306e;--barra-t:#f1f5f9;--barra-sec:#a9b9d3;--barra-borda:#1e3a5f;
  --sombra:0 1px 2px rgba(10,22,40,.06);
  --raio:10px;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
  --fonte:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --fundo:#0a1628;--card:#0d2050;--inset:#0a1628;--hover:#12295f;--sel:#16306e;
    --borda:#1e3a5f;--borda-l:#1a3257;--texto:#f1f5f9;--sec:#94a3b8;--acento-t:#ff8a5f;
    --erro:#f2877f;--erro-fundo:#2a1320;--aviso:#e8c547;--aviso-fundo:#231f24;
    --ok:#6fdca4;--ok-fundo:#0f2f2a;--info:#93bbf5;--info-fundo:#12295f;
    --barra:#081226;--barra-2:#12295f;--barra-borda:#1e3a5f;--sombra:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --fundo:#0a1628;--card:#0d2050;--inset:#0a1628;--hover:#12295f;--sel:#16306e;
  --borda:#1e3a5f;--borda-l:#1a3257;--texto:#f1f5f9;--sec:#94a3b8;--acento-t:#ff8a5f;
  --erro:#f2877f;--erro-fundo:#2a1320;--aviso:#e8c547;--aviso-fundo:#231f24;
  --ok:#6fdca4;--ok-fundo:#0f2f2a;--info:#93bbf5;--info-fundo:#12295f;
  --barra:#081226;--barra-2:#12295f;--barra-borda:#1e3a5f;--sombra:none;
}
*{box-sizing:border-box}
html{background:var(--fundo);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--texto);font:14px/1.45 var(--fonte);overflow-x:hidden}
h1,h2,h3,p,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
h1{font-size:1.45rem;line-height:1.2;font-weight:650;letter-spacing:-.01em}
h1:focus{outline:none}
h2{font-size:1rem;font-weight:650}
h3{font-size:.88rem;font-weight:650}
button,input,select,textarea{font:inherit;color:inherit}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sec{color:var(--sec)}.peq{font-size:.82rem}.forte{font-weight:650}
.leitura{max-width:72ch}
.pilha>*+*{margin-top:12px}
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.entre{justify-content:space-between}

/* Estrutura */
.lateral{position:fixed;inset:0 auto 0 0;width:252px;background:var(--barra);color:var(--barra-t);display:flex;flex-direction:column;z-index:20;overflow-y:auto}
.corpo{margin-left:252px;min-height:100dvh;display:flex;flex-direction:column;min-width:0}
.marca{display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:650}
.marca i{font-style:normal;display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--acento);color:var(--on-acento);font-weight:800;font-size:.85rem;flex:none}
.marca small{display:block;font-weight:400;color:var(--barra-sec);font-size:.74rem;line-height:1.2}
.nav-g{padding:10px 16px 4px;font-size:.7rem;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--barra-sec)}
.nav-b{appearance:none;border:0;background:none;width:100%;display:flex;align-items:center;gap:10px;padding:7px 16px;min-height:36px;text-align:left;cursor:pointer;color:var(--barra-t);border-left:3px solid transparent}
.nav-b:hover{background:var(--barra-2)}
.nav-b[aria-current]{background:var(--barra-2);border-left-color:var(--acento);font-weight:650}
.nav-b .cont{margin-left:auto;font-size:.72rem;background:var(--acento);color:var(--on-acento);border-radius:999px;padding:0 7px;font-weight:700}
.nav-b:focus-visible{outline-offset:-3px}
.lat-pe{margin-top:auto;padding:10px 0;border-top:1px solid var(--barra-borda)}
.topo{position:sticky;top:0;z-index:15;background:var(--card);border-bottom:1px solid var(--borda);display:flex;align-items:center;gap:12px;padding:8px 24px;min-height:56px}
.topo-t{display:none;font-weight:650;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.busca-g{position:relative;flex:1 1 auto;max-width:520px}
.busca-g svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--sec);pointer-events:none}
.busca-g input{width:100%;padding:8px 12px 8px 36px;border:1px solid var(--borda);border-radius:8px;background:var(--inset);min-height:38px}
.busca-r{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--borda);border-radius:10px;box-shadow:0 8px 24px rgba(10,22,40,.2);max-height:60vh;overflow:auto;z-index:30}
.res{appearance:none;border:0;background:none;width:100%;text-align:left;padding:10px 12px;min-height:44px;cursor:pointer;display:block;border-bottom:1px solid var(--borda-l)}
.res:hover{background:var(--hover)}
.quem{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.quem-t{line-height:1.2;text-align:right;white-space:nowrap}
.ava{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--sel);color:var(--texto);font-weight:650;font-size:.78rem;flex:none}
.ava.g{width:56px;height:56px;font-size:1.1rem}
.ico-b{appearance:none;border:0;background:none;display:none;place-items:center;width:44px;height:44px;border-radius:8px;cursor:pointer;color:inherit;flex:none}
.ico-b:hover{background:var(--hover)}
main{flex:1;padding:20px 24px 72px;min-width:0}
.inferior{display:none}
.lateral-menu{display:none}
.rodape{padding:0 24px 20px;font-size:.74rem;color:var(--sec)}

/* Cabeçalho, indicadores */
.volta{appearance:none;border:0;background:none;color:var(--acento-t);cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:0;min-height:32px;font-weight:600}
.cab{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.cab p{color:var(--sec);margin-top:4px;max-width:72ch}
.cab-ac{display:flex;flex-wrap:wrap;gap:8px}
.btn{appearance:none;border:1px solid var(--borda);background:var(--card);border-radius:8px;padding:7px 14px;min-height:36px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn-p{background:var(--acento);border-color:var(--acento);color:var(--on-acento)}
.btn-p:hover{background:#d94c1e}
.btn-e{color:var(--erro);border-color:var(--erro)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.link{appearance:none;border:0;background:none;padding:0;color:var(--acento-t);cursor:pointer;font-weight:600;text-align:left;text-decoration:underline;text-underline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{appearance:none;text-align:left;background:var(--card);border:1px solid var(--borda);border-radius:var(--raio);padding:12px 14px;cursor:pointer;box-shadow:var(--sombra);display:block;min-width:0}
.kpi:hover{background:var(--hover)}
.kpi b{display:block;font-size:1.55rem;line-height:1.15;font-weight:650;font-variant-numeric:tabular-nums}
.kpi span{display:block;color:var(--sec);font-size:.8rem}
.kpi small{display:block;font-size:.74rem;margin-top:2px;font-weight:600}
.kpi.er small{color:var(--erro)}.kpi.av small{color:var(--aviso)}.kpi.ok small{color:var(--ok)}
.kpi[aria-pressed="true"]{border-color:var(--acento);box-shadow:inset 0 0 0 1px var(--acento)}
.card{background:var(--card);border:1px solid var(--borda);border-radius:var(--raio);box-shadow:var(--sombra);min-width:0}
.card-c{padding:14px 16px}
.card-t{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--borda-l)}

/* Abas, filtros */
.abas{display:flex;flex-wrap:wrap;gap:0 4px;border-bottom:1px solid var(--borda);margin-bottom:14px}
.aba{appearance:none;border:0;background:none;padding:9px 12px;min-height:40px;cursor:pointer;color:var(--sec);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.aba:hover{color:var(--texto)}
.aba[aria-selected="true"]{color:var(--texto);border-bottom-color:var(--acento)}
.barra-f{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:flex-end}
.barra-f .f-q{flex:1 1 220px;min-width:0;max-width:420px}
.barra-f select,.barra-f input{width:100%;border:1px solid var(--borda);border-radius:8px;background:var(--card);padding:7px 10px;min-height:38px}
.barra-f label{display:block;font-size:.74rem;color:var(--sec);margin-bottom:2px}
.barra-f .f-s{flex:0 1 180px;min-width:130px}

/* Tabela e cartões */
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--borda);border-radius:var(--raio);box-shadow:var(--sombra)}
.tbl.sem{border:0;box-shadow:none;border-radius:0}
table{border-collapse:collapse;width:100%}
th{font-size:.74rem;text-align:left;color:var(--sec);font-weight:650;padding:8px 12px;border-bottom:1px solid var(--borda);white-space:nowrap;background:var(--inset)}
td{padding:8px 12px;border-bottom:1px solid var(--borda-l);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr[data-act]{cursor:pointer}
tr[data-act]:hover td{background:var(--hover)}
.d{text-align:right;font-variant-numeric:tabular-nums}
.cartoes{display:grid;gap:8px}
.cartao{appearance:none;width:100%;text-align:left;background:var(--card);border:1px solid var(--borda);border-radius:var(--raio);padding:12px 14px;cursor:pointer;display:block;min-height:44px;box-shadow:var(--sombra);color:inherit}
.cartao:hover{background:var(--hover)}
.cartao-t{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;font-weight:650}
.cartao-m{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin-top:6px;font-size:.84rem}
.cartao-m dt{color:var(--sec)}
.cartao-m dd{min-width:0;overflow-wrap:anywhere}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:1px 7px;font-size:.75rem;font-weight:600;white-space:nowrap;background:var(--inset);color:var(--sec);border:1px solid var(--borda-l)}
.tag svg{width:10px;height:10px;flex:none}
.tag.ok{background:var(--ok-fundo);color:var(--ok);border-color:transparent}
.tag.av{background:var(--aviso-fundo);color:var(--aviso);border-color:transparent}
.tag.er{background:var(--erro-fundo);color:var(--erro);border-color:transparent}
.tag.in{background:var(--info-fundo);color:var(--info);border-color:transparent}
.tag.la{background:var(--acento);color:var(--on-acento);border-color:transparent}
.sem-res{padding:28px 16px;text-align:center;color:var(--sec)}

/* Página com painel lateral */
.lista-g{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.lista-lado{display:none}
.reg-g{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
.reg-g>*{min-width:0}
.reg-g>div>*+*,.reg-g>aside>*+*{margin-top:14px}
.reg-cab{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin:6px 0 14px}
.reg-cab h1{font-size:1.35rem}
.reg-cab .gr{flex:1 1 240px;min-width:0}
.paineis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.dados{display:grid;gap:10px 18px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.dados dt{font-size:.74rem;color:var(--sec)}
.dados dd{font-weight:550;overflow-wrap:anywhere}
.lista-c>li{padding:10px 16px;border-bottom:1px solid var(--borda-l)}
.lista-c>li:last-child{border-bottom:0}
.li-b{appearance:none;border:0;background:none;width:100%;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--borda-l);min-height:44px;color:inherit}
.li-b:hover{background:var(--hover)}
ul>li:last-child>.li-b{border-bottom:0}
.li-b .gr{flex:1;min-width:0}
.li-data{flex:none;width:46px;text-align:center;font-variant-numeric:tabular-nums;font-weight:650;line-height:1.1}
.li-data small{display:block;font-weight:500;color:var(--sec);font-size:.7rem}

/* Próximo passo e linha do tempo */
.prox{border:1px solid var(--acento);border-left-width:4px;border-radius:var(--raio);background:var(--card);padding:12px 16px}
.prox small{display:block;color:var(--acento-t);font-weight:700;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}
.prox .t{font-weight:650;font-size:1.02rem;margin:2px 0 8px}
.tempo>li,.tempo summary{display:flex;gap:10px;align-items:flex-start}
.tempo>li{padding:6px 16px}
.tempo details{width:100%}
.tempo summary{cursor:pointer;list-style:none;padding:8px 16px;min-height:40px;font-weight:600;border-top:1px solid var(--borda-l)}
.tempo summary::-webkit-details-marker{display:none}
.tempo summary:hover{background:var(--hover)}
.tempo .gr{flex:1;min-width:0}
.tempo .sub{display:flex;gap:10px;padding:5px 16px 5px 16px;align-items:flex-start}
.pt{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--borda);display:grid;place-items:center;margin-top:1px;background:var(--card)}
.pt svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pt.f{background:var(--ok);border-color:var(--ok);color:var(--card)}
.pt.na{background:var(--inset);border-style:dashed}
.pt.at{border-color:var(--acento);background:var(--acento)}

/* Rateio */
.rat{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--inset);margin:6px 0}
.rat i{display:block;height:100%}
.rat i:nth-child(1){background:var(--barra)}.rat i:nth-child(2){background:var(--acento)}.rat i:nth-child(3){background:var(--sec)}
:root[data-theme="dark"] .rat i:nth-child(1){background:var(--info)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rat i:nth-child(1){background:var(--info)}}

/* Quadro */
.quadro{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:start}
.col{background:var(--inset);border:1px solid var(--borda-l);border-radius:var(--raio);padding:8px}
.col h3{display:flex;justify-content:space-between;padding:4px 6px 8px}
.col .cartao{margin-top:6px}

/* Agenda */
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--borda-l);border:1px solid var(--borda-l);border-radius:var(--raio);overflow:hidden}
.mes>span{background:var(--inset);text-align:center;font-size:.72rem;color:var(--sec);padding:4px 0}
.dia{appearance:none;border:0;background:var(--card);min-height:48px;padding:4px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;color:inherit}
.dia:hover{background:var(--hover)}
.dia.fora{background:var(--inset);color:var(--sec);cursor:default}
.dia[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--acento)}
.dia b{font-weight:600;font-size:.8rem;font-variant-numeric:tabular-nums}
.dia.hoje b{color:var(--on-acento);background:var(--acento);border-radius:4px;padding:0 4px;align-self:flex-start}
.pts{display:flex;gap:2px;flex-wrap:wrap}.pts i{width:6px;height:6px;border-radius:50%;background:var(--acento-t)}
.dia-t{display:none;font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--inset);border-radius:3px;padding:0 4px}

/* Estados */
.est-v{border:2px dashed var(--borda);border-radius:var(--raio);padding:36px 20px;text-align:center}
.est-v svg{width:34px;height:34px;color:var(--sec);margin-bottom:6px}
.est-v p{color:var(--sec);margin:6px auto 12px;max-width:52ch}
.est-e{border:1px solid var(--erro);border-left-width:5px;background:var(--erro-fundo);border-radius:var(--raio);padding:18px 20px}
.est-e h2{color:var(--erro);display:flex;gap:8px;align-items:center}
.est-e p{margin:6px 0 12px;max-width:62ch}
.esq{height:62px;border-radius:var(--raio);background:linear-gradient(90deg,var(--inset),var(--hover),var(--inset));background-size:200% 100%;animation:esq 1.4s linear infinite;border:1px solid var(--borda-l)}
.esq-g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
@keyframes esq{to{background-position:-200% 0}}
.nota{border-radius:8px;padding:10px 12px;background:var(--inset);border-left:4px solid var(--borda);font-size:.86rem}
.nota.av{background:var(--aviso-fundo);border-left-color:var(--aviso)}
.nota.in{background:var(--info-fundo);border-left-color:var(--info)}
.nota b{display:block}
.pontos{list-style:disc;padding-left:18px}.pontos li+li{margin-top:3px}

/* Diálogos e formulário */
dialog{border:1px solid var(--borda);border-radius:12px;background:var(--card);color:var(--texto);padding:0;width:min(580px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(5,10,20,.65)}
.d-c{padding:16px 18px;overflow:auto;flex:1}
.d-c>*+*{margin-top:12px}
.d-c h2{font-size:1.08rem}
.d-c h2:focus{outline:none}
.d-b{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--borda-l)}
.campo label{display:block;font-weight:600;font-size:.84rem;margin-bottom:3px}
.campo input,.campo select,.campo textarea{width:100%;border:1px solid var(--borda);border-radius:8px;background:var(--card);padding:8px 10px;min-height:38px}
.campo textarea{min-height:76px;resize:vertical}
.campo [aria-invalid="true"]{border-color:var(--erro);box-shadow:inset 0 0 0 1px var(--erro)}
.campo .aj{display:block;font-size:.76rem;color:var(--sec);margin-top:2px}
.campo .er{display:block;font-size:.8rem;color:var(--erro);font-weight:600;margin-top:2px}
.form-g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.form-g .todo{grid-column:1/-1}
.mail{white-space:pre-wrap;background:var(--inset);border:1px solid var(--borda-l);border-radius:8px;padding:10px 12px;font-size:.86rem}
.seg-c{display:flex;flex-wrap:wrap;gap:6px}
.seg-c button{appearance:none;border:1px solid var(--borda);background:var(--card);border-radius:8px;padding:6px 12px;min-height:44px;cursor:pointer}
.seg-c button[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:var(--on-acento);font-weight:650}
#menu{margin:0;height:100dvh;max-height:100dvh;width:min(320px,86vw);border-radius:0;border:0;background:var(--barra);color:var(--barra-t);overflow:auto}
#menu .nav-b{min-height:44px}
#menu[open]{display:block}
.demo-b{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;z-index:25;appearance:none;background:none;border:0;padding:0;min-height:44px;display:flex;align-items:center;cursor:pointer}
.demo-b span{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--sec);border:1px solid var(--borda);border-radius:999px;padding:3px 11px;font-size:.74rem;font-weight:600;box-shadow:0 2px 8px rgba(10,22,40,.18)}
.demo-b svg{width:13px;height:13px}

function tabela(cfg){

  if(modo()==="cel"){
    var ti=cfg.cols.find(c=>c.c==="t")||cfg.cols[0],tg=cfg.cols.find(c=>c.c==="tag");
    return '<div class="cartoes"'+at+'>'+L.map(r=>'<button type="button" class="cartao"'+goto(r)+'><span class="cartao-t"><span>'+ti.fn(r)+'</span>'+(tg?tg.fn(r):"")+'</span><dl class="cartao-m">'+cfg.cols.filter(c=>c!==ti&&c!==tg&&c.c!=="fora"&&(c.n||0)<=1).map(c=>'<dt'+(c.at?" "+c.at:"")+'>'+c.t+'</dt><dd>'+c.fn(r)+'</dd>').join("")+'</dl></button>').join("")+'</div>';
  }
  var nv=NIVEL[modo()],cs=cfg.cols.filter(c=>(c.n||0)<=nv),prim=cs.find(c=>c.c==="t")||cs[0];
  return '<div class="tbl'+(cfg.sem?" sem":"")+'"'+at+'><table><thead><tr>'+cs.map(c=>'<th'+(c.d?' class="d"':"")+(c.at?" "+c.at:"")+'>'+c.t+'</th>').join("")+'</tr></thead><tbody>'+L.map(r=>{
    var g=goto(r);
    return '<tr'+g+'>'+cs.map(c=>'<td'+(c.d?' class="d"':"")+'>'+(c===prim&&g?'<button type="button" class="link forte" style="text-decoration:none;color:inherit"'+g+'>'+c.fn(r)+'</button>':c.fn(r))+'</td>').join("")+'</tr>';
  }).join("")+'</tbody></table></div>';
}

  var novo={m:m,i:i||"",a:a||""},ant=S.r;

  try{if(location.hash!==hashDe(novo))location.hash=hashDe(novo);}catch(e){}

}

A.fSalvar=()=>{
  var v={},er={};
  F.campos.forEach(c=>{
    var e=document.getElementById(c.id),x=e.value.trim();v[c.k]=x;
    if(c.req&&!x)er[c.id]="Preencha este campo.";
    else if(x&&c.tipo==="valor"&&lerV(x)===null)er[c.id]="Use um valor como 1.250,00.";
    else if(x&&c.tipo==="cpf"&&!/^\d{3}\.\d{3}\.\d{3}-\d{2}$/.test(x))er[c.id]="Use o formato 000.000.000-00.";
    else if(x&&c.tipo==="email"&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x))er[c.id]="E-mail inválido.";
  });
  if(F.valida&&!Object.keys(er).length)Object.assign(er,F.valida(v)||{});
  F.campos.forEach(c=>{var e=document.getElementById(c.id),m=document.getElementById(c.id+"-m"),t=er[c.id]||"";m.textContent=t;if(t)e.setAttribute("aria-invalid","true");else e.removeAttribute("aria-invalid");});
  var ks=Object.keys(er);if(ks.length){document.getElementById(ks[0]).focus();return;}

function ratTab(rat){var t=rat.reduce((s,r)=>s+r[1],0);return ratBar(rat,t||1)+'<div class="tbl sem"><table><thead><tr><th>Centro de custo</th><th class="d">Parte</th><th class="d">Valor</th></tr></thead><tbody>'+rat.map(r=>'<tr><td>'+esc(r[0])+'</td><td class="d">'+(t?String(Math.round(r[1]*1e4/t)/100).replace(".",","):"0")+'%</td><td class="d">'+brl(r[1])+'</td></tr>').join("")+'<tr><td class="forte">Total</td><td></td><td class="d forte">'+brl(t)+'</td></tr></tbody></table></div>';}
function distrib(total,pesos){var W=pesos.reduce((s,p)=>s+p[1],0);if(!W||total<=0)return pesos.map(p=>[p[0],0]);var res=pesos.map(p=>{var n=total*p[1];return {k:p[0],v:Math.floor(n/W),r:n%W};});var fal=total-res.reduce((s,x)=>s+x.v,0);res.slice().sort((a,b)=>b.r-a.r).slice(0,fal).forEach(x=>x.v++);return res.map(x=>[x.k,x.v]);}
function pesosCC(lista){var w={};CCS.forEach(c=>w[c]=0);lista.forEach(it=>{var p=pesN(it[0]);if(p)p.rat.forEach(r=>{w[r[0]]+=r[1]*it[1];});});return CCS.map(c=>[c,w[c]]).filter(x=>x[1]>0);}

function buscaH(q){
  q=q.trim().toLowerCase();if(!q)return "";
  var R=[];
  D.pes.forEach(p=>{if((p.n+" "+p.cargo).toLowerCase().includes(q))R.push([p.n,"Pessoa · "+p.cargo,"pessoas",p.id]);});
  D.adm.forEach(a=>{if(a.nome.toLowerCase().includes(q))R.push([a.nome,"Admissão · "+a.cargo,"movimentacoes",a.id]);});
  D.vag.forEach(v=>{if(v.cargo.toLowerCase().includes(q))R.push([v.cargo,"Vaga · "+v.gestor,"recrutamento",v.id]);});
  D.can.forEach(c=>{if(c.nome.toLowerCase().includes(q))R.push([c.nome,"Candidato","recrutamento",c.id]);});
  D.pat.forEach(i=>{if((i.nome+i.id).toLowerCase().includes(q))R.push([i.nome,"Patrimônio · "+i.id,"patrimonio",i.id]);});
  D.ctr.forEach(c=>{if(c.nome.toLowerCase().includes(q))R.push([c.nome,"Contrato PJ","contratos",c.id]);});
  D.cmn.forEach(c=>{if(c.titulo.toLowerCase().includes(q))R.push([c.titulo,"Comunicado","comunicacao",c.id]);});
  D.cam.forEach(c=>{if(c.nome.toLowerCase().includes(q))R.push([c.nome,"Campanha","comunicacao",c.id]);});
  if(!R.length)return '<div class="sem-res">Nada encontrado.</div>';
  return R.slice(0,10).map(x=>'<button type="button" class="res" data-act="buscaIr" data-m="'+x[2]+'" data-i="'+x[3]+'"><span class="forte" style="display:block">'+esc(x[0])+'</span><span class="sec peq">'+esc(x[1])+'</span></button>').join("");
}

function segC(id,rot,k,ops,cur){return '<div><h3 id="'+id+'" style="margin-bottom:6px">'+rot+'</h3><div class="seg-c" role="group" aria-labelledby="'+id+'">'+ops.map(o=>'<button type="button" data-act="demoSet" data-k="'+k+'" data-v="'+o[0]+'" aria-pressed="'+(cur===o[0])+'">'+o[1]+'</button>').join("")+'</div></div>';}
function demoH(){
  var aberto=$("#demo details")&&$("#demo details").open;
  $("#demo").innerHTML='<div class="d-c"><h2 id="demo-t" tabindex="-1">Demonstração</h2><p class="sec peq">Estes controles existem só no mockup. Dados de exemplo; nenhuma pessoa é real.</p>'
   +segC("dm-p","Ver como","papel",[["rh","Controladoria/RH"],["dir","Diretoria"],["nenhum","Sem papel"]],S.papel)
   +segC("dm-e","Estado da tela","estado",[["dados","Com dados"],["carregando","Carregando"],["vazio","Vazio"],["erro","Erro"]],S.estado)
   +'<div>'+bt("Reiniciar a demonstração","demoReset")+'</div>'
   +'<details'+(aberto?" open":"")+'><summary class="forte" style="cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px">'+ic("cheg")+'Sobre este mockup</summary><div class="pilha">'
   +'<div><h3>Como responder</h3><p class="peq">Pelo WhatsApp, uma linha por módulo. Exemplo: "Pessoas aprovado", "Ponto ajustar: quero ver o saldo na lista". Para as suposições, use o número: "suposição 4 vetada".</p></div>'
   +'<div><h3>Suposições a vetar</h3><ol>'+SUPOS.map((s,i)=>'<li style="margin-top:8px"><div class="forte peq">'+(i+1)+'. '+esc(s[0])+'</div><div class="peq">'+esc(s[1])+'</div><div class="peq sec">'+esc(s[2])+'</div></li>').join("")+'</ol></div>'
   +'<div><h3>Cobertura das 18 áreas</h3><ul>'+COB.map((c,i)=>'<li class="peq" style="margin-top:4px"><b>'+(i+1)+'. '+esc(c[0])+':</b> '+esc(c[1])+'</li>').join("")+'</ul></div>'
   +'<div><h3>O que ficou de fora</h3><ul class="pontos peq"><li>Envio automático de WhatsApp (suposição 6).</li><li>Integração com o VR Ponto e cruzamento com o Cockpit (suposição 4).</li><li>Acesso próprio para gestor (suposição 1).</li><li>Guarda de senha de portão (suposição 2).</li><li>Anexos, e-mails e envios reais: aqui são simulados.</li></ul></div>'
   +'</div></details></div><div class="d-b"><button type="button" class="btn btn-p" data-act="demoFecha">Fechar</button></div>';
}
A.demoAbrir=()=>{demoH();var d=$("#demo");d.showModal();$("#demo-t").focus();};
A.demoFecha=()=>$("#demo").close();
A.demoSet=d=>{S[d.k]=d.v;render(true);demoH();};
A.demoReset=()=>{S=novoS();D=novoD();try{location.hash="";}catch(e){}$("#demo").close();render(true);toast("Demonstração reiniciada.");};

/* Eventos */
document.addEventListener("click",e=>{
  var el=e.target.closest("[data-act]");
  if(!el||el.disabled)return;
  if(el.tagName==="TR"&&e.target.closest("button"))return;
  if(el.dataset.chg)return;
  var a=A[el.dataset.act];if(a){a(el.dataset,el);}
  if(!e.target.closest(".busca-g")&&S.busca&&el.dataset.act!=="buscaIr"){S.busca="";shell();}
});
document.addEventListener("click",e=>{if(S.busca&&!e.target.closest(".busca-g")){S.busca="";shell();}
  if(e.target.id==="menu"||e.target.id==="demo"||e.target.id==="busca")e.target.close();});
document.addEventListener("input",e=>{var d=e.target.dataset;if(d&&d.inp)A[d.inp](d,e.target);});
document.addEventListener("change",e=>{var d=e.target.dataset;if(d&&d.chg)A[d.chg](d,e.target);});
Object.values(MQ).forEach(q=>q.addEventListener("change",()=>render()));
S=novoS();D=novoD();
(function(){var p=location.hash.replace(/^#\//,"").split("/");if(p[0]&&MODS.some(x=>x.id===p[0]))S.r={m:p[0],i:p[1]||"",a:p[2]||""};})();
render();
</script>
